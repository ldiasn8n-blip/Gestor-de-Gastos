<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gastos da Casa</title>
<style>
  :root{
    --paper:#0A0C10;
    --paper-raised:#161A21;
    --input-bg:#1F2530;
    --ink:#EAF2EF;
    --ink-soft:#8B96A5;
    --line:#2A313D;
    --positive:#39FF88;
    --positive-soft:rgba(57,255,136,0.15);
    --alert:#FF4D6D;
    --alert-soft:rgba(255,77,109,0.15);
    --neon2:#4FE0FF;
    --hover:rgba(255,255,255,0.06);
    --hover-soft:rgba(255,255,255,0.04);
    --backdrop:rgba(0,0,0,0.68);
    --focus-ring:rgba(57,255,136,0.30);
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    --shadow-md:0 4px 16px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.65), 0 0 24px rgba(57,255,136,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button,input,select{ transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease, color .15s ease, filter .15s ease; }
  button{ -webkit-tap-highlight-color:transparent; }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  #shell.hidden{ display:none; }
  header{
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
    gap:10px;
    box-shadow:0 1px 0 var(--line), 0 2px 12px rgba(0,0,0,0.35);
  }
  header h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--ink-soft);
  }
  .gear-btn{
    border:none;background:none;font-size:19px;cursor:pointer;padding:4px 2px;color:var(--ink-soft);flex-shrink:0;
  }
  main{
    flex:1;
    padding:16px 16px 96px;
    overflow-y:auto;
  }
  #storage-warning{
    background:var(--alert-soft);color:var(--alert);font-size:12px;padding:8px 14px;text-align:center;
  }
  nav.tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--paper-raised);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
    overflow-x:auto;
    box-shadow:0 -1px 0 var(--line), 0 -2px 12px rgba(0,0,0,0.35);
  }
  nav.tabbar button{
    flex:1;
    min-width:64px;
    border:none;
    background:none;
    border-radius:10px;
    padding:10px 4px 8px;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  nav.tabbar button .ic{font-size:19px;}
  nav.tabbar button.active{font-weight:700;color:var(--ink);}
  nav.tabbar button:active{ transform:scale(0.94); }

  .member-badge{
    width:19px;height:19px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  /* Segmented control */
  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
    background:var(--paper-raised);
    box-shadow:var(--shadow-sm);
  }
  .segmented button{
    flex:1;
    padding:9px 6px;
    border:none;
    background:none;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
  }
  .segmented button:active{ transform:scale(0.97); }

  /* Form */
  form.add-form{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:20px;
    background:var(--paper-raised);
    box-shadow:var(--shadow-md);
  }
  form.add-form .field{margin-bottom:10px;}
  form.add-form label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  form.add-form select,
  form.add-form input[type="text"],
  form.add-form input[type="number"],
  form.add-form input[type="date"]{
    width:100%;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:16px;
    background:var(--input-bg);
    color:var(--ink);
    font-family:inherit;
  }
  form.add-form select:focus,
  form.add-form input:focus,
  #settings-panel input:focus,
  .item-row input:focus,
  .items-filter-row select:focus{
    outline:none;
    border-color:var(--positive);
    box-shadow:0 0 0 3px var(--focus-ring);
  }
  input:focus-visible, select:focus-visible, button:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px var(--focus-ring);
  }
  .row2{display:flex;gap:10px;}
  .row2 > .field{flex:1;}
  .photo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
    flex-wrap:wrap;
  }
  .photo-btn{
    border:1px dashed var(--line);
    border-radius:9px;
    padding:9px 12px;
    font-size:13px;
    background:var(--input-bg);
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
  }
  .photo-btn:active{ transform:scale(0.97); }
  .photo-preview-slot{display:flex;align-items:center;gap:8px;}
  .ocr-status{ font-size:11.5px;color:var(--ink-soft);margin-top:6px;min-height:14px;line-height:1.4; }
  .ocr-status.ocr-loading{ color:var(--ink-soft); }
  .ocr-status.ocr-ok{ color:var(--positive); }
  .ocr-status.ocr-fail{ color:var(--alert); }
  .photo-preview{
    width:42px;height:42px;border-radius:6px;object-fit:cover;border:1px solid var(--line);
  }
  .photo-remove{
    font-size:12px;color:var(--alert);background:none;border:none;cursor:pointer;font-family:inherit;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:9px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    margin-top:4px;
    font-family:inherit;
    box-shadow:var(--shadow-sm);
  }
  .submit-btn:active{ transform:scale(0.98); }
  .cancel-edit-btn{
    width:100%;
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    padding:9px;
    cursor:pointer;
    font-family:inherit;
    border-radius:8px;
  }

  /* Ledger list */
  .cat-chip{
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;flex-shrink:0;vertical-align:middle;margin-right:2px;
  }
  .cat-group{margin-bottom:20px;background:var(--paper-raised);border-radius:var(--radius);padding:4px 14px;box-shadow:var(--shadow-sm);}
  .cat-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 8px;
    margin-bottom:2px;
    border-bottom:1px solid var(--line);
  }
  .cat-head .name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .cat-head .total{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .thumb{
    width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--line);
  }
  .entry .thumb-placeholder{
    width:40px;height:40px;border-radius:9px;flex-shrink:0;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .entry .info{flex:1;min-width:0;}
  .entry .desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .date{font-size:11.5px;color:var(--ink-soft);}
  .entry .value{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .entry .edit,
  .entry .del{
    border:none;background:none;color:var(--ink-soft);font-size:15px;cursor:pointer;padding:6px;border-radius:7px;font-family:inherit;
  }
  .entry .edit:active,
  .entry .del:active{ transform:scale(0.9); background:var(--hover); }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  /* Resumo */
  .hero-settlement{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    padding:20px 18px;
    margin-bottom:18px;
    box-shadow:var(--shadow-md);
  }
  .hero-settlement .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
  .hero-settlement .amount.settled{color:var(--positive);font-size:16px;font-weight:700;text-align:center;}
  .transfer-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px solid var(--line);
  }
  .transfer-row:first-of-type{border-top:none;}
  .transfer-row .direction{font-size:14px;font-weight:600;}
  .transfer-row .amount{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--alert);}
  .transfer-row .amount.single{font-size:30px;}
  .transfer-row:has(.amount.single){flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px;}

  .compare{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    padding:16px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .compare-row{margin-bottom:12px;}
  .compare-row:last-child{margin-bottom:0;}
  .compare-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .compare-row .top .who{font-weight:700;}
  .compare-row .top .val{font-variant-numeric:tabular-nums;font-weight:700;}
  .track{height:8px;border-radius:5px;background:var(--paper);overflow:hidden;}
  .track .fill{height:100%;border-radius:5px;transition:width .4s ease;}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:22px 0 8px;}
  .personal-row{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px;
  }
  .personal-row:last-child{border-bottom:none;}
  .personal-row span:first-child{display:flex;align-items:center;gap:7px;}
  .personal-row .val{font-weight:700;font-variant-numeric:tabular-nums;}
  .note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  /* Receipt modal */
  #modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:24px;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #modal img{max-width:100%;max-height:80vh;border-radius:10px;box-shadow:var(--shadow-lg);}
  #modal .close-btn{
    position:absolute;top:18px;right:18px;background:var(--paper-raised);color:var(--ink);border:none;
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;box-shadow:var(--shadow-md);
  }
  #modal .close-btn:active{ transform:scale(0.92); }
  #modal .spinner{color:var(--ink);font-size:13px;}

  /* Settings modal */
  #settings-modal{
    position:fixed;inset:0;background:var(--backdrop);
    display:flex;align-items:flex-end;justify-content:center;z-index:60;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #settings-modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #settings-modal.hidden #settings-panel{ transform:translateY(24px); }
  #settings-panel{
    background:var(--paper-raised);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    transform:translateY(0);transition:transform .2s ease;
  }
  #settings-panel h2{font-size:17px;margin:0 0 14px;}
  #settings-panel .field{margin-bottom:14px;}
  #settings-panel label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  #settings-panel input[type="text"]{
    width:100%;padding:10px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;
  }
  .settings-member-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .settings-member-row .member-name-input{
    flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  }
  .settings-member-row .member-pct-input{
    width:56px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right;font-family:inherit;
  }
  .settings-member-row .card-name-input{
    flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  }
  .settings-member-row .photo-remove{padding:8px 6px;flex-shrink:0;}
  .pct-sign{font-size:13px;color:var(--ink-soft);}
  .pct-sum-note{font-size:12px;color:var(--ink-soft);margin:4px 0 14px;}
  .secondary-btn{
    border:1px solid var(--line);background:var(--input-bg);border-radius:9px;padding:9px 12px;
    font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;width:100%;
  }
  .secondary-btn:active{ transform:scale(0.98); }
  .gear-btn:active{ transform:scale(0.9); }
  .item-row .item-remove-btn:active{ transform:scale(0.9); }
  .settings-actions{display:flex;gap:10px;margin-top:16px;}
  .settings-actions button{flex:1;margin-top:0;}

  #loading-screen{
    display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-soft);font-size:14px;width:100%;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--ink-soft);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Itemized receipt entry (contas do casal) */
  .items-section{ margin-top:2px; }
  .items-section-head{ display:flex;justify-content:space-between;align-items:baseline; }
  .items-hint{ font-size:11.5px;color:var(--ink-soft);margin:2px 0 8px;line-height:1.4; }
  .items-list{ margin-bottom:8px; }
  .item-row{
    display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;
    padding:8px;margin-bottom:6px;background:var(--paper);border-radius:8px;
  }
  .item-field{ display:flex;flex-direction:column;gap:3px;min-width:0; }
  .item-field-label{ font-size:10px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em; }
  .item-pos{ flex:0 0 42px; }
  .item-field-desc{ flex:1 1 100%; }
  .item-field-qty{ flex:1 1 72px; }
  .item-field-unit{ flex:0 0 72px; }
  .item-field-weight{ flex:1 1 82px; }
  .item-field-value{ flex:1 1 110px; }
  .item-row .item-desc-input,
  .item-row .item-qty-input,
  .item-row .item-unit-input,
  .item-row .item-weight-input,
  .item-row .item-value-input{
    padding:8px 9px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:var(--input-bg);color:var(--ink);font-family:inherit;width:100%;box-sizing:border-box;
  }
  .item-row .item-qty-input, .item-row .item-weight-input, .item-row .item-value-input{ text-align:right; }
  .item-pos-badge{ width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--paper-raised);border:1px solid var(--line);font-size:12px;font-weight:800; }
  .item-row .item-remove-btn{
    flex:0 0 auto;border:none;background:none;color:var(--alert);font-size:16px;cursor:pointer;padding:6px 6px 9px;font-family:inherit;
  }
  .add-item-btn{ width:100%; }
  .items-total-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 10px;margin:2px 0 8px;background:var(--paper);border-radius:8px;font-size:13px;color:var(--ink-soft);
  }
  .items-total-row.hidden{ display:none; }
  .items-total-row .items-total-main{ font-weight:700;color:var(--ink); }
  .items-total-row .items-total-ref{ font-size:12px; }
  .items-total-row.totals-mismatch .items-total-ref{ color:var(--alert);font-weight:600; }
  .items-total-row.totals-match .items-total-ref{ color:var(--positive);font-weight:600; }
  .value-input.computed-value{ background:var(--paper);color:var(--ink-soft); }

  /* Category → items modal */
  #items-modal{
    position:fixed;inset:0;background:var(--backdrop);
    display:flex;align-items:flex-end;justify-content:center;z-index:60;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #items-modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #items-modal.hidden #items-panel{ transform:translateY(24px); }
  #items-panel{
    background:var(--paper-raised);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    transform:translateY(0);transition:transform .2s ease;
  }
  #items-panel h2{font-size:17px;margin:0 0 14px;}
  .items-filter-row{ display:flex;align-items:center;gap:8px;margin-bottom:10px; }
  .items-filter-icon{ font-size:15px;flex-shrink:0; }
  .items-filter-row select{
    flex:1;min-width:0;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--input-bg);color:var(--ink);font-family:inherit;
  }
  .items-filter-total{ font-size:13px;font-weight:700;color:var(--ink-soft);white-space:nowrap;flex-shrink:0; }
  .item-view-row{ display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line); }
  .item-view-row:last-child{ border-bottom:none; }
  .item-view-desc{ font-size:14px;font-weight:600; }
  .item-view-meta{ font-size:11.5px;color:var(--ink-soft);margin-top:1px; }
  .item-view-value{ font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap; }

  button.personal-row.category-items-row{
    width:100%;background:none;border:none;border-bottom:1px solid var(--line);
    cursor:pointer;text-align:left;color:var(--ink);font-family:inherit;border-radius:8px;
  }
  button.personal-row.category-items-row:last-child{ border-bottom:none; }
  button.personal-row.category-items-row:active{ background:var(--hover); }
  .cat-click-hint{ color:var(--ink-soft);font-weight:400;margin-left:5px; }

  /* Reset (zerar dados) modal */
  #reset-modal{
    position:fixed;inset:0;background:var(--backdrop);
    display:flex;align-items:flex-end;justify-content:center;z-index:70;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #reset-modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #reset-modal.hidden #reset-panel{ transform:translateY(24px); }
  #reset-panel{
    background:var(--paper-raised);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    transform:translateY(0);transition:transform .2s ease;
  }
  #reset-panel h2{font-size:17px;margin:0 0 6px;color:var(--alert);}
  .reset-check-row{
    display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--line);
    font-size:13.5px;cursor:pointer;
  }
  .reset-check-row:last-of-type{ border-bottom:none; }
  .reset-check-row input[type="checkbox"]{ width:18px;height:18px;flex-shrink:0;accent-color:var(--alert); }
  .danger-btn{ background:var(--alert)!important; }
  .danger-btn:disabled{ background:var(--line)!important;color:var(--ink-soft);cursor:not-allowed; }
  #reset-confirm-input{
    width:100%;padding:10px 10px;border:1px solid var(--line);border-radius:9px;font-size:16px;font-family:inherit;
  }

  /* Meses tab */
  .month-tag{

<!--
  Tesseract.js faz a leitura automática (OCR) das notas fiscais direto no
  navegador da pessoa, sem precisar de servidor nem de chave de API.
  Se o CDN não carregar por algum motivo, o app detecta isso e cai de volta
  pro preenchimento manual — a leitura automática nunca trava o resto do site.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>

<script>
(function(){
  "use strict";

  var PALETTE = ['#4FA8FF','#FF5D8F','#39FF88','#FFC24F','#B18CFF','#4FE0FF','#FF8A4F','#7CE05A'];

  var CATEGORIES = [
    {id:'Mercado', icon:'🛒', color:'#4FE0FF'},
    {id:'Aluguel/Financiamento', icon:'🏠', color:'#FF8A4F'},
    {id:'Água', icon:'💧', color:'#4FA8FF'},
    {id:'Luz', icon:'⚡', color:'#FFC24F'},
    {id:'Internet/Telefone', icon:'📶', color:'#B18CFF'},
    {id:'Gás', icon:'🔥', color:'#FF6B4F'},
    {id:'Transporte', icon:'🚗', color:'#39FF88'},
    {id:'Saúde', icon:'💊', color:'#FF5D8F'},
    {id:'Lazer', icon:'🎉', color:'#FF4FD8'},
    {id:'Educação', icon:'📚', color:'#B18CFF'},
    {id:'Outros', icon:'📦', color:'#8B93A1'}
  ];
  var DEFAULT_CATEGORY_COLOR = '#8B93A1';

  var DEFAULT_CARDS = ['Nubank','Inter','Itaú','Santander'];

  function defaultSettings(){
    return {
      householdName: 'Gastos da Casa',
      members: [
        {id:'homem', name:'Homem', percentage:50, color:PALETTE[0]},
        {id:'mulher', name:'Mulher', percentage:50, color:PALETTE[1]}
      ],
      cards: DEFAULT_CARDS.slice()
    };
  }

  var MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var state = {
    expenses: [],
    settings: defaultSettings(),
    settingsDraft: null,
    currentTab: 'resumo',
    subTab: {},
    editingId: null,
    pendingPhoto: null,
    removeExistingPhoto: false,
    itemsModalCategory: null,
    itemsModalSort: 'recent',
    itemsModalGroup: false,
    itemsModalMonth: 'all',
    mesesView: {mode:'years', year:null, month:null}
  };

  var storageAvailable = false;

  var contentEl, loadingEl, shellEl, tabbarEl, headerTitleEl, headerSubEl;
  var modalEl, modalBodyEl, settingsModalEl, settingsPanelEl, settingsBtn;
  var itemsModalEl, itemsPanelEl;
  var resetModalEl, resetPanelEl;

  function ensureSubTabDefaults(){
    state.settings.members.forEach(function(m){
      if (!state.subTab[m.id]) state.subTab[m.id] = 'casal';
    });
  }

  function memberById(id){
    return state.settings.members.find(function(m){ return m.id === id; }) || {id:id, name:id, color:'#8B93A1'};
  }

  function catIcon(cat){
    var f = CATEGORIES.find(function(c){ return c.id === cat; });
    return f ? f.icon : '🏷️';
  }

  function catColor(cat){
    var f = CATEGORIES.find(function(c){ return c.id === cat; });
    return (f && f.color) ? f.color : DEFAULT_CATEGORY_COLOR;
  }

  function catChipHTML(cat, size){
    size = size || 26;
    var color = catColor(cat);
    return '<span class="cat-chip" style="width:'+size+'px;height:'+size+'px;font-size:'+Math.round(size*0.55)+'px;background:'+hexToRgba(color,0.15)+';color:'+color+';">'+catIcon(cat)+'</span>';
  }

  function formatBRL(v){
    return (Number(v)||0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  }

  function formatQty(q){
    return (Number(q)||0).toLocaleString('pt-BR', {maximumFractionDigits:3, minimumFractionDigits:0});
  }

  function todayISO(){
    var d = new Date();
    var m = String(d.getMonth()+1).padStart(2,'0');
    var day = String(d.getDate()).padStart(2,'0');
    return d.getFullYear() + '-' + m + '-' + day;
  }

  function formatDateBR(iso){
    var parts = String(iso).split('-');
    if (parts.length !== 3) return iso;
    return parts[2] + '/' + parts[1] + '/' + parts[0].slice(2);
  }

  function generateId(){
    return 'id_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  function hexToRgba(hex, alpha){
    var h = String(hex).replace('#','');
    if (h.length === 3) h = h.split('').map(function(c){ return c+c; }).join('');
    var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
    return 'rgba(' + r + ',' + g + ',' + b + ',' + alpha + ')';
  }

  /* ---------- Storage ---------- */

  /*
   * O código anterior dependia de window.storage, que não existe em um
   * HTML comum aberto no navegador. Isso fazia storageAvailable ficar false
   * e, consequentemente, os gastos nunca eram persistidos.
   *
   * Aqui usamos localStorage, que funciona diretamente no navegador e mantém
   * os dados mesmo depois de fechar e reabrir a página.
   */
  function waitForStorage(maxWaitMs){
    return new Promise(function(resolve){
      try {
        var testKey = '__gastos_casa_test__';
        localStorage.setItem(testKey, '1');
        localStorage.removeItem(testKey);
        resolve(true);
      } catch(e) {
        console.error('localStorage indisponível', e);
        resolve(false);
      }
    });
  }

  async function loadExpenses(){
    if (!storageAvailable) return [];
    try {
      var raw = localStorage.getItem('gastos_casa_expenses');
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      return Array.isArray(parsed) ? parsed : [];
    } catch(e){
      console.error('loadExpenses', e);
      return [];
    }
  }

  async function saveExpenses(arr){
    if (!storageAvailable) return false;
    try {
      localStorage.setItem('gastos_casa_expenses', JSON.stringify(arr));
      return true;
    } catch(e){
      console.error('saveExpenses', e);
      return false;
    }
  }

  async function loadSettings(){
    if (!storageAvailable) return defaultSettings();
    try {
      var raw = localStorage.getItem('gastos_casa_settings');
      if (!raw) return defaultSettings();
      var parsed = JSON.parse(raw);
      var loaded = parsed && Array.isArray(parsed.members) ? parsed : defaultSettings();
      if (!Array.isArray(loaded.cards) || !loaded.cards.length) loaded.cards = DEFAULT_CARDS.slice();
      return loaded;
    } catch(e){
      console.error('loadSettings', e);
      return defaultSettings();
    }
  }

  async function saveSettings(s){
    if (!storageAvailable) return false;
    try {
      localStorage.setItem('gastos_casa_settings', JSON.stringify(s));
      return true;
    } catch(e){
      console.error('saveSettings', e);
      return false;
    }
  }

  async function saveFullReceipt(id, dataUrl){
    if (!storageAvailable) return false;
    try {
      localStorage.setItem('gastos_casa_receipt_full_' + id, dataUrl);
      return true;
    } catch(e){
      console.error('saveFullReceipt', e);
      return false;
    }
  }

  async function loadFullReceipt(id){
    if (!storageAvailable) return null;
    try {
      return localStorage.getItem('gastos_casa_receipt_full_' + id);
    } catch(e){
      console.error('loadFullReceipt', e);
      return null;
    }
  }

  async function deleteFullReceipt(id){
    if (!storageAvailable) return;
    try {
      localStorage.removeItem('gastos_casa_receipt_full_' + id);
    } catch(e){
      console.error('deleteFullReceipt', e);
    }
  }

  /* ---------- Image handling ---------- */

  function compressImage(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  // Versão da foto usada só para a leitura automática (OCR): maior resolução
  // que a guardada no app, e em preto-e-branco com contraste realçado — isso
  // ajuda bastante o reconhecimento de texto em cupons fiscais fotografados.
  function prepareImageForOCR(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          // Resolução maior ajuda MUITO em cupons de impressora matricial (os
          // "pontinhos" do texto ficam pequenos e a leitura precisa de mais
          // pixels pra reconhecer cada caractere).
          var maxWidth = 2200;
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try {
            var imgData = ctx.getImageData(0, 0, w, h);
            var d = imgData.data;
            var hist = new Array(256).fill(0);
            var i, g;
            for (i = 0; i < d.length; i += 4){
              g = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
              d[i] = d[i+1] = d[i+2] = g;
              hist[g]++;
            }
            // Alonga o contraste usando percentis (2%–98%) em vez do mínimo/máximo
            // cru — assim um brilho de reflexo ou uma sombra no canto da foto não
            // estraga o realce da folha inteira, como aconteceria com min/max puro.
            var totalPx = w * h;
            var lowCut = totalPx * 0.02, highCut = totalPx * 0.02;
            var acc = 0, lo = 0, hi = 255;
            for (i = 0; i < 256; i++){ acc += hist[i]; if (acc >= lowCut){ lo = i; break; } }
            acc = 0;
            for (i = 255; i >= 0; i--){ acc += hist[i]; if (acc >= highCut){ hi = i; break; } }
            if (hi <= lo){ lo = 0; hi = 255; }
            var range = hi - lo;
            for (i = 0; i < d.length; i += 4){
              var v = (d[i] - lo) * (255 / range);
              if (v < 0) v = 0; else if (v > 255) v = 255;
              d[i] = d[i+1] = d[i+2] = v;
            }
            ctx.putImageData(imgData, 0, 0);
          } catch(err){ /* segue sem o realce se o navegador não permitir */ }
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Computation ---------- */

  function groupByCategory(list){
    var map = {};
    list.forEach(function(e){
      if (!map[e.category]) map[e.category] = [];
      map[e.category].push(e);
    });
    var groups = Object.keys(map).map(function(cat){
      var items = map[cat].slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
      var total = items.reduce(function(s,e){ return s+e.value; }, 0);
      return {category:cat, items:items, total:total};
    });
    groups.sort(function(a,b){ return b.total - a.total; });
    return groups;
  }

  function computeSettlement(){
    var members = state.settings.members;
    var casalExpenses = state.expenses.filter(function(e){ return e.type === 'casal'; });
    var totalCasal = casalExpenses.reduce(function(s,e){ return s+casalCalc(e).paidValue; }, 0);
    var pctSum = members.reduce(function(s,m){ return s + (Number(m.percentage)||0); }, 0) || 1;

    var spent = {};
    members.forEach(function(m){ spent[m.id] = 0; });
    casalExpenses.forEach(function(e){
      if (spent.hasOwnProperty(e.person)) spent[e.person] += casalCalc(e).paidValue;
    });

    var balances = members.map(function(m){
      var share = (Number(m.percentage)||0) / pctSum;
      var fairShare = totalCasal * share;
      var s = spent[m.id] || 0;
      return {id:m.id, name:m.name, color:m.color, spent:s, fairShare:fairShare, balance: s - fairShare};
    });

    var creditors = balances.filter(function(b){ return b.balance > 0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });
    var debtors = balances.filter(function(b){ return b.balance < -0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:-b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });

    var transfers = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length){
      var c = creditors[ci], d = debtors[di];
      var amt = Math.min(c.amount, d.amount);
      if (amt > 0.005) transfers.push({from:d.name, to:c.name, amount:amt});
      c.amount -= amt; d.amount -= amt;
      if (c.amount <= 0.005) ci++;
      if (d.amount <= 0.005) di++;
    }

    return {totalCasal:totalCasal, balances:balances, transfers:transfers};
  }

  function computeInstallment(e){
    var total = Math.max(1, Number(e.installmentsTotal)||1);
    var paid = Math.min(Math.max(0, Number(e.installmentsPaid)||0), total);
    var parcelValue = e.value / total;
    return {
      installment:true,
      parcelValue:parcelValue,
      total:total,
      paid:paid,
      remaining: total-paid,
      paidValue: parcelValue*paid,
      remainingValue: parcelValue*(total-paid)
    };
  }

  function personalCalc(e){
    if (e.paymentMethod === 'credito' && e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function casalCalc(e){
    if (e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function personalSummary(memberId){
    var list = state.expenses.filter(function(e){ return e.person===memberId && e.type==='pessoal'; });
    var totals = {totalComprado:0, totalPago:0, totalAPagar:0, parcelasRestantes:0};
    list.forEach(function(e){
      var c = personalCalc(e);
      totals.totalComprado += e.value;
      totals.totalPago += c.paidValue;
      totals.totalAPagar += c.remainingValue;
      totals.parcelasRestantes += c.remaining;
    });
    return totals;
  }

  function addMonthsToDate(date, n){
    return new Date(date.getFullYear(), date.getMonth()+n, date.getDate());
  }

  function upcomingMonthsForMember(memberId){
    var list = state.expenses.filter(function(e){ return e.person===memberId && e.type==='pessoal'; });
    var map = {};
    var currentYear = new Date().getFullYear();
    list.forEach(function(e){
      var c = personalCalc(e);
      if (!c.installment || c.remaining <= 0) return;
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      for (var k = c.paid+1; k <= c.total; k++){
        var due = addMonthsToDate(purchaseDate, k-1);
        var key = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
        if (!map[key]) map[key] = {year:due.getFullYear(), month:due.getMonth(), count:0, value:0};
        map[key].count += 1;
        map[key].value += c.parcelValue;
      }
    });
    var keys = Object.keys(map).sort();
    return keys.map(function(k){
      var m = map[k];
      var label = MONTH_NAMES_PT[m.month] + (m.year !== currentYear ? '/' + String(m.year).slice(2) : '');
      return {label:label, count:m.count, value:m.value};
    });
  }

  function buildCasalMonthsTimeline(){
    var casalExpenses = state.expenses.filter(function(e){ return e.type === 'casal'; });
    var map = {};
    function addTo(key, year, month, item){
      if (!map[key]) map[key] = {year:year, month:month, items:[]};
      map[key].items.push(item);
    }
    casalExpenses.forEach(function(e){
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      var c = casalCalc(e);
      if (!c.installment){
        var key = purchaseDate.getFullYear() + '-' + String(purchaseDate.getMonth()+1).padStart(2,'0');
        addTo(key, purchaseDate.getFullYear(), purchaseDate.getMonth(), {
          id:e.id, description:e.description, category:e.category, value:e.value, installmentLabel:null, paid:true
        });
      } else {
        for (var k = 1; k <= c.total; k++){
          var due = addMonthsToDate(purchaseDate, k-1);
          var key2 = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
          addTo(key2, due.getFullYear(), due.getMonth(), {
            id:e.id, description:e.description, category:e.category, value:c.parcelValue,
            installmentLabel:(k+'/'+c.total), paid:(k<=c.paid)
          });
        }
      }
    });
    var keys = Object.keys(map).sort();
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    return keys.map(function(k){
      var m = map[k];
      var items = m.items.slice().sort(function(a,b){ return (a.description||'').localeCompare(b.description||''); });
      var total = items.reduce(function(s,it){ return s+it.value; }, 0);
      return {
        key:k, year:m.year, month:m.month, items:items, total:total,
        isPast: k < currentKey, isCurrent: k === currentKey, isFuture: k > currentKey
      };
    });
  }

  function buildCasalYearsTimeline(){
    var timeline = buildCasalMonthsTimeline();
    var map = {};
    var order = [];
    timeline.forEach(function(g){
      if (!map[g.year]){ map[g.year] = {year:g.year, months:[], total:0, hasCurrent:false}; order.push(g.year); }
      map[g.year].months.push(g);
      map[g.year].total += g.total;
      if (g.isCurrent) map[g.year].hasCurrent = true;
    });
    return order.sort(function(a,b){ return b-a; }).map(function(y){ return map[y]; });
  }

  function monthKeyFromDate(iso){ return String(iso||'').slice(0,7); }

  function monthLabelFromKey(key){
    var parts = key.split('-');
    if (parts.length !== 2) return key;
    var idx = Number(parts[1]) - 1;
    var name = MONTH_NAMES_PT[idx] || parts[1];
    return name + ' de ' + parts[0];
  }

  function getCategoryItems(category){
    var expenses = state.expenses.filter(function(e){ return e.type === 'casal' && e.category === category; });
    var items = [];
    expenses.forEach(function(e){
      if (Array.isArray(e.items) && e.items.length){
        e.items.forEach(function(it, idx){
          var qty = Number(it.quantity) || 1;
          var legacyUV = Number(it.unitValue) || 0;
          var subtotal = it.value != null ? Number(it.value) || 0 : qty * legacyUV;
          items.push({position:it.position || idx+1, description:it.description, quantity:qty, unit:it.unit || 'UN', weight:it.weight != null ? it.weight : '', value:subtotal, subtotal:subtotal, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
        });
      } else {
        items.push({position:1, description:e.description, quantity:1, unit:'UN', weight:'', value:e.value, subtotal:e.value, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
      }
    });
    return items;
  }

  // Meses (mais recente primeiro) em que existe pelo menos uma compra nessa
  // categoria — usado para popular o filtro de mês em "Ver itens".
  function getAvailableMonths(items){
    var seen = {};
    items.forEach(function(it){ if (it.monthKey) seen[it.monthKey] = true; });
    return Object.keys(seen).sort(function(a,b){ return b.localeCompare(a); });
  }

  // Agrupa compras de itens pelo nome do produto (ignorando maiúscula/minúscula
  // e espaços nas pontas), somando a quantidade e o valor de todas as compras
  // desse produto — assim dá pra ver quantas unidades foram compradas no total.
  function groupItemsByProduct(items){
    var map = {};
    var order = [];
    items.forEach(function(it){
      var key = String(it.description||'').trim().toLowerCase();
      if (!map[key]){
        map[key] = {description: it.description, quantity: 0, subtotal: 0, purchases: 0, date: it.date};
        order.push(key);
      }
      var g = map[key];
      g.quantity += it.quantity;
      g.subtotal += it.subtotal;
      g.purchases += 1;
      if (it.date > g.date) g.date = it.date;
    });
    return order.map(function(k){
      var g = map[k];
      g.unitValue = g.quantity > 0 ? g.subtotal / g.quantity : g.subtotal;
      return g;
    });
  }

  function sortCategoryItems(items, sort){
    var arr = items.slice();
    if (sort === 'qty_desc') arr.sort(function(a,b){ return b.quantity - a.quantity; });
    else if (sort === 'value_desc') arr.sort(function(a,b){ return b.subtotal - a.subtotal; });
    else if (sort === 'value_asc') arr.sort(function(a,b){ return a.subtotal - b.subtotal; });
    else arr.sort(function(a,b){ return b.date.localeCompare(a.date); });
    return arr;
  }

  function recalcItemsTotal(form){
    renumberItemRows(form);
    var rows = form.querySelectorAll('.item-row');
    var valueInput = form.querySelector('.value-input');
    var totalRow = form.querySelector('.items-total-row');
    if (rows.length === 0){
      if (valueInput){
        valueInput.readOnly = false;
        valueInput.classList.remove('computed-value');
      }
      if (totalRow) totalRow.classList.add('hidden');
      return;
    }
    var total = 0;
    rows.forEach(function(row){
      var value = parseFloat(row.querySelector('.item-value-input').value) || 0;
      total += value;
    });
    if (valueInput){
      valueInput.value = total.toFixed(2);
      valueInput.readOnly = true;
      valueInput.classList.add('computed-value');
    }
    if (totalRow){
      totalRow.classList.remove('hidden');
      var mainEl = totalRow.querySelector('.items-total-main');
      if (mainEl) mainEl.textContent = formatBRL(total);
      var refEl = totalRow.querySelector('.items-total-ref');
      var itemsList = form.querySelector('.items-list');
      var ocrTotal = itemsList ? parseFloat(itemsList.dataset.ocrTotal || '') : NaN;
      totalRow.classList.remove('totals-match', 'totals-mismatch');
      if (refEl){
        if (!isNaN(ocrTotal)){
          var matches = Math.abs(ocrTotal - total) < 0.02;
          refEl.textContent = (matches ? '✅ confere com o total da nota (' : '⚠️ total da nota lido: ') + formatBRL(ocrTotal) + (matches ? ')' : ' — confira os itens');
          totalRow.classList.add(matches ? 'totals-match' : 'totals-mismatch');
        } else {
          refEl.textContent = 'Confira com o total impresso na nota.';
        }
      }
    }
  }

  function renderResumo(){
    var res = computeSettlement();
    var heroHTML;
    if (res.totalCasal === 0){
      heroHTML = '<div class="hero-settlement"><div class="label">Acerto entre a casa</div><div class="amount settled">Nenhum gasto do casal registrado ainda</div></div>';
    } else if (res.transfers.length === 0){
      heroHTML = '<div class="hero-settlement"><div class="label">Acerto entre a casa</div><div class="amount settled">Tudo certo — cada um pagou sua parte ✓</div></div>';
    } else {
      var rows = res.transfers.map(function(t){
        return '<div class="transfer-row"><span class="direction">'+escapeHTML(t.from)+' → '+escapeHTML(t.to)+'</span><span class="amount'+(res.transfers.length===1?' single':'')+'">'+formatBRL(t.amount)+'</span></div>';
      }).join('');
      heroHTML = '<div class="hero-settlement"><div class="label">Acerto entre a casa</div>' + rows + '</div>';
    }

    var maxVal = Math.max.apply(null, res.balances.map(function(b){ return b.spent; }).concat([1]));
    var compareHTML = '<div class="compare">' + res.balances.map(function(b){
      return '<div class="compare-row"><div class="top"><span class="who" style="color:'+b.color+';">'+escapeHTML(b.name)+'</span><span class="val">'+formatBRL(b.spent)+'</span></div><div class="track"><div class="fill" style="width:'+(b.spent/maxVal*100)+'%;background:'+b.color+';"></div></div></div>';
    }).join('') + '</div>';

    var casalList = state.expenses.filter(function(e){ return e.type==='casal'; });

    }).join('');

    return ''
      + heroHTML
      + compareHTML
      + '<div class="section-title">Contas do casal por categoria</div>'
      + catHTML
      + '<div class="section-title">Gastos pessoais</div>'

        + '<div class="year-bar-track"><div class="year-bar-fill" style="width:'+pct+'%;"></div></div>'
        + '<div class="year-card-meta">'+y.months.length+(y.months.length===1?' mês com gastos':' meses com gastos')+'<span class="cat-click-hint">›</span></div>'
        + '</button>';

  function renderMesesMonthsHTML(yearGroup){

    var maxTotal = Math.max.apply(null, yearGroup.months.map(function(g){ return g.total; }).concat([1]));

    for (var i = 0; i < 12; i++){

        cellsHTML += '<div class="month-cell empty-cell"><span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+'</span><span class="mc-value">—</span></div>';
        continue;

      var pct = Math.max(6, Math.round(g.total / maxTotal * 100));
      var cls = 'month-cell' + (g.isCurrent ? ' current' : '') + (g.isFuture ? ' future' : '');
      cellsHTML += ''
        + '<button type="button" class="'+cls+'" data-action="select-meses-month" data-month="'+g.key+'">'
        + '<span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+(g.isCurrent ? ' •' : '')+'</span>'
        + '<span class="mc-bar-track"><span class="mc-bar-fill" style="width:'+pct+'%;"></span></span>'
        + '<span class="mc-value">'+formatBRL(g.total)+'</span>'
        + (g.isFuture ? '<span class="mc-future-tag">previsto</span>' : '')
        + '</button>';

      + '<div class="section-title-row"><button type="button" class="back-btn" data-action="meses-back-years">‹ Anos</button></div>'

      + '<div class="meses-hint">Toque num mês pra ver os lançamentos.</div>'

  function renderMesesTab(){
    var years = buildCasalYearsTimeline();
    if (!years.length){
      return '<div class="empty-state">Nenhuma conta do casal registrada ainda. Assim que vocês lançarem uma compra — à vista ou parcelada — ela aparece aqui organizada por ano e mês.</div>';
    }
    var view = state.mesesView || {mode:'years'};

    if (view.mode === 'month'){
      var yg = years.find(function(y){ return y.year === view.year; });
      var g = yg && yg.months.find(function(m){ return m.key === view.month; });
      if (g) return renderMesesMonthDetailHTML(g);
      state.mesesView = {mode:'years'};
    } else if (view.mode === 'months'){
      var yg2 = years.find(function(y){ return y.year === view.year; });
      if (yg2) return renderMesesMonthsHTML(yg2);
      state.mesesView = {mode:'years'};
    }

    return renderMesesYearsHTML(years);
  }

  function updateResetConfirmState(){

    var input = resetPanelEl.querySelector('#reset-confirm-input');
    var matches = !!input && input.value.trim().toLowerCase() === 'excluir';

  function renderResetModal(){
    var membersHTML = state.settings.members.map(function(m){
      return '<label class="reset-check-row"><input type="checkbox" class="reset-check" value="pessoal:'+escapeHTML(m.id)+'"> Gastos pessoais — '+escapeHTML(m.name)+'</label>';
    }).join('');
    resetPanelEl.innerHTML = ''
      + '<h2>⚠️ Zerar dados</h2>'

      + membersHTML

      + '<div class="settings-actions"><button type="button" id="cancel-reset-btn" class="secondary-btn">Cancelar</button><button type="button" id="confirm-reset-btn" class="submit-btn danger-btn" disabled>Apagar selecionado(s)</button></div>';
  }
  async function handleConfirmReset(){
    var checks = resetPanelEl.querySelectorAll('.reset-check:checked');
    var wipeCasal = false, wipeSettings = false, personalMemberIds = [];
    checks.forEach(function(cb){
      var v = cb.value;
      if (v === 'casal') wipeCasal = true;
      else if (v === 'settings') wipeSettings = true;
      else if (v.indexOf('pessoal:') === 0) personalMemberIds.push(v.slice('pessoal:'.length));
    });
    if (!wipeCasal && !wipeSettings && !personalMemberIds.length) return;

    var toRemove = state.expenses.filter(function(e){
      if (wipeCasal && e.type === 'casal') return true;
      if (e.type === 'pessoal' && personalMemberIds.indexOf(e.person) !== -1) return true;
      return false;
    });
    var remaining = state.expenses.filter(function(e){ return toRemove.indexOf(e) === -1; });
    var savedR = await saveExpenses(remaining);
    if (!savedR){ alert('Não foi possível apagar os dados. Tente de novo.'); return; }
    state.expenses = remaining;
    for (var i=0;i<toRemove.length;i++){
      if (toRemove[i].thumb) await deleteFullReceipt(toRemove[i].id);
    }
    if (wipeSettings){
      var fresh = defaultSettings();
      var savedS = await saveSettings(fresh);
      if (savedS) state.settings = fresh;
      ensureSubTabDefaults();
    }
    state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
    if (state.currentTab !== 'resumo' && state.currentTab !== 'meses' && !state.settings.members.find(function(m){ return m.id === state.currentTab; })){
      state.currentTab = 'resumo';
    }
    closeResetModal();
    render();
  }

  function captureAddFormDraft(){
    var form = contentEl.querySelector('form.add-form');
    if (!form) return null;
    var draft = { memberId: form.getAttribute('data-member') };
    var el;
    el = form.querySelector('.category-select'); if (el) draft.category = el.value;
    el = form.querySelector('.custom-category-input'); if (el) draft.customCategory = el.value;
    el = form.querySelector('.description-input'); if (el) draft.description = el.value;
    el = form.querySelector('.value-input'); if (el && !el.readOnly) draft.value = el.value;
    el = form.querySelector('.date-input'); if (el) draft.date = el.value;
    el = form.querySelector('.payment-method-select'); if (el) draft.paymentMethod = el.value;
    el = form.querySelector('.card-select'); if (el) draft.card = el.value;
    el = form.querySelector('.custom-card-input'); if (el) draft.customCard = el.value;
    el = form.querySelector('.installment-toggle-select'); if (el) draft.installmentToggle = el.value;
    el = form.querySelector('.installments-total-input'); if (el) draft.installmentsTotal = el.value;
    el = form.querySelector('.installments-paid-input'); if (el) draft.installmentsPaid = el.value;
    var itemRows = form.querySelectorAll('.item-row');
    if (itemRows.length){
      draft.items = [];
      itemRows.forEach(function(row){
        draft.items.push({
          description: row.querySelector('.item-desc-input').value,
          quantity: row.querySelector('.item-qty-input').value,
          unit: row.querySelector('.item-unit-input').value,
          weight: row.querySelector('.item-weight-input').value,
          value: row.querySelector('.item-value-input').value
        });
      });
    }
    return draft;
  }

  function applyAddFormDraft(draft){
    if (!draft) return;
    var form = contentEl.querySelector('form.add-form');
    if (!form || form.getAttribute('data-member') !== draft.memberId) return;
    var el;
    el = form.querySelector('.category-select');
    if (el && draft.category != null){ el.value = draft.category; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-category-input'); if (el && draft.customCategory != null) el.value = draft.customCategory;
    el = form.querySelector('.description-input'); if (el && draft.description != null) el.value = draft.description;
    el = form.querySelector('.date-input'); if (el && draft.date != null) el.value = draft.date;
    el = form.querySelector('.payment-method-select');
    if (el && draft.paymentMethod != null){ el.value = draft.paymentMethod; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.card-select');
    if (el && draft.card != null){ el.value = draft.card; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-card-input'); if (el && draft.customCard != null) el.value = draft.customCard;
    el = form.querySelector('.installment-toggle-select');
    if (el && draft.installmentToggle != null){ el.value = draft.installmentToggle; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.installments-total-input'); if (el && draft.installmentsTotal != null) el.value = draft.installmentsTotal;
    el = form.querySelector('.installments-paid-input'); if (el && draft.installmentsPaid != null) el.value = draft.installmentsPaid;
    if (draft.items && draft.items.length){
      var list = form.querySelector('.items-list');
      if (list){
        list.innerHTML = draft.items.map(itemRowHTML).join('');
        recalcItemsTotal(form);
      }
    }
    if (draft.value != null){

    render();
    applyAddFormDraft(formDraft);

  /* ---------- Expense handlers ---------- */

  async function handleFormSubmit(form){
    var memberId = form.getAttribute('data-member');
    var type = state.subTab[memberId] || 'casal';
    var catSelect = form.querySelector('.category-select');
    var category = catSelect.value;
    if (category === '__custom__'){
      var custom = form.querySelector('.custom-category-input').value.trim();
      if (!custom){ alert('Digite o nome da categoria.'); return; }
      category = custom;
    }
    var description = form.querySelector('.description-input').value.trim();
    var value = parseFloat(form.querySelector('.value-input').value);
    var date = form.querySelector('.date-input').value || todayISO();

    if (!description){ alert('Digite uma descrição.'); return; }
    if (!value || value <= 0){ alert('Digite um valor válido.'); return; }

    var extra = {};
    if (type === 'pessoal'){
      var paymentMethodEl = form.querySelector('.payment-method-select');
      var paymentMethod = paymentMethodEl ? paymentMethodEl.value : 'credito';
      extra.paymentMethod = paymentMethod;
      if (paymentMethod === 'credito'){
        var cardSelectEl = form.querySelector('.card-select');
        var cardValue = cardSelectEl ? cardSelectEl.value : '';
        if (cardValue === '__custom__'){
          var customCard = form.querySelector('.custom-card-input').value.trim();
          if (!customCard){ alert('Digite o nome do cartão.'); return; }
          cardValue = customCard;
        }
        if (!cardValue){ alert('Selecione o cartão.'); return; }
        extra.card = cardValue;
        var instToggleEl = form.querySelector('.installment-toggle-select');
        var isInstallment = !!instToggleEl && instToggleEl.value === 'sim';
        extra.installment = isInstallment;
        if (isInstallment){
          var totalInst = parseInt(form.querySelector('.installments-total-input').value, 10);
          var paidInst = parseInt(form.querySelector('.installments-paid-input').value, 10);
          if (!totalInst || totalInst < 1){ alert('Informe o número de parcelas.'); return; }
          if (isNaN(paidInst) || paidInst < 0) paidInst = 0;
          if (paidInst > totalInst) paidInst = totalInst;
          extra.installmentsTotal = totalInst;
          extra.installmentsPaid = paidInst;
        } else {
          extra.installmentsTotal = null;
          extra.installmentsPaid = null;
        }
      } else {
        extra.card = null;
        extra.installment = false;
        extra.installmentsTotal = null;
        extra.installmentsPaid = null;
      }
    } else if (type === 'casal'){
      var itemRows = form.querySelectorAll('.item-row');
      var items = [];
      itemRows.forEach(function(row, idx){
        var idesc = row.querySelector('.item-desc-input').value.trim();
        var iqty = parseFloat(row.querySelector('.item-qty-input').value) || 0;
        var iunit = (row.querySelector('.item-unit-input').value || 'UN').trim().toUpperCase();
        var iweightEl = row.querySelector('.item-weight-input');
        var ivalue = parseFloat(row.querySelector('.item-value-input').value) || 0;
        var iweight = iweightEl && iweightEl.value !== '' ? parseFloat(iweightEl.value) : null;
        if (idesc && iqty > 0 && ivalue >= 0) items.push({position:idx+1, description:idesc, quantity:iqty, unit:iunit || 'UN', weight:isNaN(iweight)?null:iweight, value:ivalue});
      });
      extra.items = items.length ? items : null;
      // Se os itens vieram do OCR, não permite salvar silenciosamente uma lista
      // cuja soma diverge do total impresso. Isso funciona como uma trava de
      // segurança contra itens/valores embaralhados.
      var ocrTotalEl = form.querySelector('.items-list');
      var ocrTotalCheck = ocrTotalEl ? parseFloat(ocrTotalEl.dataset.ocrTotal || '') : NaN;
      if (!isNaN(ocrTotalCheck) && items.length){
        var itemsSumCheck = items.reduce(function(sum,it){ return sum + Number(it.value||0); },0);
        if (Math.abs(itemsSumCheck - ocrTotalCheck) >= 0.02){
          alert('Atenção: a soma dos itens ('+formatBRL(itemsSumCheck)+') não confere com o total da nota ('+formatBRL(ocrTotalCheck)+'). Revise os itens antes de salvar.');
          return;
        }
      }

      var instToggleC = form.querySelector('.installment-toggle-select');
      var isInstallmentC = !!instToggleC && instToggleC.value === 'sim';
      extra.installment = isInstallmentC;
      if (isInstallmentC){
        var totalInstC = parseInt(form.querySelector('.installments-total-input').value, 10);
        var paidInstC = parseInt(form.querySelector('.installments-paid-input').value, 10);
        if (!totalInstC || totalInstC < 1){ alert('Informe o número de parcelas.'); return; }
        if (isNaN(paidInstC) || paidInstC < 0) paidInstC = 0;
        if (paidInstC > totalInstC) paidInstC = totalInstC;
        extra.installmentsTotal = totalInstC;
        extra.installmentsPaid = paidInstC;
      } else {
        extra.installmentsTotal = null;
        extra.installmentsPaid = null;
      }
    }

    if (state.editingId){
      var idx = state.expenses.findIndex(function(e){ return e.id === state.editingId; });
      if (idx === -1){ state.editingId = null; render(); return; }
      var original = state.expenses[idx];
      var newThumb = original.thumb;
      if (state.pendingPhoto) newThumb = state.pendingPhoto.thumb;
      else if (state.removeExistingPhoto) newThumb = null;
      var updated = Object.assign({}, original, {category:category, description:description, value:value, date:date, thumb:newThumb}, extra);
      state.expenses[idx] = updated;
      var savedEdit = await saveExpenses(state.expenses);
      if (!savedEdit){ state.expenses[idx] = original; alert('Não foi possível salvar as alterações.'); return; }
      if (state.pendingPhoto) await saveFullReceipt(state.editingId, state.pendingPhoto.full);
      else if (state.removeExistingPhoto) await deleteFullReceipt(state.editingId);
      state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
      render();
      return;
    }

    var id = generateId();
    var photo = state.pendingPhoto;
    var newExpense = Object.assign({id:id, person:memberId, type:type, category:category, description:description, value:value, date:date, thumb: photo?photo.thumb:null}, extra);
    state.expenses.push(newExpense);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.pop(); alert('Não foi possível salvar o gasto. Verifique se o navegador permite armazenamento local e tente novamente.'); return; }
    if (photo) await saveFullReceipt(id, photo.full);
    state.pendingPhoto = null;
    render();
  }

  async function handleDeleteExpense(id){
    if (!confirm('Excluir este gasto?')) return;
    var idx = state.expenses.findIndex(function(e){ return e.id === id; });
    if (idx === -1) return;
    var removed = state.expenses[idx];
    state.expenses.splice(idx, 1);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.splice(idx, 0, removed); alert('Não foi possível excluir. Tente de novo.'); return; }
    if (removed.thumb) await deleteFullReceipt(id);
    if (state.editingId === id){ state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false; }
    render();
  }

    var exp = state.expenses.find(function(e){ return e.id === id; });

    state.editingId = id;
    state.pendingPhoto = null;
    state.removeExistingPhoto = false;
