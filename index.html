    {nome:'Semar',         re:/\bSEMAR\b/i,                  categoria:'Mercado'},
    {nome:'Roldão',        re:/ROLD[ÃA]O/i,                  categoria:'Mercado'},
    {nome:'Enxuto',        re:/\bENXUTO\b/i,                 categoria:'Mercado'},
    {nome:'Mambo',         re:/\bMAMBO\b/i,                  categoria:'Mercado'},
    {nome:'Sam\'s Club',   re:/SAM.?S\s*CLUB/i,              categoria:'Mercado'},
    {nome:'Makro',         re:/\bMAKRO\b/i,                  categoria:'Mercado'},
    {nome:'Big',           re:/\bBIG\s*(BOMPRE[ÇC]O)?\b/i,   categoria:'Mercado'},
    {nome:'Zaffari',       re:/ZAFFARI/i,                    categoria:'Mercado'},
    {nome:'Angeloni',      re:/ANGELONI/i,                   categoria:'Mercado'},
    {nome:'Drogasil',      re:/DROGASIL/i,                   categoria:'Saúde'},
    {nome:'Droga Raia',    re:/DROGA\s*RAIA|\bRAIA\b/i,      categoria:'Saúde'},
    {nome:'Pague Menos',   re:/PAGUE\s*MENOS/i,              categoria:'Saúde'},
    {nome:'Drogaria SP',   re:/DROGARIA\s*S[ÃA]O\s*PAULO/i,  categoria:'Saúde'},
    {nome:'Ultrafarma',    re:/ULTRAFARMA/i,                 categoria:'Saúde'},
    {nome:'Panvel',        re:/PANVEL/i,                     categoria:'Saúde'},
    {nome:'Ipiranga',      re:/IPIRANGA/i,                   categoria:'Transporte'},
    {nome:'Shell',         re:/\bSHELL\b/i,                  categoria:'Transporte'},
    {nome:'Petrobras',     re:/PETROBRAS|\bBR\s*DISTRIBUIDORA\b/i, categoria:'Transporte'},
    {nome:'Ale',           re:/\bALE\s*COMBUST[ÍI]VEIS\b/i,  categoria:'Transporte'},
    {nome:'Leroy Merlin',  re:/LEROY\s*MERLIN/i,             categoria:'Outros'},
    {nome:'Telhanorte',    re:/TELHANORTE/i,                 categoria:'Outros'},
    {nome:'Americanas',    re:/AMERICANAS/i,                 categoria:'Outros'},
    {nome:'Magazine Luiza',re:/MAGAZINE\s*LUIZA|MAGALU/i,    categoria:'Outros'},
    {nome:'Casas Bahia',   re:/CASAS\s*BAHIA/i,              categoria:'Outros'},
    {nome:'Petz',          re:/\bPETZ\b/i,                   categoria:'Outros'},
    {nome:'Cobasi',        re:/COBASI/i,                     categoria:'Outros'}
  ];

  function lojaConhecida(texto){
    var t = String(texto || '');
    if (!t) return null;
    for (var i = 0; i < REDES.length; i++){
      if (REDES[i].re.test(t)) return REDES[i];
    }
    return null;
  }

  // Palavras que descrevem o tipo de negócio ou a forma jurídica: nenhuma
  // delas é o nome que a pessoa usa pra falar da loja.
  var LIXO_RAZAO_SOCIAL = /^(LTDA|ME|EPP|EIRELI|S\/?A|SA|CIA|COMPANHIA|COM|COMERCIO|COMÉRCIO|DE|DA|DO|DOS|DAS|E|ALIMENTOS|PRODUTOS|DISTRIBUIDORA|DISTRIBUICAO|DISTRIBUIÇÃO|SUPERMERCADO|SUPERMERCADOS|MERCADO|MERCADOS|HIPERMERCADO|ATACADISTA|ATACADO|VAREJO|VAREJISTA|FARMACIA|FARMÁCIA|DROGARIA|DROGARIAS|POSTO|AUTO|SERVICO|SERVIÇO|SERVICOS|SERVIÇOS|COMERCIAL|INDUSTRIA|INDÚSTRIA|LOJA|LOJAS|FILIAL|MATRIZ)$/i;

  function acharLoja(linhas){
    for (var j = 0; j < Math.min(linhas.length, 6); j++){
      var lj = linhas[j];
      if (!/[A-Za-zÀ-ÿ]{3,}/.test(lj)) continue;
      if (NOISE_RE.test(lj) || TABLE_HEAD_RE.test(lj) || ANCHOR_STRONG_RE.test(lj)) continue;
      var limpo = lj.replace(/[^A-Za-zÀ-ÿ0-9 .,\-&']/g, ' ').replace(/\s+/g, ' ').trim();
      if (limpo.length < 3) continue;
      var bonito = enxugarRazaoSocial(limpo);
      if (bonito) return bonito;
    }
    return null;
  }

  /* "SHIBATA SUPERMERCADOS LTDA" -> "Shibata".
     "COMERCIAL DE ALIMENTOS SAO JOSE LTDA ME" -> "Sao Jose".
     O nome de verdade quase sempre está no meio: primeiro pulamos as palavras
     genéricas do começo (COMERCIAL, DE, ALIMENTOS, SUPERMERCADO), depois
     juntamos o que vem até a próxima genérica. */
  function enxugarRazaoSocial(bruto){
    var palavras = String(bruto).split(' ')
      .map(function(w){ return w.replace(/[.,]+$/, ''); })
      .filter(function(w){ return w.length > 0; });

    var marca = [];
    var comecou = false;
    for (var i = 0; i < palavras.length; i++){
      var w = palavras[i];
      var generica = LIXO_RAZAO_SOCIAL.test(w) || /^\d+$/.test(w);
      if (!comecou){
        if (generica) continue;    // ainda no cabeçalho genérico
        comecou = true;
      } else if (generica){
        break;                     // acabou o nome
      }
      marca.push(w);
      if (marca.length === 3) break;   // nome comprido demais não ajuda ninguém
    }

    if (!marca.length){
      // A razão social inteira era genérica: usa as duas primeiras palavras.
      marca = palavras.slice(0, 2);
    }
    var nome = marca.join(' ').trim();
    if (nome.length < 3) return null;
    return maiusculaBonita(nome);
  }

  // GRITANDO EM CAIXA ALTA vira Caixa Alta Normal.
  function maiusculaBonita(txt){
    return String(txt).toLowerCase().split(' ').map(function(w){
      if (!w) return w;
      // "de", "da", "do" no meio ficam minúsculos, como se escreve de verdade.
      if (['de','da','do','dos','das','e'].indexOf(w) !== -1) return w;
      return w.charAt(0).toUpperCase() + w.slice(1);
    }).join(' ').replace(/^./, function(c){ return c.toUpperCase(); });
  }

  function parseReceiptText(rawText){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var text = normalizeOcrText(rawText);
    var allLines = stitchLines(text.split(/\r?\n/)
      .map(function(l){ return l.replace(/\s+/g, ' ').trim(); })
      .filter(function(l){ return l.length > 0; }));

    var result = { date:null, total:null, storeName:null, storeCategory:null, itemCountPrinted:null, items:[], rawText:String(rawText||'') };

    /* --- Data --- */
    for (var i = 0; i < allLines.length; i++){
      var dm = allLines[i].match(/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/);
      if (dm){
        var y = Number(dm[3]);
        var dt = new Date(y, Number(dm[2]) - 1, Number(dm[1]));
        if (!isNaN(dt.getTime()) && y > 2000 && y < 2100){
          result.date = dm[3] + '-' + dm[2] + '-' + dm[1];
          break;
        }
      }
    }

    /* --- Nome da loja --- */
    result.storeName = acharLoja(allLines);
    var conhecida = lojaConhecida(result.storeName) || lojaConhecida(text);
    if (conhecida){
      result.storeName = conhecida.nome;
      result.storeCategory = conhecida.categoria || null;
    }

    /* --- Total impresso (só pra conferência) --- */
    for (var k = allLines.length - 1; k >= 0; k--){
      var lk = allLines[k];
      if (/(VALOR\s*A\s*PAGAR|VALOR\s*TOTAL|\bTOTAL\b)/i.test(lk) && !/SUBTOTAL|DESCONTO|ITENS|TRIBUTOS/i.test(lk)){
        var mt = lk.match(moneyRe);
        if (mt && mt.length){
          var vt = parseBRLNumber(mt[mt.length - 1]);
          if (vt != null && vt > 0){ result.total = vt; break; }
        }
      }
    }

    /* --- Nº de itens impresso (conferência) --- */
    for (var q = 0; q < allLines.length; q++){
      var mq = allLines[q].match(/(?:QTD\.?\s*TOTAL\s*DE\s*ITENS|TOTAL\s*DE\s*ITENS)\D{0,6}(\d{1,3})/i);
      if (mq){ result.itemCountPrinted = parseInt(mq[1], 10); break; }
    }

    /* --- Recorte da região dos itens --- */
    var start = 0, end = allLines.length;
    for (var a = 0; a < allLines.length; a++){
      if (TABLE_HEAD_RE.test(allLines[a])){ start = a + 1; break; }
      if (ANCHOR_STRONG_RE.test(allLines[a])){ start = a; break; }
    }
    // O rodapé só começa DEPOIS do último item numerado. Sem essa checagem,
    // uma linha de desconto no meio da compra cortaria metade da lista fora.
    var lastAnchor = -1;
    for (var z = allLines.length - 1; z >= start; z--){
      if (ANCHOR_STRONG_RE.test(allLines[z])){ lastAnchor = z; break; }
    }
    for (var b = Math.max(start, lastAnchor + 1); b < allLines.length; b++){
      if (FOOTER_RE.test(allLines[b]) && !ANCHOR_STRONG_RE.test(allLines[b])){ end = b; break; }
    }
    var region = allLines.slice(start, end).filter(function(l){
      return !NOISE_RE.test(l) && !MID_NOISE_RE.test(l) && !TABLE_HEAD_RE.test(l);
    });

    /* --- Âncoras: onde cada item começa --- */
    // Aceitamos uma âncora só se o Nº dela continuar a sequência (crescente,
    // sem pular muito). Isso impede que um pedaço de código de barras ou uma
    // data solta seja confundida com o começo de um item novo.
    var anchors = [];
    var lastPos = 0;
    region.forEach(function(line, idx){
      var m = line.match(ANCHOR_STRONG_RE);
      var strong = true;
      if (!m){ m = line.match(ANCHOR_MEDIUM_RE); strong = false; }
      if (!m) return;
      var pos = parseInt(m[1], 10);
      if (!pos || pos < 1 || pos > 300) return;
      if (pos <= lastPos || pos > lastPos + 5) return;
      if (anchors.length === 0 && pos > 3) return;
      if (!strong && !/[A-Za-zÀ-ÿ]{3,}/.test(line)) return;
      anchors.push({ index: idx, position: pos, strong: strong });
      lastPos = pos;
    });

    var nextAuto = 1;
    if (anchors.length){
      anchors.forEach(function(anc, n){
        var stop = (n + 1 < anchors.length) ? anchors[n + 1].index : region.length;
        var blob = region.slice(anc.index, stop).join(' ').replace(/\s+/g, ' ').trim();
        // Um bloco pode conter mais de um item quando o OCR perdeu o Nº do
        // item seguinte — por isso ainda dividimos pelo padrão de compra.
        var parsedItems = parseBlob(blob, anc.strong);
        parsedItems.forEach(function(it, sub){
          it.position = (sub === 0) ? anc.position : (anc.position + sub);
          if (sub > 0) it.confidence = 'baixa';
          result.items.push(it);
          nextAuto = it.position + 1;
        });
      });
    } else {
      // Nota sem Nº legível: vamos linha por linha, guardando a última linha
      // de texto como possível nome do item seguinte. Importante NÃO juntar a
      // região inteira num bloco só — senão endereço e cabeçalho da loja
      // acabam grudados no nome do primeiro produto.
      var pending = '';
      var lastItem = null;
      region.forEach(function(line){
        // Linha só com valor: é o total do item anterior, não um item novo.
        var om = line.match(ONLY_MONEY_RE);
        if (om){
          if (lastItem && lastItem._needsTotal){
            var v = parseBRLNumber(om[1]);
            if (v != null && v > 0){ lastItem.value = v; lastItem._needsTotal = false; }
          }
          return;
        }
        var got = parseBlob(line, false);
        if (!got.length){
          var cand = cleanProductName(line);
          pending = (cand && !HEADER_WORDS_RE.test(cand)) ? cand : '';
          return;
        }
        // Se o primeiro item da linha ficou sem nome, aproveitamos o texto da
        // linha anterior (caso clássico de nome e valor em linhas separadas).
        if (!got[0].description && pending){
          got[0].description = pending;
          got[0].confidence = 'baixa';
        }
        pending = '';
        got.forEach(function(it){
          it.position = nextAuto++;
          it.confidence = 'baixa';
          result.items.push(it);
          lastItem = it;
        });
      });
    }

    // Descarta o que claramente não é produto e limita nomes gigantes que só
    // aparecem quando o OCR grudou linhas que não deviam.
    result.items = result.items.filter(function(it){
      return !HEADER_WORDS_RE.test(it.description);
    });
    result.items.forEach(function(it){
      if (it.description.length > 60) it.description = it.description.slice(-60).trim();
      if (!it.description) it.description = 'Item ' + it.position;
      delete it._needsTotal;
    });

    return result;
  }

  /* Divide um bloco de texto em um ou mais itens e extrai os 4 campos. */
  function parseBlob(blob, strongAnchor){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var fullRe = new RegExp(QTY_FULL_SRC, 'gi');
    var hits = [], m;
    while ((m = fullRe.exec(blob)) !== null){
      hits.push({ start:m.index, end:m.index + m[0].length, qty:m[1], unit:m[2], unitPrice:parseBRLNumber(m[3]) });
      if (m.index === fullRe.lastIndex) fullRe.lastIndex++;
    }

    // Nenhum padrão "qtd UN x valor": o bloco é um item só, sem quantidade
    // confiável. O valor é o último número em R$ do bloco.
    if (!hits.length) return buildLooseItem(blob, strongAnchor);

    var out = [];
    hits.forEach(function(h, i){
      var nameFrom = (i === 0) ? 0 : hits[i-1].end;
      var nameSlice = blob.slice(nameFrom, h.start);
      // O valor total do item é o PRIMEIRO valor em R$ depois do padrão de
      // compra (o unitário já foi consumido pelo próprio padrão).
      var tailTo = (i + 1 < hits.length) ? hits[i+1].start : blob.length;
      var tail = blob.slice(h.end, tailTo);
      var tailMoney = tail.match(moneyRe);

      var ru = readUnitsOrWeight(h.qty, h.unit);
      var confidence = 'alta';
      var units = null, weight = null;
      if (ru.ok){ units = ru.units; weight = ru.weight; }
      else confidence = 'baixa';

      var value = tailMoney && tailMoney.length ? parseBRLNumber(tailMoney[0]) : null;
      var needsTotal = (value == null);
      if (value == null){
        // O OCR perdeu o total do item — reconstruímos com quantidade × unitário.
        var qtyN = (weight != null) ? weight : units;
        if (qtyN != null && h.unitPrice != null){
          value = Math.round(qtyN * h.unitPrice * 100) / 100;
          confidence = 'baixa';
        }
      } else if (h.unitPrice != null){
        // Confere a conta impressa: quantidade × unitário = total. Se não
        // fechar, algum número foi lido errado.
        var qtyC = (weight != null) ? weight : units;
        if (qtyC != null){
          var tol = Math.max(0.05, value * 0.02);
          if (Math.abs(qtyC * h.unitPrice - value) > tol) confidence = 'baixa';
        }
      }
      if (value == null || value <= 0) return;

      var name = cleanProductName(nameSlice);
      if (!name){ name = ''; confidence = 'baixa'; }
      if (!strongAnchor && confidence === 'alta') confidence = 'media';

      out.push({ position:null, description:name, units:units, weight:roundKg(weight), value:value, confidence:confidence, _needsTotal:needsTotal });
    });

    return out.length ? out : buildLooseItem(blob, strongAnchor);
  }

  /* Item sem padrão de compra reconhecível: só nome + valor. */
  function buildLooseItem(blob, strongAnchor){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var moneys = blob.match(moneyRe);
    if (!moneys || !moneys.length) return [];
    var value = parseBRLNumber(moneys[moneys.length - 1]);
    if (value == null || value <= 0) return [];

    var units = null, weight = null, confidence = 'media';
    var lm = blob.match(new RegExp(QTY_LOOSE_SRC, 'i'));
    if (lm){
      var ru = readUnitsOrWeight(lm[1], lm[2]);
      if (ru.ok){ units = ru.units; weight = ru.weight; }
    }
    if (units == null && weight == null){ units = 1; confidence = 'baixa'; }

    var name = cleanProductName(lm ? blob.slice(0, lm.index) : blob);
    if (!name){ name = cleanProductName(blob); }
    if (!name) confidence = 'baixa';
    if (!strongAnchor) confidence = 'baixa';

    return [{ position:null, description:name, units:units, weight:roundKg(weight), value:value, confidence:confidence }];
  }

  function roundKg(w){ return w == null ? null : Math.round(w * 1000) / 1000; }

  function setOcrStatus(formEl, text, kind){
    var el = formEl && formEl.querySelector('.ocr-status');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'ocr-status' + (kind ? (' ocr-' + kind) : '');
  }

  function applyOcrResult(formEl, parsed){
    var filled = false;
    var lojaDita = null;

    var descInput = formEl.querySelector('.description-input');
    if (descInput && !descInput.value.trim() && parsed.storeName){
      descInput.value = parsed.storeName;
      lojaDita = parsed.storeName;
      filled = true;
    }

    // Rede conhecida também sugere a categoria — mas só se a categoria ainda
    // estiver no padrão e a casa realmente tiver essa categoria na lista.
    // Se a pessoa já escolheu, ninguém mexe.
    var catSel = formEl.querySelector('.category-select');
    if (catSel && parsed.storeCategory && !formEl.dataset.catTocada){
      var temOpcao = Array.prototype.some.call(catSel.options, function(o){ return o.value === parsed.storeCategory; });
      var noPadrao = catSel.selectedIndex === 0;
      if (temOpcao && noPadrao && catSel.value !== parsed.storeCategory){
        catSel.value = parsed.storeCategory;
        filled = true;
      }
    }

    var dateInput = formEl.querySelector('.date-input');
    if (dateInput && parsed.date && dateInput.value === todayISO()){
      dateInput.value = parsed.date;
      filled = true;
    }

    var itemsList = formEl.querySelector('.items-list');
    var readCount = 0, toCheck = 0;
    if (itemsList && parsed.items.length && itemsList.querySelectorAll('.item-row').length === 0){
      itemsList.innerHTML = parsed.items.map(itemRowHTML).join('');
      readCount = parsed.items.length;
      toCheck = parsed.items.filter(function(it){ return it.confidence !== 'alta'; }).length;
      // Guarda o total impresso na nota (se o OCR conseguiu ler) pra comparar
      // com a soma dos itens no total exibido no fim da lista.
      if (parsed.total != null) itemsList.dataset.ocrTotal = String(parsed.total);
      else delete itemsList.dataset.ocrTotal;
      recalcItemsTotal(formEl);
      filled = true;
    } else {
      var valueInput = formEl.querySelector('.value-input');
      if (valueInput && !valueInput.readOnly && (!valueInput.value || parseFloat(valueInput.value) === 0) && parsed.total != null){
        valueInput.value = parsed.total.toFixed(2);
        filled = true;
      }
    }

    showOcrRawText(formEl, parsed.rawText);

    if (!filled){
      setOcrStatus(formEl, '⚠️ Não consegui identificar os dados da nota — preencha manualmente.', 'fail');
      return;
    }

    var msg = '✅ ' + (lojaDita ? lojaDita + ' · ' : '') + readCount + (readCount === 1 ? ' item lido' : ' itens lidos');
    var kind = 'ok';
    // A própria nota costuma imprimir quantos itens tem — se o número que
    // lemos for diferente, algum item ficou de fora e é melhor avisar.
    if (parsed.itemCountPrinted != null && parsed.itemCountPrinted !== readCount){
      msg += ' — mas a nota diz ' + parsed.itemCountPrinted + '. Confira se faltou algum.';
      kind = 'fail';
    } else if (toCheck > 0){
      msg += ' — ' + toCheck + (toCheck === 1 ? ' precisa' : ' precisam') + ' de conferência (marcados abaixo).';
    } else {
      msg += '. Confira antes de salvar.';
    }
    setOcrStatus(formEl, msg, kind);
  }

  // Mostra o texto cru que o OCR enxergou na foto. Quando um item sai
  // errado, é aqui que dá pra ver se o problema foi a leitura da imagem
  // (foto tremida, vinco no papel) ou a interpretação dos campos.
  function showOcrRawText(formEl, rawText){
    if (!formEl) return;
    var holder = formEl.querySelector('.ocr-raw');
    if (!rawText || !String(rawText).trim()){
      if (holder) holder.remove();
      return;
    }
    if (!holder){
      var status = formEl.querySelector('.ocr-status');
      if (!status) return;
      holder = document.createElement('details');
      holder.className = 'ocr-raw';
      holder.innerHTML = '<summary>👁️ Ver o texto que li da nota</summary><pre></pre>';
      status.insertAdjacentElement('afterend', holder);
    }
    holder.querySelector('pre').textContent = String(rawText).trim();
  }

  async function runReceiptOCR(imageSource, formEl){
    if (!formEl || !formEl.isConnected) return;
    if (typeof Tesseract === 'undefined'){
      console.warn('Tesseract.js indisponível — leitura automática desativada.');
      setOcrStatus(formEl, '⚠️ Leitura automática indisponível agora — preencha manualmente.', 'fail');
      return;
    }
    setOcrStatus(formEl, '🔎 Lendo a nota automaticamente...', 'loading');
    var worker = null;
    try {
      // Usamos o worker diretamente (em vez do atalho Tesseract.recognize) pra
      // poder ajustar o modo de segmentação de página: "6" diz pro Tesseract
      // tratar a imagem como um bloco único de texto em colunas, o que costuma
      // funcionar bem melhor em cupom fiscal do que o modo automático padrão.
      worker = await Tesseract.createWorker('por');
      if (worker.setParameters){
        await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      }
      var out = await worker.recognize(imageSource);
      if (!formEl.isConnected) return;
      var text = (out && out.data && out.data.text) ? out.data.text : '';
      var parsed = parseReceiptText(text);
      applyOcrResult(formEl, parsed);
    } catch(e){
      console.error('OCR falhou', e);
      if (formEl.isConnected) setOcrStatus(formEl, '⚠️ Não consegui ler a nota automaticamente — preencha manualmente.', 'fail');
    } finally {
      if (worker){
        try { await worker.terminate(); } catch(e2){ /* ignora falha ao encerrar */ }
      }
    }
  }

  async function handlePhotoChange(input){
    var file = input.files[0];
    if (!file) return;
    var formEl = input.closest('form');
    try {
      var results = await Promise.all([compressImage(file, 120, 0.5), compressImage(file, 1000, 0.75)]);
      state.pendingPhoto = {thumb:results[0], full:results[1]};
      state.removeExistingPhoto = false;
      refreshPhotoSlot(formEl);
    } catch(e){
      alert('Não foi possível processar a imagem. Tente outra foto.');
      return;
    }
    try {
      var ocrImage = await prepareImageForOCR(file);
      runReceiptOCR(ocrImage, formEl);
    } catch(e){
      console.error('Preparo da imagem para OCR falhou', e);
      runReceiptOCR(file, formEl);
    }
  }

  /* ---------- Data refresh ---------- */

  async function refreshAndRender(){
    state.expenses = await loadExpenses();
    if (!state.settingsDraft){
      state.settings = await loadSettings();
      ensureSubTabDefaults();
    }
    render();
  }

  /* ---------- Event wiring ---------- */

  function wireEvents(){
    tabbarEl.addEventListener('click', function(e){
      if (e.target.closest('[data-apps]')){ openAppsModal(); return; }
      var btn = e.target.closest('[data-tab]');
      if (!btn) return;
      state.currentTab = btn.getAttribute('data-tab');
      state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
      refreshAndRender();
    });

    contentEl.addEventListener('click', function(e){
      var seg = e.target.closest('[data-subtab]');
      if (seg){
        var wrap = seg.closest('[data-segmented]');
        var memberId = wrap.getAttribute('data-segmented');
        state.subTab[memberId] = seg.getAttribute('data-subtab');
        state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
        render();
        return;
      }
      var del = e.target.closest('[data-action="delete-expense"]');
      if (del){ handleDeleteExpense(del.getAttribute('data-id')); return; }

      var editBtn = e.target.closest('[data-action="edit-expense"]');
      if (editBtn){ handleEditStart(editBtn.getAttribute('data-id')); return; }

      // Editar uma conta fixa a partir da aba Fixas: leva você pra aba da
      // pessoa que paga, já com o formulário aberto no lançamento certo.
      var editFixo = e.target.closest('[data-action="edit-fixed"]');
      if (editFixo){
        var dono = editFixo.getAttribute('data-person');
        state.currentTab = dono;
        state.subTab[dono] = editFixo.getAttribute('data-type');
        handleEditStart(editFixo.getAttribute('data-id'));
        return;
      }

      var view = e.target.closest('[data-action="view-receipt"]');
      if (view){ handleViewReceipt(view.getAttribute('data-id')); return; }

      var abrirCal = e.target.closest('[data-action="abrir-calendario"]');
      if (abrirCal){
        var caixa = abrirCal.closest('.prazo-fixo-field');
        abrirAgenda(caixa ? caixa.querySelector('.prazo-ate-input') : null);
        return;
      }

      var remPending = e.target.closest('[data-action="remove-photo"]');
      if (remPending){ state.pendingPhoto = null; refreshPhotoSlot(remPending.closest('form')); return; }

      var remExisting = e.target.closest('[data-action="remove-existing-photo"]');
      if (remExisting){ state.removeExistingPhoto = true; refreshPhotoSlot(remExisting.closest('form')); return; }

      var cancelEdit = e.target.closest('[data-action="cancel-edit"]');
      if (cancelEdit){ state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false; render(); return; }

      var ajusteParcela = e.target.closest('[data-action="ajustar-parcelas"]');
      if (ajusteParcela){
        var formAj = ajusteParcela.closest('form');
        var caixaAj = formAj.querySelector('.parcela-ajuste');
        var abrindo = caixaAj.style.display === 'none';
        caixaAj.style.display = abrindo ? 'block' : 'none';
        ajusteParcela.textContent = abrindo ? 'deixar o app contar sozinho' : 'ajustar quantas já foram pagas';
        atualizarPreviaParcela(formAj);
        return;
      }

      var addItemBtn = e.target.closest('[data-action="add-item"]');
      if (addItemBtn){
        var formAI = addItemBtn.closest('form');
        var list = formAI.querySelector('.items-list');
        // Item novo já vem com o Nº seguinte da lista preenchido.
        var nextPos = list.querySelectorAll('.item-row').length + 1;
        list.insertAdjacentHTML('beforeend', itemRowHTML({position:nextPos, description:'', units:1, weight:'', value:''}));
        recalcItemsTotal(formAI);
        return;
      }

      var removeItemBtn = e.target.closest('[data-action="remove-item"]');
      if (removeItemBtn){
        var formRI = removeItemBtn.closest('form');
        removeItemBtn.closest('.item-row').remove();
        recalcItemsTotal(formRI);
        return;
      }

      // Clique numa barra do gráfico = filtro rápido daquele mês.
      var barra = e.target.closest('[data-action="pick-month"]');
      if (barra){
        var mesBarra = barra.getAttribute('data-month');
        // Tocar de novo no mês já selecionado volta pra visão de todos os meses.
        state.resumoMonth = (state.resumoMonth === mesBarra) ? 'all' : mesBarra;
        render();
        return;
      }
      var barraPessoal = e.target.closest('[data-action="pick-personal-month"]');
      if (barraPessoal){
        var chavePessoal = state.currentTab + ':pessoal';
        var mp = barraPessoal.getAttribute('data-month');
        state.entriesMonth[chavePessoal] = (state.entriesMonth[chavePessoal] === mp) ? 'all' : mp;
        render();
        return;
      }

      var cartaoBtn = e.target.closest('[data-action="toggle-card"]');
      if (cartaoBtn){
        var escopoCartao = cartaoBtn.getAttribute('data-scope');
        var nomeCartao = cartaoBtn.getAttribute('data-card');
        var jaAberto = state.cardOpen && state.cardOpen.scope === escopoCartao && state.cardOpen.card === nomeCartao;
        // Tocar de novo no cartão aberto fecha — o painel volta a ser só a lista.
        state.cardOpen = jaAberto ? null : {scope:escopoCartao, card:nomeCartao, filter:'tudo'};
        render();
        return;
      }
      var chipPessoa = e.target.closest('[data-action="card-pessoa"]');
      if (chipPessoa){
        var escP = chipPessoa.getAttribute('data-scope');
        var quem = chipPessoa.getAttribute('data-pessoa');
        var atual = (state.cardFiltro[escP] || []).slice();
        if (!quem){
          atual = [];                                  // "Todos" limpa a escolha
        } else {
          var i = atual.indexOf(quem);
          if (i === -1) atual.push(quem); else atual.splice(i, 1);
        }
        state.cardFiltro[escP] = atual;
        state.cardOpen = null;                         // o cartão aberto pode nem existir mais
        render();
        return;
      }
      var modoSeparado = e.target.closest('[data-action="card-separado"]');
      if (modoSeparado){
        var escS = modoSeparado.getAttribute('data-scope');
        state.cardSeparado[escS] = !state.cardSeparado[escS];
        state.cardOpen = null;
        render();
        return;
      }
      var chipCartao = e.target.closest('[data-action="card-filter"]');
      if (chipCartao){
        if (state.cardOpen) state.cardOpen.filter = chipCartao.getAttribute('data-filter');
        render();
        return;

      if (e.target.closest('[data-action="abrir-categorias"]')){ openCatsModal(); return; }
      if (e.target.closest('[data-action="open-metas"]')){ openMetasModal(); return; }

      var backYears = e.target.closest('[data-action="meses-back-years"]');

        state.mesesView = {mode:'years', year:null, month:null};
        render();
        return;

        render();
        return;
      }

      if (e.target.closest('[data-action="future-all"]')){
        state.futureMonths = futureMonthsList().map(function(m){ return m.key; });
        renderFutureModal(); render(); return;
      }
      if (e.target.closest('[data-action="future-none"]')){
        state.futureMonths = null;   // null = o padrão, só o mês que vem
        renderFutureModal(); render(); return;
      }
    });
    futurePanelEl.addEventListener('change', function(e){
      if (e.target.matches('.future-check')) applyFutureSelection();
    });

    settingsPanelEl.addEventListener('change', function(e){
      if (e.target.matches('#lic-f-plano')){ licFiltro.plano = e.target.value; pintarListaLicencas(); return; }
      if (e.target.matches('#lic-f-status')){ licFiltro.status = e.target.value; pintarListaLicencas(); return; }
      if (e.target.matches('#lic-plano') || e.target.matches('#lic-edit-plano')){
        var ehEdicao = e.target.matches('#lic-edit-plano');
        var prefixo = ehEdicao ? 'lic-edit' : 'lic';
        var info = planoInfo(e.target.value);
        var nota = settingsPanelEl.querySelector('#lic-plano-nota');
        if (nota && !ehEdicao) nota.textContent = info.explica;

        // Vitalício não tem prazo, então o campo some em vez de ficar ali
        // pedindo um número que não vai ser usado.
        var campo = settingsPanelEl.querySelector('#' + prefixo + '-prazo-campo');
        if (campo) campo.style.display = (e.target.value === 'vitalicio') ? 'none' : 'block';

        // Ao trocar de plano, o prazo já vem no padrão daquele plano.
        if (info.horas){
          var u = melhorUnidade(info.horas);
          var elV = settingsPanelEl.querySelector('#' + prefixo + '-prazo-valor');
          var elU = settingsPanelEl.querySelector('#' + prefixo + '-prazo-unidade');
          if (elV && elU && e.target.value !== 'personalizado'){ elV.value = u.valor; elU.value = u.unidade; }
        }
        return;
      }
      if (e.target.matches('#import-input')){
        var arq = e.target.files && e.target.files[0];
        e.target.value = '';                 // permite escolher o mesmo arquivo de novo
        importarBackup(arq);
      }
    });

    resetModalEl.addEventListener('click', function(e){ if (e.target === resetModalEl) closeResetModal(); });
    resetPanelEl.addEventListener('click', function(e){
      if (e.target.closest('#cancel-reset-btn')){ closeResetModal(); return; }
      if (e.target.closest('#confirm-reset-btn')){ handleConfirmReset(); return; }
    });
    resetPanelEl.addEventListener('input', updateResetConfirmState);
    resetPanelEl.addEventListener('change', updateResetConfirmState);

    document.addEventListener('visibilitychange', function(){
      // Só atualiza sozinho na aba Resumo (sem formulário) — evita apagar
      // um gasto que a pessoa esteja preenchendo ao voltar de outro app/aba.
      if (document.visibilityState === 'visible' && (state.currentTab === 'resumo' || state.currentTab === 'meses')) refreshAndRender();
    });

    contentEl.addEventListener('keydown', function(e){
      // Evita que a tecla Enter (ou "Concluir"/"Ir" do teclado do celular)
      // envie o formulário antes da hora enquanto a pessoa ainda está
      // preenchendo os campos (principalmente ao cadastrar vários itens).
      if (e.key === 'Enter' && e.target.matches('.add-form input')){
        e.preventDefault();
      }
    });
  }

  /* ---------- Init ---------- */

  async function init(){
    contentEl = document.getElementById('content');
    loadingEl = document.getElementById('loading-screen');
    shellEl = document.getElementById('shell');
    tabbarEl = document.getElementById('tabbar');
    headerTitleEl = document.getElementById('header-title');
    headerSubEl = document.getElementById('header-sub');
    modalEl = document.getElementById('modal');
    modalBodyEl = document.getElementById('modal-body');
    settingsModalEl = document.getElementById('settings-modal');
    settingsPanelEl = document.getElementById('settings-panel');
    settingsBtn = document.getElementById('settings-btn');
    itemsModalEl = document.getElementById('items-modal');
    itemsPanelEl = document.getElementById('items-panel');
    resetModalEl = document.getElementById('reset-modal');
    resetPanelEl = document.getElementById('reset-panel');
    membroModalEl = document.getElementById('membro-modal');
    membroPanelEl = document.getElementById('membro-panel');
    ajudaModalEl = document.getElementById('ajuda-modal');
    ajudaPanelEl = document.getElementById('ajuda-panel');
    catsModalEl = document.getElementById('cats-modal');
    catsPanelEl = document.getElementById('cats-panel');
    metasModalEl = document.getElementById('metas-modal');
    metasPanelEl = document.getElementById('metas-panel');
    futureModalEl = document.getElementById('future-modal');
    futurePanelEl = document.getElementById('future-panel');
    appsModalEl = document.getElementById('apps-modal');
    appsPanelEl = document.getElementById('apps-panel');
    appfullEl = document.getElementById('appfull');
    appfullFrameEl = document.getElementById('appfull-frame');
    appfullNomeEl = document.getElementById('appfull-nome');
    appfullAcoesEl = document.getElementById('appfull-acoes');
    cartaoModalEl = document.getElementById('cartao-modal');
    cartaoPanelEl = document.getElementById('cartao-panel');
    agendaModalEl = document.getElementById('agenda-modal');
    agendaPanelEl = document.getElementById('agenda-panel');
    authScreenEl = document.getElementById('auth-screen');
    authCardEl = document.getElementById('auth-card');
    syncBarEl = document.getElementById('sync-bar');

    storageAvailable = await waitForStorage(3000);

    conviteDoLink = lerConviteDaURL();
    supa = iniciarSupabase();
    wireEvents();

    if (supa){
      // Com servidor configurado, nada aparece antes de saber quem é você.
      var ses = null;
      try { ses = (await supa.auth.getSession()).data.session; }
      catch(e){ console.error('getSession', e); }

      if (!ses){
        mostrarAuth('entrar');
        return;
      }
      sessaoUsuario = ses.user;
      await conferirSeAdmin();
      await depoisDeEntrar();
      return;
    }

    // Sem Supabase configurado: modo local, exatamente como era antes.
    state.expenses = await loadExpenses();
    state.settings = await loadSettings();
    ensureSubTabDefaults();

    // App vazio abrindo pela primeira vez: já entra com os 3 meses de exemplo,
    // pra você ver como fica cheio sem precisar cadastrar nada. Acontece uma
    // vez só — depois que você carregar ou remover os exemplos pelo menu de
    // configurações, o app nunca mais preenche sozinho.
    if (storageAvailable && state.expenses.length === 0 && !demoAlreadyHandled()){
      state.expenses = demoExpenseSeed();
      await saveExpenses(state.expenses);
      markDemoHandled();
    }

    // Fotos guardadas por versões antigas no localStorage sobem pro IndexedDB
    // e liberam o espaço que ocupavam.
    migrarFotosAntigas();

    loadingEl.style.display = 'none';
    shellEl.classList.remove('hidden');

    if (!storageAvailable){
      var warn = document.createElement('div');
      warn.id = 'storage-warning';
      warn.textContent = 'Não foi possível conectar ao armazenamento agora — os gastos podem não ser salvos. Tente reabrir o app.';
      shellEl.insertBefore(warn, tabbarEl);
    }

    render();
  }

  init();
})();

</script>
<!--
  RachaFacil - primeiro app extra. Fica guardado aqui como texto puro
  (type="text/html" nao executa nada) e so vira pagina quando a pessoa abre
  o app, dentro do iframe. O "<\/script>" escapado no fim eh de proposito:
  sem a barra, o navegador acharia que o bloco terminou ali.
-->
<script type="text/html" id="src-rachafacil">
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RachaFácil</title>
<style>
  :root{
    /* Mesmos tokens do Gastos da Casa: o color-scheme avisa o navegador que
       a tela é escura, senão ele desenha os seletores e o calendário com
       fundo branco e o texto claro some em cima. */
    color-scheme:dark;
    --paper:#0A0C10;
    --paper-raised:#161A21;
    --input-bg:#1F2530;
    --ink:#EAF2EF;
    --ink-soft:#8B96A5;
    --line:#2A313D;
    --positive:#39FF88;
    --positive-soft:rgba(57,255,136,0.15);
    --alert:#FF4D6D;
    --alert-soft:rgba(255,77,109,0.15);
    --neon2:#4FE0FF;
    --hover:rgba(255,255,255,0.06);
    --hover-soft:rgba(255,255,255,0.04);
    --backdrop:rgba(0,0,0,0.68);
    --focus-ring:rgba(57,255,136,0.30);
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.65), 0 0 24px rgba(57,255,136,0.08);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }

  /* A tela é pra tocar, não pra selecionar: encostar num número não abre mais
     a barra de "pesquisar" do navegador. Campo de digitar volta ao normal. */
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex; justify-content:center;
    -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  }
  input, textarea, [contenteditable]{
    -webkit-user-select:text; user-select:text;
  }
  button,input,select{
    font:inherit;
    transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, color .15s ease;
  }
  button{ cursor:pointer; border:none; -webkit-tap-highlight-color:transparent; }
  :focus-visible{ outline:2px solid var(--neon2); outline-offset:2px; border-radius:6px; }

  #shell{
    width:100%; max-width:520px; min-height:100vh;
    display:flex; flex-direction:column;
    background:var(--paper);
    border-left:1px solid var(--line); border-right:1px solid var(--line);
  }

  header{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:16px 16px 14px; border-bottom:1px solid var(--line);
    position:sticky; top:0; z-index:5;
    background:rgba(10,12,16,.94); backdrop-filter:blur(8px);
  }
  .marca{ display:flex; align-items:center; gap:11px; min-width:0; }
  .logo{
    width:40px; height:40px; border-radius:12px; flex:0 0 auto;
    display:grid; place-items:center;
    font-weight:800; font-size:15px; letter-spacing:-0.02em; color:#06222c;
    background:linear-gradient(140deg, var(--neon2), #2FB6D6);
    box-shadow:0 0 22px -6px rgba(79,224,255,.9);
  }
  header h1{ font-size:18px; margin:0; letter-spacing:-0.01em; }
  header .sub{ font-size:11.5px; color:var(--ink-soft); margin-top:1px; }
  .header-acoes{ display:flex; align-items:center; gap:5px; flex:0 0 auto; }

  /* Rodando dentro do Gestor de Gastos: a barra de cima já traz o nome e os
     botões, então o cabeçalho daqui sai de cena pra não repetir tudo. */
  body.embutido header{ display:none; }
  .icone-btn{
    width:30px; height:30px; border-radius:50%;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-size:14px; font-weight:800; display:grid; place-items:center; padding:0; line-height:1;
  }
  .icone-btn:hover{ border-color:var(--neon2); color:var(--neon2); }

  main{ flex:1; padding:16px 16px 40px; }

  /* ---------- Caixas neon (as mesmas do app) ---------- */

  .neon-box{
    position:relative;
    background:var(--paper-raised);
    border:1px solid var(--accent-line, var(--line));
    border-radius:var(--radius);
    padding:15px 16px 16px;
    box-shadow:
      0 0 0 1px var(--accent-halo, transparent),
      0 0 26px -4px var(--accent-glow, transparent),
      inset 0 0 24px -18px var(--accent, transparent),
      var(--shadow-sm);
  }
  /* Fio de luz no topo — é o detalhe que dá o ar de neon sem colorir o fundo. */
  .neon-box::before{
    content:''; position:absolute; left:16px; right:16px; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent, transparent), transparent);
    opacity:.9;
  }
  .acc-cyan   { --accent:#4FE0FF; --accent-line:rgba(79,224,255,0.48); --accent-halo:rgba(79,224,255,0.10); --accent-glow:rgba(79,224,255,0.62); }
  .acc-green  { --accent:#39FF88; --accent-line:rgba(57,255,136,0.44); --accent-halo:rgba(57,255,136,0.10); --accent-glow:rgba(57,255,136,0.56); }
  .acc-pink   { --accent:#FF4D6D; --accent-line:rgba(255,77,109,0.46); --accent-halo:rgba(255,77,109,0.10); --accent-glow:rgba(255,77,109,0.58); }
  .acc-purple { --accent:#B18CFF; --accent-line:rgba(177,140,255,0.46); --accent-halo:rgba(177,140,255,0.10); --accent-glow:rgba(177,140,255,0.58); }
  .acc-amber  { --accent:#FFC24F; --accent-line:rgba(255,194,79,0.44); --accent-halo:rgba(255,194,79,0.10); --accent-glow:rgba(255,194,79,0.56); }
  .acc-blue   { --accent:#4FA8FF; --accent-line:rgba(79,168,255,0.46); --accent-halo:rgba(79,168,255,0.10); --accent-glow:rgba(79,168,255,0.58); }

  .bloco{ margin-bottom:16px; }
  .section-title{
    display:flex; align-items:center; gap:8px;
    font-size:13px; font-weight:700; color:var(--ink-soft);
    margin:0 0 10px;
  }
  .section-title::before{
    content:''; width:3px; height:13px; border-radius:2px;
    background:var(--accent, var(--ink-soft));
    box-shadow:0 0 8px var(--accent, transparent);
  }
  .section-title .acao{
    margin-left:auto; background:transparent; border:none; padding:0;
    font-family:inherit; font-size:11.5px; font-weight:700; color:var(--ink-soft);
    text-decoration:underline;
  }
  .section-title .acao:hover{ color:var(--neon2); }

  /* ---------- Indicadores ---------- */

  .kpi-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .kpi-tile{ padding:11px 13px 12px; border-radius:12px; min-width:0; }
  .kpi-tile::before{ left:12px; right:12px; }
  .kpi-label{
    font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase;
    color:var(--accent, var(--ink-soft));
    display:flex; align-items:center; gap:6px;
  }
  .kpi-label::before{
    content:''; width:5px; height:5px; border-radius:50%;
    background:var(--accent, var(--ink-soft)); box-shadow:0 0 6px var(--accent, transparent);
  }
  .kpi-value{
    font-size:20px; font-weight:800; margin-top:5px;
    font-variant-numeric:tabular-nums; letter-spacing:-0.02em;
  }
  .kpi-hint{ font-size:11px; color:var(--ink-soft); margin-top:3px; }

  /* ---------- Acerto (o resultado) ---------- */

  .acerto-linha{
    display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .acerto-linha:last-child{ border-bottom:none; }
  .acerto-quem{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:600; min-width:0; }
  .acerto-seta{ color:var(--alert); font-weight:800; }
  .acerto-valor{
    font-weight:800; font-size:16px; color:var(--alert);
    font-variant-numeric:tabular-nums; white-space:nowrap;
  }
  .acerto-unico{
    text-align:center; padding:6px 0 2px;
  }
  .acerto-unico .quem{ font-size:15px; font-weight:700; margin-bottom:6px; }
  .acerto-unico .valor{
    font-size:34px; font-weight:800; color:var(--alert);
    font-variant-numeric:tabular-nums; letter-spacing:-0.02em;
    text-shadow:0 0 28px rgba(255,77,109,.5);
  }
  .tudo-certo{
    text-align:center; padding:10px 0 4px;
    font-size:15px; font-weight:700; color:var(--positive);
    text-shadow:0 0 18px rgba(57,255,136,.4);
  }

  /* ---------- Pessoas ---------- */

  .pessoa-linha{
    display:flex; align-items:center; gap:10px;
    padding:10px 0; border-bottom:1px solid var(--line);
  }
  .pessoa-linha:last-of-type{ border-bottom:none; }
  .avatar{
    width:30px; height:30px; border-radius:50%; flex:0 0 auto;
    display:grid; place-items:center;
    font-size:12.5px; font-weight:800; color:#0A0C10;
  }
  .pessoa-nome{ flex:1; min-width:0; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pessoa-eu{
    font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--neon2); border:1px solid rgba(79,224,255,.4);
    padding:2px 7px; border-radius:999px; margin-left:7px;
  }
  .pessoa-saldo{ font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
  .saldo-recebe{ color:var(--positive); }
  .saldo-deve{ color:var(--alert); }
  .saldo-zero{ color:var(--ink-soft); }
  .linha-acao{
    background:transparent; border:none; font-size:14px; padding:5px 3px;
    border-radius:6px; flex:0 0 auto; line-height:1;
  }
  .linha-acao:hover{ background:var(--hover); }

  /* ---------- Despesas ---------- */

  .despesa{
    display:flex; align-items:center; gap:11px;
    padding:11px 0; border-bottom:1px solid var(--line);
  }
  .despesa:last-of-type{ border-bottom:none; }
  .despesa-ic{
    width:34px; height:34px; border-radius:10px; flex:0 0 auto;
    display:grid; place-items:center; font-size:15px;
    background:var(--hover-soft); border:1px solid var(--line);
  }
  .despesa-info{ flex:1; min-width:0; }
  .despesa-desc{ display:block; font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .despesa-meta{ display:block; font-size:11.5px; color:var(--ink-soft); margin-top:2px; }
  .despesa-valor{ font-size:14px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }

  .empty-state{
    text-align:center; color:var(--ink-soft); font-size:13.5px; line-height:1.55;
    padding:22px 12px; border:1px dashed var(--line); border-radius:12px;
  }

  /* ---------- Botões ---------- */

  .btn-principal{
    width:100%; padding:14px; border-radius:12px;
    background:var(--neon2); color:#06222c;
    font-weight:800; font-size:15px; font-family:inherit;
    box-shadow:0 0 22px -8px var(--neon2);
  }
  .btn-principal:hover{ filter:brightness(1.08); }
  .btn-secundario{
    width:100%; padding:11px; border-radius:10px;
    background:transparent; border:1px solid var(--line); color:var(--ink);
    font-weight:700; font-size:14px; font-family:inherit;
  }
  .btn-secundario:hover{ border-color:var(--neon2); color:var(--neon2); }
  .btn-perigo{ border-color:rgba(255,77,109,.5); color:var(--alert); }
  .btn-perigo:hover{ border-color:var(--alert); color:var(--alert); background:var(--alert-soft); }
  .btn-perigo.btn-principal{ background:var(--alert); color:#2A0710; box-shadow:0 0 22px -8px var(--alert); }
  .btn-linha{ display:flex; gap:9px; margin-top:12px; }
  .btn-linha > *{ flex:1; }

  /* ---------- Campos ---------- */

  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12px; color:var(--ink-soft); margin-bottom:6px; }
  .field input[type="text"], .field input[type="number"], .field input[type="date"], .field select{
    width:100%; padding:11px 12px;
    border:1px solid var(--line); border-radius:9px;
    font-size:16px; font-family:inherit;
    background:var(--input-bg); color:var(--ink);
  }
  .field input:focus, .field select:focus{
    outline:none; border-color:var(--positive); box-shadow:0 0 0 3px var(--focus-ring);
  }
  .row2{ display:flex; gap:10px; }
  .row2 > *{ flex:1; min-width:0; }
  .nota{ font-size:11.5px; color:var(--ink-soft); margin-top:6px; line-height:1.5; }
  select option{ background:var(--paper-raised); color:var(--ink); }

  /* Quem dividiu: caixinhas de marcar, não uma lista de checkbox nu */
  .divide-grade{ display:flex; flex-wrap:wrap; gap:7px; }
  .divide-op{
    display:inline-flex; align-items:center; gap:7px;
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    padding:8px 12px; border-radius:999px;
    font-size:13px; font-weight:600; font-family:inherit;
  }
  .divide-op.is-on{
    border-color:var(--cor, var(--neon2)); color:var(--cor, var(--neon2));
    box-shadow:0 0 13px -3px var(--cor, var(--neon2));
  }
  .divide-ponto{ width:9px; height:9px; border-radius:50%; background:var(--cor, var(--ink-soft)); flex:0 0 auto; }
  .divide-resumo{ font-size:12px; color:var(--ink-soft); margin-top:9px; }
  .divide-resumo b{ color:var(--ink); font-variant-numeric:tabular-nums; }

  /* ---------- Janelas ---------- */

  .modal{
    position:fixed; inset:0; background:var(--backdrop);
    display:flex; align-items:flex-end; justify-content:center; z-index:60;
    opacity:1; visibility:visible; transition:opacity .18s ease, visibility .18s ease;
  }
  .modal.hidden{ opacity:0; visibility:hidden; pointer-events:none; }
  .modal.hidden .modal-caixa{ transform:translateY(24px); }
  .modal-caixa{
    background:var(--paper-raised); width:100%; max-width:520px;
    border-radius:18px 18px 0 0;
    padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg);
    transform:translateY(0); transition:transform .2s ease;
  }
  .modal-caixa h2{ font-size:17px; margin:0 0 6px; }
  .modal-nota{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; line-height:1.5; }
  .aviso-perigo{
    padding:12px 14px; border-left:2px solid var(--alert);
    background:var(--alert-soft); border-radius:0 9px 9px 0;
    font-size:13.5px; margin:0 0 16px; line-height:1.5;
  }

  /* Passo a passo da ajuda */
  .ajuda-passo{ display:flex; gap:12px; padding:12px 0; border-bottom:1px solid var(--line); }
  .ajuda-passo:last-of-type{ border-bottom:none; }
  .ajuda-num{
    flex:0 0 25px; height:25px; border-radius:50%;
    background:var(--hover-soft); border:1px solid var(--line);
    display:grid; place-items:center; font-size:11.5px; font-weight:800; color:var(--neon2);
  }
  .ajuda-txt h3{ margin:1px 0 4px; font-size:14px; font-weight:700; }
  .ajuda-txt p{ margin:0; font-size:13px; color:var(--ink-soft); line-height:1.5; }
  .ajuda-txt b{ color:var(--ink); font-weight:600; }

  .aviso{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:22px; z-index:80;
    background:var(--paper-raised); color:var(--ink);
    border:1px solid var(--neon2);
    box-shadow:0 0 26px -6px var(--neon2), var(--shadow-lg);
    padding:12px 18px; border-radius:12px;
    font-size:13.5px; font-weight:600;
    opacity:1; transition:opacity .2s ease;
  }
  .aviso.hidden{ opacity:0; pointer-events:none; }

  @media (min-width:560px){
    #shell{ max-width:640px; }
    .modal{ align-items:center; }
    .modal-caixa{ border-radius:16px; max-width:520px; max-height:82vh; }
    .kpi-row{ grid-template-columns:repeat(4,minmax(0,1fr)); }
  }
</style>
</head>
<body>

<div id="shell">
  <header>
    <div class="marca">
      <div class="logo">RF</div>
      <div>
        <h1>RachaFácil</h1>
        <div class="sub">Divida contas sem dor de cabeça</div>
      </div>
    </div>
    <div class="header-acoes">
      <button class="icone-btn" id="btn-ajuda" title="Como usar" aria-label="Como usar">?</button>
      <button class="icone-btn" id="btn-zerar" title="Zerar tudo" aria-label="Zerar tudo">🗑️</button>
    </div>
  </header>

  <main id="conteudo"></main>
</div>

<div class="modal hidden" id="modal-despesa"><div class="modal-caixa" id="painel-despesa"></div></div>
<div class="modal hidden" id="modal-pessoa"><div class="modal-caixa" id="painel-pessoa"></div></div>
<div class="modal hidden" id="modal-confirma"><div class="modal-caixa" id="painel-confirma"></div></div>
<div class="modal hidden" id="modal-ajuda"><div class="modal-caixa" id="painel-ajuda"></div></div>
<div class="aviso hidden" id="aviso"></div>

<script>
(function(){
  'use strict';

  var CHAVE = 'rachafacil_v2';

  // Mesma paleta de pessoas do Gastos da Casa.
  var CORES = ['#4FA8FF','#FF5D8F','#39FF88','#FFC24F','#B18CFF','#4FE0FF','#FF8A4F','#35D6C4'];

  var ICONES = ['🍽️','🛒','🚗','🏠','🍺','🎬','✈️','🎁','💊','⛽','🏨','🎉','☕','🧾'];

  /* ---------------- Estado ---------------- */

  var state = carregar();

  function novoId(pre){
    return pre + '_' + Date.now().toString(36) + '_' + Math.random().toString(36).slice(2,7);
  }

  function estadoInicial(){
    // Duas pessoas já criadas: dá pra lançar a primeira despesa sem
    // configurar nada. "Você" é quem abriu o app.
    var eu = {id:novoId('p'), nome:'Você', cor:CORES[0]};
    var outra = {id:novoId('p'), nome:'Amigo', cor:CORES[1]};
    return {pessoas:[eu, outra], despesas:[], euId:eu.id};
  }

  function carregar(){
    try {
      var cru = JSON.parse(localStorage.getItem(CHAVE) || 'null');
      if (cru && Array.isArray(cru.pessoas) && cru.pessoas.length) return cru;
    } catch(e){}
    return estadoInicial();
  }

  function salvar(){
    try { localStorage.setItem(CHAVE, JSON.stringify(state)); }
    catch(e){ avisar('Não consegui salvar neste navegador.'); }
    render();
  }

  /* ---------------- Ajudantes ---------------- */

  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(m){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
    });
  }
  function dinheiro(centavos){
    return (Number(centavos||0)/100).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  }
  function pessoaPor(id){
    return state.pessoas.filter(function(p){ return p.id === id; })[0] || null;
  }
  function nomeDe(id){
    var p = pessoaPor(id);
    return p ? p.nome : 'alguém que saiu';
  }
  function corDe(id){
    var p = pessoaPor(id);
    return p ? p.cor : '#8B96A5';
  }
  function inicial(nome){
    return (String(nome || '?').trim().charAt(0) || '?').toUpperCase();
  }

  /* Rateio em centavos: o que não divide certinho vira 1 centavo a mais pros
     primeiros da lista. Dividir com float perde centavo e o acerto nunca
     fecha exatamente com o total. */
  function ratear(totalCent, quantos){
    var base = Math.floor(totalCent / quantos);
    var resto = totalCent - base * quantos;
    var partes = [];
    for (var i = 0; i < quantos; i++) partes.push(base + (i < resto ? 1 : 0));
    return partes;
  }

  function saldos(){
    var b = {};
    state.pessoas.forEach(function(p){ b[p.id] = 0; });
    state.despesas.forEach(function(d){
      var entre = d.entre.filter(function(id){ return pessoaPor(id); });
      if (!entre.length) return;
      var partes = ratear(d.centavos, entre.length);
      if (b[d.pagouId] !== undefined) b[d.pagouId] += d.centavos;
      entre.forEach(function(id, i){ if (b[id] !== undefined) b[id] -= partes[i]; });
    });
    return b;
  }

  /* Menor número de transferências: o que mais deve paga pro que mais tem a
     receber, até zerar. É o mesmo acerto do Gastos da Casa. */
  function acertos(b){
    var recebem = [], devem = [];
    Object.keys(b).forEach(function(id){
      if (b[id] > 0) recebem.push({id:id, v:b[id]});
      if (b[id] < 0) devem.push({id:id, v:-b[id]});
    });
    recebem.sort(function(x,y){ return y.v - x.v; });
    devem.sort(function(x,y){ return y.v - x.v; });

    var saida = [], i = 0, j = 0;
    while (i < devem.length && j < recebem.length){
      var quanto = Math.min(devem[i].v, recebem[j].v);
      if (quanto > 0) saida.push({de:devem[i].id, para:recebem[j].id, centavos:quanto});
      devem[i].v -= quanto;
      recebem[j].v -= quanto;
      if (devem[i].v === 0) i++;
      if (recebem[j].v === 0) j++;
    }
    return saida;
  }

  /* ---------------- Tela ---------------- */

  var conteudoEl = document.getElementById('conteudo');

  function render(){
    var b = saldos();
    var totalCent = state.despesas.reduce(function(s,d){ return s + d.centavos; }, 0);
    var meu = b[state.euId] || 0;
    var lista = acertos(b);

    conteudoEl.innerHTML = ''
      + kpisHTML(totalCent, meu)
      + acertoHTML(lista)
      + pessoasHTML(b)
      + despesasHTML();
  }

  function kpisHTML(totalCent, meu){
    var qtd = state.despesas.length;
    return '<div class="kpi-row">'
      + kpi('Total do rachão', dinheiro(totalCent), qtd + (qtd === 1 ? ' despesa' : ' despesas'), 'acc-cyan')
      + kpi('Você deve', dinheiro(Math.max(0, -meu)), meu < 0 ? 'Pra acertar' : 'Nada pendente', meu < 0 ? 'acc-pink' : 'acc-green')
      + kpi('Você recebe', dinheiro(Math.max(0, meu)), meu > 0 ? 'Te devem' : 'Nada a receber', meu > 0 ? 'acc-green' : 'acc-purple')
      + kpi('No grupo', String(state.pessoas.length), state.pessoas.length === 1 ? 'pessoa' : 'pessoas', 'acc-amber')
      + '</div>';
  }
  function kpi(rot, valor, dica, acc){
    return '<div class="kpi-tile neon-box ' + acc + '">'
      + '<div class="kpi-label">' + esc(rot) + '</div>'
      + '<div class="kpi-value">' + valor + '</div>'
      + '<div class="kpi-hint">' + esc(dica) + '</div>'
      + '</div>';
  }

  function acertoHTML(lista){
    var corpo;
    if (!state.despesas.length){
      corpo = '<div class="empty-state">Assim que a primeira despesa entrar, o acerto aparece aqui.</div>';
    } else if (!lista.length){
      corpo = '<div class="tudo-certo">Tudo certo — ninguém deve nada ✓</div>';
    } else if (lista.length === 1){
      // Um pagamento só: vira o número grande, que é a resposta do rachão.
      corpo = '<div class="acerto-unico">'
        + '<div class="quem">' + esc(nomeDe(lista[0].de)) + ' <span class="acerto-seta">→</span> ' + esc(nomeDe(lista[0].para)) + '</div>'
        + '<div class="valor">' + dinheiro(lista[0].centavos) + '</div>'
        + '</div>';
    } else {
      corpo = lista.map(function(t){
        return '<div class="acerto-linha">'
          + '<span class="acerto-quem">'
            + '<span class="avatar" style="background:' + corDe(t.de) + ';">' + esc(inicial(nomeDe(t.de))) + '</span>'
            + esc(nomeDe(t.de)) + ' <span class="acerto-seta">→</span> ' + esc(nomeDe(t.para))
          + '</span>'
          + '<span class="acerto-valor">' + dinheiro(t.centavos) + '</span>'
          + '</div>';
      }).join('');
    }
    return '<section class="bloco neon-box acc-pink">'
      + '<div class="section-title">🤝 Acerto sugerido</div>'
      + corpo
      + (lista.length > 1 ? '<div class="nota">Menor número de transferências possível pra todo mundo ficar quite.</div>' : '')
      + '</section>';
  }

  function pessoasHTML(b){
    var linhas = state.pessoas.map(function(p){
      var v = b[p.id] || 0;
      var classe = v > 0 ? 'saldo-recebe' : (v < 0 ? 'saldo-deve' : 'saldo-zero');
      var texto = v > 0 ? '+' + dinheiro(v) : (v < 0 ? '−' + dinheiro(-v) : dinheiro(0));
      var souEu = p.id === state.euId;
      return '<div class="pessoa-linha">'
        + '<span class="avatar" style="background:' + p.cor + ';">' + esc(inicial(p.nome)) + '</span>'
        + '<span class="pessoa-nome">' + esc(p.nome) + (souEu ? '<span class="pessoa-eu">você</span>' : '') + '</span>'
        + '<span class="pessoa-saldo ' + classe + '">' + texto + '</span>'
        + '<button class="linha-acao" data-acao="editar-pessoa" data-id="' + p.id + '" title="Editar">✏️</button>'
        + (state.pessoas.length > 1
            ? '<button class="linha-acao" data-acao="apagar-pessoa" data-id="' + p.id + '" title="Tirar do grupo">🗑️</button>'
            : '<span style="width:22px;"></span>')
        + '</div>';
    }).join('');

    return '<section class="bloco neon-box acc-blue">'
      + '<div class="section-title">👥 Quem está no rachão</div>'
      + linhas
      + '<div class="nota">Verde é quem tem a receber, vermelho é quem deve.</div>'
      + '<div class="btn-linha"><button class="btn-secundario" data-acao="nova-pessoa">+ Adicionar pessoa</button></div>'
      + '</section>';
  }

  function despesasHTML(){
    var corpo;
    if (!state.despesas.length){
      corpo = '<div class="empty-state">Nenhuma despesa ainda.<br>Lance a primeira conta aí embaixo.</div>';
    } else {
      // Mais recente em cima: é o que a pessoa acabou de lançar.
      corpo = state.despesas.slice().reverse().map(function(d){
        var quantos = d.entre.filter(function(id){ return pessoaPor(id); }).length;
        var cada = quantos ? ratear(d.centavos, quantos)[0] : 0;
        return '<div class="despesa">'
          + '<span class="despesa-ic">' + esc(d.icone || '🧾') + '</span>'
          + '<span class="despesa-info">'
            + '<span class="despesa-desc">' + esc(d.desc) + '</span>'
            + '<span class="despesa-meta">' + esc(nomeDe(d.pagouId)) + ' pagou · '
              + dinheiro(cada) + ' × ' + quantos + '</span>'
          + '</span>'
          + '<span class="despesa-valor">' + dinheiro(d.centavos) + '</span>'
          + '<button class="linha-acao" data-acao="editar-despesa" data-id="' + d.id + '" title="Editar">✏️</button>'
          + '<button class="linha-acao" data-acao="apagar-despesa" data-id="' + d.id + '" title="Apagar">🗑️</button>'
          + '</div>';
      }).join('');
    }

    return '<section class="bloco neon-box acc-green">'
      + '<div class="section-title">🧾 Despesas</div>'
      + corpo
      + '<div class="btn-linha"><button class="btn-principal" data-acao="nova-despesa">+ Nova despesa</button></div>'
      + '</section>';
  }

  /* ---------------- Janela de despesa ---------------- */

  var despesaEditando = null;
  var painelDespesa = document.getElementById('painel-despesa');

  function abrirDespesa(id){
    if (state.pessoas.length < 2){
      avisar('Adicione pelo menos 2 pessoas antes.');
      return;
    }
    despesaEditando = id || null;
    var d = id ? state.despesas.filter(function(x){ return x.id === id; })[0] : null;
    var entre = d ? d.entre.slice() : state.pessoas.map(function(p){ return p.id; });
    var pagou = d ? d.pagouId : state.euId;
    if (!pessoaPor(pagou)) pagou = state.pessoas[0].id;

    painelDespesa.innerHTML = ''
      + '<h2>' + (d ? 'Editar despesa' : 'Nova despesa') + '</h2>'
      + '<p class="modal-nota">Quem pagou entra no acerto como crédito; quem dividiu entra como parte a pagar.</p>'
      + '<div class="field"><label>O que foi?</label>'
        + '<input type="text" id="d-desc" placeholder="Ex.: Jantar de sábado" value="' + esc(d ? d.desc : '') + '" autocomplete="off"></div>'
      + '<div class="row2">'
        + '<div class="field"><label>Valor total (R$)</label>'
          + '<input type="number" id="d-valor" inputmode="decimal" step="0.01" min="0" placeholder="0,00" value="' + (d ? (d.centavos/100) : '') + '"></div>'
        + '<div class="field"><label>Quem pagou?</label><select id="d-pagou">'
          + state.pessoas.map(function(p){
              return '<option value="' + p.id + '"' + (p.id === pagou ? ' selected' : '') + '>' + esc(p.nome) + '</option>';
            }).join('')
          + '</select></div>'
      + '</div>'
      + '<div class="field"><label>Ícone</label>'
        + '<select id="d-icone">' + ICONES.map(function(ic){
            return '<option value="' + ic + '"' + ((d && d.icone === ic) ? ' selected' : '') + '>' + ic + '</option>';
          }).join('') + '</select></div>'
      + '<div class="field"><label>Dividir entre quem?</label>'
        + '<div class="divide-grade" id="d-entre">'
          + state.pessoas.map(function(p){
              var on = entre.indexOf(p.id) !== -1;
              return '<button type="button" class="divide-op' + (on ? ' is-on' : '') + '" style="--cor:' + p.cor + ';" data-pessoa="' + p.id + '">'
                + '<span class="divide-ponto"></span>' + esc(p.nome) + '</button>';
            }).join('')
        + '</div>'
        + '<div class="divide-resumo" id="d-resumo"></div></div>'
      + '<div class="btn-linha">'
        + '<button class="btn-secundario" data-acao="fechar-despesa">Cancelar</button>'
        + '<button class="btn-principal" id="d-salvar">' + (d ? 'Salvar' : 'Adicionar') + '</button>'
      + '</div>';

    atualizarResumoDivisao();
    document.getElementById('modal-despesa').classList.remove('hidden');
    var campo = document.getElementById('d-desc');
    if (campo) campo.focus();
  }

  function fecharDespesa(){
    document.getElementById('modal-despesa').classList.add('hidden');
    despesaEditando = null;
  }

  // Mostra quanto cai pra cada um enquanto a pessoa digita — assim ela vê o
  // resultado antes de salvar, em vez de descobrir depois.
  function atualizarResumoDivisao(){
    var resumo = document.getElementById('d-resumo');
    if (!resumo) return;
    var marcados = painelDespesa.querySelectorAll('.divide-op.is-on');
    var valor = parseFloat((document.getElementById('d-valor') || {}).value) || 0;
    var cent = Math.round(valor * 100);
    if (!marcados.length){
      resumo.innerHTML = 'Escolha pelo menos uma pessoa.';
      return;
    }
    if (!cent){
      resumo.innerHTML = marcados.length + (marcados.length === 1 ? ' pessoa marcada.' : ' pessoas marcadas.');
      return;
    }
    var partes = ratear(cent, marcados.length);
    var iguais = partes[0] === partes[partes.length - 1];
    resumo.innerHTML = 'Dá <b>' + dinheiro(partes[0]) + '</b> pra cada'
      + (iguais ? '' : ' (e <b>' + dinheiro(partes[partes.length-1]) + '</b> pra ' + (partes.filter(function(x){ return x === partes[partes.length-1]; }).length) + ' deles, pra fechar o centavo)')
      + '.';
  }

  function salvarDespesa(){
    var desc = (document.getElementById('d-desc').value || '').trim() || 'Despesa';
    var valor = parseFloat(document.getElementById('d-valor').value);
    var cent = Math.round((valor || 0) * 100);
    var pagouId = document.getElementById('d-pagou').value;
    var icone = document.getElementById('d-icone').value;
    var entre = [].slice.call(painelDespesa.querySelectorAll('.divide-op.is-on')).map(function(b){
      return b.getAttribute('data-pessoa');
    });

    if (!cent || cent <= 0){ avisar('Informe um valor maior que zero.'); return; }
    if (!entre.length){ avisar('Escolha quem participou.'); return; }

    if (despesaEditando){
      state.despesas.forEach(function(d){
        if (d.id === despesaEditando){
          d.desc = desc; d.centavos = cent; d.pagouId = pagouId; d.entre = entre; d.icone = icone;
        }
      });
    } else {
      state.despesas.push({
        id: novoId('d'), desc:desc, centavos:cent, pagouId:pagouId,
        entre:entre, icone:icone, quando:new Date().toISOString()
      });
    }
    fecharDespesa();
    salvar();
    avisar(despesaEditando ? 'Despesa atualizada.' : 'Despesa adicionada.');
  }

  /* ---------------- Janela de pessoa ---------------- */

  var pessoaEditando = null;
  var painelPessoa = document.getElementById('painel-pessoa');

  function abrirPessoa(id){
    pessoaEditando = id || null;
    var p = id ? pessoaPor(id) : null;
    painelPessoa.innerHTML = ''
      + '<h2>' + (p ? 'Editar ' + esc(p.nome) : 'Adicionar pessoa') + '</h2>'
      + '<div class="field"><label>Nome</label>'
        + '<input type="text" id="p-nome" placeholder="Ex.: João" value="' + esc(p ? p.nome : '') + '" autocomplete="off"></div>'
      + (p
          ? '<div class="field"><label>Marcar como você</label>'
            + '<button type="button" class="btn-secundario" id="p-sou-eu"' + (p.id === state.euId ? ' disabled style="opacity:.5;"' : '') + '>'
            + (p.id === state.euId ? 'Este já é você' : 'Sou eu') + '</button>'
            + '<div class="nota">Os indicadores "Você deve" e "Você recebe" usam essa escolha.</div></div>'
          : '')
      + '<div class="btn-linha">'
        + '<button class="btn-secundario" data-acao="fechar-pessoa">Cancelar</button>'
        + '<button class="btn-principal" id="p-salvar">' + (p ? 'Salvar' : 'Adicionar') + '</button>'
      + '</div>';
    document.getElementById('modal-pessoa').classList.remove('hidden');
    var campo = document.getElementById('p-nome');
    if (campo){ campo.focus(); campo.select(); }
  }
  function fecharPessoa(){
    document.getElementById('modal-pessoa').classList.add('hidden');
    pessoaEditando = null;
  }

  function salvarPessoa(){
    var nome = (document.getElementById('p-nome').value || '').trim();
    if (!nome){ avisar('Digite um nome.'); return; }

    if (pessoaEditando){
      state.pessoas.forEach(function(p){ if (p.id === pessoaEditando) p.nome = nome; });
    } else {
      var usadas = state.pessoas.map(function(p){ return p.cor; });
      var cor = CORES.filter(function(c){ return usadas.indexOf(c) === -1; })[0] || CORES[state.pessoas.length % CORES.length];
      state.pessoas.push({id:novoId('p'), nome:nome, cor:cor});
    }
    fecharPessoa();
    salvar();
    avisar(pessoaEditando ? 'Nome atualizado.' : nome + ' entrou no rachão.');
  }

  /* ---------------- Confirmações ---------------- */

  var painelConfirma = document.getElementById('painel-confirma');
  var confirmaAcao = null;

  function pedirConfirmacao(opcoes){
    confirmaAcao = opcoes.aoConfirmar;
    painelConfirma.innerHTML = ''
      + '<h2>' + esc(opcoes.titulo) + '</h2>'
      + '<div class="aviso-perigo">' + opcoes.aviso + '</div>'
      + (opcoes.exigePalavra
          ? '<div class="field"><label>Pra confirmar, digite <b>excluir</b> abaixo</label>'
            + '<input type="text" id="c-palavra" placeholder="excluir" autocomplete="off"></div>'
          : '')
      + '<div class="btn-linha">'
        + '<button class="btn-secundario" data-acao="fechar-confirma">Cancelar</button>'
        + '<button class="btn-principal btn-perigo" id="c-confirmar"' + (opcoes.exigePalavra ? ' disabled' : '') + '>'
          + esc(opcoes.botao || 'Excluir') + '</button>'
      + '</div>';
    document.getElementById('modal-confirma').classList.remove('hidden');
    var campo = document.getElementById('c-palavra');
    if (campo) campo.focus();
  }
  function fecharConfirma(){
    document.getElementById('modal-confirma').classList.add('hidden');
    confirmaAcao = null;
  }

  function apagarPessoa(id){
    var p = pessoaPor(id);
    if (!p) return;
    var pagou = state.despesas.filter(function(d){ return d.pagouId === id; }).length;
    var dividiu = state.despesas.filter(function(d){ return d.entre.indexOf(id) !== -1; }).length;

    pedirConfirmacao({
      titulo: 'Tirar ' + p.nome + ' do rachão?',
      // Quem pagou uma conta não pode sumir: a despesa ficaria sem dono e o
      // acerto pararia de fechar. Nesse caso o app manda editar antes.
      aviso: pagou
        ? '<b>' + esc(p.nome) + ' pagou ' + pagou + (pagou === 1 ? ' despesa' : ' despesas') + '.</b> '
          + 'Apagar agora deixaria essas contas sem dono e o acerto sairia errado. '
          + 'Troque quem pagou nessas despesas primeiro (no lápis da lista).'
        : (dividiu
            ? '<b>' + esc(p.nome) + ' está em ' + dividiu + (dividiu === 1 ? ' despesa' : ' despesas') + '.</b> '
              + 'Ela sai da divisão dessas contas, e o valor passa a ser rachado só entre quem sobrar. Isso muda o acerto.'
            : esc(p.nome) + ' não participa de nenhuma despesa. Tirar não muda número nenhum.'),
      botao: pagou ? 'Entendi' : 'Tirar do rachão',
      exigePalavra: dividiu > 0 && !pagou,
      aoConfirmar: pagou ? null : function(){
        state.pessoas = state.pessoas.filter(function(x){ return x.id !== id; });
        state.despesas.forEach(function(d){
          d.entre = d.entre.filter(function(x){ return x !== id; });
        });
        // Despesa que ficou sem ninguém dividindo não faz sentido: sai junto.
        state.despesas = state.despesas.filter(function(d){ return d.entre.length > 0; });
        if (state.euId === id) state.euId = state.pessoas[0].id;
        fecharConfirma();
        salvar();
        avisar(p.nome + ' saiu do rachão.');
      }
    });

    if (pagou){
      // Não é uma exclusão: é um aviso. O botão só fecha.
      var btn = document.getElementById('c-confirmar');
      btn.classList.remove('btn-perigo');
      confirmaAcao = fecharConfirma;
    }
  }

  function apagarDespesa(id){
    var d = state.despesas.filter(function(x){ return x.id === id; })[0];
    if (!d) return;
    pedirConfirmacao({
      titulo: 'Apagar "' + d.desc + '"?',
      aviso: 'A despesa de <b>' + dinheiro(d.centavos) + '</b> sai da conta e o acerto é refeito na hora. Isso não tem como desfazer.',
      botao: 'Apagar',
      aoConfirmar: function(){
        state.despesas = state.despesas.filter(function(x){ return x.id !== id; });
        fecharConfirma();
        salvar();
        avisar('Despesa apagada.');
      }
    });
  }

  function zerarTudo(){
    pedirConfirmacao({
      titulo: 'Zerar tudo?',
      aviso: 'Apaga <b>todas as pessoas e todas as despesas</b> deste navegador. Isso não tem como desfazer.',
      botao: 'Zerar tudo',
      exigePalavra: true,
      aoConfirmar: function(){
        state = estadoInicial();
        fecharConfirma();
        salvar();
        avisar('Tudo zerado.');
      }
    });
  }

  /* ---------------- Ajuda ---------------- */

  var PASSOS = [
    ['Monte o grupo', 'Em <b>Quem está no rachão</b>, adicione as pessoas. Toque no lápis pra renomear ou pra marcar qual delas é você.'],
    ['Lance as despesas', 'Em <b>Nova despesa</b>, diga o que foi, quanto custou, <b>quem pagou</b> e entre quem divide. Não precisa ser todo mundo — desmarque quem não participou daquela conta.'],
    ['Veja quanto cai pra cada um', 'Enquanto você digita o valor, o app já mostra quanto sobra pra cada pessoa. Quando o valor não divide certinho, ele distribui o centavo que sobra em vez de sumir com ele.'],
    ['Leia o acerto', 'O bloco de cima mostra <b>quem paga pra quem</b>, no menor número de transferências possível. Verde na lista de pessoas é quem tem a receber; vermelho é quem deve.'],
    ['Corrigiu algo?', 'Lápis edita e lixeira apaga, tanto em pessoa quanto em despesa. O acerto é refeito na hora.']
  ];

  function abrirAjuda(){
    document.getElementById('painel-ajuda').innerHTML = ''
      + '<h2>❓ Como usar</h2>'
      + '<p class="modal-nota">Leva um minuto. Tudo fica salvo neste navegador — não precisa criar conta.</p>'
      + PASSOS.map(function(p, i){
          return '<div class="ajuda-passo">'
            + '<span class="ajuda-num">' + (i+1) + '</span>'
            + '<div class="ajuda-txt"><h3>' + esc(p[0]) + '</h3><p>' + p[1] + '</p></div>'
            + '</div>';
        }).join('')
      + '<div class="btn-linha"><button class="btn-secundario" data-acao="fechar-ajuda">Entendi</button></div>';
    document.getElementById('modal-ajuda').classList.remove('hidden');
  }

  /* ---------------- Aviso rápido ---------------- */

  var avisoEl = document.getElementById('aviso');
  var avisoTimer = null;
  function avisar(texto){
    avisoEl.textContent = texto;
    avisoEl.classList.remove('hidden');
    clearTimeout(avisoTimer);
    avisoTimer = setTimeout(function(){ avisoEl.classList.add('hidden'); }, 2400);
  }

  /* ---------------- Eventos ---------------- */

  conteudoEl.addEventListener('click', function(e){
    var alvo = e.target.closest('[data-acao]');
    if (!alvo) return;
    var acao = alvo.getAttribute('data-acao');
    var id = alvo.getAttribute('data-id');
    if (acao === 'nova-despesa') abrirDespesa(null);
    else if (acao === 'editar-despesa') abrirDespesa(id);
    else if (acao === 'apagar-despesa') apagarDespesa(id);
    else if (acao === 'nova-pessoa') abrirPessoa(null);
    else if (acao === 'editar-pessoa') abrirPessoa(id);
    else if (acao === 'apagar-pessoa') apagarPessoa(id);
  });

  painelDespesa.addEventListener('click', function(e){
    if (e.target.closest('[data-acao="fechar-despesa"]')){ fecharDespesa(); return; }
    if (e.target.closest('#d-salvar')){ salvarDespesa(); return; }
    var op = e.target.closest('.divide-op');
    if (op){ op.classList.toggle('is-on'); atualizarResumoDivisao(); return; }
  });
  painelDespesa.addEventListener('input', function(e){
    if (e.target.matches('#d-valor')) atualizarResumoDivisao();
  });

  painelPessoa.addEventListener('click', function(e){
    if (e.target.closest('[data-acao="fechar-pessoa"]')){ fecharPessoa(); return; }
    if (e.target.closest('#p-salvar')){ salvarPessoa(); return; }
    if (e.target.closest('#p-sou-eu')){
      state.euId = pessoaEditando;
      fecharPessoa();
      salvar();
      avisar('Pronto, agora é você.');
      return;
    }
  });

  painelConfirma.addEventListener('click', function(e){
    if (e.target.closest('[data-acao="fechar-confirma"]')){ fecharConfirma(); return; }
    if (e.target.closest('#c-confirmar')){ if (confirmaAcao) confirmaAcao(); return; }
  });
  painelConfirma.addEventListener('input', function(e){
    if (!e.target.matches('#c-palavra')) return;
    var btn = document.getElementById('c-confirmar');
    if (btn) btn.disabled = e.target.value.trim().toLowerCase() !== 'excluir';
  });

  document.getElementById('painel-ajuda').addEventListener('click', function(e){
    if (e.target.closest('[data-acao="fechar-ajuda"]')) document.getElementById('modal-ajuda').classList.add('hidden');
  });

  // Tocar fora fecha a janela — o gesto que todo mundo tenta primeiro.
  ['modal-despesa','modal-pessoa','modal-confirma','modal-ajuda'].forEach(function(idM){
    var el = document.getElementById(idM);
    el.addEventListener('click', function(e){ if (e.target === el) el.classList.add('hidden'); });
  });

  document.addEventListener('keydown', function(e){
    if (e.key !== 'Escape') return;
    ['modal-despesa','modal-pessoa','modal-confirma','modal-ajuda'].forEach(function(idM){
      document.getElementById(idM).classList.add('hidden');
    });
  });

  document.getElementById('btn-ajuda').addEventListener('click', abrirAjuda);
  document.getElementById('btn-zerar').addEventListener('click', zerarTudo);

  /* ---------- Rodando dentro do Gestor ----------
     Quando o RachaFácil abre dentro do Gestor de Gastos, o cabeçalho daqui
     sai e os dois botões (ajuda e zerar) passam a viver na barra de cima do
     Gestor. O combinado entre os dois é só isto: mandamos a lista de botões
     e ficamos ouvindo o clique. Qualquer app extra futuro pode fazer igual. */
  var embutido = false;
  try { embutido = (window.parent !== window); } catch(e){ embutido = true; }

  if (embutido){
    document.body.classList.add('embutido');
    window.addEventListener('message', function(e){
      var d = e.data;
      if (!d || d.tipo !== 'app-acao') return;
      if (d.id === 'ajuda') abrirAjuda();
      else if (d.id === 'zerar') zerarTudo();
    });
    try {
      window.parent.postMessage({
        tipo: 'app-acoes',
        acoes: [
          {id:'ajuda', rotulo:'?', titulo:'Como usar'},
          {id:'zerar', rotulo:'\uD83D\uDDD1\uFE0F', titulo:'Zerar tudo'}
        ]
      }, '*');
    } catch(e){}
  }

  render();
})();
<\/script>
</body>
</html>

</script>
</body>
</html>
