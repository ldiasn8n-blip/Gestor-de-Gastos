    var porCartao = '<section class="resumo-block neon-box acc-amber" style="margin-bottom:16px;">'
      + '<div class="section-title">💳 Seus gastos por cartão</div>'
      + cardsPanelHTML(listaPessoal, 'pessoal:' + memberId)
      + '</section>';

    return cartoes + grafico + porCartao;
  }

  function renderUpcomingMonthsHTML(memberId){
    var months = upcomingMonthsForMember(memberId);
    if (!months.length) return '';
    var rows = months.map(function(m){
      return '<div class="personal-row"><span>📅 '+escapeHTML(m.label)+'</span><span class="val">'+m.count+'x — '+formatBRL(m.value)+'</span></div>';
    }).join('');
    return '<div class="section-title">Próximos meses</div><div class="hero-settlement stat-grid" style="padding:16px 18px;">'+rows+'</div>';
  }

  // Meses em que essa pessoa tem lançamentos desse tipo. Nos gastos pessoais
  // também entram os meses em que só caem parcelas de compras antigas — são
  // meses em que ela paga algo, e o gráfico os mostra, então o seletor precisa
  // aceitá-los pra o clique na barra funcionar.
  function memberAvailableMonths(memberId, sub){
    var chaves = {};
    expenseMonthSpan(2).forEach(function(mk){
      if (materializedForMonth(mk).some(function(e){ return e.person === memberId && e.type === sub; })){
        chaves[mk] = true;
      }
    });
    if (sub === 'pessoal'){
      buildPersonalMonthsTimeline(memberId).forEach(function(g){ chaves[g.key] = true; });
    }
    return Object.keys(chaves).sort(function(a,b){ return b.localeCompare(a); });
  }
  function entriesMonthKey(memberId, sub){
    var chave = memberId + ':' + sub;
    var meses = memberAvailableMonths(memberId, sub);
    var atual = state.entriesMonth[chave];
    if (atual && (atual === 'all' || meses.indexOf(atual) !== -1)) return atual;
    return defaultMonthKey(meses);
  }

  function renderMemberTab(memberId){
    var member = memberById(memberId);
    var sub = state.subTab[memberId] || 'casal';
    // A lista abre no mês atual — antes vinha tudo misturado e o aluguel de
    // agosto, setembro e outubro apareciam empilhados no mesmo bloco.
    var mesLista = entriesMonthKey(memberId, sub);
    var mesesLista = memberAvailableMonths(memberId, sub);
    var list = expensesFor(mesLista).filter(function(e){ return e.person===memberId && e.type===sub; });
    var editingExpense = null;
    if (state.editingId){
      var alvo = baseExpenseId(state.editingId);
      var found = state.expenses.find(function(e){ return e.id === alvo; });
      if (found && found.person === memberId && found.type === sub) editingExpense = found;
    }
    var softA = hexToRgba(member.color, 0.14);
    var segmentedHTML = '<div class="segmented" data-segmented="'+escapeHTML(memberId)+'">'
        + '<button data-subtab="casal" style="'+(sub==='casal'?('background:'+softA+';color:'+member.color+';'):'')+'">Contas do casal</button>'
        + '<button data-subtab="pessoal" style="'+(sub==='pessoal'?('background:'+softA+';color:'+member.color+';'):'')+'">Contas pessoais</button>'
      + '</div>';
    var barraMes = monthBarHTML('entries-month', mesLista, mesesLista, memberId + ':' + sub);

    if (sub === 'pessoal'){
      return ''
        + segmentedHTML
        + renderFormHTML(memberId, sub, editingExpense)
        + renderPersonalSummaryHTML(memberId, mesLista)
        + barraMes
        + renderPersonalEntriesHTML(list)
        + renderUpcomingMonthsHTML(memberId);
    }
    return ''
      + segmentedHTML
      + renderFormHTML(memberId, sub, editingExpense)
      + barraMes
      + renderEntriesHTML(list);
  }

  /* ---------- Gráficos do Resumo ----------
     Os dois gráficos são SVG escrito à mão: nenhuma biblioteca externa, pra
     o app continuar abrindo offline e sem depender de CDN.

     Uma decisão importante sobre cor: o app tem 11 categorias, e 11 cores não
     se separam de verdade — Internet (#B18CFF) e Água (#4FA8FF), por exemplo,
     são quase idênticas para quem tem daltonismo. Por isso a comparação entre
     categorias é uma LISTA DE BARRAS com nome e valor escritos em cada linha,
     não um gráfico de pizza/rosca: a cor vira reforço, e quem diz qual é qual
     é o texto. Num gráfico de rosca a cor seria a única pista, e várias fatias
     ficariam impossíveis de distinguir. */

  // Meses que aparecem no seletor do Resumo. Sai do intervalo completo (e não
  // das datas cruas) porque um gasto fixo dá movimento a meses onde você não
  // digitou nada. Só entram meses que realmente têm algum lançamento.
  function resumoAvailableMonths(){
    // O mesmo alcance do gráfico (2 meses à frente): se a barra de novembro
    // aparece lá, clicar nela tem que funcionar — senão o filtro rejeitaria o
    // mês e voltaria calado pro mês atual.
    return expenseMonthSpan(2)
      .filter(function(mk){ return materializedForMonth(mk).length > 0; })
      .sort(function(a,b){ return b.localeCompare(a); });
  }

  // O app abre sempre no mês atual. Se ele ainda não tem nada, cai no mês mais
  // recente que tem — melhor abrir com conteúdo do que numa tela vazia.
  function defaultMonthKey(disponiveis){
    var atual = currentMonthKey();
    if (!disponiveis || !disponiveis.length) return atual;
    if (disponiveis.indexOf(atual) !== -1) return atual;
    return disponiveis[0];
  }

  // Barra de seleção de mês, usada no Resumo e nas listas de cada pessoa.
  function monthBarHTML(action, selecionado, meses, sufixo, comMetas){
    var atual = currentMonthKey();
    // O mês corrente vai aceso na lista e com um marcador de texto junto: cor
    // sozinha não basta, tem navegador que ignora estilo em <option>.
    var opts = '<option value="all"'+(selecionado==='all'?' selected':'')+'>Todos os meses</option>'
      + meses.map(function(k){
          var ehAtual = k === atual;
          return '<option value="'+k+'"'+(selecionado===k?' selected':'')+(ehAtual?' class="mes-atual"':'')+'>'
            + monthLabelFromKey(k) + (ehAtual ? '  ●  mês atual' : '') + '</option>';
        }).join('');
    var texto = selecionado === 'all'
      ? 'Somando tudo desde o começo'
      : (selecionado === currentMonthKey() ? 'Mês atual' : 'Mostrando ' + monthLabelFromKey(selecionado));
    return '<div class="resumo-toolbar">'
      + '<label class="resumo-month'+(selecionado === atual ? ' is-current' : '')+'"><span class="resumo-month-icon">🗓️</span>'
      + '<select class="resumo-month-select" data-action="'+action+'"'+(sufixo?' data-scope="'+escapeHTML(sufixo)+'"':'')+'>'+opts+'</select></label>'
      + '<span class="resumo-scope">'+escapeHTML(texto)+'</span>'
      + (comMetas ? metaBotaoHTML() : '')
      + '</div>';
  }

  // O botão fica sempre ali; a meta só aparece na tela depois que a pessoa
  // configura alguma. Quem não quiser meta nenhuma não vê meta nenhuma.
  function metaBotaoHTML(){
    var ligado = metasAtivas();
    return '<button type="button" class="meta-btn'+(ligado?' is-on':'')+'" data-action="open-metas"'
      + ' title="'+(ligado ? 'Ver e mudar as metas do mês' : 'Definir metas de gasto')+'">'
      + '<span class="meta-btn-icone">🎯</span>'
      + '<span class="meta-btn-texto">' + (ligado ? 'Metas' : 'Definir metas') + '</span>'
      + '</button>';
  }

  /* ---------- Metas ---------- */

  // Quanto foi gasto contra o teto, no mês que está na tela.
  // Quanto foi gasto por categoria e por cartão no mês.
  // Atenção à diferença, que está escrita na tela pra ninguém se enganar:
  // categoria conta só as CONTAS DO CASAL (é o que o Resumo mostra), enquanto
  // cartão conta TUDO que passou nele — casal e pessoal — porque a fatura do
  // cartão não separa uma coisa da outra.
  function gastoDoMesPorItem(monthKey){
    var tudo = expensesFor(monthKey);
    var casal = tudo.filter(function(e){ return e.type === 'casal'; });
    var porCat = {}, porCartao = {};
    casal.forEach(function(e){ porCat[e.category] = (porCat[e.category] || 0) + e.value; });
    tudo.forEach(function(e){
      if (usouCartao(e)) porCartao[e.card] = (porCartao[e.card] || 0) + e.value;
    });
    return {
      totalCasal: casal.reduce(function(soma,e){ return soma + e.value; }, 0),
      categorias: porCat,
      cartoes: porCartao
    };
  }

  function metasDoMes(monthKey){
    var m = normalizarMetas(state.settings.goals);
    var g = gastoDoMesPorItem(monthKey);

    var linhas = [];
    if (m.geral) linhas.push({key:'__geral__', tipo:'geral', nome:'Total do mês', meta:m.geral, gasto:g.totalCasal});
    Object.keys(m.categorias).forEach(function(c){
      linhas.push({key:'cat:'+c, tipo:'categoria', nome:c, meta:m.categorias[c], gasto:g.categorias[c] || 0});
    });
    Object.keys(m.cartoes).forEach(function(c){
      linhas.push({key:'card:'+c, tipo:'cartao', nome:c, meta:m.cartoes[c], gasto:g.cartoes[c] || 0});
    });
    // A meta mais perto de estourar sobe: é a que precisa de decisão.
    linhas.sort(function(a,b){
      if (a.tipo === 'geral') return -1;
      if (b.tipo === 'geral') return 1;
      return (b.gasto/b.meta) - (a.gasto/a.meta);
    });
    return linhas;
  }

  function metaEstado(gasto, meta){
    var pct = meta > 0 ? (gasto / meta * 100) : 0;
    if (pct > 100) return {classe:'estourou', cor:'#FF4D6D', rotulo:'Passou'};
    if (pct >= 80)  return {classe:'perto', cor:'#FFC24F', rotulo:'No limite'};
    return {classe:'ok', cor:'#39FF88', rotulo:'Dentro'};
  }

  function metasBlockHTML(monthKey){
    if (!metasAtivas()) return '';
    // Meta é sempre de um mês. Com "todos os meses" na tela, comparar com um
    // teto mensal daria um número sem sentido, então o bloco some.
    if (!monthKey || monthKey === 'all') return '';

    var linhas = metasDoMes(monthKey).map(function(l){
      var e = metaEstado(l.gasto, l.meta);
      var pct = l.meta > 0 ? (l.gasto / l.meta * 100) : 0;
      var sobra = l.meta - l.gasto;
      var largura = Math.min(100, pct);
      var texto = sobra >= 0
        ? 'Ainda cabe ' + formatBRL(sobra)
        : 'Passou ' + formatBRL(Math.abs(sobra));
      // O selo da esquerda diz de que tipo é a meta sem precisar de legenda:
      // alvo = o mês inteiro, ícone da categoria, bolinha colorida = cartão.
      var selo;
      if (l.tipo === 'geral') selo = '🎯';
      else if (l.tipo === 'cartao') selo = cardChipHTML(l.nome, 'sm');
      else selo = catChipHTML(l.nome, 20);

      return '<div class="meta-row meta-' + e.classe + '">'
        + '<div class="meta-topo">'
          + '<span class="meta-nome">' + selo + '<span class="meta-nome-txt">' + escapeHTML(l.nome)
            + (l.tipo === 'cartao' ? '<span class="meta-tipo">cartão</span>' : '') + '</span></span>'
          + '<span class="meta-val">' + formatBRL(l.gasto) + '<span class="meta-de"> de ' + formatBRL(l.meta) + '</span></span>'
        + '</div>'
        + '<div class="meta-track"><div class="meta-fill" style="width:' + largura.toFixed(1) + '%;background:' + e.cor + ';box-shadow:0 0 10px ' + hexToRgba(e.cor,0.7) + ';"></div></div>'
        + '<div class="meta-pe"><span class="meta-tag" style="color:' + e.cor + ';">' + e.rotulo + '</span>'
          + '<span>' + escapeHTML(texto) + ' · ' + Math.round(pct) + '% da meta</span></div>'
        + '</div>';
    }).join('');

    return '<section class="resumo-block neon-box acc-green rb-metas" style="margin-bottom:16px;">'
      + '<div class="section-title">🎯 Metas de ' + escapeHTML(monthLabelFromKey(monthKey))
        + '<button type="button" class="meta-editar" data-action="open-metas">ajustar</button></div>'
      + linhas
      + '</section>';
  }

  // Meses que ainda vão chegar e já têm conta marcada (parcela ou conta fixa).
  function futureMonthsList(){
    var atual = currentMonthKey();
    return buildCasalMonthsTimeline()
      .filter(function(g){ return g.key > atual; })
      .map(function(g){ return {key:g.key, total:g.total}; });
  }

  // Quais meses futuros entram na conta. state.futureMonths = null é o padrão:
  // só o PRÓXIMO mês. Somar tudo que vem pela frente de cara assusta e não
  // ajuda — o que interessa no dia a dia é o mês que vem. Os outros a pessoa
  // adiciona na janela quando quiser olhar mais longe.
  function futureSelectedKeys(){
    var todos = futureMonthsList().map(function(m){ return m.key; });
    if (state.futureMonths){
      return state.futureMonths.filter(function(k){ return todos.indexOf(k) !== -1; });
    }
    return todos.length ? [todos[0]] : [];
  }

  function futureCommitment(){
    var sel = futureSelectedKeys();
    return futureMonthsList()
      .filter(function(m){ return sel.indexOf(m.key) !== -1; })
      .reduce(function(s,m){ return s + m.total; }, 0);
  }

  function futureTileHTML(valor){
    var todos = futureMonthsList();
    var sel = futureSelectedKeys();
    var dica;
    if (!todos.length) dica = 'Nada marcado pra frente';
    else if (sel.length === 0) dica = 'Nenhum mês marcado · toque pra escolher';
    else if (sel.length === 1) dica = escapeHTML(monthLabelFromKey(sel[0])) + ' · toque pra somar outros';
    else if (sel.length === todos.length) dica = 'Todos os ' + todos.length + ' meses · toque pra mudar';
    else dica = sel.length + ' de ' + todos.length + ' meses · toque pra mudar';
    return '<button type="button" class="kpi-tile neon-box acc-amber kpi-clickable" data-action="open-future">'
      + '<div class="kpi-label">Próximos meses</div>'
      + '<div class="kpi-value">'+formatBRL(valor)+'</div>'
      + '<div class="kpi-hint">'+dica+' <span class="kpi-caret">›</span></div>'
      + '</button>';
  }

  function kpiTileHTML(label, value, hint, accent){
    return '<div class="kpi-tile neon-box '+(accent || 'acc-cyan')+'">'
      + '<div class="kpi-label">'+escapeHTML(label)+'</div>'
      + '<div class="kpi-value">'+value+'</div>'
      + '<div class="kpi-hint">'+(hint || '')+'</div>'
      + '</div>';
  }

  // Barras horizontais ranqueadas: cada linha é clicável e abre os itens
  // daquela categoria, igual as linhas de antes faziam.
  function categoryBarsHTML(groups, opts){
    opts = opts || {};
    var clicavel = opts.clicavel !== false;
    if (!groups.length) return '<div class="empty-state">' + (opts.vazio || 'Sem contas do casal neste período.') + '</div>';
    var max = groups.reduce(function(m,g){ return Math.max(m, g.total); }, 0) || 1;
    var totalAll = groups.reduce(function(s,g){ return s + g.total; }, 0) || 1;
    return '<div class="cat-bars">' + groups.map(function(g){
      var color = catColor(g.category);
      var pct = g.total / max * 100;
      var share = Math.round(g.total / totalAll * 100);
      var abre = clicavel
        ? '<button type="button" class="cat-bar-row" data-action="open-items" data-category="'+escapeHTML(g.category)+'" title="'+escapeHTML(g.category)+' — '+formatBRL(g.total)+' ('+share+'% do período)">'
        : '<div class="cat-bar-row" style="cursor:default;">';
      return abre
        + '<span class="cat-bar-head">'
          + '<span class="cat-bar-name">'+catChipHTML(g.category, 22)+'<span class="cat-bar-label">'+escapeHTML(g.category)+'</span></span>'
          + '<span class="cat-bar-val">'+formatBRL(g.total)+'<span class="cat-bar-share">'+share+'%</span></span>'
        + '</span>'
        + '<span class="cat-bar-track"><span class="cat-bar-fill" style="width:'+pct.toFixed(2)+'%;background:'+color+';box-shadow:0 0 10px '+hexToRgba(color,0.75)+';"></span></span>'
        + (clicavel ? '</button>' : '</div>');
    }).join('') + '</div>';
  }

  /* ---------- Contas por cartão ----------
     Um extrato dá o total do cartão e depois abre no que foi débito, crédito à
     vista e parcelado. É esse recorte que este painel refaz: cada cartão vira
     uma linha; tocar na linha abre as gavetas e as categorias daquele cartão.
     O que não passou por cartão nenhum (pix, dinheiro, boleto) não some — vai
     pra uma linha própria no fim, senão a soma do painel não bateria com o mês. */

  var CARD_COLORS = ['#8B5CF6','#4FE0FF','#FF9F43','#35D6C4','#FF5D8F','#9BE564'];
  var CARTAO_OUTRO = '__outro__';

  /* Aparência dos cartões conhecidos: a cor da marca e um símbolo. Não são as
     logomarcas dos bancos — logo de banco é marca registrada e eu não posso
     desenhar. Cor + inicial dá o mesmo reconhecimento à distância (é o que o
     próprio app do banco faz no ícone da tela de início) e não põe você em
     apuro por usar marca de terceiro num produto que vende. Quem quiser outra
     coisa troca o símbolo e a cor na janela do cartão. */
  var CARTOES_CONHECIDOS = {
    'nubank':      {cor:'#820AD1', icone:'N'},
    'nu':          {cor:'#820AD1', icone:'N'},
    'inter':       {cor:'#FF7A00', icone:'I'},
    'itau':        {cor:'#004990', icone:'I'},
    'itaú':        {cor:'#004990', icone:'I'},
    'santander':   {cor:'#EC0000', icone:'S'},
    'bradesco':    {cor:'#CC092F', icone:'B'},
    'caixa':       {cor:'#0070AF', icone:'C'},
    'banco do brasil': {cor:'#F9DD16', icone:'B'},
    'bb':          {cor:'#F9DD16', icone:'B'},
    'c6':          {cor:'#242424', icone:'6'},
    'c6 bank':     {cor:'#242424', icone:'6'},
    'picpay':      {cor:'#21C25E', icone:'P'},
    'mercado pago':{cor:'#00B1EA', icone:'M'},
    'will':        {cor:'#FFD100', icone:'W'},
    'neon':        {cor:'#00E0C7', icone:'N'},
    'next':        {cor:'#00FF5F', icone:'N'},
    'original':    {cor:'#00A86B', icone:'O'},
    'safra':       {cor:'#003B71', icone:'S'},
    'btg':         {cor:'#0D2B45', icone:'B'},
    'xp':          {cor:'#101820', icone:'X'},
    'pan':         {cor:'#00AEEF', icone:'P'},
    'digio':       {cor:'#0F62FE', icone:'D'},
    'sicredi':     {cor:'#3FA110', icone:'S'},
    'sicoob':      {cor:'#003641', icone:'S'},
    'ame':         {cor:'#EB1D5E', icone:'A'},
    'nubank ultravioleta': {cor:'#4B0082', icone:'N'}
  };

  // Símbolos prontos pra quem não quiser a letra.
  var ICONES_CARTAO = ['💳','🏦','💰','💵','🪙','🧾','📱','⭐','🔷','🔶','🟣','🟢','🔵','🔴','🟡','⚫'];

  // Cores boas em cima do fundo escuro do app.
  var CORES_CARTAO = ['#820AD1','#FF7A00','#EC7000','#EC0000','#0070AF','#F9DD16',
                      '#21C25E','#00B1EA','#8B5CF6','#4FE0FF','#FF9F43','#35D6C4',
                      '#FF5D8F','#9BE564','#B18CFF','#7C8A97'];

  function chaveCartao(nome){ return String(nome || '').trim().toLowerCase(); }

  function marcaConhecida(nome){
    var k = chaveCartao(nome);
    if (CARTOES_CONHECIDOS[k]) return CARTOES_CONHECIDOS[k];
    // "Nubank Ultravioleta", "Inter Gold": vale a marca que abre o nome.
    var primeira = k.split(/[\s\-]+/)[0];
    return CARTOES_CONHECIDOS[primeira] || null;
  }

  function cardColorFor(nome){
    if (nome === CARTAO_OUTRO) return '#7C8A97';
    var escolhida = (state.settings.cardColors || {})[nome];
    if (escolhida) return escolhida;
    var marca = marcaConhecida(nome);
    if (marca) return marca.cor;
    var lista = (state.settings.cards && state.settings.cards.length) ? state.settings.cards : DEFAULT_CARDS;
    var i = lista.indexOf(nome);
    if (i === -1) i = hashString(nome) % CARD_COLORS.length;
    return CARD_COLORS[i % CARD_COLORS.length];
  }

  function cardIconFor(nome){
    if (nome === CARTAO_OUTRO) return '💸';
    var escolhido = (state.settings.cardIcons || {})[nome];
    if (escolhido) return escolhido;
    var marca = marcaConhecida(nome);
    if (marca) return marca.icone;
    return inicialDeCartao(nome);
  }

  // Dois cartões que começam com a mesma letra ("Itaú" e "Inter") viravam duas
  // plaquinhas idênticas. Quando isso acontece, a letra vira duas.
  function inicialDeCartao(nome){
    var limpo = String(nome || '?').trim();
    var uma = (limpo.charAt(0) || '?').toUpperCase();
    var lista = (state.settings.cards && state.settings.cards.length) ? state.settings.cards : DEFAULT_CARDS;
    var repete = lista.filter(function(c){
      return c !== nome && !marcaConhecida(c)
        && (String(c || '').trim().charAt(0) || '').toUpperCase() === uma;
    }).length > 0;
    return repete ? limpo.slice(0, 2).toUpperCase() : uma;
  }

  // A "plaquinha" do cartão: quadradinho na cor da marca com o símbolo dentro.
  function cardChipHTML(nome, tamanho){
    var cor = cardColorFor(nome);
    var ic = cardIconFor(nome);
    var cls = 'card-mark' + (tamanho ? ' card-mark-' + tamanho : '');
    return '<span class="' + cls + '" style="background:' + cor + ';color:' + textoSobre(cor) + ';'
      + 'box-shadow:0 0 10px ' + hexToRgba(cor, 0.55) + ';">' + escapeHTML(ic) + '</span>';
  }

  // Cor da marca clara (o amarelo do BB, por exemplo) pede texto escuro.
  function textoSobre(hex){
    var h = String(hex || '').replace('#','');
    if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
    var r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
    if (isNaN(r) || isNaN(g) || isNaN(b)) return '#fff';
    // Luminância relativa simplificada — o verde pesa mais pro olho humano.
    return (0.299*r + 0.587*g + 0.114*b) > 150 ? '#10151C' : '#FFFFFF';
  }

  function cardLabelFor(nome){
    return nome === CARTAO_OUTRO ? 'Pix, dinheiro ou boleto' : nome;
  }

  function usouCartao(e){
    return (e.paymentMethod === 'credito' || e.paymentMethod === 'debito') && !!e.card;
  }

  // Em qual gaveta do cartão o gasto entra.
  function cardBucket(e){
    if (!usouCartao(e)) return e.installment ? 'parcelado' : 'avista';
    if (e.installment) return 'parcelado';
    return e.paymentMethod === 'debito' ? 'debito' : 'credito';
  }

  function groupByCard(list){
    var map = {};
    list.forEach(function(e){
      var key = usouCartao(e) ? e.card : CARTAO_OUTRO;
      if (!map[key]) map[key] = {card:key, items:[], total:0, buckets:{credito:0, debito:0, parcelado:0, avista:0}};
      var g = map[key];
      g.items.push(e);
      g.total += e.value;
      g.buckets[cardBucket(e)] += e.value;
    });
    var groups = Object.keys(map).map(function(k){ return map[k]; });
    groups.sort(function(a,b){
      if (a.card === CARTAO_OUTRO) return 1;
      if (b.card === CARTAO_OUTRO) return -1;
      return b.total - a.total;
    });
    return groups;
  }

  function cardOpenHTML(g){
    var filtro = (state.cardOpen && state.cardOpen.filter) || 'tudo';
    var defs = (g.card === CARTAO_OUTRO)
      ? [['tudo','Tudo'], ['avista','À vista'], ['parcelado','Parcelado']]
      : [['tudo','Tudo'], ['credito','Crédito'], ['debito','Débito'], ['parcelado','Parcelado']];
    var chips = defs.map(function(d){
      var valor = (d[0] === 'tudo') ? g.total : g.buckets[d[0]];
      // Gaveta vazia não vira botão: um "Débito R$ 0,00" só ocupa espaço.
      if (d[0] !== 'tudo' && !(valor > 0.005)) return '';
      var ligado = (filtro === d[0]);
      return '<button type="button" class="card-chip'+(ligado?' is-on':'')+'" data-action="card-filter" data-filter="'+d[0]+'">'
        + escapeHTML(d[1]) + ' <b>' + formatBRL(valor) + '</b></button>';
    }).join('');
    var itens = (filtro === 'tudo') ? g.items : g.items.filter(function(e){ return cardBucket(e) === filtro; });
    return '<div class="card-open">'
      + '<div class="card-chips">' + chips + '</div>'
      + categoryBarsHTML(groupByCategory(itens), {clicavel:false, vazio:'Nada nesta parte do cartão neste mês.'})
      + '</div>';
  }

  // A lista de cartões propriamente dita. Separada do painel porque no modo
  // "ver separado" ela é desenhada uma vez por pessoa, cada uma com seu
  // próprio escopo de abrir/fechar.
  function listaCartoesHTML(list, escopo){
    var groups = groupByCard(list);
    if (!groups.length) return '<div class="empty-state">Nada lançado aqui neste mês.</div>';

    var aberto = (state.cardOpen && state.cardOpen.scope === escopo) ? state.cardOpen.card : null;
    if (aberto && !groups.some(function(g){ return g.card === aberto; })) aberto = null;

    var max = groups.reduce(function(m,g){ return Math.max(m, g.total); }, 0) || 1;
    var totalAll = groups.reduce(function(sum,g){ return sum + g.total; }, 0) || 1;

    return '<div class="cat-bars card-list">' + groups.map(function(g){
      var cor = cardColorFor(g.card);
      var pct = g.total / max * 100;
      var share = Math.round(g.total / totalAll * 100);
      var estaAberto = (g.card === aberto);
      var head = '<button type="button" class="cat-bar-row card-row'+(estaAberto?' is-open':'')+'"'
        + ' data-action="toggle-card" data-scope="'+escapeHTML(escopo)+'" data-card="'+escapeHTML(g.card)+'"'
        + ' title="'+escapeHTML(cardLabelFor(g.card))+' — '+formatBRL(g.total)+'. Toque pra abrir.">'
        + '<span class="cat-bar-head">'
          + '<span class="cat-bar-name">' + cardChipHTML(g.card, 'sm')
            + '<span class="cat-bar-label">'+escapeHTML(cardLabelFor(g.card))+'</span></span>'
          + '<span class="cat-bar-val">'+formatBRL(g.total)+'<span class="cat-bar-share">'+share+'%</span>'
            + '<span class="card-caret">'+(estaAberto ? '⌄' : '›')+'</span></span>'
        + '</span>'
        + '<span class="cat-bar-track"><span class="cat-bar-fill" style="width:'+pct.toFixed(2)+'%;background:'+cor+';box-shadow:0 0 10px '+hexToRgba(cor,0.75)+';"></span></span>'
        + '</button>';
      return estaAberto ? (head + cardOpenHTML(g)) : head;
    }).join('') + '</div>';
  }

  // Quem aparece nos botões: só quem tem gasto na lista, na ordem dos membros.
  function pessoasNaLista(list){
    var ids = {};
    list.forEach(function(e){ ids[e.person] = true; });
    return state.settings.members.filter(function(m){ return ids[m.id]; });
  }

  function cardsPanelHTML(list, escopo){
    if (!list.length) return '<div class="empty-state">Nada lançado neste mês ainda.</div>';

    var pessoas = pessoasNaLista(list);
    var temEscolha = pessoas.length > 1;

    var sel = (state.cardFiltro[escopo] || []).filter(function(id){
      return pessoas.some(function(p){ return p.id === id; });
    });
    var separado = !!state.cardSeparado[escopo];
    var filtrada = sel.length ? list.filter(function(e){ return sel.indexOf(e.person) !== -1; }) : list;

    // Botões de pessoa: cada um com o próprio total, pra dar pra comparar sem
    // clicar. Dá pra marcar mais de um.
    var chips = '';
    if (temEscolha){
      var totalGeral = list.reduce(function(soma,e){ return soma + e.value; }, 0);
      chips = '<div class="pessoa-chips">'
        + '<button type="button" class="pessoa-chip'+(sel.length === 0 ? ' is-on' : '')+'"'
          + ' data-action="card-pessoa" data-scope="'+escapeHTML(escopo)+'" data-pessoa="">'
          + 'Todos <b>'+formatBRL(totalGeral)+'</b></button>'
        + pessoas.map(function(m){
            var meu = list.filter(function(e){ return e.person === m.id; })
                          .reduce(function(soma,e){ return soma + e.value; }, 0);
            var ligado = sel.indexOf(m.id) !== -1;
            return '<button type="button" class="pessoa-chip'+(ligado ? ' is-on' : '')+'"'
              + ' style="--cor-pessoa:'+m.color+';"'
              + ' data-action="card-pessoa" data-scope="'+escapeHTML(escopo)+'" data-pessoa="'+escapeHTML(m.id)+'">'
              + '<span class="pessoa-ponto" style="background:'+m.color+';"></span>'
              + escapeHTML(m.name) + ' <b>'+formatBRL(meu)+'</b></button>';
          }).join('')
        + '<button type="button" class="pessoa-chip chip-modo'+(separado ? ' is-on' : '')+'"'
          + ' data-action="card-separado" data-scope="'+escapeHTML(escopo)+'"'
          + ' title="Mostra a lista de cartões de cada pessoa em separado">'
          + (separado ? '◫ Junto' : '⇅ Ver separado') + '</button>'
        + '</div>';
    }

    var corpo;
    if (separado && temEscolha){
      // Uma lista por pessoa: cada um enxerga o próprio cartão sem o do outro
      // no meio. O escopo leva o id da pessoa pra abrir um cartão de cada vez.
      var quais = sel.length ? pessoas.filter(function(p){ return sel.indexOf(p.id) !== -1; }) : pessoas;
      corpo = quais.map(function(m){
        var meus = list.filter(function(e){ return e.person === m.id; });
        var meuTotal = meus.reduce(function(soma,e){ return soma + e.value; }, 0);
        return '<div class="pessoa-bloco" style="--cor-pessoa:'+m.color+';">'
          + '<div class="pessoa-bloco-topo">'
            + '<span class="pessoa-bloco-nome"><span class="pessoa-ponto" style="background:'+m.color+';"></span>'+escapeHTML(m.name)+'</span>'
            + '<span class="pessoa-bloco-total">'+formatBRL(meuTotal)+'</span>'
          + '</div>'
          + listaCartoesHTML(meus, escopo + '::' + m.id)
          + '</div>';
      }).join('');
    } else {
      corpo = listaCartoesHTML(filtrada, escopo);
    }

    var semCartao = groupByCard(filtrada).every(function(g){ return g.card === CARTAO_OUTRO; });
    return chips + corpo
      + (semCartao
          ? '<div class="trend-legend">Nenhuma conta deste mês foi marcada com cartão. Ao lançar, escolha <b>Crédito</b> ou <b>Débito</b> e diga qual cartão — aí cada um vira uma linha aqui.</div>'
          : '<div class="trend-legend">Toque num cartão pra abrir o que foi débito, crédito à vista e parcelado nele.'
            + (temEscolha ? ' Toque num nome pra ver só os cartões daquela pessoa.' : '') + '</div>');
  }

  // Gráfico de barras por mês. É usado em dois lugares — nas contas do casal
  // (Resumo) e nos gastos pessoais de cada pessoa — então recebe a linha do
  // tempo pronta e a ação de clique, em vez de buscar os dados sozinho.
  // Tocar numa barra filtra a tela naquele mês.
  function monthlyTrendHTML(mesSelecionado, timeline, acaoClique){
    timeline = timeline || buildCasalMonthsTimeline();
    acaoClique = acaoClique || 'pick-month';
    if (!timeline.length) return '<div class="empty-state">Sem histórico ainda — ele aparece aqui depois do primeiro lançamento.</div>';

    var atual = currentMonthKey();
    var curIdx = -1;
    for (var i = 0; i < timeline.length; i++){ if (timeline[i].key <= atual) curIdx = i; }
    if (curIdx < 0) curIdx = 0;
    // Até 2 meses à frente: as parcelas e contas fixas já contratadas fazem
    // parte do quadro mesmo antes de a data chegar.
    var endIdx = Math.min(timeline.length - 1, curIdx + 2);
    var slice = timeline.slice(Math.max(0, endIdx - 5), endIdx + 1);
    var temFuturo = slice.some(function(g){ return g.key > atual; });

    var max = slice.reduce(function(m,g){ return Math.max(m, g.total); }, 0) || 1;
    var maxIdx = slice.reduce(function(bi,g,ix){ return g.total > slice[bi].total ? ix : bi; }, 0);

    var barras = slice.map(function(g, ix){
      var isCurrent = g.key === atual;
      var isFuture = g.key > atual;
      // Aceso = o mês que a tela está mostrando. Com o filtro em "todos os
      // meses", o mês atual fica aceso como referência.
      var isSelected = (mesSelecionado && mesSelecionado !== 'all') ? (g.key === mesSelecionado) : isCurrent;
      // Altura mínima de 3% pra um mês de valor baixo não sumir e virar uma
      // barra invisível que ninguém consegue clicar.
      var alt = Math.max(3, g.total / max * 100);
      // Todo mês mostra o valor. O do mês aberto vem aceso; os outros ficam
      // apagados, do mesmo jeito que as barras — dá pra comparar os números de
      // relance sem que eles briguem com a leitura do mês selecionado.
      var rotulo = formatChartLabel(g.total);
      var classes = 'trend-bar' + (isSelected ? ' is-selected' : '') + (isCurrent ? ' is-current' : '') + (isFuture ? ' is-future' : '')
        + (ix === maxIdx ? ' is-max' : '');
      return '<button type="button" class="'+classes+'" data-action="'+acaoClique+'" data-month="'+g.key+'"'
        + ' title="'+escapeHTML(monthLabelFromKey(g.key))+' — '+formatBRL(g.total)+(isFuture ? ' (previsto)' : '')+'. Toque pra ver só este mês.">'
        + '<span class="trend-cap">'+escapeHTML(rotulo)+'</span>'
        + '<span class="trend-plot"><span class="trend-mark" style="height:'+alt.toFixed(1)+'%;"></span></span>'
        + '<span class="trend-month">'+escapeHTML(shortMonthFromKey(g.key))+'</span>'
        + '</button>';
    }).join('');

    // Barras em HTML, não em SVG: um SVG esticado até a largura da caixa
    // engorda as barras e deforma o texto. Com flexbox a proporção fica igual
    // no celular e num monitor largo.
    return '<div class="trend-chart">' + barras + '</div>'
      + '<div class="trend-legend">Valores em reais. Toque numa barra pra ver só aquele mês.'
        + (temFuturo ? ' Barra mais fraca = mês que ainda não chegou (parcelas e contas fixas já comprometidas).' : '')
      + '</div>';
  }

  function shortMonthFromKey(key){
    var parts = String(key).split('-');
    var idx = Number(parts[1]) - 1;
    var name = MONTH_NAMES_PT[idx] || parts[1];
    return name.slice(0,3) + '/' + String(parts[0]).slice(2);
  }

  // Valores curtos pros rótulos do gráfico (R$ 1,2 mil não estoura a barra).
  function formatCompactBRL(v){
    v = Number(v) || 0;
    if (v >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil';
    return formatBRL(v);
  }

  // Agora TODA barra do gráfico mostra o valor, e num celular seis barras
  // dividem menos de 50px cada. Por isso o rótulo do gráfico é ainda mais
  // curto que o formatCompactBRL: sem "R$" (a legenda embaixo já diz que é
  // dinheiro) e sem centavos. "7,8 mil" cabe; "R$ 7.812,40" não caberia.
  function formatChartLabel(v){
    v = Number(v) || 0;
    if (v >= 1000) return (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil';
    return Math.round(v).toLocaleString('pt-BR');
  }

  function renderResumo(){
    var months = resumoAvailableMonths();
    var month = state.resumoMonth || defaultMonthKey(months);
    if (month !== 'all' && months.indexOf(month) === -1) month = defaultMonthKey(months);
    state.resumoMonth = month;
    var res = computeSettlement(month);
    var heroHTML;
    if (res.totalCasal === 0){
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div><div class="amount settled">Nenhum gasto do casal registrado ainda</div></div>';
    } else if (res.transfers.length === 0){
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div><div class="amount settled">Tudo certo — cada um pagou sua parte ✓</div></div>';
    } else {
      var rows = res.transfers.map(function(t){
        return '<div class="transfer-row"><span class="direction">'+escapeHTML(t.from)+' → '+escapeHTML(t.to)+'</span><span class="amount'+(res.transfers.length===1?' single':'')+'">'+formatBRL(t.amount)+'</span></div>';
      }).join('');
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div>' + rows + '</div>';
    }

    var maxVal = Math.max.apply(null, res.balances.map(function(b){ return b.spent; }).concat([1]));
    var compareHTML = '<div class="compare">' + res.balances.map(function(b){
      return '<div class="compare-row"><div class="top"><span class="who" style="color:'+b.color+';text-shadow:0 0 14px '+hexToRgba(b.color,0.6)+';">'+escapeHTML(b.name)+'</span><span class="val">'+formatBRL(b.spent)+'</span></div><div class="track"><div class="fill" style="width:'+(b.spent/maxVal*100)+'%;background:'+b.color+';box-shadow:0 0 10px '+hexToRgba(b.color,0.75)+';"></div></div></div>';
    }).join('') + '</div>';

    var casalList = expensesFor(month).filter(function(e){ return e.type==='casal'; });
    var byCat = groupByCategory(casalList);

    // Quanto do mês já está preso em conta fixa — o número que diz o quanto da
    // renda de vocês está comprometido antes mesmo do mês começar.
    var totalFixo = casalList.reduce(function(s,e){ return s + (e.fixed ? e.value : 0); }, 0);

    // Média mensal das contas do casal, considerando só meses já fechados ou
    // em andamento (mês futuro ainda incompleto puxaria a média pra baixo).
    var mesesFechados = expenseMonthSpan().filter(function(mk){ return mk <= currentMonthKey(); });
    var somaGeral = 0;
    mesesFechados.forEach(function(mk){
      materializedForMonth(mk).forEach(function(e){
        if (e.type === 'casal') somaGeral += casalCalc(e).paidValue;
      });
    });
    var media = mesesFechados.length ? (somaGeral / mesesFechados.length) : 0;

    var futuro = futureCommitment();
    var toolbarHTML = monthBarHTML('resumo-month', month, months, null, true);

    // Os quatro indicadores são todos sobre as contas do casal — gasto pessoal
    // saiu daqui e vive na aba de cada pessoa, que é de quem ele é.
    // Cada um tem cor fixa, sempre a mesma, pra virar atalho de leitura.
    var pctFixo = res.totalCasal > 0 ? Math.round(totalFixo / res.totalCasal * 100) : 0;
    var kpiHTML = '<div class="kpi-row">'
      + kpiTileHTML('Contas do casal', formatBRL(res.totalCasal), byCat.length + (byCat.length === 1 ? ' categoria' : ' categorias'), 'acc-cyan')
      + kpiTileHTML('Contas fixas', formatBRL(totalFixo), pctFixo + '% do mês já é fixo', 'acc-green')
      + kpiTileHTML('Média por mês', formatBRL(media), mesesFechados.length + (mesesFechados.length === 1 ? ' mês de histórico' : ' meses de histórico'), 'acc-purple')
      + futureTileHTML(futuro)
      + '</div>';

    return ''
      + toolbarHTML
      + kpiHTML
      + metasBlockHTML(month)
      // As colunas são divs de verdade (não áreas de grid) porque o grid
      // dimensiona a linha pelo bloco mais alto e abre buracos no meio quando
      // os blocos têm alturas diferentes — que é exatamente o caso aqui.
      // Colunas empilham o conteúdo coladinho, sem vão.
      + '<div class="resumo-grid">'
        + '<div class="resumo-col resumo-col-a">'
          + '<section class="resumo-block rb-acerto">' + heroHTML + '</section>'
          + '<section class="resumo-block neon-box acc-blue rb-compare"><div class="section-title">👥 Quem pagou quanto</div>' + compareHTML + '</section>'
        + '</div>'
        + '<div class="resumo-col resumo-col-b">'
          + '<section class="resumo-block neon-box acc-cyan rb-trend"><div class="section-title">📈 Contas do casal por mês</div>' + monthlyTrendHTML(month) + '</section>'
        + '</div>'
        + '<div class="resumo-col resumo-col-c">'
          // Cartões e categorias são as duas leituras "largas" do mês, então
          // ficam na faixa que ocupa a tela inteira — barra comprida é o que
          // deixa comparar valor de relance.
          + '<section class="resumo-block neon-box acc-amber rb-cartoes"><div class="section-title">💳 Contas por cartão</div>' + cardsPanelHTML(casalList, 'resumo') + '</section>'
          + '<section class="resumo-block neon-box acc-green rb-cats"><div class="section-title">🧾 Contas do casal por categoria</div>' + categoryBarsHTML(byCat) + '</section>'
        + '</div>'
      + '</div>';
  }

  /* ---------- Aba Meses: anos → meses → detalhe ---------- */

  function renderMesesYearsHTML(years){
    var maxTotal = Math.max.apply(null, years.map(function(y){ return y.total; }).concat([1]));
    var cardsHTML = years.map(function(y){
      var pct = Math.max(4, Math.round(y.total / maxTotal * 100));
      var anoAgora = new Date().getFullYear();
      var tag = y.hasCurrent
        ? '<span class="month-tag current">Ano atual</span>'
        : (y.year > anoAgora ? '<span class="month-tag future">Previsto</span>' : '');
      return ''
        + '<button type="button" class="year-card" data-action="select-meses-year" data-year="'+y.year+'">'
        + '<div class="year-card-top"><span class="year-label">📅 '+y.year+tag+'</span><span class="year-total">'+formatBRL(y.total)+'</span></div>'
        + '<div class="year-bar-track"><div class="year-bar-fill" style="width:'+pct+'%;"></div></div>'
        + '<div class="year-card-meta">'+y.months.length+(y.months.length===1?' mês com gastos':' meses com gastos')+'<span class="cat-click-hint">›</span></div>'
        + '</button>';
    }).join('');
    return ''
      + '<div class="section-title">Contas do casal por ano</div>'
      + '<div class="meses-hint">Toque num ano pra ver o gasto mês a mês.</div>'
      + '<div class="years-list">' + cardsHTML + '</div>';
  }

  function renderMesesMonthsHTML(yearGroup){
    var byMonthIdx = {};
    yearGroup.months.forEach(function(g){ byMonthIdx[g.month] = g; });
    var maxTotal = Math.max.apply(null, yearGroup.months.map(function(g){ return g.total; }).concat([1]));
    var cellsHTML = '';
    for (var i = 0; i < 12; i++){
      var g = byMonthIdx[i];
      if (!g){
        cellsHTML += '<div class="month-cell empty-cell"><span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+'</span><span class="mc-value">—</span></div>';
        continue;
      }
      var pct = Math.max(6, Math.round(g.total / maxTotal * 100));
      var cls = 'month-cell' + (g.isCurrent ? ' current' : '') + (g.isFuture ? ' future' : '');
      cellsHTML += ''
        + '<button type="button" class="'+cls+'" data-action="select-meses-month" data-month="'+g.key+'">'
        + '<span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+(g.isCurrent ? ' •' : '')+'</span>'
        + '<span class="mc-bar-track"><span class="mc-bar-fill" style="width:'+pct+'%;"></span></span>'
        + '<span class="mc-value">'+formatBRL(g.total)+'</span>'
        + (g.isFuture ? '<span class="mc-future-tag">previsto</span>' : '')
        + '</button>';
    }
    return ''
      + '<div class="section-title-row"><button type="button" class="back-btn" data-action="meses-back-years">‹ Anos</button></div>'
      + '<div class="year-total-hero">📅 <strong>'+yearGroup.year+'</strong> · total do ano: <strong>'+formatBRL(yearGroup.total)+'</strong></div>'
      + '<div class="meses-hint">Toque num mês pra ver os lançamentos.</div>'
      + '<div class="months-grid">' + cellsHTML + '</div>';
  }

  function renderMesesMonthDetailHTML(g){
    var label = MONTH_NAMES_PT[g.month] + '/' + g.year;
    var tag = g.isCurrent ? '<span class="month-tag current">Este mês</span>' : (g.isFuture ? '<span class="month-tag future">Previsto</span>' : '');
    var rows = g.items.map(function(it){
      var badge = it.installmentLabel
        ? ('<span class="installment-badge">'+(it.paid?'✅':'⏳')+' Parcela '+it.installmentLabel+'</span>')
        : '';
      return ''
        + '<div class="entry month-item'+(it.paid?'':' pending-item')+'">'
        + catChipHTML(it.category, 34)
        + '<div class="info"><div class="desc">'+escapeHTML(it.description)+'</div><div class="date">'+escapeHTML(it.category)+(badge?(' · '+badge):'')+'</div></div>'
        + '<div class="value">'+formatBRL(it.value)+'</div>'
        + '</div>';
    }).join('');
    return ''
      + '<div class="section-title-row"><button type="button" class="back-btn" data-action="meses-back-months" data-year="'+g.year+'">‹ '+g.year+'</button></div>'
      + '<div class="cat-group month-group'+(g.isCurrent?' current-month':'')+(g.isFuture?' future-month':'')+'">'
      + '<div class="cat-head"><span class="name">📅 '+label+tag+'</span><span class="total">'+formatBRL(g.total)+'</span></div>'
      + rows
      + '</div>'
      + '<div class="note">Compras parceladas aparecem aqui em cada mês até a última parcela. Esse valor é só organizacional — o acerto da casa (aba Resumo) conta apenas as parcelas já marcadas como pagas.</div>';
  }

  /* ---------- Aba Contas fixas ----------
     Junta num lugar só tudo que se repete todo mês: as contas da casa e os
     fixos pessoais de cada um. É a resposta pra "quanto da nossa renda já
     está comprometido antes do mês começar". */

  // Formulário curto pra cadastrar uma conta da casa direto nesta aba: só o
  // essencial de um gasto fixo (o quê, quanto, quem paga e desde quando).
  // Selo do gasto fixo. Com prazo, ele diz quanto falta — que é o que a
  // pessoa quer saber ao bater o olho numa conta que vai acabar.
  function seloFixoHTML(e){
    var fim = fixedEndMonth(e);
    if (!fim) return '<span class="fixed-tag">🔁 fixo</span>';
    var faltam = fixedMesesRestantes(e);
    var texto = faltam === 0 ? 'terminou'
      : (faltam === 1 ? 'último mês' : 'faltam ' + faltam);
    return '<span class="fixed-tag' + (faltam === 0 ? ' fixo-fim' : '') + '">🔁 fixo · ' + escapeHTML(texto) + '</span>';
  }

  function fixaFormHTML(){
    var cat = categorySelectHTML(null);
    var opcoesPessoa = state.settings.members.map(function(m){
      return '<option value="'+escapeHTML(m.id)+'">'+escapeHTML(m.name)+'</option>';
    }).join('');
    return ''
      + '<form class="add-form" id="fixa-form">'
      + '<div class="form-col acc-cyan">'
        + '<div class="form-col-title">Nova conta fixa da casa</div>'
        + '<div class="field"><label>Categoria</label>' + cat.html + '</div>'
        + '<div class="field custom-cat-field" style="display:none;"><label>Nome da categoria</label><input type="text" class="custom-category-input" placeholder="Ex: Condomínio, Streaming..."></div>'
        + '<div class="field"><label>Descrição</label><input type="text" class="description-input" placeholder="Ex: Aluguel, Internet, Seguro do carro"></div>'
        + '<div class="row2">'
          + '<div class="field"><label>Valor por mês (R$)</label><input type="number" inputmode="decimal" class="value-input" step="0.01" min="0" placeholder="0,00"></div>'
          + '<div class="field"><label>Quem paga</label><select class="fixa-person-select">'+opcoesPessoa+'</select></div>'
        + '</div>'
        + '<div class="field"><label>A partir de quando</label><input type="date" class="date-input" value="'+todayISO()+'">'
          + '<div class="items-hint" style="margin:6px 0 0;">A conta passa a aparecer deste mês em diante. Se ela já vem sendo paga há um tempo, coloque a data do primeiro mês.</div></div>'
        + prazoFixoHTML(null, true, true)
      + '</div>'
      + '<div class="form-submit-area"><button type="submit" class="submit-btn" style="background:var(--neon2);color:#06222c;">Adicionar conta fixa</button></div>'
      + '</form>';
  }

  // Na aba Contas Fixas o prazo aparece por extenso: a pessoa está justamente
  // olhando quanto ainda vai sair todo mês.
  function prazoNaListaHTML(e){
    var fim = fixedEndMonth(e);
    if (!fim) return '';
    var faltam = fixedMesesRestantes(e);
    var quanto = faltam === 0 ? 'já terminou'
      : (faltam === 1 ? 'este é o último mês' : 'faltam ' + faltam + ' meses');
    return ' · <span class="prazo-selo' + (faltam === 0 ? ' prazo-fim' : '') + '">até '
      + escapeHTML(monthLabelFromKey(fim)) + ' · ' + quanto + '</span>';
  }

  /* Quanto as contas fixas realmente somam nos próximos 12 meses. Multiplicar
     o mês por 12 mentia assim que uma delas tinha prazo: o financiamento que
     acaba em outubro aparecia inteiro no ano. Aqui cada mês é somado com as
     contas que estiverem valendo nele. */
  function totalDoze(fixos){
    var total = 0;
    for (var i = 0; i < 12; i++){
      var mk = monthKeyAdd(currentMonthKey(), i);
      fixos.forEach(function(e){
        var inicio = monthKeyFromDate(e.date);
        if (mk < inicio) return;
        var fim = fixedEndMonth(e);
        if (fim && mk > fim) return;
        total += e.value;
      });
    }
    return total;
  }

  function renderFixasTab(){
    var fixos = state.expenses.filter(function(e){ return e.fixed; });
    if (!fixos.length){
      return fixaFormHTML()
        + '<div class="empty-state">Nenhuma conta fixa ainda. Cadastre a primeira aí em cima — aluguel, internet, seguro, condomínio.<br><br>Ela passa a aparecer sozinha em todos os meses, e você nunca mais digita a mesma conta duas vezes.</div>';
    }

    var daCasa = fixos.filter(function(e){ return e.type === 'casal'; });
    var totalCasa = daCasa.reduce(function(s,e){ return s + e.value; }, 0);

    // Quanto cada pessoa banca das contas fixas da casa.
    var porPessoa = state.settings.members.map(function(m){
      var v = daCasa.filter(function(e){ return e.person === m.id; })
                    .reduce(function(s,e){ return s + e.value; }, 0);
      return {nome:m.name, cor:m.color, valor:v};
    }).filter(function(p){ return p.valor > 0; });

    var totalPessoais = fixos.filter(function(e){ return e.type === 'pessoal'; })
                             .reduce(function(s,e){ return s + e.value; }, 0);

    var temPrazo = fixos.some(function(e){ return !!fixedEndMonth(e); });

    var cartoes = '<div class="kpi-row">'
      + kpiTileHTML('Fixas da casa', formatBRL(totalCasa), daCasa.length + (daCasa.length === 1 ? ' conta por mês' : ' contas por mês'), 'acc-cyan')
      + kpiTileHTML('Fixas pessoais', formatBRL(totalPessoais), 'Fora da divisão', 'acc-purple')
      + kpiTileHTML('Total por mês', formatBRL(totalCasa + totalPessoais), 'Sai todo mês, sem falta', 'acc-amber')
      + kpiTileHTML('Próximos 12 meses', formatBRL(totalDoze(fixos)),
          temPrazo ? 'Já descontando o que acaba' : 'Se nada mudar', 'acc-green')
      + '</div>';

    var quemPaga = porPessoa.length
      ? '<section class="resumo-block neon-box acc-blue" style="margin-bottom:16px;">'
        + '<div class="section-title">👥 Quem banca as fixas da casa</div>'
        + porPessoa.map(function(p){
            var pct = totalCasa > 0 ? Math.round(p.valor / totalCasa * 100) : 0;
            return '<div class="cat-bar-row" style="cursor:default;">'
              + '<span class="cat-bar-head"><span class="cat-bar-name"><span class="cat-bar-label" style="color:'+p.cor+';">'+escapeHTML(p.nome)+'</span></span>'
              + '<span class="cat-bar-val">'+formatBRL(p.valor)+'<span class="cat-bar-share">'+pct+'%</span></span></span>'
              + '<span class="cat-bar-track"><span class="cat-bar-fill" style="width:'+pct+'%;background:'+p.cor+';box-shadow:0 0 10px '+hexToRgba(p.cor,0.75)+';"></span></span>'
              + '</div>';
          }).join('')
        + '</section>'
      : '';

    function listaFixos(itens, titulo, accent){
      if (!itens.length) return '';
      var total = itens.reduce(function(s,e){ return s + e.value; }, 0);
      var linhas = itens.slice().sort(function(a,b){ return b.value - a.value; }).map(function(e){
        var dono = memberById(e.person);
        return '<div class="entry">'
          + '<div class="thumb-placeholder" style="background:'+hexToRgba(catColor(e.category),0.15)+';color:'+catColor(e.category)+';">'+catIcon(e.category)+'</div>'
          + '<div class="info"><div class="desc">'+escapeHTML(e.description)+'</div>'
            + '<div class="date">'+escapeHTML(e.category)+' · paga por '+escapeHTML(dono ? dono.name : '?')
            + ' · desde '+escapeHTML(monthLabelFromKey(monthKeyFromDate(e.date)))
            + prazoNaListaHTML(e)+'</div></div>'
          + '<div class="value">'+formatBRL(e.value)+'</div>'
          + '<button class="edit" data-action="edit-fixed" data-id="'+e.id+'" data-person="'+escapeHTML(e.person)+'" data-type="'+e.type+'">✏️</button>'
          + '<button class="del" data-action="delete-expense" data-id="'+e.id+'">🗑️</button>'
          + '</div>';
      }).join('');
      return '<section class="resumo-block neon-box '+accent+'" style="margin-bottom:16px;">'
        + '<div class="section-title">'+titulo+' <span style="margin-left:auto;font-weight:700;color:var(--ink);">'+formatBRL(total)+'</span></div>'
        + linhas + '</section>';
    }

    var pessoaisHTML = state.settings.members.map(function(m){
      var meus = fixos.filter(function(e){ return e.type === 'pessoal' && e.person === m.id; });
      return listaFixos(meus, '👤 Fixas de ' + escapeHTML(m.name), 'acc-purple');
    }).join('');

    return cartoes
      + '<div class="meses-hint" style="margin:14px 0 12px;">Estas contas aparecem sozinhas em todos os meses. Editar aqui muda o valor em todos eles; excluir tira de todos, inclusive dos meses que já passaram.</div>'
      + fixaFormHTML()
      + quemPaga
      + listaFixos(daCasa, '🏠 Fixas da casa', 'acc-cyan')
      + pessoaisHTML;
  }

  function renderMesesTab(){
    var years = buildCasalYearsTimeline();
    if (!years.length){
      return '<div class="empty-state">Nenhuma conta do casal registrada ainda. Assim que vocês lançarem uma compra — à vista ou parcelada — ela aparece aqui organizada por ano e mês.</div>';
    }
    var view = state.mesesView || {mode:'years'};

    if (view.mode === 'month'){
      var yg = years.find(function(y){ return y.year === view.year; });
      var g = yg && yg.months.find(function(m){ return m.key === view.month; });
      if (g) return renderMesesMonthDetailHTML(g);
      state.mesesView = {mode:'years'};
    } else if (view.mode === 'months'){
      var yg2 = years.find(function(y){ return y.year === view.year; });
      if (yg2) return renderMesesMonthsHTML(yg2);
      state.mesesView = {mode:'years'};
    }

    return renderMesesYearsHTML(years);
  }

  function render(){
    renderTabBar();
    updateHeaderText();
    // As cores das categorias personalizadas dependem de quais existem, então
    // são recalculadas quando a lista de gastos pode ter mudado.
    invalidateCustomColors();
    // Só o Resumo usa a largura toda da tela; o resto continua numa coluna
    // estreita, que é mais confortável de ler e de preencher.
    contentEl.classList.toggle('wide', state.currentTab === 'resumo');
    if (state.currentTab === 'resumo') contentEl.innerHTML = renderResumo();
    else if (state.currentTab === 'meses') contentEl.innerHTML = renderMesesTab();
    else if (state.currentTab === 'fixas') contentEl.innerHTML = renderFixasTab();
    else contentEl.innerHTML = renderMemberTab(state.currentTab);
    // Se o formulário renderizado já tem itens (ex: editando uma conta com
    // itens salvos), mostra o total dos itens desde já, não só depois de mexer.
    var itemsListEl = contentEl.querySelector('form .items-list');
    if (itemsListEl && itemsListEl.querySelectorAll('.item-row').length){
      recalcItemsTotal(itemsListEl.closest('form'));
    }
  }

      ? 'Recarregar os dados de exemplo? Os de exemplo que já estão aí serão trocados pelos novos. Seus lançamentos de verdade não são tocados.'
      : 'Carregar 3 meses de lançamentos de exemplo (agosto, setembro e outubro de 2026)? Seus lançamentos de verdade continuam onde estão.';
    if (!confirm(msg)) return;
    var reais = state.expenses.filter(function(e){ return !e.demo; });
    var novos = reais.concat(demoExpenseSeed());
    var ok = await saveExpenses(novos);
    if (!ok){ alert('Não foi possível salvar os dados de exemplo.'); return; }
    markDemoHandled();
    state.expenses = novos;
    state.resumoMonth = null;   // volta pro mês atual, o padrão do app
    state.entriesMonth = {};
    closeSettingsModal();
    render();
  }

  async function removeDemoData(){
    var reais = state.expenses.filter(function(e){ return !e.demo; });
    if (reais.length === state.expenses.length){ alert('Não há dados de exemplo carregados.'); return; }
    if (!confirm('Remover só os lançamentos de exemplo? Os seus continuam.')) return;
    var ok = await saveExpenses(reais);
    if (!ok){ alert('Não foi possível remover os dados de exemplo.'); return; }
    markDemoHandled();
    state.expenses = reais;
    closeSettingsModal();
    render();
  }

  // Situação de um acesso, num rótulo só — é por ela que o filtro trabalha.
  function situacaoLicenca(l){
    var t = tempoAte(l.expira_em);
    if (!l.ativa) return 'desligado';
    if (t && t.vencido) return 'vencido';
    return l.usada_por ? 'usado' : 'livre';
  }

  // Número + unidade. É o mesmo controle no formulário de gerar e no de
  // editar, pra "6 horas" e "3 meses" serem escritos do mesmo jeito nos dois.
  function duracaoControlHTML(prefixo, horas){
    var u = melhorUnidade(horas == null ? 7*DIA : horas);
    var unidades = [['horas','horas'], ['dias','dias'], ['meses','meses']];
    return '<div class="lic-prazo-linha">'
      + '<input type="number" min="1" step="1" inputmode="numeric" id="'+prefixo+'-prazo-valor" value="'+u.valor+'">'
      + '<select id="'+prefixo+'-prazo-unidade">'
        + unidades.map(function(x){
            return '<option value="'+x[0]+'"'+(x[0]===u.unidade?' selected':'')+'>'+x[1]+'</option>';
          }).join('')
      + '</select></div>';

  function lerDuracao(raiz, prefixo){
    var v = raiz.querySelector('#'+prefixo+'-prazo-valor');
    var un = raiz.querySelector('#'+prefixo+'-prazo-unidade');
    if (!v || !un) return null;
    var horas = paraHoras(v.value, un.value);
    return horas > 0 ? horas : null;
  }

  async function renderListaLicencas(){

  // Filtra em cima do que já foi baixado: mexer no filtro não faz ida e volta
  // ao servidor nem pisca a lista.
  function pintarListaLicencas(){
    var alvo = settingsPanelEl.querySelector('#lic-lista');
    var caixaFiltros = settingsPanelEl.querySelector('#lic-filtros');
    if (!alvo || !licencasCache) return;

    var todas = licencasCache;
    if (!todas.length){
      if (caixaFiltros) caixaFiltros.style.display = 'none';
      alvo.innerHTML = '<div class="note">Nenhum link gerado ainda.</div>';
      return;
    }
    // Menos de 4 acessos não precisam de filtro nenhum.
    if (caixaFiltros) caixaFiltros.style.display = todas.length >= 4 ? 'block' : 'none';

    var busca = (licFiltro.busca || '').trim().toLowerCase();
    var lista = todas.filter(function(l){
      if (licFiltro.plano && l.plano !== licFiltro.plano) return false;
      if (licFiltro.status && situacaoLicenca(l) !== licFiltro.status) return false;
      if (busca){
        var alvoTexto = ((l.observacao || '') + ' ' + (l.codigo || '')).toLowerCase();
        if (alvoTexto.indexOf(busca) === -1) return false;
      }
      return true;
    });

    var contagem = settingsPanelEl.querySelector('#lic-contagem');
    if (contagem){
      var filtrando = busca || licFiltro.plano || licFiltro.status;
      contagem.innerHTML = filtrando
        ? '<b>' + lista.length + '</b> de ' + todas.length + ' acessos'
          + ' <button type="button" class="lic-limpar" data-action="limpar-filtro-lic">limpar filtro</button>'
        : todas.length + ' acessos gerados';
    }

    alvo.innerHTML = lista.length
      ? lista.map(licencaRowHTML).join('')
      : '<div class="note">Nenhum acesso bate com esse filtro.</div>';
  }

  function licencaRowHTML(l){
    var usada = !!l.usada_por;
    var plano = planoInfo(l.plano);
    var t = tempoAte(l.expira_em);
    var vencida = !!(t && t.vencido);

    // Um link vencido não é a mesma coisa que um link desligado por você:
    // um a pessoa resolve pagando, o outro foi decisão sua.
    var estado = !l.ativa ? 'desligado' : (vencida ? 'vencido' : (usada ? 'usado' : 'livre'));
    var rotulo = !l.ativa ? 'Desligado' : (vencida ? 'Vencido' : (usada ? 'Em uso' : 'Disponível'));
    var quando = l.usada_em ? formatDateBR(String(l.usada_em).slice(0,10)) : '';

    var prazo;
    if (!usada){
      prazo = l.plano === 'vitalicio'
        ? 'Ainda não usado · não vence'
        : 'Ainda não usado · ' + formatDuracao(l.duracao_horas) + ' começam quando a pessoa se cadastrar';
    } else if (l.plano === 'vitalicio'){
      prazo = 'Ativado em ' + quando + ' · não vence';
    } else if (vencida){
      prazo = 'Venceu em ' + formatVencimento(l.expira_em) + ' (' + t.texto + ')';
    } else {
      prazo = 'Vence em ' + formatVencimento(l.expira_em) + ' · ' + t.texto;
    }

    var podeRenovar = usada && l.plano !== 'vitalicio';
    var editando = (licencaEditando === l.codigo);

    return '<div class="lic-row lic-' + estado + (editando ? ' lic-editando' : '') + '">'
      + '<div class="lic-topo">'
        + '<span class="lic-codigo">' + escapeHTML(l.codigo) + '</span>'
        + '<span class="lic-tag">' + rotulo + '</span>'
      + '</div>'
      + '<div class="lic-plano">' + plano.icone + ' ' + escapeHTML(plano.curto)
        + (l.duracao_horas ? ' · ' + escapeHTML(formatDuracao(l.duracao_horas)) : '') + '</div>'
      + (l.observacao ? '<div class="lic-obs">' + escapeHTML(l.observacao) + '</div>' : '')
      + '<div class="lic-meta">' + escapeHTML(prazo) + '</div>'
      + (editando ? licencaEditorHTML(l) : ''
          + '<div class="lic-acoes">'
            + (usada ? '' : '<button type="button" class="secondary-btn lic-btn" data-action="copiar-link" data-codigo="' + escapeHTML(l.codigo) + '">Copiar link</button>')
            + '<button type="button" class="secondary-btn lic-btn lic-btn-editar" data-action="editar-licenca" data-codigo="' + escapeHTML(l.codigo) + '">Editar</button>'
            + (podeRenovar ? '<button type="button" class="secondary-btn lic-btn lic-btn-renovar" data-action="renovar-licenca" data-codigo="' + escapeHTML(l.codigo) + '" data-horas="' + (l.duracao_horas || 30*DIA) + '">Renovar +' + escapeHTML(formatDuracao(l.duracao_horas || 30*DIA)) + '</button>' : '')
            + '<button type="button" class="secondary-btn lic-btn" data-action="alternar-licenca" data-codigo="' + escapeHTML(l.codigo) + '" data-ativa="' + (l.ativa ? '1' : '0') + '">'
              + (l.ativa ? 'Desligar acesso' : 'Religar acesso') + '</button>'
          + '</div>')
      + '</div>';
  }

  async function acaoGerarLicenca(){
    var b = settingsPanelEl.querySelector('#btn-gerar-licenca');
    var obs = settingsPanelEl.querySelector('#lic-obs');
    var selPlano = settingsPanelEl.querySelector('#lic-plano');
    var plano = selPlano ? selPlano.value : 'vitalicio';
    var horas = plano === 'vitalicio' ? null : lerDuracao(settingsPanelEl, 'lic');
    if (plano !== 'vitalicio' && !horas){ alert('Informe um prazo maior que zero.'); return; }
    b.disabled = true; b.textContent = 'Gerando...';
    try {
      var codigo = await gerarLicenca(obs ? obs.value : null, plano, horas);
      var link = baseDoSite() + '?convite=' + codigo;
      var info = planoInfo(plano);
      var descricao;
      if (plano === 'vitalicio') descricao = 'acesso vitalício';
      else if (plano === 'teste') descricao = 'teste de ' + formatDuracao(horas);
      else if (plano === 'mensal') descricao = 'mensalidade de ' + formatDuracao(horas);
      else descricao = 'acesso de ' + formatDuracao(horas);

  async function acaoSalvarLicenca(codigo){
    var raiz = settingsPanelEl;
    var plano = (raiz.querySelector('#lic-edit-plano') || {}).value || null;
    var horas = plano === 'vitalicio' ? null : lerDuracao(raiz, 'lic-edit');
    var obs = (raiz.querySelector('#lic-edit-obs') || {}).value || null;
    if (plano && plano !== 'vitalicio' && !horas){ alert('Informe um prazo maior que zero.'); return; }
    var b = raiz.querySelector('[data-action="salvar-licenca"]');
    if (b){ b.disabled = true; b.textContent = 'Salvando...'; }
    try {
      var r = await editarLicenca(codigo, plano, horas, obs);
      licencaEditando = null;
      licencasCache = null;
      await renderListaLicencas();
      if (r && r.expira_em){
        alert('Pronto. Agora vence em ' + formatVencimento(r.expira_em) + '.');
      } else if (plano === 'vitalicio'){
        alert('Pronto. Esse acesso agora é vitalício — não vence mais.');
      }
    } catch(e){
      alert('Não deu certo: ' + (e.message || ''));
      if (b){ b.disabled = false; b.textContent = 'Salvar'; }
    }
  }

  async function alternarLicenca(codigo, estavaAtiva){
    var texto = estavaAtiva
      ? 'Desligar este acesso? A casa que usa este link para de ver os dados na hora. Nada é apagado — religando, volta tudo.'

  /* ---------- Backup: exportar e importar ----------
     Sem isso, limpar os dados do navegador (ou trocar de celular) apagava
     tudo sem volta. O arquivo gerado leva os gastos, as configurações E os
     comprovantes, então serve tanto de cópia de segurança quanto de mudança
     de aparelho. */

  var VERSAO_BACKUP = 1;

  async function todosOsComprovantes(){
    var fotos = {};
    var db = await receiptDb();
    if (db){
      try {
        var chaves = await idbOp(db, 'readonly', function(loja){ return loja.getAllKeys(); });
        var valores = await idbOp(db, 'readonly', function(loja){ return loja.getAll(); });
        (chaves || []).forEach(function(k, i){ if (valores[i]) fotos[k] = valores[i]; });
      } catch(e){ /* segue com o que der */ }
    }
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('gastos_casa_receipt_full_') === 0){
          var id = k.replace('gastos_casa_receipt_full_', '');
          if (!fotos[id]) fotos[id] = localStorage.getItem(k);
        }
      }
    } catch(e){ /* ignora */ }
    return fotos;
  }

  // comFotos=false gera um arquivo pequeno (só números e configurações), que
  // é o que dá pra baixar toda semana sem pesar. O completo inclui as imagens
  // dos comprovantes e passa fácil dos 30 MB.
  async function exportarBackup(comFotos){
    var botao = settingsPanelEl.querySelector(comFotos ? '#export-btn' : '#export-lite-btn');
    var rotulo = botao ? botao.textContent : '';
    if (botao){ botao.disabled = true; botao.textContent = 'Preparando o arquivo...'; }
    try {
      var dados = {
        app: 'gastos-da-casa',
        versaoBackup: VERSAO_BACKUP,
        exportadoEm: new Date().toISOString(),
        settings: state.settings,
        expenses: state.expenses,
        comprovantes: comFotos ? await todosOsComprovantes() : {},
        semFotos: !comFotos
      };
      var texto = JSON.stringify(dados);
      var blob = new Blob([texto], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var hoje = todayISO();
      var a = document.createElement('a');
      a.href = url;
      a.download = 'gastos-da-casa-' + hoje + (comFotos ? '' : '-sem-fotos') + '.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
      if (botao){
        botao.textContent = '✅ Baixado (' + formatarMB(texto.length) + ')';
        setTimeout(function(){ if (botao.isConnected){ botao.textContent = rotulo; botao.disabled = false; } }, 2600);
      }
    } catch(e){
      console.error('exportarBackup', e);
      alert('Não foi possível gerar o arquivo de backup.');
      if (botao){ botao.textContent = rotulo; botao.disabled = false; }
    }
  }

  async function importarBackup(arquivo){
    if (!arquivo) return;
    var texto;
    try { texto = await arquivo.text(); }
    catch(e){ alert('Não consegui ler esse arquivo.'); return; }

    var dados;
    try { dados = JSON.parse(texto); }
    catch(e){ alert('Esse arquivo não parece ser um backup do app (não é um JSON válido).'); return; }

    if (!dados || dados.app !== 'gastos-da-casa' || !Array.isArray(dados.expenses)){
      alert('Esse arquivo não é um backup do Gastos da Casa.');
      return;
    }

    var qtdFotos = dados.comprovantes ? Object.keys(dados.comprovantes).length : 0;
    var quando = dados.exportadoEm ? formatDateBR(String(dados.exportadoEm).slice(0,10)) : 'data desconhecida';
    var aviso = 'Restaurar este backup?\n\n'
      + '• ' + dados.expenses.length + ' lançamentos\n'
      + '• ' + (dados.semFotos ? 'sem fotos (cópia leve — os comprovantes atuais serão mantidos)' : qtdFotos + ' comprovantes') + '\n'
      + '• salvo em ' + quando + '\n\n'
      + 'TUDO que está no app agora será SUBSTITUÍDO por isso.';
    if (!confirm(aviso)) return;

    var ok = await saveExpenses(dados.expenses);
    if (!ok){ alert('Não foi possível gravar os lançamentos. Nada foi alterado.'); return; }
    state.expenses = dados.expenses;

    if (dados.settings){
      await saveSettings(dados.settings);
      state.settings = dados.settings;
    }

    var falhas = 0;
    if (dados.comprovantes){
      var ids = Object.keys(dados.comprovantes);
      for (var i = 0; i < ids.length; i++){
        var gravou = await saveFullReceipt(ids[i], dados.comprovantes[ids[i]]);
        if (!gravou) falhas++;
      }
    }

    state.resumoMonth = null;
    state.entriesMonth = {};
    state.futureMonths = null;
    closeSettingsModal();
    render();
    alert(falhas
      ? ('Backup restaurado, mas ' + falhas + ' comprovante(s) não couberam no armazenamento.')
      : 'Backup restaurado.');
  }

  async function confirmarExcluirMembro(){
    var d = state.settingsDraft;
    var m = d.members[membroExcluindo];
    if (!m) return;

    var radio = membroPanelEl.querySelector('input[name="destino-gastos"]:checked');
    var modo = radio ? radio.value : 'mover';
    var destinoEl = membroPanelEl.querySelector('#membro-destino');
    var destino = destinoEl ? destinoEl.value : null;

    var btn = membroPanelEl.querySelector('#btn-excluir-membro');
    if (btn){ btn.disabled = true; btn.textContent = 'Excluindo...'; }

    var antes = state.expenses.slice();
    if (modo === 'apagar'){
      state.expenses = state.expenses.filter(function(e){ return e.person !== m.id; });
    } else if (destino){
      state.expenses.forEach(function(e){ if (e.person === m.id) e.person = destino; });
    }

    var novoDraft = Object.assign({}, d, {
      members: d.members.filter(function(x){ return x.id !== m.id; })
    });

    var okG = await saveExpenses(state.expenses);
    var okS = await saveSettings(novoDraft);
    if (!okG || !okS){
      state.expenses = antes;                       // desfaz se não deu pra gravar
      alert('Não consegui salvar a exclusão. Nada foi mudado.');
      renderMembroModal();
      return;
    }

    state.settingsDraft = novoDraft;
    state.settings = novoDraft;
    // A aba da pessoa não existe mais: se você estava nela, volta pro Resumo.
    if (state.currentTab === m.id) state.currentTab = 'resumo';
    delete state.subTab[m.id];
    ensureSubTabDefaults();
    invalidateCustomColors();

    closeMembroModal();
    renderSettingsModal();
    render();
  }
