  /* ---------- Gráficos do Resumo ----------
     Os dois gráficos são SVG escrito à mão: nenhuma biblioteca externa, pra
     o app continuar abrindo offline e sem depender de CDN.

     Uma decisão importante sobre cor: o app tem 11 categorias, e 11 cores não
     se separam de verdade — Internet (#B18CFF) e Água (#4FA8FF), por exemplo,
     são quase idênticas para quem tem daltonismo. Por isso a comparação entre
     categorias é uma LISTA DE BARRAS com nome e valor escritos em cada linha,
     não um gráfico de pizza/rosca: a cor vira reforço, e quem diz qual é qual
     é o texto. Num gráfico de rosca a cor seria a única pista, e várias fatias
     ficariam impossíveis de distinguir. */

  // Meses que aparecem no seletor do Resumo. Sai do intervalo completo (e não
  // das datas cruas) porque um gasto fixo dá movimento a meses onde você não
  // digitou nada. Só entram meses que realmente têm algum lançamento.
  function resumoAvailableMonths(){
    // O mesmo alcance do gráfico (2 meses à frente): se a barra de novembro
    // aparece lá, clicar nela tem que funcionar — senão o filtro rejeitaria o
    // mês e voltaria calado pro mês atual.
    return expenseMonthSpan(2)
      .filter(function(mk){ return materializedForMonth(mk).length > 0; })
      .sort(function(a,b){ return b.localeCompare(a); });
  }

  // O app abre sempre no mês atual. Se ele ainda não tem nada, cai no mês mais
  // recente que tem — melhor abrir com conteúdo do que numa tela vazia.
  function defaultMonthKey(disponiveis){
    var atual = currentMonthKey();
    if (!disponiveis || !disponiveis.length) return atual;
    if (disponiveis.indexOf(atual) !== -1) return atual;
    return disponiveis[0];
  }

  // Barra de seleção de mês, usada no Resumo e nas listas de cada pessoa.
  function monthBarHTML(action, selecionado, meses, sufixo){
    var opts = '<option value="all"'+(selecionado==='all'?' selected':'')+'>Todos os meses</option>'
      + meses.map(function(k){
          return '<option value="'+k+'"'+(selecionado===k?' selected':'')+'>'+monthLabelFromKey(k)+'</option>';
        }).join('');
    var texto = selecionado === 'all'
      ? 'Somando tudo desde o começo'
      : (selecionado === currentMonthKey() ? 'Mês atual' : 'Mostrando ' + monthLabelFromKey(selecionado));
    return '<div class="resumo-toolbar">'
      + '<label class="resumo-month"><span class="resumo-month-icon">🗓️</span>'
      + '<select class="resumo-month-select" data-action="'+action+'"'+(sufixo?' data-scope="'+escapeHTML(sufixo)+'"':'')+'>'+opts+'</select></label>'
      + '<span class="resumo-scope">'+escapeHTML(texto)+'</span>'
      + '</div>';
  }

  // Soma das parcelas do casal que ainda vão cair nos próximos meses.
  function futureCommitment(){
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    return buildCasalMonthsTimeline()
      .filter(function(g){ return g.key > currentKey; })
      .reduce(function(s,g){ return s + g.total; }, 0);
  }

  function kpiTileHTML(label, value, hint, accent){
    return '<div class="kpi-tile neon-box '+(accent || 'acc-cyan')+'">'
      + '<div class="kpi-label">'+escapeHTML(label)+'</div>'
      + '<div class="kpi-value">'+value+'</div>'
      + '<div class="kpi-hint">'+(hint || '')+'</div>'
      + '</div>';
  }

  // Barras horizontais ranqueadas: cada linha é clicável e abre os itens
  // daquela categoria, igual as linhas de antes faziam.
  function categoryBarsHTML(groups){
    if (!groups.length) return '<div class="empty-state">Sem contas do casal neste período.</div>';
    var max = groups.reduce(function(m,g){ return Math.max(m, g.total); }, 0) || 1;
    var totalAll = groups.reduce(function(s,g){ return s + g.total; }, 0) || 1;
    return '<div class="cat-bars">' + groups.map(function(g){
      var color = catColor(g.category);
      var pct = g.total / max * 100;
      var share = Math.round(g.total / totalAll * 100);
      return '<button type="button" class="cat-bar-row" data-action="open-items" data-category="'+escapeHTML(g.category)+'" title="'+escapeHTML(g.category)+' — '+formatBRL(g.total)+' ('+share+'% das contas do casal)">'
        + '<span class="cat-bar-head">'
          + '<span class="cat-bar-name">'+catChipHTML(g.category, 22)+'<span class="cat-bar-label">'+escapeHTML(g.category)+'</span></span>'
          + '<span class="cat-bar-val">'+formatBRL(g.total)+'<span class="cat-bar-share">'+share+'%</span></span>'
        + '</span>'
        + '<span class="cat-bar-track"><span class="cat-bar-fill" style="width:'+pct.toFixed(2)+'%;background:'+color+';box-shadow:0 0 10px '+hexToRgba(color,0.75)+';"></span></span>'
        + '</button>';
    }).join('') + '</div>';
  }

  // Evolução: 6 meses terminando no mês atual (ou no último com dados).
  // As barras são clicáveis: tocar numa delas filtra o Resumo inteiro naquele
  // mês, sem precisar ir no seletor lá em cima.
  function monthlyTrendHTML(mesSelecionado){
    var timeline = buildCasalMonthsTimeline();
    if (!timeline.length) return '<div class="empty-state">Sem histórico ainda — ele aparece aqui depois do primeiro lançamento.</div>';

    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    var curIdx = -1;
    for (var i = 0; i < timeline.length; i++){ if (timeline[i].key <= currentKey) curIdx = i; }
    if (curIdx < 0) curIdx = 0;
    // Mostramos até 2 meses à frente: as parcelas que já estão compradas mas
    // ainda vão cair fazem parte do quadro. Antes o gráfico cortava no mês
    // atual e um mês futuro com lançamento simplesmente não aparecia.
    var endIdx = Math.min(timeline.length - 1, curIdx + 2);
    var slice = timeline.slice(Math.max(0, endIdx - 5), endIdx + 1);
    var temFuturo = slice.some(function(g){ return g.key > currentKey; });

    var max = slice.reduce(function(m,g){ return Math.max(m, g.total); }, 0) || 1;
    var W = 320, H = 132, padB = 22, padT = 16;
    // Com poucos meses as barras não se espalham pela largura toda: ficariam
    // isoladas nos cantos. O grupo é centralizado com um passo máximo fixo.
    var slot = Math.min(W / slice.length, 62);
    var offsetX = (W - slot * slice.length) / 2;
    var barW = Math.min(34, slot - 10);
    var maxIdx = slice.reduce(function(bi,g,ix){ return g.total > slice[bi].total ? ix : bi; }, 0);

    var bars = slice.map(function(g, ix){
      var h = Math.max(2, (g.total / max) * (H - padB - padT));
      var x = offsetX + ix * slot + (slot - barW) / 2;
      var y = H - padB - h;
      var isCurrent = g.key === currentKey;
      var isFuture = g.key > currentKey;
      // Aceso = o mês que o Resumo está mostrando agora. Quando o filtro está
      // em "todos os meses", o mês atual fica aceso como referência.
      var isSelected = (mesSelecionado && mesSelecionado !== 'all')
        ? (g.key === mesSelecionado)
        : isCurrent;
      // Só o maior mês e o mês atual recebem valor escrito — número em cima de
      // toda barra vira ruído e o gráfico deixa de ser lido de relance.
      var label = (ix === maxIdx || isSelected)
        ? '<text class="trend-val" x="'+(x + barW/2).toFixed(1)+'" y="'+(y - 5).toFixed(1)+'">'+formatCompactBRL(g.total)+'</text>'
        : '';
      // A área de toque cobre a fatia inteira (não só a barra), pra acertar
      // fácil no celular mesmo num mês de valor baixo, cuja barra é curtinha.
      return '<g class="trend-bar'+(isSelected ? ' is-selected' : '')+(isCurrent ? ' is-current' : '')+(isFuture ? ' is-future' : '')+'"'
        + ' data-action="pick-month" data-month="'+g.key+'" role="button" tabindex="0">'
        + '<title>'+escapeHTML(monthLabelFromKey(g.key))+' — '+formatBRL(g.total)+(isFuture ? ' (previsto)' : '')+'. Toque pra ver só este mês.</title>'
        + '<rect class="trend-hit" x="'+(offsetX + ix*slot).toFixed(1)+'" y="0" width="'+slot.toFixed(1)+'" height="'+H+'"></rect>'
        + '<rect class="trend-mark" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+barW.toFixed(1)+'" height="'+h.toFixed(1)+'" rx="4"></rect>'
        + label
        + '<text class="trend-month" x="'+(x + barW/2).toFixed(1)+'" y="'+(H - 6)+'">'+escapeHTML(shortMonthFromKey(g.key))+'</text>'
        + '</g>';
    }).join('');

    return '<svg class="trend-chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none" role="img" aria-label="Gastos do casal por mês">'
      + '<line class="trend-axis" x1="0" y1="'+(H - padB)+'" x2="'+W+'" y2="'+(H - padB)+'"></line>'
      + bars
      + '</svg>'
      + '<div class="trend-legend">Toque numa barra pra ver só aquele mês.'
        + (temFuturo ? ' Barra mais fraca = mês que ainda não chegou (parcelas e contas fixas já comprometidas).' : '')
      + '</div>';
  }

  function shortMonthFromKey(key){
    var parts = String(key).split('-');
    var idx = Number(parts[1]) - 1;
    var name = MONTH_NAMES_PT[idx] || parts[1];
    return name.slice(0,3) + '/' + String(parts[0]).slice(2);
  }

  // Valores curtos pros rótulos do gráfico (R$ 1,2 mil não estoura a barra).
  function formatCompactBRL(v){
    v = Number(v) || 0;
    if (v >= 1000) return 'R$ ' + (v/1000).toLocaleString('pt-BR', {maximumFractionDigits:1}) + ' mil';
    return formatBRL(v);
  }

  function renderResumo(){
    var months = resumoAvailableMonths();
    var month = state.resumoMonth || defaultMonthKey(months);
    if (month !== 'all' && months.indexOf(month) === -1) month = defaultMonthKey(months);
    state.resumoMonth = month;
    var res = computeSettlement(month);
    var heroHTML;
    if (res.totalCasal === 0){
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div><div class="amount settled">Nenhum gasto do casal registrado ainda</div></div>';
    } else if (res.transfers.length === 0){
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div><div class="amount settled">Tudo certo — cada um pagou sua parte ✓</div></div>';
    } else {
      var rows = res.transfers.map(function(t){
        return '<div class="transfer-row"><span class="direction">'+escapeHTML(t.from)+' → '+escapeHTML(t.to)+'</span><span class="amount'+(res.transfers.length===1?' single':'')+'">'+formatBRL(t.amount)+'</span></div>';
      }).join('');
      heroHTML = '<div class="hero-settlement neon-box acc-pink"><div class="label">Acerto entre a casa</div>' + rows + '</div>';
    }

    var maxVal = Math.max.apply(null, res.balances.map(function(b){ return b.spent; }).concat([1]));
    var compareHTML = '<div class="compare">' + res.balances.map(function(b){
      return '<div class="compare-row"><div class="top"><span class="who" style="color:'+b.color+';text-shadow:0 0 14px '+hexToRgba(b.color,0.6)+';">'+escapeHTML(b.name)+'</span><span class="val">'+formatBRL(b.spent)+'</span></div><div class="track"><div class="fill" style="width:'+(b.spent/maxVal*100)+'%;background:'+b.color+';box-shadow:0 0 10px '+hexToRgba(b.color,0.75)+';"></div></div></div>';
    }).join('') + '</div>';

    var casalList = expensesFor(month).filter(function(e){ return e.type==='casal'; });
    var byCat = groupByCategory(casalList);

    var totalPessoal = 0, totalAPagar = 0;
    var personalHTML = state.settings.members.map(function(m){
      var s = personalSummary(m.id, month);
      totalPessoal += s.totalComprado;

    var kpiHTML = '<div class="kpi-row">'

  /* ---------- Aba Meses: anos → meses → detalhe ---------- */

  function renderMesesYearsHTML(years){
    var maxTotal = Math.max.apply(null, years.map(function(y){ return y.total; }).concat([1]));
    var cardsHTML = years.map(function(y){
      var pct = Math.max(4, Math.round(y.total / maxTotal * 100));
      var anoAgora = new Date().getFullYear();
      var tag = y.hasCurrent
        ? '<span class="month-tag current">Ano atual</span>'
        : (y.year > anoAgora ? '<span class="month-tag future">Previsto</span>' : '');
      return ''
        + '<button type="button" class="year-card" data-action="select-meses-year" data-year="'+y.year+'">'
        + '<div class="year-card-top"><span class="year-label">📅 '+y.year+tag+'</span><span class="year-total">'+formatBRL(y.total)+'</span></div>'
        + '<div class="year-bar-track"><div class="year-bar-fill" style="width:'+pct+'%;"></div></div>'
        + '<div class="year-card-meta">'+y.months.length+(y.months.length===1?' mês com gastos':' meses com gastos')+'<span class="cat-click-hint">›</span></div>'
        + '</button>';
    }).join('');
    return ''
      + '<div class="section-title">Contas do casal por ano</div>'
      + '<div class="meses-hint">Toque num ano pra ver o gasto mês a mês.</div>'
      + '<div class="years-list">' + cardsHTML + '</div>';
  }

  function renderMesesMonthsHTML(yearGroup){
    var byMonthIdx = {};
    yearGroup.months.forEach(function(g){ byMonthIdx[g.month] = g; });
    var maxTotal = Math.max.apply(null, yearGroup.months.map(function(g){ return g.total; }).concat([1]));
    var cellsHTML = '';
    for (var i = 0; i < 12; i++){
      var g = byMonthIdx[i];
      if (!g){
        cellsHTML += '<div class="month-cell empty-cell"><span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+'</span><span class="mc-value">—</span></div>';
        continue;
      }
      var pct = Math.max(6, Math.round(g.total / maxTotal * 100));
      var cls = 'month-cell' + (g.isCurrent ? ' current' : '') + (g.isFuture ? ' future' : '');
      cellsHTML += ''
        + '<button type="button" class="'+cls+'" data-action="select-meses-month" data-month="'+g.key+'">'
        + '<span class="mc-label">'+MONTH_NAMES_PT[i].slice(0,3)+(g.isCurrent ? ' •' : '')+'</span>'
        + '<span class="mc-bar-track"><span class="mc-bar-fill" style="width:'+pct+'%;"></span></span>'
        + '<span class="mc-value">'+formatBRL(g.total)+'</span>'
        + (g.isFuture ? '<span class="mc-future-tag">previsto</span>' : '')
        + '</button>';
    }
    return ''
      + '<div class="section-title-row"><button type="button" class="back-btn" data-action="meses-back-years">‹ Anos</button></div>'
      + '<div class="year-total-hero">📅 <strong>'+yearGroup.year+'</strong> · total do ano: <strong>'+formatBRL(yearGroup.total)+'</strong></div>'
      + '<div class="meses-hint">Toque num mês pra ver os lançamentos.</div>'
      + '<div class="months-grid">' + cellsHTML + '</div>';
  }

  function renderMesesMonthDetailHTML(g){
    var label = MONTH_NAMES_PT[g.month] + '/' + g.year;
    var tag = g.isCurrent ? '<span class="month-tag current">Este mês</span>' : (g.isFuture ? '<span class="month-tag future">Previsto</span>' : '');
    var rows = g.items.map(function(it){
      var badge = it.installmentLabel
        ? ('<span class="installment-badge">'+(it.paid?'✅':'⏳')+' Parcela '+it.installmentLabel+'</span>')
        : '';
      return ''
        + '<div class="entry month-item'+(it.paid?'':' pending-item')+'">'
        + catChipHTML(it.category, 34)
        + '<div class="info"><div class="desc">'+escapeHTML(it.description)+'</div><div class="date">'+escapeHTML(it.category)+(badge?(' · '+badge):'')+'</div></div>'
        + '<div class="value">'+formatBRL(it.value)+'</div>'

    }).join('');
    return ''
      + '<div class="section-title-row"><button type="button" class="back-btn" data-action="meses-back-months" data-year="'+g.year+'">‹ '+g.year+'</button></div>'

      + '</div>'

  function renderMesesTab(){
    var years = buildCasalYearsTimeline();
    if (!years.length){
      return '<div class="empty-state">Nenhuma conta do casal registrada ainda. Assim que vocês lançarem uma compra — à vista ou parcelada — ela aparece aqui organizada por ano e mês.</div>';
    }
    var view = state.mesesView || {mode:'years'};

    if (view.mode === 'month'){
      var yg = years.find(function(y){ return y.year === view.year; });
      var g = yg && yg.months.find(function(m){ return m.key === view.month; });
      if (g) return renderMesesMonthDetailHTML(g);
      state.mesesView = {mode:'years'};
    } else if (view.mode === 'months'){
      var yg2 = years.find(function(y){ return y.year === view.year; });
      if (yg2) return renderMesesMonthsHTML(yg2);
      state.mesesView = {mode:'years'};
    }

    return renderMesesYearsHTML(years);
  }

  function render(){
    renderTabBar();
    updateHeaderText();
    // As cores das categorias personalizadas dependem de quais existem, então
    // são recalculadas quando a lista de gastos pode ter mudado.
    invalidateCustomColors();
    // Só o Resumo usa a largura toda da tela; o resto continua numa coluna
    // estreita, que é mais confortável de ler e de preencher.
    contentEl.classList.toggle('wide', state.currentTab === 'resumo');
    if (state.currentTab === 'resumo') contentEl.innerHTML = renderResumo();
    else if (state.currentTab === 'meses') contentEl.innerHTML = renderMesesTab();
    else contentEl.innerHTML = renderMemberTab(state.currentTab);
    // Se o formulário renderizado já tem itens (ex: editando uma conta com
    // itens salvos), mostra o total dos itens desde já, não só depois de mexer.
    var itemsListEl = contentEl.querySelector('form .items-list');
    if (itemsListEl && itemsListEl.querySelectorAll('.item-row').length){
      recalcItemsTotal(itemsListEl.closest('form'));
    }
  }

  // Marca que você já decidiu o que fazer com os dados de exemplo, pra o app

  function demoAlreadyHandled(){
    try { return localStorage.getItem('gastos_casa_demo_feito') === '1'; }
    catch(e){ return false; }
  }
  function markDemoHandled(){
    try { localStorage.setItem('gastos_casa_demo_feito', '1'); } catch(e){ /* segue sem marcar */ }
  }

  async function loadDemoData(){
    var jaTem = state.expenses.some(function(e){ return e.demo; });
    var msg = jaTem
      ? 'Recarregar os dados de exemplo? Os de exemplo que já estão aí serão trocados pelos novos. Seus lançamentos de verdade não são tocados.'
      : 'Carregar 3 meses de lançamentos de exemplo (agosto, setembro e outubro de 2026)? Seus lançamentos de verdade continuam onde estão.';
    if (!confirm(msg)) return;
    var reais = state.expenses.filter(function(e){ return !e.demo; });
    var novos = reais.concat(demoExpenseSeed());
    var ok = await saveExpenses(novos);
    if (!ok){ alert('Não foi possível salvar os dados de exemplo.'); return; }
    markDemoHandled();
    state.expenses = novos;
    state.resumoMonth = null;   // volta pro mês atual, o padrão do app
    state.entriesMonth = {};
    closeSettingsModal();
    render();
  }

  async function removeDemoData(){
    var reais = state.expenses.filter(function(e){ return !e.demo; });
    if (reais.length === state.expenses.length){ alert('Não há dados de exemplo carregados.'); return; }
    if (!confirm('Remover só os lançamentos de exemplo? Os seus continuam.')) return;
    var ok = await saveExpenses(reais);
    if (!ok){ alert('Não foi possível remover os dados de exemplo.'); return; }
    markDemoHandled();
    state.expenses = reais;
    closeSettingsModal();
    render();
  }

  async function handleConfirmReset(){
    var checks = resetPanelEl.querySelectorAll('.reset-check:checked');
    var wipeCasal = false, wipeSettings = false, personalMemberIds = [];
    checks.forEach(function(cb){
      var v = cb.value;
      if (v === 'casal') wipeCasal = true;
      else if (v === 'settings') wipeSettings = true;
      else if (v.indexOf('pessoal:') === 0) personalMemberIds.push(v.slice('pessoal:'.length));
    });
    if (!wipeCasal && !wipeSettings && !personalMemberIds.length) return;

    var toRemove = state.expenses.filter(function(e){
      if (wipeCasal && e.type === 'casal') return true;
      if (e.type === 'pessoal' && personalMemberIds.indexOf(e.person) !== -1) return true;
      return false;
    });
    var remaining = state.expenses.filter(function(e){ return toRemove.indexOf(e) === -1; });
    var savedR = await saveExpenses(remaining);
    if (!savedR){ alert('Não foi possível apagar os dados. Tente de novo.'); return; }
    state.expenses = remaining;
    for (var i=0;i<toRemove.length;i++){
      if (toRemove[i].thumb) await deleteFullReceipt(toRemove[i].id);
    }
    if (wipeSettings){
      var fresh = defaultSettings();
      var savedS = await saveSettings(fresh);
      if (savedS) state.settings = fresh;
      ensureSubTabDefaults();
    }
    state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
    if (state.currentTab !== 'resumo' && state.currentTab !== 'meses' && !state.settings.members.find(function(m){ return m.id === state.currentTab; })){
      state.currentTab = 'resumo';
    }
    closeResetModal();
    render();
  }

  function captureAddFormDraft(){
    var form = contentEl.querySelector('form.add-form');
    if (!form) return null;
    var draft = { memberId: form.getAttribute('data-member') };
    var el;
    el = form.querySelector('.category-select'); if (el) draft.category = el.value;
    el = form.querySelector('.custom-category-input'); if (el) draft.customCategory = el.value;
    el = form.querySelector('.description-input'); if (el) draft.description = el.value;
    el = form.querySelector('.value-input'); if (el && !el.readOnly) draft.value = el.value;
    el = form.querySelector('.date-input'); if (el) draft.date = el.value;
    el = form.querySelector('.payment-method-select'); if (el) draft.paymentMethod = el.value;
    el = form.querySelector('.card-select'); if (el) draft.card = el.value;
    el = form.querySelector('.custom-card-input'); if (el) draft.customCard = el.value;
    el = form.querySelector('.fixed-toggle-select'); if (el) draft.fixedToggle = el.value;
    el = form.querySelector('.installment-toggle-select'); if (el) draft.installmentToggle = el.value;
    el = form.querySelector('.installments-total-input'); if (el) draft.installmentsTotal = el.value;
    el = form.querySelector('.installments-paid-input'); if (el) draft.installmentsPaid = el.value;
    var itemRows = form.querySelectorAll('.item-row');
    if (itemRows.length){
      draft.items = [];
      itemRows.forEach(function(row){
        draft.items.push({
          position: row.querySelector('.item-pos-input').value,
          description: row.querySelector('.item-desc-input').value,
          units: row.querySelector('.item-units-input').value,
          weight: row.querySelector('.item-weight-input').value,
          value: row.querySelector('.item-value-input').value
        });
      });
    }
    return draft;
  }

  function applyAddFormDraft(draft){
    if (!draft) return;
    var form = contentEl.querySelector('form.add-form');
    if (!form || form.getAttribute('data-member') !== draft.memberId) return;
    var el;
    el = form.querySelector('.category-select');
    if (el && draft.category != null){ el.value = draft.category; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-category-input'); if (el && draft.customCategory != null) el.value = draft.customCategory;
    el = form.querySelector('.description-input'); if (el && draft.description != null) el.value = draft.description;
    el = form.querySelector('.date-input'); if (el && draft.date != null) el.value = draft.date;
    el = form.querySelector('.payment-method-select');
    if (el && draft.paymentMethod != null){ el.value = draft.paymentMethod; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.card-select');
    if (el && draft.card != null){ el.value = draft.card; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-card-input'); if (el && draft.customCard != null) el.value = draft.customCard;
    el = form.querySelector('.fixed-toggle-select');
    if (el && draft.fixedToggle != null){ el.value = draft.fixedToggle; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.installment-toggle-select');
    if (el && draft.installmentToggle != null){ el.value = draft.installmentToggle; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.installments-total-input'); if (el && draft.installmentsTotal != null) el.value = draft.installmentsTotal;
    el = form.querySelector('.installments-paid-input'); if (el && draft.installmentsPaid != null) el.value = draft.installmentsPaid;
    if (draft.items && draft.items.length){
      var list = form.querySelector('.items-list');
      if (list){
        list.innerHTML = draft.items.map(itemRowHTML).join('');
        recalcItemsTotal(form);
      }
    }
    if (draft.value != null){
      var valueInput = form.querySelector('.value-input');
      if (valueInput && !valueInput.readOnly) valueInput.value = draft.value;
    }
  }

  async function saveSettingsAndClose(){
    var d = state.settingsDraft;
    d.members.forEach(function(m){
      if (!m.name || !m.name.trim()) m.name = 'Pessoa';
      m.percentage = Number(m.percentage) || 0;
    });
    d.cards = (d.cards || []).map(function(c){ return (c||'').trim(); }).filter(function(c){ return c.length > 0; });
    if (!d.cards.length) d.cards = DEFAULT_CARDS.slice();
    var ok = await saveSettings(d);
    if (!ok){ alert('Não foi possível salvar as configurações. Tente de novo.'); return; }
    var formDraft = captureAddFormDraft();
    state.settings = d;
    ensureSubTabDefaults();
    if (state.currentTab !== 'resumo' && state.currentTab !== 'meses' && !state.settings.members.find(function(m){ return m.id === state.currentTab; })){
      state.currentTab = 'resumo';
    }
    closeSettingsModal();
    render();
    applyAddFormDraft(formDraft);
  }

  function renderItemsPanel(){
    var category = state.itemsModalCategory;
    if (!category) return;
    var sort = state.itemsModalSort || 'recent';
    var grouped = !!state.itemsModalGroup;
    var monthFilter = state.itemsModalMonth || 'all';

    var allItems = getCategoryItems(category);
    var months = getAvailableMonths(allItems);
    var items = monthFilter === 'all' ? allItems : allItems.filter(function(it){ return it.monthKey === monthFilter; });

    var displayItems = grouped ? groupItemsByProduct(items) : items;
    displayItems = sortCategoryItems(displayItems, sort);
    var total = displayItems.reduce(function(s,it){ return s+it.subtotal; }, 0);

    var rows = displayItems.length ? displayItems.map(function(it){
      var metaBits = [];
      if (!grouped) metaBits.push(formatDateBR(it.date));
      if (grouped && it.purchases > 1) metaBits.push(it.purchases + ' compras · última em ' + formatDateBR(it.date));
      if (!grouped && it.weight) metaBits.push(formatQty(it.weight) + ' kg');
      else if (it.quantity !== 1) metaBits.push(formatQty(it.quantity) + (grouped ? ' un. no total' : 'x ' + formatBRL(it.unitValue)));
      return '<div class="item-view-row">'
        + '<div class="item-view-main"><div class="item-view-desc">'+escapeHTML(it.description)+'</div><div class="item-view-meta">'+metaBits.join(' · ')+'</div></div>'
        + '<div class="item-view-value">'+formatBRL(it.subtotal)+'</div>'
        + '</div>';
    }).join('') : '<div class="empty-state">Nenhum item registrado neste período ainda.</div>';

    var monthOptionsHTML = '<option value="all"'+(monthFilter==='all'?' selected':'')+'>Todos os meses</option>'
      + months.map(function(mk){ return '<option value="'+mk+'"'+(monthFilter===mk?' selected':'')+'>'+monthLabelFromKey(mk)+'</option>'; }).join('');

    itemsPanelEl.innerHTML = ''
      + '<h2>'+catChipHTML(category,30)+' '+escapeHTML(category)+'</h2>'
      + '<div class="items-filter-row">'
        + '<span class="items-filter-icon">🔽</span>'
        + '<select id="items-month-select">' + monthOptionsHTML + '</select>'
        + '<select id="items-sort-select">'
          + '<option value="recent"'+(sort==='recent'?' selected':'')+'>Mais recentes</option>'
          + '<option value="qty_desc"'+(sort==='qty_desc'?' selected':'')+'>Quantidade (maior primeiro)</option>'
          + '<option value="value_desc"'+(sort==='value_desc'?' selected':'')+'>Valor: maior → menor</option>'
          + '<option value="value_asc"'+(sort==='value_asc'?' selected':'')+'>Valor: menor → maior</option>'
        + '</select>'
      + '</div>'
      + '<label class="items-group-toggle" style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-soft);margin:-4px 0 12px;">'
        + '<input type="checkbox" id="items-group-toggle"'+(grouped?' checked':'')+'> Agrupar por produto (somar quantidades)'
      + '</label>'
      + '<div class="items-filter-total" style="display:block;margin-bottom:8px;">'+displayItems.length+(displayItems.length===1?' item':' itens')+' · '+formatBRL(total)+'</div>'
      + '<div class="items-list-view">' + rows + '</div>'
      + '<button type="button" id="close-items-btn" class="secondary-btn" style="margin-top:14px;">Fechar</button>';
  }

  /* ---------- Expense handlers ---------- */

  async function handleFormSubmit(form){
    var memberId = form.getAttribute('data-member');
    var type = state.subTab[memberId] || 'casal';
    var catSelect = form.querySelector('.category-select');
    var category = catSelect.value;
    if (category === '__custom__'){
      var custom = form.querySelector('.custom-category-input').value.trim();
      if (!custom){ alert('Digite o nome da categoria.'); return; }
      category = custom;
    }
    var description = form.querySelector('.description-input').value.trim();
    var value = parseFloat(form.querySelector('.value-input').value);
    var date = form.querySelector('.date-input').value || todayISO();

    if (!description){ alert('Digite uma descrição.'); return; }
    if (!value || value <= 0){ alert('Digite um valor válido.'); return; }

    var extra = {};
    var fixedToggleEl = form.querySelector('.fixed-toggle-select');
    extra.fixed = !!fixedToggleEl && fixedToggleEl.value === 'sim';
    if (type === 'pessoal'){
      var paymentMethodEl = form.querySelector('.payment-method-select');
      var paymentMethod = paymentMethodEl ? paymentMethodEl.value : 'credito';
      extra.paymentMethod = paymentMethod;
      if (paymentMethod === 'credito'){
        var cardSelectEl = form.querySelector('.card-select');
        var cardValue = cardSelectEl ? cardSelectEl.value : '';
        if (cardValue === '__custom__'){
          var customCard = form.querySelector('.custom-card-input').value.trim();
          if (!customCard){ alert('Digite o nome do cartão.'); return; }
          cardValue = customCard;
        }
        if (!cardValue){ alert('Selecione o cartão.'); return; }
        extra.card = cardValue;
        var instToggleEl = form.querySelector('.installment-toggle-select');
        var isInstallment = !!instToggleEl && instToggleEl.value === 'sim' && !extra.fixed;
        extra.installment = isInstallment;
        if (isInstallment){
          var totalInst = parseInt(form.querySelector('.installments-total-input').value, 10);
          var paidInst = parseInt(form.querySelector('.installments-paid-input').value, 10);
          if (!totalInst || totalInst < 1){ alert('Informe o número de parcelas.'); return; }
          if (isNaN(paidInst) || paidInst < 0) paidInst = 0;
          if (paidInst > totalInst) paidInst = totalInst;
          extra.installmentsTotal = totalInst;
          extra.installmentsPaid = paidInst;
        } else {
          extra.installmentsTotal = null;
          extra.installmentsPaid = null;
        }
      } else {
        extra.card = null;
        extra.installment = false;
        extra.installmentsTotal = null;
        extra.installmentsPaid = null;
      }
    } else if (type === 'casal'){
      var itemRows = form.querySelectorAll('.item-row');
      var items = [];
      itemRows.forEach(function(row){
        var idesc = row.querySelector('.item-desc-input').value.trim();
        var ivalue = parseFloat(row.querySelector('.item-value-input').value) || 0;
        var ipos = parseInt(row.querySelector('.item-pos-input').value, 10);
        var iunits = parseFloat(row.querySelector('.item-units-input').value);
        var iweight = parseFloat(row.querySelector('.item-weight-input').value);
        if (idesc && ivalue > 0) items.push({
          position: isNaN(ipos) ? null : ipos,
          description: idesc,
          units: isNaN(iunits) ? null : iunits,
          weight: isNaN(iweight) ? null : iweight,
          value: ivalue
        });
      });
      extra.items = items.length ? items : null;

      var instToggleC = form.querySelector('.installment-toggle-select');
      var isInstallmentC = !!instToggleC && instToggleC.value === 'sim' && !extra.fixed;
      extra.installment = isInstallmentC;
      if (isInstallmentC){
        var totalInstC = parseInt(form.querySelector('.installments-total-input').value, 10);
        var paidInstC = parseInt(form.querySelector('.installments-paid-input').value, 10);
        if (!totalInstC || totalInstC < 1){ alert('Informe o número de parcelas.'); return; }
        if (isNaN(paidInstC) || paidInstC < 0) paidInstC = 0;
        if (paidInstC > totalInstC) paidInstC = totalInstC;
        extra.installmentsTotal = totalInstC;
        extra.installmentsPaid = paidInstC;
      } else {
        extra.installmentsTotal = null;
        extra.installmentsPaid = null;
      }
    }

    if (state.editingId){
      var idx = state.expenses.findIndex(function(e){ return e.id === state.editingId; });
      if (idx === -1){ state.editingId = null; render(); return; }
      var original = state.expenses[idx];
      var newThumb = original.thumb;
      if (state.pendingPhoto) newThumb = state.pendingPhoto.thumb;
      else if (state.removeExistingPhoto) newThumb = null;
      var updated = Object.assign({}, original, {category:category, description:description, value:value, date:date, thumb:newThumb}, extra);
      state.expenses[idx] = updated;
      var savedEdit = await saveExpenses(state.expenses);
      if (!savedEdit){ state.expenses[idx] = original; alert('Não foi possível salvar as alterações.'); return; }
      if (state.pendingPhoto) await saveFullReceipt(state.editingId, state.pendingPhoto.full);
      else if (state.removeExistingPhoto) await deleteFullReceipt(state.editingId);
      state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
      render();
      return;
    }

    var id = generateId();
    var photo = state.pendingPhoto;
    var newExpense = Object.assign({id:id, person:memberId, type:type, category:category, description:description, value:value, date:date, thumb: photo?photo.thumb:null}, extra);
    state.expenses.push(newExpense);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.pop(); alert('Não foi possível salvar o gasto. Verifique se o navegador permite armazenamento local e tente novamente.'); return; }
    if (photo) await saveFullReceipt(id, photo.full);
    state.pendingPhoto = null;
    render();
  }

  async function handleDeleteExpense(id){
    // A linha clicada pode ser a repetição de um gasto fixo — nesse caso o que
    // existe de verdade é o lançamento original, e apagar tira de todos os meses.
    var alvo = baseExpenseId(id);
    var idx = state.expenses.findIndex(function(e){ return e.id === alvo; });
    if (idx === -1) return;
    var removed = state.expenses[idx];
    var pergunta = removed.fixed
      ? 'Este é um gasto fixo: excluir tira ele de TODOS os meses, inclusive dos que já passaram e já entraram no acerto. Excluir mesmo assim?'
      : 'Excluir este gasto?';
    if (!confirm(pergunta)) return;
    state.expenses.splice(idx, 1);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.splice(idx, 0, removed); alert('Não foi possível excluir. Tente de novo.'); return; }
    if (removed.thumb) await deleteFullReceipt(alvo);
    if (baseExpenseId(state.editingId) === alvo){ state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false; }
    render();
  }

  function handleEditStart(id){
    // Editar uma repetição edita o lançamento original — mudar o valor do
    // aluguel muda em todos os meses, que é o esperado num gasto fixo.
    var alvo = baseExpenseId(id);
    var exp = state.expenses.find(function(e){ return e.id === alvo; });
    if (!exp) return;
    state.editingId = alvo;
    state.pendingPhoto = null;
    state.removeExistingPhoto = false;
    render();
  }

  /* ================================================================
     LEITURA DA NOTA — v2
     Estratégia: em vez de ler linha por linha (que embaralha quando o
     OCR quebra ou junta linhas), a nota é dividida em BLOCOS ancorados
     no Nº sequencial do item impresso no cupom, e dentro de cada bloco
     procuramos o padrão de compra "quantidade UNIDADE x valor unitário".
     Esse "x" é a chave: é ele que separa a QUANTIDADE COMPRADA do
     TAMANHO impresso no nome do produto ("ARROZ 5KG", "LEITE 395G").
     De cada item extraímos só 4 coisas:
       1) Nº de posição + nome do produto
       2) Unidade (quantas unidades)
       3) Peso em kg (só quando vendido por peso)
       4) Valor total do item
     Todo o resto (código de barras, valor unitário, código tributário,
     CNPJ, endereço, formas de pagamento) é descartado.
     ================================================================ */

  var MONEY_SRC = '\\d{1,3}(?:\\.\\d{3})*,\\d{2}';
  var UNIT_SRC = 'UN|UND|UNID|KG|PC|CX|LT|DZ|MT|PT|FD|G';

  function parseBRLNumber(str){
    if (str == null) return null;
    var cleaned = String(str).replace(/\./g, '').replace(',', '.');
    var n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }

  // Quantidade pode ser "2" ou "0,970" — aqui a vírgula é decimal, nunca
  // separador de milhar (ninguém compra 1.500 unidades num mercado).
  function parseQty(str){
    var n = parseFloat(String(str).replace(',', '.'));
    return isNaN(n) ? null : n;
  }

  // O OCR troca letras por números o tempo todo em cupom de impressora
  // térmica. Consertamos isso SÓ dentro de trechos que já parecem número,
  // nunca no nome do produto — senão "SABAO" viraria "5A8AO".
  var DIGIT_FIX = {'O':'0','o':'0','Q':'0','D':'0','l':'1','I':'1','i':'1','|':'1','!':'1','T':'1','S':'5','s':'5','B':'8','Z':'2','z':'2','G':'6','b':'6'};
  function fixDigits(str){
    return String(str).replace(/[OoQDlIi|!TSsBZzGb]/g, function(c){ return DIGIT_FIX[c] || c; });
  }

  // Normaliza o texto bruto do OCR antes de qualquer análise.
  function normalizeOcrText(text){
    var t = String(text || '');

    // 1) Conserta valores em R$ com letra no meio ("8,4S" -> "8,45", "1O,50"
    //    -> "10,50"). Só aceitamos a correção se o resultado virar um valor
    //    válido de verdade — assim uma palavra nunca vira número por engano.
    t = t.replace(/\b[0-9OoQDlIi|!TSsBZzGb]{1,6}(?:[.\s][0-9OoQDlIi|!TSsBZzGb]{3})*\s*,\s*[0-9OoQDlIi|!TSsBZzGb]{2}\b/g, function(tok){
      if (!/[0-9]/.test(tok)) return tok;
      var fixed = fixDigits(tok).replace(/\s+/g, '');
      return /^\d{1,3}(?:\.\d{3})*,\d{2}$/.test(fixed) ? fixed : tok;
    });

    // 2) Separa quantidade/unidade/"x" que vieram grudadas ou com letra
    //    trocada ("TUNX" -> "1 UN X", "2UNx" -> "2 UN X", "0,970KGX" ->
    //    "0,970 KG X"). O "x" é o marcador mais importante da nota inteira.
    t = t.replace(new RegExp('(^|[\\s|])([0-9OoQDlIiTSBZG]{1,3}(?:[.,][0-9OoQDlIiTSBZG]{1,3})?)\\s*(' + UNIT_SRC + ')\\s*[XxK×*]\\s*(?=[\\d' + 'OoQDlIiTSBZG' + '])', 'gi'), function(m, pre, q, u){
      return pre + fixDigits(q) + ' ' + u.toUpperCase() + ' X ';
    });

    // 3) Conserta o Nº sequencial do item no começo da linha quando ele veio
    //    com letra ("OO1 7891..." -> "001 7891...").
    t = t.split(/\r?\n/).map(function(line){
      return line.replace(/^(\s*)([0-9OoQDlIiTS]{1,3})(\s+\d[\d.\-]{5,}\b)/, function(m, sp, seq, rest){
        return sp + fixDigits(seq) + rest;
      });
    }).join('\n');

    return t;
  }

  // Tira do nome do produto tudo que não é nome: Nº sequencial, código de
  // barras/interno, valores em R$, código tributário solto no fim.
  function cleanProductName(raw){
    var s = ' ' + String(raw || '') + ' ';
    s = s.replace(new RegExp(MONEY_SRC, 'g'), ' ');       // valores em R$
    s = s.replace(/\b\d[\d.\-]{5,}\b/g, ' ');             // código de barras / interno
    s = s.replace(/^\s*\d{1,3}\b(?!\s*(KG|G|ML|L|UN)\b)/i, ' '); // Nº sequencial no início
    s = s.replace(/[^A-Za-zÀ-ÿ0-9.,%/&+\-\s]/g, ' ');     // símbolos que o OCR inventa
    s = s.replace(/\s+[A-Za-z]\s*$/, ' ');                // letra solta no fim (F/T/I/N — código tributário)
    s = s.replace(/\s{2,}/g, ' ').trim();
    s = s.replace(/[.,\-]+$/, '').trim();
    if (!/[A-Za-zÀ-ÿ]{2,}/.test(s)) return '';
    return s;
  }

  /* ---------- Recorte da região dos itens ---------- */
  var TABLE_HEAD_RE = /(C[ÓO]DIGO.*DESCRI|DESCRI[ÇC][ÃA]O.*(QTD|QTDE|UN)|ITEM.*C[ÓO]DIGO|VL\.?\s*UNIT|V[LR]\.?\s*TOT|#\s*COD)/i;
  var FOOTER_RE = /(QTD\.?\s*TOTAL\s*DE\s*ITENS|TOTAL\s*DE\s*ITENS|VALOR\s*A\s*PAGAR|VALOR\s*TOTAL|^TOTAL\b|FORMA\s*DE\s*PAGAMENTO|FORMAS?\s*PGTO|^DINHEIRO|CART[ÃA]O\s*DE|TROCO|INFORMA[ÇC][ÕO]ES\s*DO\s*QR|CONSULTE\s*PELA\s*CHAVE|CHAVE\s*DE\s*ACESSO|PROTOCOLO)/i;
  var NOISE_RE = /(CNPJ|\bCPF\b|INSCRI[ÇC][ÃA]O|ENDERE|CUPOM\s*FISCAL|NOTA\s*FISCAL|DOCUMENTO\s*AUXILIAR|CONSUMIDOR|N[ÃA]O\s*IDENTIFICADO|EXTRATO|SAT\s*N|EMISS[ÃA]O|S[ÉE]RIE|www\.)/i;
  // Linhas que aparecem NO MEIO dos itens mas não são item — descontos,
  // acréscimos, subtotais parciais. Elas somem sem interromper a lista.
  var MID_NOISE_RE = /(DESCONTO|ACR[ÉE]SCIMO|SUBTOTAL|CANCELAMENTO|ITEM\s*CANCELADO|TROCO)/i;
  // Sobras de cabeçalho da tabela que não podem virar nome de produto.
  var HEADER_WORDS_RE = /(DESCRI[ÇC]|C[ÓO]DIGO|\bQTDE?\b|VL\.?\s*UNIT|V[LR]\.?\s*TOT|\bCOD\b)/i;

  /* ---------- Âncoras de item ---------- */
  var ANCHOR_STRONG_RE = /^(\d{1,3})\s+(\d[\d.\-]{5,})\b/;
  var ANCHOR_MEDIUM_RE = /^(\d{1,3})[\s.\)\-]+(?=[A-Za-zÀ-ÿ])/;

  // O padrão de compra completo: quantidade + unidade + "x" + valor unitário.
  // Exigir o "x" e o valor é o que impede "ARROZ 5KG" de virar "5 KG".
  var QTY_FULL_SRC = '(\\d+(?:[.,]\\d+)?)\\s*(' + UNIT_SRC + ')\\s*[Xx×*]\\s*(' + MONEY_SRC + ')';
  // Fallback quando o OCR comeu o "x": exige espaço entre número e unidade
  // (o tamanho no nome do produto vem colado: "5KG", "395G", "2L").
  var QTY_LOOSE_SRC = '(\\d+(?:[.,]\\d+)?)\\s+(UN|UND|UNID|KG|PC|CX|LT|DZ|MT|PT|FD)\\b';

  function readUnitsOrWeight(qtyStr, unitStr){
    var qty = parseQty(qtyStr);
    if (qty == null) return {units:null, weight:null, ok:false};
    var u = String(unitStr || '').toUpperCase();
    if (u === 'KG') return {units:null, weight:qty, ok:(qty > 0 && qty < 500)};
    if (u === 'G')  return {units:null, weight:qty/1000, ok:(qty > 0 && qty < 500000)};
    return {units:qty, weight:null, ok:(qty > 0 && qty < 1000)};
  }

  // Uma linha que só tem o Nº do item (e a linha seguinte só o código de
  // barras) é o mesmo cabeçalho de item quebrado em pedaços pelo OCR —
  // remontamos antes de procurar as âncoras.
  function stitchLines(lines){
    var out = [];
    for (var i = 0; i < lines.length; i++){
      var cur = lines[i];
      if (/^\d{1,3}$/.test(cur) && i + 1 < lines.length){
        var nxt = lines[i + 1];
        if (/^\d[\d.\-]{5,}$/.test(nxt)){ out.push(cur + ' ' + nxt); i++; continue; }
        if (/^[A-Za-zÀ-ÿ]/.test(nxt)){ out.push(cur + ' ' + nxt); i++; continue; }
      }
      out.push(cur);
    }
    return out;
  }

  // Linha que contém apenas um valor em R$ (com no máximo o código
  // tributário do lado): é a continuação do item anterior, nunca um item novo.
  var ONLY_MONEY_RE = new RegExp('^R?\\$?\\s*(' + MONEY_SRC + ')\\s*[A-Za-z]?$');

  /* ---------- Parser principal ---------- */
  function parseReceiptText(rawText){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var text = normalizeOcrText(rawText);
    var allLines = stitchLines(text.split(/\r?\n/)
      .map(function(l){ return l.replace(/\s+/g, ' ').trim(); })
      .filter(function(l){ return l.length > 0; }));

    var result = { date:null, total:null, storeName:null, itemCountPrinted:null, items:[], rawText:String(rawText||'') };

    /* --- Data --- */
    for (var i = 0; i < allLines.length; i++){
      var dm = allLines[i].match(/(\d{2})[\/.\-](\d{2})[\/.\-](\d{4})/);
      if (dm){
        var y = Number(dm[3]);
        var dt = new Date(y, Number(dm[2]) - 1, Number(dm[1]));
        if (!isNaN(dt.getTime()) && y > 2000 && y < 2100){
          result.date = dm[3] + '-' + dm[2] + '-' + dm[1];
          break;
        }
      }
    }

    /* --- Nome da loja --- */
    for (var j = 0; j < Math.min(allLines.length, 6); j++){
      var lj = allLines[j];
      if (/[A-Za-zÀ-ÿ]{3,}/.test(lj) && !NOISE_RE.test(lj) && !TABLE_HEAD_RE.test(lj) && !ANCHOR_STRONG_RE.test(lj)){
        var cl = lj.replace(/[^A-Za-zÀ-ÿ0-9 .,\-&]/g, '').trim();
        if (cl.length >= 3){ result.storeName = cl; break; }
      }
    }

    /* --- Total impresso (só pra conferência) --- */
    for (var k = allLines.length - 1; k >= 0; k--){
      var lk = allLines[k];
      if (/(VALOR\s*A\s*PAGAR|VALOR\s*TOTAL|\bTOTAL\b)/i.test(lk) && !/SUBTOTAL|DESCONTO|ITENS|TRIBUTOS/i.test(lk)){
        var mt = lk.match(moneyRe);
        if (mt && mt.length){
          var vt = parseBRLNumber(mt[mt.length - 1]);
          if (vt != null && vt > 0){ result.total = vt; break; }
        }
      }
    }

    /* --- Nº de itens impresso (conferência) --- */
    for (var q = 0; q < allLines.length; q++){
      var mq = allLines[q].match(/(?:QTD\.?\s*TOTAL\s*DE\s*ITENS|TOTAL\s*DE\s*ITENS)\D{0,6}(\d{1,3})/i);
      if (mq){ result.itemCountPrinted = parseInt(mq[1], 10); break; }
    }

    /* --- Recorte da região dos itens --- */
    var start = 0, end = allLines.length;
    for (var a = 0; a < allLines.length; a++){
      if (TABLE_HEAD_RE.test(allLines[a])){ start = a + 1; break; }
      if (ANCHOR_STRONG_RE.test(allLines[a])){ start = a; break; }
    }
    // O rodapé só começa DEPOIS do último item numerado. Sem essa checagem,
    // uma linha de desconto no meio da compra cortaria metade da lista fora.
    var lastAnchor = -1;
    for (var z = allLines.length - 1; z >= start; z--){
      if (ANCHOR_STRONG_RE.test(allLines[z])){ lastAnchor = z; break; }
    }
    for (var b = Math.max(start, lastAnchor + 1); b < allLines.length; b++){
      if (FOOTER_RE.test(allLines[b]) && !ANCHOR_STRONG_RE.test(allLines[b])){ end = b; break; }
    }
    var region = allLines.slice(start, end).filter(function(l){
      return !NOISE_RE.test(l) && !MID_NOISE_RE.test(l) && !TABLE_HEAD_RE.test(l);
    });

    /* --- Âncoras: onde cada item começa --- */
    // Aceitamos uma âncora só se o Nº dela continuar a sequência (crescente,
    // sem pular muito). Isso impede que um pedaço de código de barras ou uma
    // data solta seja confundida com o começo de um item novo.
    var anchors = [];
    var lastPos = 0;
    region.forEach(function(line, idx){
      var m = line.match(ANCHOR_STRONG_RE);
      var strong = true;
      if (!m){ m = line.match(ANCHOR_MEDIUM_RE); strong = false; }
      if (!m) return;
      var pos = parseInt(m[1], 10);
      if (!pos || pos < 1 || pos > 300) return;
      if (pos <= lastPos || pos > lastPos + 5) return;
      if (anchors.length === 0 && pos > 3) return;
      if (!strong && !/[A-Za-zÀ-ÿ]{3,}/.test(line)) return;
      anchors.push({ index: idx, position: pos, strong: strong });
      lastPos = pos;
    });

    var nextAuto = 1;
    if (anchors.length){
      anchors.forEach(function(anc, n){
        var stop = (n + 1 < anchors.length) ? anchors[n + 1].index : region.length;
        var blob = region.slice(anc.index, stop).join(' ').replace(/\s+/g, ' ').trim();
        // Um bloco pode conter mais de um item quando o OCR perdeu o Nº do
        // item seguinte — por isso ainda dividimos pelo padrão de compra.
        var parsedItems = parseBlob(blob, anc.strong);
        parsedItems.forEach(function(it, sub){
          it.position = (sub === 0) ? anc.position : (anc.position + sub);
          if (sub > 0) it.confidence = 'baixa';
          result.items.push(it);
          nextAuto = it.position + 1;
        });
      });
    } else {
      // Nota sem Nº legível: vamos linha por linha, guardando a última linha
      // de texto como possível nome do item seguinte. Importante NÃO juntar a
      // região inteira num bloco só — senão endereço e cabeçalho da loja
      // acabam grudados no nome do primeiro produto.
      var pending = '';
      var lastItem = null;
      region.forEach(function(line){
        // Linha só com valor: é o total do item anterior, não um item novo.
        var om = line.match(ONLY_MONEY_RE);
        if (om){
          if (lastItem && lastItem._needsTotal){
            var v = parseBRLNumber(om[1]);
            if (v != null && v > 0){ lastItem.value = v; lastItem._needsTotal = false; }
          }
          return;
        }
        var got = parseBlob(line, false);
        if (!got.length){
          var cand = cleanProductName(line);
          pending = (cand && !HEADER_WORDS_RE.test(cand)) ? cand : '';
          return;
        }
        // Se o primeiro item da linha ficou sem nome, aproveitamos o texto da
        // linha anterior (caso clássico de nome e valor em linhas separadas).
        if (!got[0].description && pending){
          got[0].description = pending;
          got[0].confidence = 'baixa';
        }
        pending = '';
        got.forEach(function(it){
          it.position = nextAuto++;
          it.confidence = 'baixa';
          result.items.push(it);
          lastItem = it;
        });
      });
    }

    // Descarta o que claramente não é produto e limita nomes gigantes que só
    // aparecem quando o OCR grudou linhas que não deviam.
    result.items = result.items.filter(function(it){
      return !HEADER_WORDS_RE.test(it.description);
    });
    result.items.forEach(function(it){
      if (it.description.length > 60) it.description = it.description.slice(-60).trim();
      if (!it.description) it.description = 'Item ' + it.position;
      delete it._needsTotal;
    });

    return result;
  }

  /* Divide um bloco de texto em um ou mais itens e extrai os 4 campos. */
  function parseBlob(blob, strongAnchor){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var fullRe = new RegExp(QTY_FULL_SRC, 'gi');
    var hits = [], m;
    while ((m = fullRe.exec(blob)) !== null){
      hits.push({ start:m.index, end:m.index + m[0].length, qty:m[1], unit:m[2], unitPrice:parseBRLNumber(m[3]) });
      if (m.index === fullRe.lastIndex) fullRe.lastIndex++;
    }

    // Nenhum padrão "qtd UN x valor": o bloco é um item só, sem quantidade
    // confiável. O valor é o último número em R$ do bloco.
    if (!hits.length) return buildLooseItem(blob, strongAnchor);

    var out = [];
    hits.forEach(function(h, i){
      var nameFrom = (i === 0) ? 0 : hits[i-1].end;
      var nameSlice = blob.slice(nameFrom, h.start);
      // O valor total do item é o PRIMEIRO valor em R$ depois do padrão de
      // compra (o unitário já foi consumido pelo próprio padrão).
      var tailTo = (i + 1 < hits.length) ? hits[i+1].start : blob.length;
      var tail = blob.slice(h.end, tailTo);
      var tailMoney = tail.match(moneyRe);

      var ru = readUnitsOrWeight(h.qty, h.unit);
      var confidence = 'alta';
      var units = null, weight = null;
      if (ru.ok){ units = ru.units; weight = ru.weight; }
      else confidence = 'baixa';

      var value = tailMoney && tailMoney.length ? parseBRLNumber(tailMoney[0]) : null;
      var needsTotal = (value == null);
      if (value == null){
        // O OCR perdeu o total do item — reconstruímos com quantidade × unitário.
        var qtyN = (weight != null) ? weight : units;
        if (qtyN != null && h.unitPrice != null){
          value = Math.round(qtyN * h.unitPrice * 100) / 100;
          confidence = 'baixa';
        }
      } else if (h.unitPrice != null){
        // Confere a conta impressa: quantidade × unitário = total. Se não
        // fechar, algum número foi lido errado.
        var qtyC = (weight != null) ? weight : units;
        if (qtyC != null){
          var tol = Math.max(0.05, value * 0.02);
          if (Math.abs(qtyC * h.unitPrice - value) > tol) confidence = 'baixa';
        }
      }
      if (value == null || value <= 0) return;

      var name = cleanProductName(nameSlice);
      if (!name){ name = ''; confidence = 'baixa'; }
      if (!strongAnchor && confidence === 'alta') confidence = 'media';

      out.push({ position:null, description:name, units:units, weight:roundKg(weight), value:value, confidence:confidence, _needsTotal:needsTotal });
    });

    return out.length ? out : buildLooseItem(blob, strongAnchor);
  }

  /* Item sem padrão de compra reconhecível: só nome + valor. */
  function buildLooseItem(blob, strongAnchor){
    var moneyRe = new RegExp(MONEY_SRC, 'g');
    var moneys = blob.match(moneyRe);
    if (!moneys || !moneys.length) return [];
    var value = parseBRLNumber(moneys[moneys.length - 1]);
    if (value == null || value <= 0) return [];

    var units = null, weight = null, confidence = 'media';
    var lm = blob.match(new RegExp(QTY_LOOSE_SRC, 'i'));
    if (lm){
      var ru = readUnitsOrWeight(lm[1], lm[2]);
      if (ru.ok){ units = ru.units; weight = ru.weight; }
    }
    if (units == null && weight == null){ units = 1; confidence = 'baixa'; }

    var name = cleanProductName(lm ? blob.slice(0, lm.index) : blob);
    if (!name){ name = cleanProductName(blob); }
    if (!name) confidence = 'baixa';
    if (!strongAnchor) confidence = 'baixa';

    return [{ position:null, description:name, units:units, weight:roundKg(weight), value:value, confidence:confidence }];
  }

  function roundKg(w){ return w == null ? null : Math.round(w * 1000) / 1000; }

  function setOcrStatus(formEl, text, kind){
    var el = formEl && formEl.querySelector('.ocr-status');
    if (!el) return;
    el.textContent = text || '';
    el.className = 'ocr-status' + (kind ? (' ocr-' + kind) : '');
  }

  function applyOcrResult(formEl, parsed){
    var filled = false;

    var descInput = formEl.querySelector('.description-input');
    if (descInput && !descInput.value.trim() && parsed.storeName){
      descInput.value = parsed.storeName;
      filled = true;
    }

    var dateInput = formEl.querySelector('.date-input');
    if (dateInput && parsed.date && dateInput.value === todayISO()){
      dateInput.value = parsed.date;
      filled = true;
    }

    var itemsList = formEl.querySelector('.items-list');
    var readCount = 0, toCheck = 0;
    if (itemsList && parsed.items.length && itemsList.querySelectorAll('.item-row').length === 0){
      itemsList.innerHTML = parsed.items.map(itemRowHTML).join('');
      readCount = parsed.items.length;
      toCheck = parsed.items.filter(function(it){ return it.confidence !== 'alta'; }).length;
      // Guarda o total impresso na nota (se o OCR conseguiu ler) pra comparar
      // com a soma dos itens no total exibido no fim da lista.
      if (parsed.total != null) itemsList.dataset.ocrTotal = String(parsed.total);
      else delete itemsList.dataset.ocrTotal;
      recalcItemsTotal(formEl);
      filled = true;
    } else {
      var valueInput = formEl.querySelector('.value-input');
      if (valueInput && !valueInput.readOnly && (!valueInput.value || parseFloat(valueInput.value) === 0) && parsed.total != null){
        valueInput.value = parsed.total.toFixed(2);
        filled = true;
      }
    }

    showOcrRawText(formEl, parsed.rawText);

    if (!filled){
      setOcrStatus(formEl, '⚠️ Não consegui identificar os dados da nota — preencha manualmente.', 'fail');
      return;
    }

    var msg = '✅ ' + readCount + (readCount === 1 ? ' item lido' : ' itens lidos');
    var kind = 'ok';
    // A própria nota costuma imprimir quantos itens tem — se o número que
    // lemos for diferente, algum item ficou de fora e é melhor avisar.
    if (parsed.itemCountPrinted != null && parsed.itemCountPrinted !== readCount){
      msg += ' — mas a nota diz ' + parsed.itemCountPrinted + '. Confira se faltou algum.';
      kind = 'fail';
    } else if (toCheck > 0){
      msg += ' — ' + toCheck + (toCheck === 1 ? ' precisa' : ' precisam') + ' de conferência (marcados abaixo).';
    } else {
      msg += '. Confira antes de salvar.';
    }
    setOcrStatus(formEl, msg, kind);
  }

  // Mostra o texto cru que o OCR enxergou na foto. Quando um item sai
  // errado, é aqui que dá pra ver se o problema foi a leitura da imagem
  // (foto tremida, vinco no papel) ou a interpretação dos campos.
  function showOcrRawText(formEl, rawText){
    if (!formEl) return;
    var holder = formEl.querySelector('.ocr-raw');
    if (!rawText || !String(rawText).trim()){
      if (holder) holder.remove();
      return;
    }
    if (!holder){
      var status = formEl.querySelector('.ocr-status');
      if (!status) return;
      holder = document.createElement('details');
      holder.className = 'ocr-raw';
      holder.innerHTML = '<summary>👁️ Ver o texto que li da nota</summary><pre></pre>';
      status.insertAdjacentElement('afterend', holder);
    }
    holder.querySelector('pre').textContent = String(rawText).trim();
  }

  async function runReceiptOCR(imageSource, formEl){
    if (!formEl || !formEl.isConnected) return;
    if (typeof Tesseract === 'undefined'){
      console.warn('Tesseract.js indisponível — leitura automática desativada.');
      setOcrStatus(formEl, '⚠️ Leitura automática indisponível agora — preencha manualmente.', 'fail');
      return;
    }
    setOcrStatus(formEl, '🔎 Lendo a nota automaticamente...', 'loading');
    var worker = null;
    try {
      // Usamos o worker diretamente (em vez do atalho Tesseract.recognize) pra
      // poder ajustar o modo de segmentação de página: "6" diz pro Tesseract
      // tratar a imagem como um bloco único de texto em colunas, o que costuma
      // funcionar bem melhor em cupom fiscal do que o modo automático padrão.
      worker = await Tesseract.createWorker('por');
      if (worker.setParameters){
        await worker.setParameters({ tessedit_pageseg_mode: '6', preserve_interword_spaces: '1' });
      }
      var out = await worker.recognize(imageSource);
      if (!formEl.isConnected) return;
      var text = (out && out.data && out.data.text) ? out.data.text : '';
      var parsed = parseReceiptText(text);
      applyOcrResult(formEl, parsed);
    } catch(e){
      console.error('OCR falhou', e);
      if (formEl.isConnected) setOcrStatus(formEl, '⚠️ Não consegui ler a nota automaticamente — preencha manualmente.', 'fail');
    } finally {
      if (worker){
        try { await worker.terminate(); } catch(e2){ /* ignora falha ao encerrar */ }
      }
    }
  }

  async function handlePhotoChange(input){
    var file = input.files[0];
    if (!file) return;
    var formEl = input.closest('form');
    try {
      var results = await Promise.all([compressImage(file, 120, 0.5), compressImage(file, 1000, 0.75)]);
      state.pendingPhoto = {thumb:results[0], full:results[1]};
      state.removeExistingPhoto = false;
      refreshPhotoSlot(formEl);
    } catch(e){
      alert('Não foi possível processar a imagem. Tente outra foto.');
      return;
    }
    try {
      var ocrImage = await prepareImageForOCR(file);
      runReceiptOCR(ocrImage, formEl);
    } catch(e){
      console.error('Preparo da imagem para OCR falhou', e);
      runReceiptOCR(file, formEl);
    }
  }

  /* ---------- Data refresh ---------- */

  async function refreshAndRender(){
    state.expenses = await loadExpenses();
    if (!state.settingsDraft){
      state.settings = await loadSettings();
      ensureSubTabDefaults();
    }
    render();
  }

  /* ---------- Event wiring ---------- */

  function wireEvents(){
    tabbarEl.addEventListener('click', function(e){
      var btn = e.target.closest('[data-tab]');
      if (!btn) return;
      state.currentTab = btn.getAttribute('data-tab');
      state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
      refreshAndRender();
    });

    contentEl.addEventListener('click', function(e){
      var seg = e.target.closest('[data-subtab]');
      if (seg){
        var wrap = seg.closest('[data-segmented]');
        var memberId = wrap.getAttribute('data-segmented');
        state.subTab[memberId] = seg.getAttribute('data-subtab');
        state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
        render();
        return;
      }
      var del = e.target.closest('[data-action="delete-expense"]');
      if (del){ handleDeleteExpense(del.getAttribute('data-id')); return; }

      var editBtn = e.target.closest('[data-action="edit-expense"]');
      if (editBtn){ handleEditStart(editBtn.getAttribute('data-id')); return; }

      var view = e.target.closest('[data-action="view-receipt"]');
      if (view){ handleViewReceipt(view.getAttribute('data-id')); return; }

      var remPending = e.target.closest('[data-action="remove-photo"]');
      if (remPending){ state.pendingPhoto = null; refreshPhotoSlot(remPending.closest('form')); return; }

      var remExisting = e.target.closest('[data-action="remove-existing-photo"]');
      if (remExisting){ state.removeExistingPhoto = true; refreshPhotoSlot(remExisting.closest('form')); return; }

      var cancelEdit = e.target.closest('[data-action="cancel-edit"]');
      if (cancelEdit){ state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false; render(); return; }

      var addItemBtn = e.target.closest('[data-action="add-item"]');
      if (addItemBtn){
        var formAI = addItemBtn.closest('form');
        var list = formAI.querySelector('.items-list');
        // Item novo já vem com o Nº seguinte da lista preenchido.
        var nextPos = list.querySelectorAll('.item-row').length + 1;
        list.insertAdjacentHTML('beforeend', itemRowHTML({position:nextPos, description:'', units:1, weight:'', value:''}));
        recalcItemsTotal(formAI);
        return;
      }

      var removeItemBtn = e.target.closest('[data-action="remove-item"]');
      if (removeItemBtn){
        var formRI = removeItemBtn.closest('form');
        removeItemBtn.closest('.item-row').remove();
        recalcItemsTotal(formRI);
        return;
      }

      // Clique numa barra do gráfico = filtro rápido daquele mês.
      var barra = e.target.closest('[data-action="pick-month"]');
      if (barra){
        var mesBarra = barra.getAttribute('data-month');
        // Tocar de novo no mês já selecionado volta pra visão de todos os meses.
        state.resumoMonth = (state.resumoMonth === mesBarra) ? 'all' : mesBarra;
        render();
        return;
      }

      var openItemsBtn = e.target.closest('[data-action="open-items"]');
      if (openItemsBtn){
        openItemsModal(openItemsBtn.getAttribute('data-category'));
        return;
      }

      var selYear = e.target.closest('[data-action="select-meses-year"]');
      if (selYear){
        state.mesesView = {mode:'months', year:Number(selYear.getAttribute('data-year')), month:null};
        render();
        return;
      }
      var selMonth = e.target.closest('[data-action="select-meses-month"]');
      if (selMonth){
        var monthKey = selMonth.getAttribute('data-month');
        state.mesesView = {mode:'month', year:state.mesesView.year, month:monthKey};
        render();
        return;
      }
      var backYears = e.target.closest('[data-action="meses-back-years"]');
      if (backYears){
        state.mesesView = {mode:'years', year:null, month:null};
        render();
        return;
      }
      var backMonths = e.target.closest('[data-action="meses-back-months"]');
      if (backMonths){
        state.mesesView = {mode:'months', year:Number(backMonths.getAttribute('data-year')), month:null};
        render();
        return;
      }
    });

    contentEl.addEventListener('input', function(e){
      var itemRow = e.target.closest ? e.target.closest('.item-row') : null;
      if (!itemRow) return;
      // Mexeu na linha? Então você já conferiu — o aviso de conferência sai.
      if (itemRow.classList.contains('conf-media') || itemRow.classList.contains('conf-baixa')){
        itemRow.classList.remove('conf-media', 'conf-baixa');
        itemRow.classList.add('conf-ok');
      }
      if (e.target.matches('.item-value-input')){
        var formQI = e.target.closest('form');
        if (formQI) recalcItemsTotal(formQI);
      }
    });

    contentEl.addEventListener('change', function(e){
      if (e.target.matches('[data-action="resumo-month"]')){
        state.resumoMonth = e.target.value;
        render();
        return;
      }
      if (e.target.matches('[data-action="entries-month"]')){
        state.entriesMonth[e.target.getAttribute('data-scope')] = e.target.value;
        render();
        return;
      }
      // Gasto fixo e parcelamento não convivem: um repete pra sempre com o
      // mesmo valor, o outro divide um valor único em N vezes.
      if (e.target.matches('.fixed-toggle-select')){
        var formFx = e.target.closest('form');
        var ehFixo = e.target.value === 'sim';
        formFx.querySelectorAll('.not-fixed-field').forEach(function(el){
          var pagamentoCredito = !el.classList.contains('card-only-field')
            || (formFx.querySelector('.payment-method-select') || {}).value === 'credito';
          el.style.display = (ehFixo || !pagamentoCredito) ? 'none' : 'block';
        });
        if (ehFixo){
          var tog = formFx.querySelector('.installment-toggle-select');
          if (tog) tog.value = 'nao';
          var campos = formFx.querySelector('.installment-fields');
          if (campos) campos.style.display = 'none';
        }
        return;
      }
      if (e.target.matches('.category-select')){
        var form = e.target.closest('form');
        var customField = form.querySelector('.custom-cat-field');
        customField.style.display = (e.target.value === '__custom__') ? 'block' : 'none';
        return;
      }
      if (e.target.matches('.card-select')){
        var formCard = e.target.closest('form');
        var customCardField = formCard.querySelector('.custom-card-field');
        customCardField.style.display = (e.target.value === '__custom__') ? 'block' : 'none';
        return;
      }
      if (e.target.matches('.payment-method-select')){
        var formPm = e.target.closest('form');
        var isCred = e.target.value === 'credito';
        var cardOnlyFields = formPm.querySelectorAll('.card-only-field');
        for (var i=0;i<cardOnlyFields.length;i++){ cardOnlyFields[i].style.display = isCred ? 'block' : 'none'; }
        var instToggle = formPm.querySelector('.installment-toggle-select');
        var instFields = formPm.querySelector('.installment-fields');
        if (!isCred){
          instFields.style.display = 'none';
        } else if (instToggle && instToggle.value === 'sim'){
          instFields.style.display = 'flex';
        }
        return;
      }
      if (e.target.matches('.installment-toggle-select')){
        var formInst = e.target.closest('form');
        var instFields2 = formInst.querySelector('.installment-fields');
        instFields2.style.display = (e.target.value === 'sim') ? 'flex' : 'none';
        return;
      }
      if (e.target.matches('.photo-input')){ handlePhotoChange(e.target); return; }
    });

    contentEl.addEventListener('submit', function(e){
      if (e.target.matches('.add-form')){ e.preventDefault(); handleFormSubmit(e.target); }
    });

    modalEl.querySelector('#modal-close').addEventListener('click', closeModal);
    modalEl.addEventListener('click', function(e){ if (e.target === modalEl) closeModal(); });

    settingsBtn.addEventListener('click', openSettingsModal);
    settingsModalEl.addEventListener('click', function(e){ if (e.target === settingsModalEl) closeSettingsModal(); });

    itemsModalEl.addEventListener('click', function(e){ if (e.target === itemsModalEl) closeItemsModal(); });
    itemsPanelEl.addEventListener('click', function(e){
      if (e.target.closest('#close-items-btn')){ closeItemsModal(); }
    });
    itemsPanelEl.addEventListener('change', function(e){
      if (e.target.matches('#items-sort-select')){
        state.itemsModalSort = e.target.value;
        renderItemsPanel();
        return;
      }
      if (e.target.matches('#items-month-select')){
        state.itemsModalMonth = e.target.value;
        renderItemsPanel();
        return;
      }
      if (e.target.matches('#items-group-toggle')){
        state.itemsModalGroup = e.target.checked;
        renderItemsPanel();
        return;
      }
    });

    settingsPanelEl.addEventListener('input', function(e){
      if (e.target.matches('.member-name-input')){
        var idx = Number(e.target.getAttribute('data-idx'));
        state.settingsDraft.members[idx].name = e.target.value;
        var row = e.target.closest('.settings-member-row');
        var badge = row.querySelector('.member-badge');
        badge.textContent = (e.target.value||'?').charAt(0).toUpperCase();
        return;
      }
      if (e.target.matches('.member-pct-input')){
        var idx2 = Number(e.target.getAttribute('data-idx'));
        state.settingsDraft.members[idx2].percentage = parseFloat(e.target.value)||0;
        updateSumNote();
        return;
      }
      if (e.target.matches('#household-name-input')){
        state.settingsDraft.householdName = e.target.value;
        return;
      }
      if (e.target.matches('.card-name-input')){
        var cidx = Number(e.target.getAttribute('data-idx'));
        state.settingsDraft.cards[cidx] = e.target.value;
        return;
      }
    });

    settingsPanelEl.addEventListener('click', function(e){
      if (e.target.closest('#add-member-btn')){
        var idx = state.settingsDraft.members.length;
        state.settingsDraft.members.push({id:'member_'+Date.now()+'_'+Math.floor(Math.random()*1000), name:'Pessoa '+(idx+1), percentage:0, color:PALETTE[idx % PALETTE.length]});
        renderSettingsModal();
        return;
      }
      if (e.target.closest('#add-card-btn')){
        if (!Array.isArray(state.settingsDraft.cards)) state.settingsDraft.cards = [];
        state.settingsDraft.cards.push('Novo cartão');
        renderSettingsModal();
        return;
      }
      var removeCardBtn = e.target.closest('[data-action="remove-card"]');
      if (removeCardBtn){
        var ridx = Number(removeCardBtn.getAttribute('data-idx'));
        state.settingsDraft.cards.splice(ridx, 1);
        renderSettingsModal();
        return;
      }
      if (e.target.closest('#save-settings-btn')){ saveSettingsAndClose(); return; }
      if (e.target.closest('#cancel-settings-btn')){ closeSettingsModal(); return; }
      if (e.target.closest('#load-demo-btn')){ loadDemoData(); return; }
      if (e.target.closest('#remove-demo-btn')){ removeDemoData(); return; }
      if (e.target.closest('#open-reset-btn')){ closeSettingsModal(); openResetModal(); return; }
    });

    resetModalEl.addEventListener('click', function(e){ if (e.target === resetModalEl) closeResetModal(); });
    resetPanelEl.addEventListener('click', function(e){
      if (e.target.closest('#cancel-reset-btn')){ closeResetModal(); return; }
      if (e.target.closest('#confirm-reset-btn')){ handleConfirmReset(); return; }
    });
    resetPanelEl.addEventListener('input', updateResetConfirmState);
    resetPanelEl.addEventListener('change', updateResetConfirmState);

    document.addEventListener('visibilitychange', function(){
      // Só atualiza sozinho na aba Resumo (sem formulário) — evita apagar
      // um gasto que a pessoa esteja preenchendo ao voltar de outro app/aba.
      if (document.visibilityState === 'visible' && (state.currentTab === 'resumo' || state.currentTab === 'meses')) refreshAndRender();
    });

    contentEl.addEventListener('keydown', function(e){
      // Evita que a tecla Enter (ou "Concluir"/"Ir" do teclado do celular)
      // envie o formulário antes da hora enquanto a pessoa ainda está
      // preenchendo os campos (principalmente ao cadastrar vários itens).
      if (e.key === 'Enter' && e.target.matches('.add-form input')){
        e.preventDefault();
      }
    });
  }

  /* ---------- Init ---------- */

  async function init(){
    contentEl = document.getElementById('content');
    loadingEl = document.getElementById('loading-screen');
    shellEl = document.getElementById('shell');
    tabbarEl = document.getElementById('tabbar');
    headerTitleEl = document.getElementById('header-title');
    headerSubEl = document.getElementById('header-sub');
    modalEl = document.getElementById('modal');
    modalBodyEl = document.getElementById('modal-body');
    settingsModalEl = document.getElementById('settings-modal');
    settingsPanelEl = document.getElementById('settings-panel');
    settingsBtn = document.getElementById('settings-btn');
    itemsModalEl = document.getElementById('items-modal');
    itemsPanelEl = document.getElementById('items-panel');
    resetModalEl = document.getElementById('reset-modal');
    resetPanelEl = document.getElementById('reset-panel');

    storageAvailable = await waitForStorage(3000);

    state.expenses = await loadExpenses();
    state.settings = await loadSettings();
    ensureSubTabDefaults();

    // App vazio abrindo pela primeira vez: já entra com os 3 meses de exemplo,
    // pra você ver como fica cheio sem precisar cadastrar nada. Acontece uma
    // vez só — depois que você carregar ou remover os exemplos pelo menu de
    // configurações, o app nunca mais preenche sozinho.
    if (storageAvailable && state.expenses.length === 0 && !demoAlreadyHandled()){
      state.expenses = demoExpenseSeed();
      await saveExpenses(state.expenses);
      markDemoHandled();
    }

    wireEvents();

    loadingEl.style.display = 'none';
    shellEl.classList.remove('hidden');

    if (!storageAvailable){
      var warn = document.createElement('div');
      warn.id = 'storage-warning';
      warn.textContent = 'Não foi possível conectar ao armazenamento agora — os gastos podem não ser salvos. Tente reabrir o app.';
      shellEl.insertBefore(warn, tabbarEl);
    }

    render();
  }

  init();
})();

</script>
</body>
</html>
