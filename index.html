  /* ---------- Comprovantes: IndexedDB ----------
     As fotos ficavam no localStorage junto com o resto. O problema é que o
     localStorage tem só ~5 MB no total, e uma foto de nota tirada de celular
     pesa entre 300 e 500 KB — ou seja, entre 9 e 16 comprovantes e o espaço
     acabava. Pior: quando enchia, a foto era descartada em silêncio.
     O IndexedDB é feito pra isso e trabalha na casa das centenas de MB, então
     as fotos passaram pra lá. Os gastos e as configurações continuam no
     localStorage, que é leve e simples de ler.
     Se o navegador não tiver IndexedDB (aba anônima antiga, configuração
     restrita), tudo volta pro localStorage sozinho — só com o limite de antes. */

  // Quanto do localStorage já foi usado. É estimativa: o navegador não expõe
  // o número exato, então contamos os caracteres (2 bytes cada, UTF-16) das
  // chaves e valores do app. Serve bem pra saber se está perto do limite.
  function usoDoArmazenamento(){
    var bytes = 0;
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (!k || k.indexOf('gastos_casa') !== 0) continue;
        bytes += (k.length + (localStorage.getItem(k) || '').length) * 2;
      }
    } catch(e){ return null; }
    var limite = 5 * 1024 * 1024;
    return { bytes:bytes, limite:limite, pct: Math.min(100, Math.round(bytes / limite * 100)) };
  }

  function formatarMB(bytes){
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  // Antes, quando o espaço acabava, a foto simplesmente não era gravada e
  // ninguém ficava sabendo. Agora o app fala.
  function avisarSeFotoNaoCoube(salvou){
    if (salvou) return;
    alert('O gasto foi salvo, mas a FOTO do comprovante não coube: o armazenamento do navegador está cheio.\n\nVá em Configurações → Backup, baixe uma cópia dos seus dados e apague comprovantes antigos pra liberar espaço.');
  }

  var LOJA_FOTOS = 'fotos';
  var receiptDbPromise = null;

  function receiptDb(){
    if (receiptDbPromise) return receiptDbPromise;
    receiptDbPromise = new Promise(function(resolve){
      try {
        if (typeof indexedDB === 'undefined') return resolve(null);
        var req = indexedDB.open('gastos_casa_comprovantes', 1);
        req.onupgradeneeded = function(){
          var db = req.result;
          if (!db.objectStoreNames.contains(LOJA_FOTOS)) db.createObjectStore(LOJA_FOTOS);
        };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ resolve(null); };
        req.onblocked = function(){ resolve(null); };
      } catch(e){ resolve(null); }
    });
    return receiptDbPromise;
  }

  function idbOp(db, modo, fn){
    return new Promise(function(resolve, reject){
      try {
        var tx = db.transaction(LOJA_FOTOS, modo);
        var req = fn(tx.objectStore(LOJA_FOTOS));
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      } catch(e){ reject(e); }
    });
  }

  function chaveFotoAntiga(id){ return 'gastos_casa_receipt_full_' + id; }

  // Traz pro IndexedDB as fotos que ficaram no localStorage de versões antigas.
  // Roda uma vez na abertura e libera o espaço que elas ocupavam.
  async function migrarFotosAntigas(){
    var db = await receiptDb();
    if (!db || !storageAvailable) return 0;
    var chaves = [];
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('gastos_casa_receipt_full_') === 0) chaves.push(k);
      }
    } catch(e){ return 0; }
    var movidas = 0;
    for (var j = 0; j < chaves.length; j++){
      try {
        var valor = localStorage.getItem(chaves[j]);
        if (!valor) continue;
        var id = chaves[j].replace('gastos_casa_receipt_full_', '');
        await idbOp(db, 'readwrite', function(loja){ return loja.put(valor, id); });
        localStorage.removeItem(chaves[j]);
        movidas++;
      } catch(e){ /* deixa onde está e segue */ }
    }
    return movidas;
  }

  async function saveFullReceipt(id, dataUrl){
    var db = await receiptDb();
    if (db){
      try {
        await idbOp(db, 'readwrite', function(loja){ return loja.put(dataUrl, id); });
        return true;
      } catch(e){ console.error('saveFullReceipt (IndexedDB)', e); }
    }
    if (!storageAvailable) return false;
    try {
      localStorage.setItem(chaveFotoAntiga(id), dataUrl);
      return true;
    } catch(e){
      console.error('saveFullReceipt', e);
      return false;
    }
  }

  async function loadFullReceipt(id){
    var db = await receiptDb();
    if (db){
      try {
        var v = await idbOp(db, 'readonly', function(loja){ return loja.get(id); });
        if (v) return v;
      } catch(e){ /* tenta o localStorage abaixo */ }
    }
    if (!storageAvailable) return null;
    try {
      return localStorage.getItem(chaveFotoAntiga(id));
    } catch(e){
      console.error('loadFullReceipt', e);
      return null;
    }
  }

  async function deleteFullReceipt(id){
    var db = await receiptDb();
    if (db){
      try { await idbOp(db, 'readwrite', function(loja){ return loja.delete(id); }); }
      catch(e){ console.error('deleteFullReceipt (IndexedDB)', e); }
    }
    if (!storageAvailable) return;
    try {
      localStorage.removeItem(chaveFotoAntiga(id));
    } catch(e){
      console.error('deleteFullReceipt', e);
    }
  }

  /* ---------- Image handling ---------- */

  function compressImage(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  // Versão da foto usada só para a leitura automática (OCR): maior resolução
  // que a guardada no app, e em preto-e-branco com contraste realçado — isso
  // ajuda bastante o reconhecimento de texto em cupons fiscais fotografados.
  function prepareImageForOCR(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          // Resolução maior ajuda MUITO em cupons de impressora matricial (os
          // "pontinhos" do texto ficam pequenos e a leitura precisa de mais
          // pixels pra reconhecer cada caractere).
          var maxWidth = 2200, minWidth = 1400;
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          // Foto pequena demais também atrapalha: o Tesseract precisa de uns
          // 20px de altura por caractere. Ampliar antes de ler ajuda mais do
          // que atrapalha em cupom (o texto é impresso em pontinhos).
          else if (w < minWidth){ h = Math.round(h * (minWidth / w)); w = minWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try {
            var imgData = ctx.getImageData(0, 0, w, h);
            var d = imgData.data;
            var hist = new Array(256).fill(0);
            var i, g;
            for (i = 0; i < d.length; i += 4){
              g = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
              d[i] = d[i+1] = d[i+2] = g;
              hist[g]++;
            }
            // Alonga o contraste usando percentis (2%–98%) em vez do mínimo/máximo
            // cru — assim um brilho de reflexo ou uma sombra no canto da foto não
            // estraga o realce da folha inteira, como aconteceria com min/max puro.
            var totalPx = w * h;
            var lowCut = totalPx * 0.02, highCut = totalPx * 0.02;
            var acc = 0, lo = 0, hi = 255;
            for (i = 0; i < 256; i++){ acc += hist[i]; if (acc >= lowCut){ lo = i; break; } }
            acc = 0;
            for (i = 255; i >= 0; i--){ acc += hist[i]; if (acc >= highCut){ hi = i; break; } }
            if (hi <= lo){ lo = 0; hi = 255; }
            var range = hi - lo;
            for (i = 0; i < d.length; i += 4){
              var v = (d[i] - lo) * (255 / range);
              if (v < 0) v = 0; else if (v > 255) v = 255;
              d[i] = d[i+1] = d[i+2] = v;
            }
            ctx.putImageData(imgData, 0, 0);
          } catch(err){ /* segue sem o realce se o navegador não permitir */ }
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Computation ---------- */

  // Mais novo em cima. A data resolve a maioria dos casos, mas quatro compras
  // no MESMO dia empatavam e ficavam na ordem em que foram digitadas — quem
  // acabou de lançar via o item novo lá embaixo. O id carrega a hora exata do
  // lançamento (id_<timestamp>_...), então ele desempata.
  function ordemMaisRecente(a, b){
    var d = String(b.date || '').localeCompare(String(a.date || ''));
    if (d !== 0) return d;
    return String(b.id || '').localeCompare(String(a.id || ''));
  }

  // Uma compra em 3x tem dois números diferentes e os dois importam: o que
  // sai agora e o que a compra custa inteira. Antes o cabeçalho da categoria
  // mostrava só o valor cheio, e o mês parecia mais caro do que foi.
  function calcDoGasto(e){
    if (e.installment && e.installmentsTotal) return computeInstallment(e);
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function groupByCategory(list){
    var map = {};
    list.forEach(function(e){
      if (!map[e.category]) map[e.category] = [];
      map[e.category].push(e);
    });
    var groups = Object.keys(map).map(function(cat){
      var items = map[cat].slice().sort(ordemMaisRecente);
      var total = items.reduce(function(s,e){ return s+e.value; }, 0);
      var noMes = items.reduce(function(s,e){ return s + calcDoGasto(e).paidValue; }, 0);
      var futuro = items.reduce(function(s,e){ return s + calcDoGasto(e).remainingValue; }, 0);
      return {category:cat, items:items, total:total, noMes:noMes, futuro:futuro};
    });
    groups.sort(function(a,b){ return b.total - a.total; });
    return groups;
  }

  // monthKey opcional ('2026-09'): quando informado, considera só as contas
  // lançadas naquele mês. As abas de cada pessoa continuam chamando sem o
  // filtro, então o comportamento delas não muda.
  function computeSettlement(monthKey){
    var members = state.settings.members;
    var casalExpenses = expensesFor(monthKey).filter(function(e){ return e.type === 'casal'; });
    var totalCasal = casalExpenses.reduce(function(s,e){ return s+casalCalc(e).paidValue; }, 0);
    var pctSum = members.reduce(function(s,m){ return s + (Number(m.percentage)||0); }, 0) || 1;

    var spent = {};
    members.forEach(function(m){ spent[m.id] = 0; });
    casalExpenses.forEach(function(e){
      if (spent.hasOwnProperty(e.person)) spent[e.person] += casalCalc(e).paidValue;
    });

    var balances = members.map(function(m){
      var share = (Number(m.percentage)||0) / pctSum;
      var fairShare = totalCasal * share;
      var s = spent[m.id] || 0;
      return {id:m.id, name:m.name, color:m.color, spent:s, fairShare:fairShare, balance: s - fairShare};
    });

    var creditors = balances.filter(function(b){ return b.balance > 0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });
    var debtors = balances.filter(function(b){ return b.balance < -0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:-b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });

    var transfers = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length){
      var c = creditors[ci], d = debtors[di];
      var amt = Math.min(c.amount, d.amount);
      if (amt > 0.005) transfers.push({from:d.name, to:c.name, amount:amt});
      c.amount -= amt; d.amount -= amt;
      if (c.amount <= 0.005) ci++;
      if (d.amount <= 0.005) di++;
    }

    return {totalCasal:totalCasal, balances:balances, transfers:transfers};
  }

  function computeInstallment(e){
    var total = Math.max(1, Number(e.installmentsTotal)||1);
    var paid = Math.min(Math.max(0, Number(e.installmentsPaid)||0), total);
    var parcelValue = e.value / total;
    return {
      installment:true,
      parcelValue:parcelValue,
      total:total,
      paid:paid,
      remaining: total-paid,
      paidValue: parcelValue*paid,
      remainingValue: parcelValue*(total-paid)
    };
  }

  function personalCalc(e){
    if (e.paymentMethod === 'credito' && e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function casalCalc(e){
    if (e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function personalSummary(memberId, monthKey){
    var list = expensesFor(monthKey).filter(function(e){
      return e.person===memberId && e.type==='pessoal';
    });
    var totals = {totalComprado:0, totalPago:0, totalAPagar:0, parcelasRestantes:0};
    list.forEach(function(e){
      var c = personalCalc(e);
      totals.totalComprado += e.value;
      totals.totalPago += c.paidValue;
      totals.totalAPagar += c.remainingValue;
      totals.parcelasRestantes += c.remaining;
    });
    return totals;
  }

  function addMonthsToDate(date, n){
    return new Date(date.getFullYear(), date.getMonth()+n, date.getDate());
  }

  // Linha do tempo dos gastos pessoais de uma pessoa, no mesmo formato da do
  // casal — assim o gráfico de barras serve pros dois sem mudar nada.
  // Compra parcelada entra pelo valor da PARCELA no mês em que ela cai, não
  // pelo valor cheio no mês da compra: é o que você realmente paga naquele mês.
  function buildPersonalMonthsTimeline(memberId){
    var lista = materializedAll(2).filter(function(e){
      return e.person === memberId && e.type === 'pessoal';
    });
    var map = {};
    function addTo(key, ano, mes, valor){
      if (!map[key]) map[key] = {year:ano, month:mes, total:0, items:[]};
      map[key].total += valor;
      map[key].items.push(1);
    }
    lista.forEach(function(e){
      var compra = new Date(e.date + 'T00:00:00');
      if (isNaN(compra.getTime())) return;
      var c = personalCalc(e);
      if (!c.installment){
        addTo(monthKeyFromDate(e.date), compra.getFullYear(), compra.getMonth(), e.value);
        return;
      }
      for (var k = 1; k <= c.total; k++){
        var venc = addMonthsToDate(compra, k - 1);
        var chave = venc.getFullYear() + '-' + String(venc.getMonth()+1).padStart(2,'0');
        addTo(chave, venc.getFullYear(), venc.getMonth(), c.parcelValue);
      }
    });
    var atual = currentMonthKey();
    return Object.keys(map).sort().map(function(k){
      var m = map[k];
      return { key:k, year:m.year, month:m.month, items:m.items, total:m.total,
               isPast:k < atual, isCurrent:k === atual, isFuture:k > atual };
    });
  }

  function upcomingMonthsForMember(memberId){
    var list = state.expenses.filter(function(e){ return e.person===memberId && e.type==='pessoal'; });
    var map = {};
    var currentYear = new Date().getFullYear();
    list.forEach(function(e){
      var c = personalCalc(e);
      if (!c.installment || c.remaining <= 0) return;
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      for (var k = c.paid+1; k <= c.total; k++){
        var due = addMonthsToDate(purchaseDate, k-1);
        var key = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
        if (!map[key]) map[key] = {year:due.getFullYear(), month:due.getMonth(), count:0, value:0};
        map[key].count += 1;
        map[key].value += c.parcelValue;
      }
    });
    var keys = Object.keys(map).sort();
    return keys.map(function(k){
      var m = map[k];
      var label = MONTH_NAMES_PT[m.month] + (m.year !== currentYear ? '/' + String(m.year).slice(2) : '');
      return {label:label, count:m.count, value:m.value};
    });
  }

  function buildCasalMonthsTimeline(){
    // 2 meses à frente: as parcelas e os gastos fixos que já estão contratados
    // aparecem como "previsto" antes de chegar a data.
    var casalExpenses = materializedAll(2).filter(function(e){ return e.type === 'casal'; });
    var map = {};
    function addTo(key, year, month, item){
      if (!map[key]) map[key] = {year:year, month:month, items:[]};
      map[key].items.push(item);
    }
    casalExpenses.forEach(function(e){
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      var c = casalCalc(e);
      if (!c.installment){
        var key = purchaseDate.getFullYear() + '-' + String(purchaseDate.getMonth()+1).padStart(2,'0');
        addTo(key, purchaseDate.getFullYear(), purchaseDate.getMonth(), {
          id:e.id, description:e.description, category:e.category, value:e.value, installmentLabel:null, paid:true
        });
      } else {
        for (var k = 1; k <= c.total; k++){
          var due = addMonthsToDate(purchaseDate, k-1);
          var key2 = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
          addTo(key2, due.getFullYear(), due.getMonth(), {
            id:e.id, description:e.description, category:e.category, value:c.parcelValue,
            installmentLabel:(k+'/'+c.total), paid:(k<=c.paid)
          });
        }
      }
    });
    var keys = Object.keys(map).sort();
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    return keys.map(function(k){
      var m = map[k];
      var items = m.items.slice().sort(function(a,b){ return (a.description||'').localeCompare(b.description||''); });
      var total = items.reduce(function(s,it){ return s+it.value; }, 0);
      return {
        key:k, year:m.year, month:m.month, items:items, total:total,
        isPast: k < currentKey, isCurrent: k === currentKey, isFuture: k > currentKey
      };
    });
  }

  function buildCasalYearsTimeline(){
    var timeline = buildCasalMonthsTimeline();
    var map = {};
    var order = [];
    timeline.forEach(function(g){
      if (!map[g.year]){ map[g.year] = {year:g.year, months:[], total:0, hasCurrent:false}; order.push(g.year); }
      map[g.year].months.push(g);
      map[g.year].total += g.total;
      if (g.isCurrent) map[g.year].hasCurrent = true;
    });
    // Ordem da lista: o ano atual sempre em cima, depois os anos que ainda vão
    // chegar em ordem crescente (é a sequência natural do que vem pela frente),
    // e por último o histórico, do mais recente pro mais antigo.
    var anoAtual = new Date().getFullYear();
    return order.sort(function(a,b){
      if (a === anoAtual) return -1;
      if (b === anoAtual) return 1;
      var aFuturo = a > anoAtual, bFuturo = b > anoAtual;
      if (aFuturo !== bFuturo) return aFuturo ? -1 : 1;
      return aFuturo ? (a - b) : (b - a);
    }).map(function(y){ return map[y]; });
  }

  function monthKeyFromDate(iso){ return String(iso||'').slice(0,7); }

  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  // Quantos meses separam dois meses (chaves '2026-09').
  function mesesEntre(de, ate){
    var a = String(de).split('-'), b = String(ate).split('-');
    return (Number(b[0]) - Number(a[0])) * 12 + (Number(b[1]) - Number(a[1]));
  }

  // Parcelas que já venceram, contando a partir do mês da compra (a 1ª vence
  // no próprio mês). É esta conta que o app passou a fazer sozinho — antes a
  // pessoa tinha que calcular de cabeça e digitar.
  function parcelasVencidas(dataISO, total){
    total = Math.max(1, Number(total) || 1);
    var n = mesesEntre(monthKeyFromDate(dataISO), currentMonthKey()) + 1;
    return Math.min(total, Math.max(0, n));
  }

  function monthKeyAdd(mk, n){
    var p = String(mk).split('-');
    var y = Number(p[0]), m = Number(p[1]) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + String(m + 1).padStart(2,'0');
  }
  // Dia 31 num mês de 30 vira dia 30 — senão a data do gasto fixo escorregaria
  // pro mês seguinte e ele sumiria do mês certo.
  function dateInMonth(mk, day){
    var p = String(mk).split('-');
    var y = Number(p[0]), m = Number(p[1]);
    var ultimo = new Date(y, m, 0).getDate();
    return mk + '-' + String(Math.min(day || 1, ultimo)).padStart(2,'0');
  }

  /* ---------- Gastos fixos ----------
     Um gasto fixo é lançado UMA vez e vale de lá pra frente. Em vez de gravar
     uma cópia dele em cada mês (o que encheria o armazenamento e faria você ter
     que editar 12 lugares pra mudar o valor do aluguel), guardamos só o
     original e "materializamos" uma cópia na hora de mostrar cada mês.
     A cópia tem id "original@2026-10" — é assim que editar ou excluir uma
     repetição sabe voltar pro lançamento de verdade. */

  function baseExpenseId(id){ return String(id || '').split('@')[0]; }

  // Último mês em que um gasto fixo ainda vale. Sem prazo, devolve null.
  function fixedEndMonth(e){
    if (!e || !e.fixed || !e.fixedUntil) return null;
    var fim = monthKeyFromDate(e.fixedUntil);
    return fim || null;
  }

  // Quantos meses ainda vão cair, contando o mês atual. Serve pro selo
  // "faltam 5 meses" da aba Contas Fixas.
  function fixedMesesRestantes(e){
    var fim = fixedEndMonth(e);
    if (!fim) return null;
    var inicio = monthKeyFromDate(e.date);
    var de = (currentMonthKey() > inicio) ? currentMonthKey() : inicio;
    return Math.max(0, mesesEntre(de, fim) + 1);
  }

  function fixedOccurrence(e, mk){
    if (!e.fixed) return null;
    var inicio = monthKeyFromDate(e.date);
    if (!inicio || mk < inicio) return null;
    // Conta fixa com prazo para de aparecer depois do mês combinado.
    var fim = fixedEndMonth(e);
    if (fim && mk > fim) return null;
    if (mk === inicio) return e;
    var dia = parseInt(String(e.date).slice(8,10), 10) || 1;
    var copia = Object.assign({}, e);
    copia.id = e.id + '@' + mk;
    copia.date = dateInMonth(mk, dia);
    copia.virtual = true;
    return copia;
  }

  // Até onde um gasto fixo se projeta pra frente. Sem esse limite, bastava
  // você lançar UMA conta lá em 2028 pra o app repetir todas as suas contas
  // fixas em cada um dos 20 meses até lá, inflando os totais dos anos futuros.
  // Dois meses à frente é o mesmo horizonte de "previsto" usado no gráfico.
  function fixedHorizon(){ return monthKeyAdd(currentMonthKey(), 2); }

  function materializedForMonth(mk){
    var out = [];
    var limite = fixedHorizon();
    state.expenses.forEach(function(e){
      if (e.fixed){
        // O mês de origem entra sempre; as repetições param no horizonte
        // (e antes disso, no prazo, se a pessoa tiver posto um).
        if (mk > limite && mk !== monthKeyFromDate(e.date)) return;
        var occ = fixedOccurrence(e, mk);
        if (occ) out.push(occ);
      } else if (monthKeyFromDate(e.date) === mk){
        out.push(e);
      }
    });
    return out;
  }

  // Meses que o app precisa considerar: do primeiro lançamento até o mês atual
  // (ou até o último lançamento, se você já lançou algo à frente).
  function expenseMonthSpan(mesesAdiante){
    var atual = currentMonthKey();
    var keys = state.expenses.map(function(e){ return monthKeyFromDate(e.date); })
      .filter(Boolean).sort();
    if (!keys.length) return [atual];
    var primeiro = keys[0];
    var ultimo = keys[keys.length - 1];
    if (ultimo < atual) ultimo = atual;
    if (mesesAdiante){
      var limite = monthKeyAdd(atual, mesesAdiante);
      if (limite > ultimo) ultimo = limite;
    }
    var out = [], mk = primeiro, guarda = 0;
    while (mk <= ultimo && guarda++ < 600){ out.push(mk); mk = monthKeyAdd(mk, 1); }
    return out;
  }

  function materializedAll(mesesAdiante){
    var out = [];
    expenseMonthSpan(mesesAdiante).forEach(function(mk){
      out = out.concat(materializedForMonth(mk));
    });
    return out;
  }

  // Ponto único de leitura: 'all' (ou vazio) devolve todos os meses,
  // 'YYYY-MM' devolve só aquele mês. Tudo que soma dinheiro passa por aqui.
  function expensesFor(monthKey, mesesAdiante){
    return (!monthKey || monthKey === 'all')
      ? materializedAll(mesesAdiante)
      : materializedForMonth(monthKey);
  }

  function monthLabelFromKey(key){
    var parts = key.split('-');
    if (parts.length !== 2) return key;
    var idx = Number(parts[1]) - 1;
    var name = MONTH_NAMES_PT[idx] || parts[1];
    return name + ' de ' + parts[0];
  }

  function getCategoryItems(category){
    var expenses = materializedAll().filter(function(e){ return e.type === 'casal' && e.category === category; });
    var items = [];
    expenses.forEach(function(e){
      if (Array.isArray(e.items) && e.items.length){
        e.items.forEach(function(it){
          var isNewSchema = it.value !== undefined;
          var subtotal, qty, weight;
          if (isNewSchema){
            subtotal = Number(it.value) || 0;
            qty = (it.units != null && it.units !== '') ? Number(it.units) : null;
            weight = (it.weight != null && it.weight !== '') ? Number(it.weight) : null;
          } else {
            // Itens salvos antes desta atualização (schema antigo: quantity/unitValue).
            qty = Number(it.quantity) || 1;
            var uv = Number(it.unitValue) || 0;
            subtotal = qty * uv;
            weight = null;
          }
          var displayQty = (qty != null) ? qty : (weight != null ? weight : 1);
          items.push({description:it.description, quantity:displayQty, weight:weight, unitValue: displayQty ? subtotal/displayQty : subtotal, subtotal:subtotal, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
        });
      } else {
        items.push({description:e.description, quantity:1, weight:null, unitValue:e.value, subtotal:e.value, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
      }
    });
    return items;
  }

  // Meses (mais recente primeiro) em que existe pelo menos uma compra nessa
  // categoria — usado para popular o filtro de mês em "Ver itens".
  function getAvailableMonths(items){
    var seen = {};
    items.forEach(function(it){ if (it.monthKey) seen[it.monthKey] = true; });
    return Object.keys(seen).sort(function(a,b){ return b.localeCompare(a); });
  }

  // Agrupa compras de itens pelo nome do produto (ignorando maiúscula/minúscula
  // e espaços nas pontas), somando a quantidade e o valor de todas as compras
  // desse produto — assim dá pra ver quantas unidades foram compradas no total.
  function groupItemsByProduct(items){
    var map = {};
    var order = [];
    items.forEach(function(it){
      var key = String(it.description||'').trim().toLowerCase();
      if (!map[key]){
        map[key] = {description: it.description, quantity: 0, subtotal: 0, purchases: 0, date: it.date};
        order.push(key);
      }
      var g = map[key];
      g.quantity += it.quantity;
      g.subtotal += it.subtotal;
      g.purchases += 1;
      if (it.date > g.date) g.date = it.date;
    });
    return order.map(function(k){
      var g = map[k];
      g.unitValue = g.quantity > 0 ? g.subtotal / g.quantity : g.subtotal;
      return g;
    });
  }

  function sortCategoryItems(items, sort){
    var arr = items.slice();
    if (sort === 'qty_desc') arr.sort(function(a,b){ return b.quantity - a.quantity; });
    else if (sort === 'value_desc') arr.sort(function(a,b){ return b.subtotal - a.subtotal; });
    else if (sort === 'value_asc') arr.sort(function(a,b){ return a.subtotal - b.subtotal; });
    else arr.sort(function(a,b){ return ordemMaisRecente({date:a.date, id:a.id}, {date:b.date, id:b.id}); });
    return arr;
  }

  /* ---------- Rendering: shared pieces ---------- */

  function renderTabBar(){
    var html = '<button data-tab="resumo" class="tab-btn' + (state.currentTab==='resumo' ? ' active' : '') + '">'

    html += '<button data-tab="fixas" class="tab-btn' + (state.currentTab==='fixas' ? ' active' : '') + '">'
      + '<span class="ic">🔁</span><span>Contas Fixas</span></button>';
    html += '<button data-tab="meses" class="tab-btn' + (state.currentTab==='meses' ? ' active' : '') + '">'
      + '<span class="ic">📅</span><span>Meses</span></button>';
    state.settings.members.forEach(function(m){
      var active = state.currentTab === m.id;
      html += '<button data-tab="' + escapeHTML(m.id) + '" class="tab-btn' + (active?' active':'') + '" style="' + (active ? ('color:'+m.color+';') : '') + '">'
        + '<span class="ic member-badge" style="background:' + m.color + ';">' + escapeHTML((m.name||'?').charAt(0).toUpperCase()) + '</span>'
        + '<span>' + escapeHTML(m.name) + '</span></button>';

    html += '<button data-apps="1" class="tab-btn">'

  }

  function updateHeaderText(){
    if (state.currentTab === 'resumo'){
      headerTitleEl.textContent = state.settings.householdName || 'Resumo';
      headerSubEl.textContent = 'Resumo dos gastos';
    } else if (state.currentTab === 'meses'){
      headerTitleEl.textContent = 'Meses';
      headerSubEl.textContent = 'Contas do casal, mês a mês';
    } else if (state.currentTab === 'fixas'){
      headerTitleEl.textContent = 'Contas fixas';
      headerSubEl.textContent = 'O que se repete todo mês';

      var m = memberById(state.currentTab);
      headerTitleEl.textContent = m.name;
      headerSubEl.textContent = 'Gastos de ' + m.name;
    }
  }

  // Categorias da casa. Se a casa nunca mexeu nisso, são as de fábrica.
  function catsDaCasa(){
    var c = state.settings && state.settings.categories;
    if (Array.isArray(c) && c.length) return c.slice();
    return CATEGORIES.map(function(x){ return x.id; });
  }

  // No banco a lista pode vir como ['Mercado', ...] (formato antigo) ou como
  // [{n:'Mercado', i:'🛒'}, ...] (com ícone). Os dois entram aqui.
  function normalizarCategorias(lista){
    var vistos = {}, out = [];
    (Array.isArray(lista) ? lista : []).forEach(function(c){
      var nome = (c && typeof c === 'object') ? String(c.n || '').trim() : String(c || '').trim();
      if (!nome || vistos[nome]) return;
      vistos[nome] = true;
      out.push(nome);
    });
    return out.length ? out : CATEGORIES.map(function(x){ return x.id; });
  }

  // Cartões seguem o mesmo caminho das categorias: no banco a lista pode vir
  // como ['Nubank', ...] (formato antigo) ou como [{n:'Nubank',i:'N',c:'#820AD1'}]
  // — os dois entram aqui, então nenhuma casa antiga quebra e nenhum SQL novo
  // precisa ser rodado.
  function normalizarCartoes(lista){
    var vistos = {}, out = [];
    (Array.isArray(lista) ? lista : []).forEach(function(c){
      var nome = (c && typeof c === 'object') ? String(c.n || '').trim() : String(c || '').trim();
      if (!nome || vistos[nome]) return;
      vistos[nome] = true;
      out.push(nome);
    });
    return out;
  }

  function aparenciaDaLista(lista, campo){
    var out = {};
    (Array.isArray(lista) ? lista : []).forEach(function(c){
      if (c && typeof c === 'object' && c.n && c[campo]) out[String(c.n).trim()] = String(c[campo]);
    });
    return out;
  }

  // Só grava o que a pessoa escolheu de propósito: o que vem da marca conhecida
  // fica de fora, senão a lista engorda com o que o app já sabe sozinho.
  function cartoesParaBanco(s){
    var icones = (s && s.cardIcons) || {};
    var cores = (s && s.cardColors) || {};
    return ((s && s.cards) || []).map(function(nome){
      var o = {n: nome};
      if (icones[nome]) o.i = icones[nome];
      if (cores[nome]) o.c = cores[nome];
      return (o.i || o.c) ? o : nome;
    });
  }

  function iconesDaLista(lista){
    var out = {};
    (Array.isArray(lista) ? lista : []).forEach(function(c){
      if (c && typeof c === 'object' && c.n && c.i) out[String(c.n).trim()] = String(c.i);
    });
    return out;
  }

  // Vai pro banco no formato com ícone, uma coluna só.
  function categoriasParaBanco(s){
    var icones = (s && s.categoryIcons) || {};
    return normalizarCategorias(s && s.categories).map(function(nome){
      return icones[nome] ? {n:nome, i:icones[nome]} : {n:nome};
    });
  }

  function categorySelectHTML(selected){
    var lista = catsDaCasa();
    var isKnown = lista.indexOf(selected) !== -1;
    var opts = lista.map(function(c){
      return '<option value="'+escapeHTML(c)+'"'+(c===selected?' selected':'')+'>'+catIcon(c)+' '+escapeHTML(c)+'</option>';
    }).join('');
    var customSelected = !!selected && !isKnown;
    opts += '<option value="__custom__"'+(customSelected?' selected':'')+'>✏️ Outra categoria…</option>';
    return {
      html: '<select class="category-select">'+opts+'</select>'
        + '<button type="button" class="link-gerenciar" data-action="abrir-categorias">✏️ criar, renomear ou apagar categorias</button>',
      customSelected: customSelected
    };
  }

  /* ---------- Mexer nas categorias (usado pelo gerenciador e pelas metas) ---------- */

  function usosDaCategoria(nome){
    return state.expenses.filter(function(e){ return e.category === nome; }).length;
  }

  // Troca o nome em tudo que aponta pra ele: lançamentos antigos, a lista da
  // casa e a meta. Mudar num lugar só deixaria gasto órfão com o nome velho.
  function trocarNomeCategoria(antiga, nova){
    state.expenses.forEach(function(e){ if (e.category === antiga) e.category = nova; });
    var lista = catsDaCasa().map(function(c){ return c === antiga ? nova : c; });
    var icones = Object.assign({}, state.settings.categoryIcons || {});
    if (icones[antiga]){ icones[nova] = icones[antiga]; delete icones[antiga]; }
    var metas = normalizarMetas(state.settings.goals);
    if (metas.categorias[antiga] !== undefined){
      metas.categorias[nova] = Math.max(Number(metas.categorias[nova]) || 0, Number(metas.categorias[antiga]) || 0);
      delete metas.categorias[antiga];
    }
    return Object.assign({}, state.settings, {categories: normalizarCategorias(lista), categoryIcons: icones, goals: metas});
  }

  // Apagar não pode sumir com gasto lançado. Quando a categoria está em uso,
  // os lançamentos são movidos pra outra em vez de desaparecerem.
  function removerCategoria(nome, destino){
    if (destino) state.expenses.forEach(function(e){ if (e.category === nome) e.category = destino; });
    var lista = catsDaCasa().filter(function(c){ return c !== nome; });
    var icones = Object.assign({}, state.settings.categoryIcons || {});
    delete icones[nome];
    var metas = normalizarMetas(state.settings.goals);
    delete metas.categorias[nome];
    return Object.assign({}, state.settings, {categories: normalizarCategorias(lista), categoryIcons: icones, goals: metas});
  }

  // Um só lugar define as formas de pagamento, pros dois formulários dizerem
  // a mesma coisa. "Pix, dinheiro ou boleto" é o que sobra: sai da conta, mas
  // não pertence a cartão nenhum.
  function paymentMethodSelectHTML(selected, incluirOutro){
    var opcoes = [];
    if (incluirOutro) opcoes.push(['outro', '💸 Pix, dinheiro ou boleto']);
    opcoes.push(['credito', '💳 Crédito']);
    opcoes.push(['debito', '💵 Débito']);
    if (!incluirOutro) opcoes.push(['outro', '💸 Pix, dinheiro ou boleto']);
    return '<select class="payment-method-select">' + opcoes.map(function(o){
      return '<option value="'+o[0]+'"'+(o[0]===selected?' selected':'')+'>'+o[1]+'</option>';
    }).join('') + '</select>';
  }

  /* ---------- Parcelamento ----------
     Antes eram dois campos: "nº de parcelas" e "parcelas pagas" — e o segundo
     obrigava a pessoa a contar nos dedos quantas já venceram desde a compra.
     Agora só o número de vezes é digitado; as pagas saem da data da compra,
     que o app já tem. Quem precisar corrigir (comprou e a 1ª só vem no mês
     seguinte, ou já adiantou parcelas) abre o ajuste manual. */
  function parcelaCamposHTML(editingExpense, visivel){
    var total = (editingExpense && editingExpense.installmentsTotal) ? editingExpense.installmentsTotal : 2;
    var data = (editingExpense && editingExpense.date) ? editingExpense.date : todayISO();
    var auto = parcelasVencidas(data, total);
    var pagas = (editingExpense && typeof editingExpense.installmentsPaid === 'number') ? editingExpense.installmentsPaid : auto;
    var manual = !!editingExpense && pagas !== auto;
    return ''
      + '<div class="installment-fields" style="display:'+(visivel?'block':'none')+';">'
        + '<div class="field"><label>Em quantas vezes?</label>'
          + '<div class="parcela-linha">'
            + '<input type="number" inputmode="numeric" min="1" max="99" step="1" class="installments-total-input" value="'+total+'">'
            + '<span class="parcela-x">x</span>'
            + '<span class="parcela-previa">—</span>'
          + '</div>'
          + '<div class="items-hint parcela-explica" style="margin:8px 0 0;"></div>'
        + '</div>'
        + '<button type="button" class="link-gerenciar parcela-ajuste-link" data-action="ajustar-parcelas">ajustar quantas já foram pagas</button>'
        + '<div class="field parcela-ajuste" style="display:'+(manual?'block':'none')+';margin-top:8px;">'
          + '<label>Parcelas já pagas</label>'
          + '<input type="number" inputmode="numeric" min="0" step="1" class="installments-paid-input" value="'+pagas+'">'
          + '<div class="items-hint" style="margin:6px 0 0;">Deixe em branco pra o app contar sozinho pela data da compra.</div>'
        + '</div>'
      + '</div>';
  }

  // Escreve, em português, o que aquele parcelamento significa: valor da
  // parcela, quando começa, quando acaba e quantas já venceram.
  function atualizarPreviaParcela(form){
    if (!form) return;
    var bloco = form.querySelector('.installment-fields');
    if (!bloco) return;
    var totalEl = form.querySelector('.installments-total-input');
    var valorEl = form.querySelector('.value-input');
    var dataEl = form.querySelector('.date-input');
    var pagasEl = form.querySelector('.installments-paid-input');
    var ajuste = form.querySelector('.parcela-ajuste');

    var total = Math.max(1, parseInt(totalEl ? totalEl.value : '', 10) || 1);
    var valor = parseFloat(valorEl ? valorEl.value : '') || 0;
    var data = (dataEl && dataEl.value) ? dataEl.value : todayISO();
    var auto = parcelasVencidas(data, total);

    var previa = form.querySelector('.parcela-previa');
    if (previa) previa.textContent = valor > 0 ? formatBRL(valor / total) : 'de ?';

    var manualLigado = ajuste && ajuste.style.display !== 'none';
    var pagas = manualLigado && pagasEl && pagasEl.value !== ''
      ? Math.min(total, Math.max(0, parseInt(pagasEl.value, 10) || 0))
      : auto;
    if (!manualLigado && pagasEl) pagasEl.value = auto;

    var primeiro = monthKeyFromDate(data);
    var ultimo = monthKeyAdd(primeiro, total - 1);
    var explica = form.querySelector('.parcela-explica');
    if (explica){
      explica.innerHTML = 'De ' + escapeHTML(monthLabelFromKey(primeiro)) + ' a ' + escapeHTML(monthLabelFromKey(ultimo))
        + '. Até hoje, <b>' + pagas + ' de ' + total + '</b> já ' + (pagas === 1 ? 'venceu' : 'venceram') + '.'
        + (pagas < total ? ' As que faltam aparecem na aba Meses.' : '');
    }
  }

  /* ---------- Prazo do gasto fixo ----------
     Nem toda conta fixa é pra sempre: financiamento acaba, curso tem 10 meses,
     seguro é anual. Quem não quiser pensar nisso deixa em "sem prazo" e nada
     muda — o campo do prazo só aparece depois de marcar "Sim". */

  function prazoFixoHTML(editingExpense, isFixed, sempreFixo){
    var ate = (editingExpense && editingExpense.fixed && editingExpense.fixedUntil) ? editingExpense.fixedUntil : '';
    var temPrazo = !!ate;
    return '<div class="field prazo-fixo-field"' + (sempreFixo ? ' data-sempre-fixo="1"' : '')
      + ' style="display:' + (isFixed ? 'block' : 'none') + ';">'
      + '<label>Por quanto tempo?</label>'
      + '<select class="prazo-toggle-select">'
        + '<option value="sempre"' + (temPrazo ? '' : ' selected') + '>Sem prazo — repete até eu tirar</option>'
        + '<option value="ate"' + (temPrazo ? ' selected' : '') + '>Tem prazo — vai até um mês certo</option>'
      + '</select>'
      + '<div class="prazo-data-linha" style="display:' + (temPrazo ? 'flex' : 'none') + ';">'
        + '<input type="hidden" class="prazo-ate-input" value="' + escapeHTML(ate) + '">'
        + '<button type="button" class="prazo-botao" data-action="abrir-calendario">'
          + '<span class="prazo-ic">📅</span>'
          + '<span class="prazo-txt">' + (temPrazo ? escapeHTML(rotuloPrazo(ate)) : 'Escolher até quando') + '</span>'
        + '</button>'
      + '</div>'
      + '<div class="items-hint prazo-dica" style="display:' + (isFixed ? 'block' : 'none') + ';margin:6px 0 0;">'
        + (temPrazo
            ? 'Depois desse mês ele para de aparecer sozinho. O que já passou continua no histórico.'
            : 'Financiamento, curso, seguro: se tem data pra acabar, escolha o prazo e o app para de repetir na hora certa.')
      + '</div></div>';
  }

  function rotuloPrazo(iso){
    if (!iso) return 'Escolher até quando';
    var mk = monthKeyFromDate(iso);
    var dia = String(iso).slice(8,10);
    var falta = mesesEntre(currentMonthKey(), mk) + 1;
    var quanto = falta <= 0 ? 'já terminou'
      : (falta === 1 ? 'este é o último mês' : 'faltam ' + falta + ' meses');
    return 'Até ' + dia + ' de ' + monthLabelFromKey(mk) + ' · ' + quanto;
  }

  function cardSelectHTML(selected){
    var cards = state.settings.cards && state.settings.cards.length ? state.settings.cards : DEFAULT_CARDS;
    var isKnown = cards.indexOf(selected) !== -1;
    var opts = cards.map(function(c){
      return '<option value="'+escapeHTML(c)+'"'+(c===selected?' selected':'')+'>'+escapeHTML(c)+'</option>';
    }).join('');
    var customSelected = !!selected && !isKnown;
    opts += '<option value="__custom__"'+(customSelected?' selected':'')+'>✏️ Outro cartão…</option>';
    return {html: '<select class="card-select">'+opts+'</select>', customSelected: customSelected};
  }

  //   campo 1 — Nº de posição do item na nota + nome do produto
  //   campo 2 — Unidade (quantas unidades)
  //   campo 3 — Peso em kg (só quando o item é vendido por peso; opcional)
  //   campo 4 — Valor do item na nota
  // Cada campo tem rótulo permanente (não só placeholder) pra nunca ficar
  // dúvida sobre qual número é qual, mesmo depois de preenchido pelo OCR.
  var CONF_LABEL = {
    media: '⚠️ Confira a unidade deste item',
    baixa: '⚠️ Não consegui ler direito — confira este item'
  };
  function itemRowHTML(item){
    item = item || {};
    var posVal = (item.position !== undefined && item.position !== null && item.position !== '') ? item.position : '';
    var unitsVal = (item.units !== undefined && item.units !== null && item.units !== '') ? item.units : '';
    var weightVal = (item.weight !== undefined && item.weight !== null && item.weight !== '') ? item.weight : '';
    var valueVal = (item.value !== undefined && item.value !== null && item.value !== '') ? item.value : '';
    // Dinheiro sempre com duas casas: sem isso 28,90 apareceria como "28.9".
    if (valueVal !== '' && !isNaN(parseFloat(valueVal))) valueVal = parseFloat(valueVal).toFixed(2);
    var conf = (item.confidence === 'media' || item.confidence === 'baixa') ? item.confidence : 'ok';
    return ''
      + '<div class="item-row conf-'+conf+'">'
      + '<div class="item-field item-field-pos"><span class="item-field-label">Nº</span><input type="number" inputmode="numeric" class="item-pos-input" min="1" step="1" placeholder="—" value="'+posVal+'"></div>'
      + '<div class="item-field item-field-desc"><span class="item-field-label">Produto</span><input type="text" class="item-desc-input" placeholder="Ex: Arroz 5kg" value="'+escapeHTML(item.description||'')+'"></div>'
      + '<div class="item-break"></div>'
      + '<div class="item-field item-field-units"><span class="item-field-label">Unid.</span><input type="number" inputmode="decimal" class="item-units-input" min="0" step="1" placeholder="—" value="'+unitsVal+'"></div>'
      + '<div class="item-field item-field-weight"><span class="item-field-label">Peso (kg)</span><input type="number" inputmode="decimal" class="item-weight-input" min="0" step="0.001" placeholder="—" value="'+weightVal+'"></div>'
      + '<div class="item-field item-field-value"><span class="item-field-label">Valor (R$)</span><input type="number" inputmode="decimal" class="item-value-input" min="0" step="0.01" placeholder="0,00" value="'+valueVal+'"></div>'
      + '<button type="button" class="item-remove-btn" data-action="remove-item">✕</button>'
      + '<span class="item-conf">'+(CONF_LABEL[conf] || '')+'</span>'

  function itemsTotalRowHTML(){
    return '<div class="items-total-row hidden"><span>🧮 Total dos itens: <span class="items-total-main">R$ 0,00</span></span><span class="items-total-ref"></span></div>';
  }

  function recalcItemsTotal(form){
    var rows = form.querySelectorAll('.item-row');
    var valueInput = form.querySelector('.value-input');
    var totalRow = form.querySelector('.items-total-row');
    if (rows.length === 0){
      if (valueInput){
        valueInput.readOnly = false;
        valueInput.classList.remove('computed-value');
      }
      if (totalRow) totalRow.classList.add('hidden');
      return;
    }
    var total = 0;
    rows.forEach(function(row){
      var val = parseFloat(row.querySelector('.item-value-input').value) || 0;
      total += val;
    });
    if (valueInput){
      valueInput.value = total.toFixed(2);
      valueInput.readOnly = true;
      valueInput.classList.add('computed-value');
    }
    if (totalRow){
      totalRow.classList.remove('hidden');
      var mainEl = totalRow.querySelector('.items-total-main');
      if (mainEl) mainEl.textContent = formatBRL(total);
      var refEl = totalRow.querySelector('.items-total-ref');
      var itemsList = form.querySelector('.items-list');
      var ocrTotal = itemsList ? parseFloat(itemsList.dataset.ocrTotal || '') : NaN;
      totalRow.classList.remove('totals-match', 'totals-mismatch');
      if (refEl){
        if (!isNaN(ocrTotal)){
          var matches = Math.abs(ocrTotal - total) < 0.02;
          refEl.textContent = (matches ? '✅ confere com o total da nota (' : '⚠️ total da nota lido: ') + formatBRL(ocrTotal) + (matches ? ')' : ' — confira os itens');
          totalRow.classList.add(matches ? 'totals-match' : 'totals-mismatch');
        } else {
          refEl.textContent = 'Confira com o total impresso na nota.';
        }
      }
    }
  }

    var todoMes = !mesSelecionado || mesSelecionado === 'all';

      ? 'Somando todos os meses'

    // O mesmo extrato por cartão da tela de Resumo, agora só com os gastos

    var listaPessoal = expensesFor(mesSelecionado).filter(function(e){
