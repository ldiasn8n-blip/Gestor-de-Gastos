<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Gastos da Casa</title>
<style>
  :root{
    /* Avisa o navegador que o app é escuro. Sem isso ele desenha as partes
       nativas — a listinha que abre no seletor de mês, o calendário do campo
       de data, a barra de rolagem — com fundo branco, e o texto claro do app
       fica ilegível em cima. */
    color-scheme:dark;
    --paper:#0A0C10;
    --paper-raised:#161A21;
    --input-bg:#1F2530;
    --ink:#EAF2EF;
    --ink-soft:#8B96A5;
    --line:#2A313D;
    --positive:#39FF88;
    --positive-soft:rgba(57,255,136,0.15);
    --alert:#FF4D6D;
    --alert-soft:rgba(255,77,109,0.15);
    --neon2:#4FE0FF;
    --hover:rgba(255,255,255,0.06);
    --hover-soft:rgba(255,255,255,0.04);
    --backdrop:rgba(0,0,0,0.68);
    --focus-ring:rgba(57,255,136,0.30);
    --radius:14px;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    --shadow-md:0 4px 16px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.05);
    --shadow-lg:0 16px 40px rgba(0,0,0,0.65), 0 0 24px rgba(57,255,136,0.08);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  button,input,select{ transition:background-color .15s ease, border-color .15s ease, box-shadow .15s ease, transform .1s ease, color .15s ease, filter .15s ease; }
  button{ -webkit-tap-highlight-color:transparent; }
  /* No celular, encostar num número fazia o navegador "marcar" o texto e
     abrir aquela barra de pesquisar/copiar por cima da tela. Isto aqui é um
     painel pra tocar, não um texto pra selecionar — então a seleção sai de
     tudo, e volta só onde ela serve: campos de digitação e o código de
     convite, que a pessoa às vezes copia na mão. */
  body{
    -webkit-user-select:none; -ms-user-select:none; user-select:none;
    -webkit-touch-callout:none;
  }
  input, textarea, [contenteditable], .selecionavel{
    -webkit-user-select:text; -ms-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #shell{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
  }
  #shell.hidden{ display:none; }
  header{
    padding:18px 20px 14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--paper);
    position:sticky;
    top:0;
    z-index:5;
    gap:10px;
    box-shadow:0 1px 0 var(--line), 0 2px 12px rgba(0,0,0,0.35);
  }
  header h1{
    font-size:19px;
    font-weight:700;
    margin:0;
    letter-spacing:-0.01em;
  }
  header .sub{
    font-size:12px;
    color:var(--ink-soft);
  }
  .gear-btn{
    border:none;background:none;font-size:19px;cursor:pointer;padding:4px 2px;color:var(--ink-soft);flex-shrink:0;
  }
  main{
    flex:1;
    padding:16px 16px 96px;
    overflow-y:auto;
  }
  #storage-warning{
    background:var(--alert-soft);color:var(--alert);font-size:12px;padding:8px 14px;text-align:center;
  }
  nav.tabbar{
    position:sticky;
    bottom:0;
    display:flex;
    background:var(--paper-raised);
    padding-bottom:env(safe-area-inset-bottom);
    z-index:10;
    overflow-x:auto;
    box-shadow:0 -1px 0 var(--line), 0 -2px 12px rgba(0,0,0,0.35);
  }
  nav.tabbar button{
    flex:1;
    min-width:64px;
    border:none;
    background:none;
    border-radius:10px;
    padding:10px 4px 8px;
    font-size:11px;
    color:var(--ink-soft);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    cursor:pointer;
    font-family:inherit;
    white-space:nowrap;
  }
  nav.tabbar button .ic{font-size:19px;}
  nav.tabbar button.active{font-weight:700;color:var(--ink);}
  nav.tabbar button:active{ transform:scale(0.94); }

  .member-badge{
    width:19px;height:19px;border-radius:50%;color:#fff;font-size:10.5px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }

  /* Segmented control */
  .segmented{
    display:flex;
    border:1px solid var(--line);
    border-radius:var(--radius);
    overflow:hidden;
    margin-bottom:16px;
    background:var(--paper-raised);
    box-shadow:var(--shadow-sm);
  }
  .segmented button{
    flex:1;
    padding:9px 6px;
    border:none;
    background:none;
    font-size:13.5px;
    font-weight:600;
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
  }
  .segmented button:active{ transform:scale(0.97); }

  /* Form */
  form.add-form{
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:14px;
    margin-bottom:20px;
    background:var(--paper-raised);
    box-shadow:var(--shadow-md);
  }
  form.add-form .field{margin-bottom:10px;}
  form.add-form label{
    display:block;
    font-size:12px;
    color:var(--ink-soft);
    margin-bottom:4px;
  }
  form.add-form select,
  form.add-form input[type="text"],
  form.add-form input[type="number"],
  form.add-form input[type="date"]{
    width:100%;
    padding:10px 10px;
    border:1px solid var(--line);
    border-radius:9px;
    font-size:16px;
    background:var(--input-bg);
    color:var(--ink);
    font-family:inherit;
  }
  form.add-form select:focus,
  form.add-form input:focus,
  #settings-panel input:focus,
  #metas-panel input:focus,
  #metas-panel select:focus,
  .item-row input:focus,
  .items-filter-row select:focus{
    outline:none;
    border-color:var(--positive);
    box-shadow:0 0 0 3px var(--focus-ring);
  }
  input:focus-visible, select:focus-visible, button:focus-visible{
    outline:none;
    box-shadow:0 0 0 3px var(--focus-ring);
  }
  .row2{display:flex;gap:10px;}
  .row2 > .field{flex:1;}
  .photo-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:2px;
    flex-wrap:wrap;
  }
  .photo-btn{
    border:1px dashed var(--line);
    border-radius:9px;
    padding:9px 12px;
    font-size:13px;
    background:var(--input-bg);
    color:var(--ink-soft);
    cursor:pointer;
    font-family:inherit;
  }
  .photo-btn:active{ transform:scale(0.97); }
  .photo-preview-slot{display:flex;align-items:center;gap:8px;}
  .ocr-status{ font-size:11.5px;color:var(--ink-soft);margin-top:6px;min-height:14px;line-height:1.4; }
  .ocr-status.ocr-loading{ color:var(--ink-soft); }
  .ocr-status.ocr-ok{ color:var(--positive); }
  .ocr-status.ocr-fail{ color:var(--alert); }
  .photo-preview{
    width:42px;height:42px;border-radius:6px;object-fit:cover;border:1px solid var(--line);
  }
  .photo-remove{
    font-size:12px;color:var(--alert);background:none;border:none;cursor:pointer;font-family:inherit;
  }
  .submit-btn{
    width:100%;
    border:none;
    border-radius:9px;
    padding:12px;
    font-size:14.5px;
    font-weight:700;
    color:#fff;
    cursor:pointer;
    margin-top:4px;
    font-family:inherit;
    box-shadow:var(--shadow-sm);
  }
  .submit-btn:active{ transform:scale(0.98); }
  .cancel-edit-btn{
    width:100%;
    border:none;
    background:none;
    color:var(--ink-soft);
    font-size:13px;
    padding:9px;
    cursor:pointer;
    font-family:inherit;
    border-radius:8px;
  }

  /* Ledger list */
  .cat-chip{
    display:inline-flex;align-items:center;justify-content:center;
    border-radius:8px;flex-shrink:0;vertical-align:middle;margin-right:2px;
  }
  .cat-group{margin-bottom:20px;background:var(--paper-raised);border-radius:var(--radius);padding:4px 14px;box-shadow:var(--shadow-sm);}
  .cat-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:10px 0 8px;
    margin-bottom:2px;
    border-bottom:1px solid var(--line);
  }
  .cat-head .name{font-size:13.5px;font-weight:700;display:flex;align-items:center;gap:7px;}
  .cat-head .total{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink-soft);}
  .entry{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px solid var(--line);
  }
  .entry:last-child{border-bottom:none;}
  .entry .thumb{
    width:40px;height:40px;border-radius:9px;object-fit:cover;flex-shrink:0;cursor:pointer;border:1px solid var(--line);
  }
  .entry .thumb-placeholder{
    width:40px;height:40px;border-radius:9px;flex-shrink:0;background:var(--paper);
    display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .entry .info{flex:1;min-width:0;}
  .entry .desc{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .entry .date{font-size:11.5px;color:var(--ink-soft);}
  .entry .value{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;}
  .entry .edit,
  .entry .del{
    border:none;background:none;color:var(--ink-soft);font-size:15px;cursor:pointer;padding:6px;border-radius:7px;font-family:inherit;
  }
  .entry .edit:active,
  .entry .del:active{ transform:scale(0.9); background:var(--hover); }
  .empty-state{
    text-align:center;
    padding:30px 10px;
    color:var(--ink-soft);
    font-size:13.5px;
  }

  /* Resumo */
  .hero-settlement{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    padding:20px 18px;
    margin-bottom:18px;
    box-shadow:var(--shadow-md);
  }
  .hero-settlement .label{font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;text-align:center;}
  .hero-settlement .amount.settled{color:var(--positive);font-size:16px;font-weight:700;text-align:center;}
  .transfer-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:8px 0;border-top:1px solid var(--line);
  }
  .transfer-row:first-of-type{border-top:none;}
  .transfer-row .direction{font-size:14px;font-weight:600;}
  .transfer-row .amount{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--alert);}
  .transfer-row .amount.single{font-size:30px;}
  .transfer-row:has(.amount.single){flex-direction:column;align-items:center;gap:6px;padding:6px 0 2px;}

  .compare{
    border:1px solid var(--line);
    border-radius:var(--radius);
    background:var(--paper-raised);
    padding:16px;
    margin-bottom:18px;
    box-shadow:var(--shadow-sm);
  }
  .compare-row{margin-bottom:12px;}
  .compare-row:last-child{margin-bottom:0;}
  .compare-row .top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;}
  .compare-row .top .who{font-weight:700;}
  .compare-row .top .val{font-variant-numeric:tabular-nums;font-weight:700;}
  .track{height:8px;border-radius:5px;background:var(--paper);overflow:hidden;}
  .track .fill{height:100%;border-radius:5px;transition:width .4s ease;}

  .section-title{font-size:13px;font-weight:700;color:var(--ink-soft);margin:22px 0 8px;}
  .personal-row{
    display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px;
  }
  .personal-row:last-child{border-bottom:none;}
  .personal-row span:first-child{display:flex;align-items:center;gap:7px;}
  .personal-row .val{font-weight:700;font-variant-numeric:tabular-nums;}
  .note{font-size:12px;color:var(--ink-soft);margin-top:6px;line-height:1.5;}

  /* Receipt modal */
  #modal{
    position:fixed;inset:0;background:rgba(0,0,0,0.85);
    display:flex;align-items:center;justify-content:center;
    z-index:50;padding:24px;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #modal img{max-width:100%;max-height:80vh;border-radius:10px;box-shadow:var(--shadow-lg);}
  #modal .close-btn{
    position:absolute;top:18px;right:18px;background:var(--paper-raised);color:var(--ink);border:none;
    width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;box-shadow:var(--shadow-md);
  }
  #modal .close-btn:active{ transform:scale(0.92); }
  #modal .spinner{color:var(--ink);font-size:13px;}

  /* Settings modal */
  #settings-modal{
    position:fixed;inset:0;background:var(--backdrop);
    display:flex;align-items:flex-end;justify-content:center;z-index:60;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #settings-modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #settings-modal.hidden #settings-panel{ transform:translateY(24px); }
  #settings-panel{
    background:var(--paper-raised);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
    max-height:85vh;overflow-y:auto;box-shadow:var(--shadow-lg);
    transform:translateY(0);transition:transform .2s ease;
  }
  #settings-panel h2{font-size:17px;margin:0 0 14px;}
  #settings-panel .field, #metas-panel .field{margin-bottom:14px;}
  #settings-panel label, #metas-panel label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:6px;}
  #settings-panel input[type="text"],
  #metas-panel input[type="text"],
  #metas-panel input[type="number"],
  #metas-panel select{
    width:100%;padding:10px 10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;
    background:var(--input-bg);color:var(--ink);
  }
  /* O campo de cada categoria fica na mesma linha do nome, então ele não
     pode esticar pra largura toda como os outros. */
  #metas-panel input.meta-cfg-input{ width:120px; padding:8px 9px; font-size:15px; }
  .settings-member-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
  .settings-member-row .member-name-input{
    flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  }
  .settings-member-row .member-pct-input{
    width:56px;padding:8px 6px;border:1px solid var(--line);border-radius:8px;font-size:14px;text-align:right;font-family:inherit;
  }
  .settings-member-row .card-name-input{
    flex:1;padding:8px 9px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;
  }
  .settings-member-row .photo-remove{padding:8px 6px;flex-shrink:0;}
  .pct-sign{font-size:13px;color:var(--ink-soft);}
  .pct-sum-note{font-size:12px;color:var(--ink-soft);margin:4px 0 14px;}
  .secondary-btn{
    border:1px solid var(--line);background:var(--input-bg);border-radius:9px;padding:9px 12px;
    font-size:13.5px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit;width:100%;
  }
  .secondary-btn:active{ transform:scale(0.98); }
  .gear-btn:active{ transform:scale(0.9); }
  .item-row .item-remove-btn:active{ transform:scale(0.9); }
  .settings-actions{display:flex;gap:10px;margin-top:16px;}
  .settings-actions button{flex:1;margin-top:0;}

  #loading-screen{
    display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-soft);font-size:14px;width:100%;
  }
  .loading-spinner{
    width:26px;height:26px;border-radius:50%;
    border:3px solid var(--line);border-top-color:var(--ink-soft);
    animation:spin .7s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* Itemized receipt entry (contas do casal) */
  .items-section{ margin-top:2px; }
  .items-section-head{ display:flex;justify-content:space-between;align-items:baseline; }
  .items-hint{ font-size:11.5px;color:var(--ink-soft);margin:2px 0 8px;line-height:1.4; }
  .items-list{ margin-bottom:8px; }
  .item-row{
    display:flex;flex-wrap:wrap;gap:6px 8px;align-items:flex-end;
    padding:8px;margin-bottom:6px;background:var(--paper);border-radius:8px;
  }
  .item-field{ display:flex;flex-direction:column;gap:3px;min-width:0; }
  .item-field-label{ font-size:10px;font-weight:600;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.03em; }
  /* Campo 1 (Nº + Produto) ocupa a primeira linha inteira; campos 2, 3 e 4
     (Unidade, Peso e Valor) dividem a segunda. A quebra é forçada pelo
     .item-break pra ordem nunca mudar conforme a largura da tela. */
  .item-field-pos{ flex:0 0 56px; }
  /* Sem as setinhas do input numérico sobra largura pro número aparecer
     inteiro — "12" estava saindo cortado como "1C". */
  .item-row .item-pos-input{ -moz-appearance:textfield; appearance:textfield; }
  .item-row .item-pos-input::-webkit-outer-spin-button,
  .item-row .item-pos-input::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  .item-field-desc{ flex:1 1 120px; }
  .item-break{ flex:1 1 100%; height:0; margin:0; }
  .item-field-units{ flex:1 1 60px; }
  .item-field-weight{ flex:1 1 70px; }
  .item-field-value{ flex:1 1 90px; }
  .item-row .item-desc-input,
  .item-row .item-pos-input,
  .item-row .item-units-input,
  .item-row .item-weight-input,
  .item-row .item-value-input{
    padding:8px 9px;border:1px solid var(--line);border-radius:7px;font-size:14px;background:var(--input-bg);color:var(--ink);font-family:inherit;width:100%;box-sizing:border-box;
  }
  .item-row .item-pos-input{ text-align:center;color:var(--ink-soft); }
  .item-row .item-units-input{ text-align:center; }
  .item-row .item-weight-input{ text-align:center; }
  .item-row .item-value-input{ text-align:right; }
  /* Selo de conferência: o item lido pelo OCR que não fechou a conta ou veio
     sem quantidade confiável ganha uma faixa colorida e um aviso, pra você
     saber exatamente qual linha revisar em vez de conferir a nota inteira. */
  .item-row.conf-media{ border-left:3px solid var(--warn, #d99b28); padding-left:9px; }
  .item-row.conf-baixa{ border-left:3px solid var(--alert); padding-left:9px; }
  .item-conf{
    flex:1 1 100%; font-size:11px; font-weight:600; margin:-2px 0 0;
    display:flex; align-items:center; gap:5px;
  }
  .conf-media .item-conf{ color:var(--warn, #d99b28); }
  .conf-baixa .item-conf{ color:var(--alert); }
  .item-row.conf-ok .item-conf{ display:none; }
  .ocr-raw{ margin-top:8px; font-size:11.5px; }
  .ocr-raw summary{ cursor:pointer; color:var(--ink-soft); user-select:none; }
  .ocr-raw pre{
    margin:6px 0 0; padding:8px 10px; background:var(--hover-soft, rgba(0,0,0,.04));
    border-radius:8px; max-height:220px; overflow:auto; white-space:pre-wrap;
    word-break:break-word; font-size:11px; line-height:1.45; color:var(--ink-soft);
  }
  .item-row .item-remove-btn{
    flex:0 0 auto;border:none;background:none;color:var(--alert);font-size:16px;cursor:pointer;padding:6px 6px 9px;font-family:inherit;
  }
  .add-item-btn{ width:100%; }
  .items-total-row{
    display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;
    padding:9px 10px;margin:2px 0 8px;background:var(--paper);border-radius:8px;font-size:13px;color:var(--ink-soft);
  }
  .items-total-row.hidden{ display:none; }
  .items-total-row .items-total-main{ font-weight:700;color:var(--ink); }
  .items-total-row .items-total-ref{ font-size:12px; }
  .items-total-row.totals-mismatch .items-total-ref{ color:var(--alert);font-weight:600; }
  .items-total-row.totals-match .items-total-ref{ color:var(--positive);font-weight:600; }
  .value-input.computed-value{ background:var(--paper);color:var(--ink-soft); }

  /* Category → items modal */
  #items-modal{
    position:fixed;inset:0;background:var(--backdrop);
    display:flex;align-items:flex-end;justify-content:center;z-index:60;
    opacity:1;visibility:visible;transition:opacity .18s ease, visibility .18s ease;
  }
  #items-modal.hidden{opacity:0;visibility:hidden;pointer-events:none;}
  #items-modal.hidden #items-panel{ transform:translateY(24px); }
  #items-panel{
    background:var(--paper-raised);width:100%;max-width:480px;
    border-radius:18px 18px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));

  /* ================================================================
     CAIXAS COM BORDA NEON
     Cada bloco do app é uma caixa fechada com uma cor própria: a borda,
     o brilho e a barrinha do título usam a mesma cor, então bate o olho e
     já sabe o que é o quê. A cor de cada caixa vem da variável --accent,
     definida por classe logo abaixo.
     O brilho é feito com box-shadow colorido (nunca com filter/blur, que
     borraria o texto dentro da caixa). ================================ */
  .neon-box{
    position:relative;
    background:var(--paper-raised);
    border:1px solid var(--accent-line, var(--line));
    border-radius:var(--radius);
    padding:15px 16px 16px;
    box-shadow:
      0 0 0 1px var(--accent-halo, transparent),
      0 0 26px -4px var(--accent-glow, transparent),
      inset 0 0 24px -18px var(--accent, transparent),
      var(--shadow-sm);
  }
  /* Fio de luz no topo da caixa — o detalhe que dá o ar de neon sem
     deixar o fundo inteiro colorido. */
  .neon-box::before{
    content:'';
    position:absolute; left:16px; right:16px; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent, transparent), transparent);
    opacity:.9;
  }
  .neon-box > .section-title{ margin-top:0; }

  /* Título com barrinha acesa do lado */
  .section-title{
    font-size:13px; font-weight:700; color:var(--ink-soft); margin:22px 0 8px;
    display:flex; align-items:center; gap:8px;
  }
  .neon-box > .section-title::before{
    content:''; flex:0 0 3px; width:3px; height:13px; border-radius:2px;
    background:var(--accent, var(--ink-soft));
    box-shadow:0 0 7px var(--accent, transparent);
  }
  .neon-box > .section-title{ color:var(--ink); letter-spacing:.01em; }

  /* Paleta das caixas. Cada área do app tem a sua cor fixa. */
  .acc-cyan   { --accent:#4FE0FF; --accent-line:rgba(79,224,255,0.48); --accent-halo:rgba(79,224,255,0.10); --accent-glow:rgba(79,224,255,0.62); }
  .acc-green  { --accent:#39FF88; --accent-line:rgba(57,255,136,0.44); --accent-halo:rgba(57,255,136,0.10); --accent-glow:rgba(57,255,136,0.56); }
  .acc-pink   { --accent:#FF4D6D; --accent-line:rgba(255,77,109,0.46); --accent-halo:rgba(255,77,109,0.10); --accent-glow:rgba(255,77,109,0.58); }
  .acc-purple { --accent:#B18CFF; --accent-line:rgba(177,140,255,0.46); --accent-halo:rgba(177,140,255,0.10); --accent-glow:rgba(177,140,255,0.58); }
  .acc-amber  { --accent:#FFC24F; --accent-line:rgba(255,194,79,0.44); --accent-halo:rgba(255,194,79,0.10); --accent-glow:rgba(255,194,79,0.56); }
  .acc-blue   { --accent:#4FA8FF; --accent-line:rgba(79,168,255,0.46); --accent-halo:rgba(79,168,255,0.10); --accent-glow:rgba(79,168,255,0.58); }

  /* Ajustes pra nada virar caixa dentro de caixa */
  .hero-settlement.neon-box{ padding:20px 18px; margin-bottom:0; }
  .rb-acerto{ padding:0; background:transparent; border:none; box-shadow:none; }
  .rb-acerto::before{ display:none; }
  .rb-compare .compare{
    border:none; background:transparent; box-shadow:none; padding:0; margin:0;
  }

  /* Caixas do resto do app com o mesmo tratamento */
  .cat-group{
    position:relative; padding:4px 15px 8px;
    border:1px solid var(--accent-line, var(--line));
    box-shadow:0 0 0 1px var(--accent-halo, transparent), 0 0 24px -6px var(--accent-glow, transparent), var(--shadow-sm);
  }
  .cat-group::before{
    content:''; position:absolute; left:15px; right:15px; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent, transparent), transparent);
  }
  .cat-head .name{ color:var(--ink); }
  .cat-head .total{ text-shadow:0 0 14px var(--accent-glow, transparent); }

  .segmented{ border-color:rgba(79,224,255,0.22); }

  /* As duas metades do formulário viram caixas rotuladas, em qualquer tela:
     à esquerda os dados da conta, à direita os itens da nota. */
  .form-col{
    position:relative;
    border:1px solid var(--accent-line, var(--line));
    border-radius:12px; padding:14px 14px 4px; margin-bottom:14px;
    box-shadow:0 0 0 1px var(--accent-halo, transparent), 0 0 18px -8px var(--accent-glow, transparent);
  }
  .form-col::before{
    content:''; position:absolute; left:14px; right:14px; top:-1px; height:1px;
    background:linear-gradient(90deg, transparent, var(--accent, transparent), transparent);
  }
  .form-col-title{
    font-size:11.5px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent); margin:-2px 0 12px; display:flex; align-items:center; gap:7px;
  }
  .form-col-title::before{
    content:''; width:5px; height:5px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 6px var(--accent);
  }

  /* Botão de enviar com brilho na cor da pessoa */
  .submit-btn{ box-shadow:0 0 22px -8px currentColor; }

  /* ---------- Resumo: barra de mês, indicadores, grade e gráficos ---------- */
  .resumo-toolbar{
    display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:14px;
  }
  .resumo-month{
    display:inline-flex; align-items:center; gap:7px;
    background:var(--paper-raised); border:1px solid var(--line);
    border-radius:10px; padding:5px 10px 5px 11px;
  }
  .resumo-month-icon{ font-size:14px; }
  .resumo-month-select{
    background:transparent; border:none; color:var(--ink);
    font-size:13.5px; font-weight:600; font-family:inherit; padding:3px 2px; cursor:pointer;
  }
  .resumo-month-select:focus{ outline:none; }
  /* Reforço pros navegadores que ignoram o color-scheme nas opções. */
  select option{ background:var(--paper-raised); color:var(--ink); }
  select option:disabled{ color:var(--ink-soft); }
  select option.mes-atual{ color:var(--neon2); font-weight:700; }
  /* Quando o mês corrente é o que está selecionado, o próprio campo acende. */
  .resumo-month.is-current{ border-color:rgba(79,224,255,0.5); box-shadow:0 0 16px -4px rgba(79,224,255,0.55); }
  .resumo-month.is-current .resumo-month-select{ color:var(--neon2); }
  .resumo-scope{ font-size:12px; color:var(--ink-soft); }

  .kpi-row{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-bottom:16px; }
  .kpi-tile{ padding:11px 13px 12px; border-radius:12px; min-width:0; }
  .kpi-tile::before{ left:12px; right:12px; }
  .kpi-label{
    font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.05em;
    color:var(--accent, var(--ink-soft)); display:flex; align-items:center; gap:6px;
  }
  .kpi-label::before{
    content:''; width:5px; height:5px; border-radius:50%;
    background:var(--accent); box-shadow:0 0 6px var(--accent);
  }
  .kpi-value{
    font-size:20px; font-weight:700; margin-top:5px; color:var(--ink);
    font-variant-numeric:tabular-nums; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    text-shadow:0 0 16px var(--accent-glow, transparent);
  }
  .kpi-hint{ font-size:11px; color:var(--ink-soft); margin-top:3px; }

  /* No celular as colunas "somem" (display:contents) e os blocos viram
     filhos diretos da pilha, na ordem definida por .order abaixo. */
  .resumo-grid{ display:flex; flex-direction:column; gap:16px; }
  .resumo-col{ display:contents; }
  .resumo-block{ min-width:0; }
  .resumo-block .section-title{ margin-top:0; }
  .rb-acerto{ order:1; } .rb-compare{ order:2; } .rb-cartoes{ order:3; }
  .rb-trend{ order:4; } .rb-cats{ order:5; } .rb-pessoais{ order:6; }

  /* Categorias: barra por linha, com nome e valor escritos. O texto é que
     identifica a categoria — a cor só reforça (ver comentário em categoryBarsHTML). */
  .cat-bars{ display:flex; flex-direction:column; gap:9px; }
  .cat-bar-row{
    display:block; width:100%; text-align:left; cursor:pointer;
    background:transparent; border:none; padding:6px 6px 7px; margin:0;
    border-radius:9px; font-family:inherit; color:var(--ink);
  }
  .cat-bar-row:active{ background:var(--hover); }
  .cat-bar-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .cat-bar-name{ display:flex; align-items:center; gap:8px; font-size:13.5px; font-weight:600; min-width:0; }
  .cat-bar-label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .cat-bar-val{ font-size:13.5px; font-weight:700; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .cat-bar-share{ font-size:11px; color:var(--ink-soft); font-weight:600; margin-left:6px; }
  .cat-bar-track{ display:block; height:6px; border-radius:3px; background:var(--hover-soft); overflow:hidden; }

  /* Contas por cartão */
  .card-list{ gap:6px; }
  .card-dot{ width:11px; height:11px; border-radius:50%; flex:0 0 auto; }
  .card-caret{ margin-left:8px; color:var(--ink-soft); font-weight:700; }
  .card-row.is-open{ background:var(--hover-soft); }
  .card-row.is-open .card-caret{ color:var(--neon2); }
  .card-open{
    margin:2px 0 10px; padding:11px 12px 12px;
    border:1px solid var(--line); border-left:2px solid var(--neon2);
    border-radius:10px; background:rgba(255,255,255,0.02);
  }
  .card-chips{ display:flex; flex-wrap:wrap; gap:7px; margin-bottom:11px; }
  .card-chip{
    border:1px solid var(--line); background:transparent; color:var(--ink-soft);
    font-family:inherit; font-size:11.5px; font-weight:600; cursor:pointer;
    padding:6px 10px; border-radius:999px; white-space:nowrap;
  }
  .card-chip b{ color:var(--ink); font-weight:800; margin-left:2px; }
  .card-chip:hover{ border-color:var(--neon2); }
  .card-chip.is-on{
    border-color:var(--neon2); color:var(--neon2);
    box-shadow:0 0 12px -2px rgba(79,224,255,0.55);
  }
  .card-chip.is-on b{ color:var(--neon2); }
  .cat-bar-fill{ display:block; height:100%; border-radius:3px; min-width:3px; }

  /* Evolução mensal — barras em HTML/CSS.
     A altura da área do gráfico é fixa e as barras dividem a largura entre si,
     então a proporção não muda quando a caixa fica mais larga. */
  .trend-chart{
    display:flex; align-items:stretch; justify-content:center;
    gap:10px; height:172px; margin-top:4px;
    border-bottom:1px solid var(--line); padding-bottom:0;
  }
  .trend-bar{
    flex:1 1 0; max-width:78px; min-width:0;
    display:flex; flex-direction:column; align-items:center;
    background:transparent; border:none; padding:0; margin:0;
    font-family:inherit; cursor:pointer; color:inherit;
    border-radius:8px 8px 0 0;
  }
  .trend-bar:hover{ background:var(--hover-soft); }
  /* O valor acompanha a barra: apagado no mês que não está aberto, aceso no
     mês selecionado. Assim os números não competem entre si. */
  .trend-cap{
    height:17px; font-size:10px; font-weight:700; color:var(--ink);
    white-space:nowrap; line-height:17px; letter-spacing:-0.01em;
    max-width:100%; overflow:hidden; text-overflow:ellipsis;
    opacity:.42; transition:opacity .12s ease, color .12s ease;
  }
  .trend-bar.is-max .trend-cap{ opacity:.62; }
  .trend-bar:hover .trend-cap{ opacity:.8; }
  .trend-bar.is-future .trend-cap{ opacity:.28; }
  .trend-bar.is-selected .trend-cap{
    opacity:1; color:var(--neon2);
    text-shadow:0 0 10px rgba(79,224,255,0.55);
  }
  .trend-plot{ flex:1; width:100%; display:flex; align-items:flex-end; justify-content:center; padding:0 2px; }
  .trend-mark{
    width:100%; max-width:46px; border-radius:5px 5px 2px 2px;
    background:var(--neon2); opacity:.42; transition:opacity .12s ease;
  }
  .trend-bar.is-selected .trend-mark{
    opacity:1; box-shadow:0 0 12px -1px rgba(79,224,255,0.85);
  }
  .trend-bar:hover .trend-mark{ opacity:.72; }
  .trend-bar.is-future .trend-mark{ opacity:.2; }
  .trend-bar.is-future.is-selected .trend-mark{ opacity:.8; }
  .trend-bar.is-future:hover .trend-mark{ opacity:.4; }
  .trend-month{
    height:22px; line-height:22px; font-size:10.5px; color:var(--ink-soft);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100%;
  }
  /* O mês de hoje fica sempre identificável, mesmo olhando outro mês. */
  .trend-bar.is-current .trend-month{ color:var(--neon2); font-weight:700; }
  .trend-bar.is-future .trend-month{ opacity:.72; }
  .trend-legend{ font-size:11px; color:var(--ink-soft); margin-top:8px; line-height:1.45; }

  @media (min-width:640px){
    .months-grid{ grid-template-columns:repeat(4,1fr); }
    .kpi-row{ grid-template-columns:repeat(4,minmax(0,1fr)); }
    .kpi-value{ font-size:22px; }
  }

  /* ---------- Tablet ---------- */
  @media (min-width:640px){
    #settings-modal, #items-modal, #reset-modal, #future-modal, #metas-modal{ align-items:center; }
    #settings-panel, #items-panel, #reset-panel, #future-panel, #metas-panel{ border-radius:16px; max-height:80vh; }
    .row2, .row2.installment-fields{ gap:14px; }
  }

  /* ---------- Desktop: sidebar layout ---------- */
  @media (min-width:860px){
    body{ align-items:flex-start; }
    #shell{
      max-width:1120px;
      min-height:100vh;
      display:grid;
      grid-template-columns:232px minmax(0,1fr);
      /* Sem definir as linhas, o grid estica as duas igualmente quando o
         conteúdo é curto: o cabeçalho crescia e descia o app inteiro pro meio
         da tela (dava pra ver na aba Meses com poucos lançamentos).
         "auto 1fr" prende o cabeçalho na altura dele e dá o resto pro miolo. */
      grid-template-rows:auto 1fr;
      grid-template-areas:"header header" "nav main";
      background:var(--paper);
    }
    header{
      grid-area:header;
      position:static;
      padding:20px 28px;
      box-shadow:0 1px 0 var(--line);
    }
    header h1{ font-size:21px; }
    nav.tabbar{
      grid-area:nav;
      flex-direction:column;
      align-items:stretch;
      gap:2px;
      border-right:1px solid var(--line);
      background:var(--paper);
      padding:10px 14px 24px;
      position:sticky;
      top:0;
      bottom:auto;
      align-self:start;
      width:auto;
      overflow-x:visible;
      box-shadow:none;
    }
    nav.tabbar button{
      flex-direction:row;
      justify-content:flex-start;
      gap:10px;
      padding:11px 12px;
      border-radius:9px;
      font-size:14px;
    }
    nav.tabbar button .ic{ font-size:17px; }
    nav.tabbar button.active{ background:var(--paper-raised); box-shadow:inset 0 0 0 1px var(--line); }
    main{
      grid-area:main;
      padding:28px 36px 56px;
      overflow-y:visible;
    }
    #content{ max-width:760px; }
    form.add-form{ padding:20px; }
    .segmented{ max-width:420px; }
  }

  /* ---------- Desktop largo ----------
     A partir daqui o app deixa de ser uma coluna só. A largura cresce, o
     Resumo abre em duas (e depois três) colunas e o formulário separa os
     dados da conta dos itens da nota. No celular nada disso vale — todas as
     regras abaixo estão presas a min-width. */
  @media (min-width:1100px){
    #shell{ max-width:1320px; grid-template-columns:250px minmax(0,1fr); }
    main{ padding:26px 34px 56px; }
    /* O Resumo usa a largura toda; formulários e listas continuam estreitos,
       porque linha de texto e campo de digitação muito largos pioram a leitura. */
    #content{ max-width:820px; }
    #content.wide{ max-width:none; }

    /* Duas colunas em cima (acerto+quem pagou | mês+pessoais) e as categorias
       ocupando a largura toda embaixo — barra larga é mais fácil de comparar. */
    .resumo-grid{
      flex-direction:row; flex-wrap:wrap; align-items:flex-start; gap:18px 22px;
    }
    .resumo-col{
      display:flex; flex-direction:column; gap:16px; min-width:0;
    }
    .resumo-col-a, .resumo-col-b{ flex:1 1 44%; }
    .resumo-col-c{ flex:1 1 100%; }
    .resumo-block{ padding:16px 18px 17px; }
    .trend-chart{ height:190px; }
    .trend-cap{ font-size:11.5px; }

    /* Formulário do casal em duas colunas: dados da conta à esquerda,
       itens da nota à direita (que é a parte que cresce sem parar). */
    form.add-form.two-col{
      display:grid;
      grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);
      grid-template-areas:"main items" "submit submit";
      gap:0 26px;
      align-items:start;
      max-width:1000px;
    }
    /* Esta coluna já foi "sticky" (grudada no topo ao rolar). Tirei porque o
       navegador não prende o elemento na área do grid como deveria: ao rolar,
       a coluna descia e passava POR CIMA do botão "Adicionar gasto",
       escondendo o texto de baixo. Rolar normal é melhor do que esconder. */
    form.add-form.two-col .form-col-main{ grid-area:main; min-width:0; }
    form.add-form.two-col .form-col-items{ grid-area:items; min-width:0; }
    form.add-form.two-col .form-submit-area{ grid-area:submit; margin-top:6px; }
    form.add-form.two-col .items-section{ margin-top:0; }

    /* Formulário pessoal: as três caixas se distribuem em duas colunas em vez
       de virar uma torre de 900px de altura. */
    form.add-form.cols-2{
      display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      gap:0 26px; align-items:start; max-width:900px;
    }
    form.add-form.cols-2 .form-submit-area{ grid-column:1 / -1; margin-top:6px; }
  }

  /* Tela bem larga: as categorias sobem e viram a terceira coluna. */
  @media (min-width:1560px){
    #shell{ max-width:1520px; }
    /* A coluna do acerto tem pouco conteúdo, então recebe menos largura e
       sobra espaço pras barras de categoria, que são as mais compridas. */
    .resumo-col-a{ flex:0.85 1 0; }
    .resumo-col-b{ flex:1 1 0; }
    .resumo-col-c{ flex:1.12 1 0; }
    .cat-bars{ gap:11px; }
  }

  /* ---------- Stat grid (visão geral / próximos meses) on wider screens ---------- */
  @media (min-width:520px){
    .hero-settlement.stat-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      column-gap:20px;
    }
    .hero-settlement.stat-grid .personal-row{ padding:9px 0; }
  }

  /* ---------- Pointer-device affordances (desktop mouse, not touch) ---------- */
  @media (hover:hover) and (pointer:fine){
    nav.tabbar button:hover{ background:var(--paper-raised); }
    .entry:hover{ background:var(--hover-soft); border-radius:8px; }
    .segmented button:hover{ background:var(--hover-soft); }
    .submit-btn:hover{ filter:brightness(0.94); }
    .secondary-btn:hover{ background:var(--paper); }
    .photo-btn:hover{ background:var(--paper); }
    .entry .edit:hover, .entry .del:hover{ color:var(--ink); }
    .gear-btn:hover{ color:var(--ink); }
    .category-items-row:hover{ background:var(--hover-soft); }
    .item-row .item-remove-btn:hover{ color:var(--ink); }
  }
</style>
</head>
<body>

<div id="loading-screen"><div class="loading-spinner"></div><span>Carregando…</span></div>

<div id="shell" class="hidden">
  <header>
    <div>
      <h1 id="header-title">Resumo</h1>
      <div class="sub" id="header-sub">Gastos da casa</div>
    </div>
    <button id="settings-btn" class="gear-btn" aria-label="Configurações">⚙️</button>
  </header>

  <main id="content"></main>

  <nav class="tabbar" id="tabbar"></nav>
</div>

<div id="modal" class="hidden">
  <button class="close-btn" id="modal-close">✕</button>
  <div id="modal-body" class="spinner">Carregando…</div>
</div>

<div id="settings-modal" class="hidden">
  <div id="settings-panel"></div>
</div>

<div id="items-modal" class="hidden">
  <div id="items-panel"></div>
</div>

<div id="reset-modal" class="hidden">
  <div id="reset-panel"></div>
</div>

<div id="auth-screen" class="hidden">
  <div id="auth-card"></div>
</div>

<div id="sync-bar" class="hidden"></div>

<div id="future-modal" class="hidden">
  <div id="future-panel"></div>
</div>

<div id="metas-modal" class="hidden">
  <div id="metas-panel"></div>
</div>

<!--
  Tesseract.js faz a leitura automática (OCR) das notas fiscais direto no
  navegador da pessoa, sem precisar de servidor nem de chave de API.
  Se o CDN não carregar por algum motivo, o app detecta isso e cai de volta
  pro preenchimento manual — a leitura automática nunca trava o resto do site.
-->
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.0.4/tesseract.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>

<script>
(function(){
  "use strict";

  var PALETTE = ['#4FA8FF','#FF5D8F','#39FF88','#FFC24F','#B18CFF','#4FE0FF','#FF8A4F','#7CE05A'];

  var CATEGORIES = [
    {id:'Mercado', icon:'🛒', color:'#4FE0FF'},
    {id:'Aluguel/Financiamento', icon:'🏠', color:'#FF8A4F'},
    {id:'Água', icon:'💧', color:'#4FA8FF'},
    {id:'Luz', icon:'⚡', color:'#FFC24F'},
    {id:'Internet/Telefone', icon:'📶', color:'#B18CFF'},
    {id:'Gás', icon:'🔥', color:'#FF6B4F'},
    {id:'Transporte', icon:'🚗', color:'#39FF88'},
    {id:'Saúde', icon:'💊', color:'#FF5D8F'},
    {id:'Lazer', icon:'🎉', color:'#FF4FD8'},
    // Educação usava o mesmo #B18CFF de Internet/Telefone — duas categorias
    // com a cor idêntica. Este verde-água se separa bem das duas e do verde
    // de Transporte, inclusive para quem tem daltonismo.
    {id:'Educação', icon:'📚', color:'#35D6C4'},
    {id:'Outros', icon:'📦', color:'#8B93A1'}
  ];
  var DEFAULT_CATEGORY_COLOR = '#8B93A1';

  var DEFAULT_CARDS = ['Nubank','Inter','Itaú','Santander'];

  function defaultSettings(){
    return {
      householdName: 'Gastos da Casa',
      members: [
        {id:'homem', name:'Homem', percentage:50, color:PALETTE[0]},
        {id:'mulher', name:'Mulher', percentage:50, color:PALETTE[1]}
      ],
      cards: DEFAULT_CARDS.slice(),
      // Metas do mês. geral = teto das contas do casal; categorias = teto por
      // categoria. Vazio = a pessoa nunca configurou, e aí nada de meta
      // aparece na tela.
      goals: {geral:null, categorias:{}}
    };
  }

  // O que vem do banco pode ser {} ou faltar campos — normaliza sempre.
  function normalizarMetas(m){
    var g = (m && typeof m === 'object') ? m : {};
    var geral = Number(g.geral);
    var cats = {};
    var origem = (g.categorias && typeof g.categorias === 'object') ? g.categorias : {};
    Object.keys(origem).forEach(function(k){
      var v = Number(origem[k]);
      if (v > 0) cats[k] = v;
    });
    return {geral: (geral > 0 ? geral : null), categorias: cats};
  }

  function metasAtivas(){
    var m = normalizarMetas(state.settings && state.settings.goals);
    return !!m.geral || Object.keys(m.categorias).length > 0;
  }

  var MONTH_NAMES_PT = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];

  var state = {
    expenses: [],
    settings: defaultSettings(),
    settingsDraft: null,
    currentTab: 'resumo',
    subTab: {},
    editingId: null,
    pendingPhoto: null,
    removeExistingPhoto: false,
    itemsModalCategory: null,
    itemsModalSort: 'recent',
    itemsModalGroup: false,
    itemsModalMonth: 'all',
    mesesView: {mode:'years', year:null, month:null},
    // Mês exibido no Resumo e nas listas de cada pessoa. null = ainda não
    // escolhido, então cai no mês atual.
    resumoMonth: null,
    entriesMonth: {},
    // Meses futuros marcados no indicador "Próximos meses". null = todos.
    futureMonths: null,
    // Cartão aberto no painel "Contas por cartão": {scope, card, filter}.
    cardOpen: null
  };

  var storageAvailable = false;

  var contentEl, loadingEl, shellEl, tabbarEl, headerTitleEl, headerSubEl;
  var modalEl, modalBodyEl, settingsModalEl, settingsPanelEl, settingsBtn;
  var itemsModalEl, itemsPanelEl;
  var futureModalEl, futurePanelEl;
  var metasModalEl, metasPanelEl;
  var resetModalEl, resetPanelEl;

  function ensureSubTabDefaults(){
    state.settings.members.forEach(function(m){
      if (!state.subTab[m.id]) state.subTab[m.id] = 'casal';
    });
  }

  function memberById(id){
    return state.settings.members.find(function(m){ return m.id === id; }) || {id:id, name:id, color:'#8B93A1'};
  }

  function catIcon(cat){
    var f = CATEGORIES.find(function(c){ return c.id === cat; });
    return f ? f.icon : '🏷️';
  }

  // Categoria que você criou (iFood, Cachorro, Guardar...) também ganha cor.
  // Antes toda categoria personalizada saía cinza, e no gráfico do Resumo
  // várias barras ficavam iguais. A cor é derivada do nome, então é sempre a
  // mesma pra mesma categoria — não muda a cada vez que a tela recarrega.
  var CUSTOM_CATEGORY_COLORS = ['#9BE564','#FF7BC8','#6C9BFF','#F2A65A','#5FD3D8'];
  function hashString(s){
    var h = 0;
    s = String(s || '');
    for (var i = 0; i < s.length; i++){ h = (h * 31 + s.charCodeAt(i)) >>> 0; }
    return h;
  }
  // Só o hash não bastava: duas categorias diferentes podiam cair na mesma
  // cor (iFood e Cachorro caíram). Aqui a cor sugerida pelo hash é o ponto de
  // partida, e se ela já estiver ocupada anda pra próxima livre — assim
  // nenhuma categoria repete cor enquanto houver cor sobrando.
  var customColorMap = null;
  function invalidateCustomColors(){ customColorMap = null; }
  function buildCustomColorMap(){
    var seen = {};
    state.expenses.forEach(function(e){
      if (!e.category) return;
      if (CATEGORIES.some(function(c){ return c.id === e.category; })) return;
      seen[e.category] = true;
    });
    var nomes = Object.keys(seen).sort();
    var n = CUSTOM_CATEGORY_COLORS.length;
    var usados = {}, map = {};
    nomes.forEach(function(nome){
      var base = hashString(nome) % n;
      for (var k = 0; k < n; k++){
        var idx = (base + k) % n;
        if (!usados[idx]){ usados[idx] = true; map[nome] = CUSTOM_CATEGORY_COLORS[idx]; return; }
      }
      map[nome] = CUSTOM_CATEGORY_COLORS[base]; // mais categorias do que cores
    });
    return map;
  }
  function catColor(cat){
    var f = CATEGORIES.find(function(c){ return c.id === cat; });
    if (f && f.color) return f.color;
    if (!cat) return DEFAULT_CATEGORY_COLOR;
    if (!customColorMap) customColorMap = buildCustomColorMap();
    return customColorMap[cat] || CUSTOM_CATEGORY_COLORS[hashString(cat) % CUSTOM_CATEGORY_COLORS.length];
  }

  function enfileirar(upserts, deletes){
    var f = lerFila();
    f.upserts = f.upserts || {}; f.deletes = f.deletes || [];
    upserts.forEach(function(g){ f.upserts[g.id] = g; delete_do_array(f.deletes, g.id); });
    deletes.forEach(function(id){ delete f.upserts[id]; if (f.deletes.indexOf(id) === -1) f.deletes.push(id); });
    gravarFila(f);
  }
  function delete_do_array(arr, valor){

  async function saveExpenses(arr){
    gravarCache('gastos_casa_expenses', arr);
    if (!modoNuvem()) return storageAvailable;

    // Compara com o retrato do servidor e separa só o que mudou.
    var agora = {};
    arr.forEach(function(e){ agora[e.id] = e; });

    var upserts = [], deletes = [];
    Object.keys(agora).forEach(function(id){
      if (espelhoServidor[id] !== assinaturaGasto(agora[id])) upserts.push(agora[id]);
    });
    Object.keys(espelhoServidor).forEach(function(id){
      if (!agora[id]) deletes.push(id);
    });
    if (!upserts.length && !deletes.length) return true;

    var enviou = await enviarParaServidor(upserts, deletes);
    if (!enviou){
      enfileirar(upserts, deletes);
      atualizarAvisoSync();
      return true;   // guardado no aparelho; sobe quando a internet voltar
    }
    refazerEspelho(arr);
    atualizarAvisoSync();
    return true;
  }

  // Chega uma mudança feita no OUTRO aparelho: encaixa na lista e
  // redesenha, sem recarregar a página.
  function aplicarMudancaRemota(msg){
    try {
      if (msg.eventType === 'DELETE'){
        var idFora = msg.old && msg.old.id;
        if (!idFora) return;
        var iF = state.expenses.findIndex(function(e){ return e.id === idFora; });
        if (iF === -1) return;
        state.expenses.splice(iF, 1);
        delete espelhoServidor[idFora];
      } else {
        var g = gastoDoBanco(msg.new);
        var i = state.expenses.findIndex(function(e){ return e.id === g.id; });
        // Se a assinatura é a mesma, a mudança foi nossa e voltou de eco.
        if (i !== -1 && espelhoServidor[g.id] === assinaturaGasto(g)) return;
        if (i === -1) state.expenses.push(g); else state.expenses[i] = g;
        espelhoServidor[g.id] = assinaturaGasto(g);
      }
      gravarCache('gastos_casa_expenses', state.expenses);
      if (!state.settingsDraft) render();
    } catch(e){ console.error('aplicarMudancaRemota', e); }
  }

  function traduzirErroAuth(msg){
    var m = String(msg || '').toLowerCase();
    if (m.indexOf('invalid login') !== -1) return 'E-mail ou senha errados.';
    if (m.indexOf('already registered') !== -1 || m.indexOf('already been registered') !== -1) return 'Esse e-mail já tem conta. Tente entrar.';
    if (m.indexOf('password should be') !== -1 || m.indexOf('at least 6') !== -1) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (m.indexOf('invalid email') !== -1 || m.indexOf('unable to validate email') !== -1) return 'Esse e-mail não parece válido.';
    if (m.indexOf('email not confirmed') !== -1) return 'Confirme o e-mail que enviamos e tente de novo.';
    if (m.indexOf('failed to fetch') !== -1 || m.indexOf('network') !== -1) return 'Sem conexão com o servidor. Verifique a internet.';
    if (m.indexOf('licenca_invalida') !== -1) return 'Esse convite não existe. Confira o código ou o link que você recebeu.';
    if (m.indexOf('licenca_ja_usada') !== -1) return 'Esse convite já foi usado. Cada link vale por um cadastro.';
    if (m.indexOf('licenca_desativada') !== -1) return 'Esse acesso está desativado. Fale com quem te vendeu o app.';
    if (m.indexOf('licenca_expirada') !== -1) return 'Esse convite expirou.';
    if (m.indexOf('convite_invalido') !== -1) return 'Código de casa inválido. Confira as letras.';
    if (m.indexOf('casa_lotada') !== -1) return 'Essa casa já está com o número máximo de pessoas.';
    if (m.indexOf('precisa_de_convite') !== -1) return 'O acesso é por convite. Use o link que você recebeu.';
    if (m.indexOf('código de convite') !== -1 || m.indexOf('convite inv') !== -1) return 'Código de convite inválido. Confira as letras.';
    return msg || 'Algo deu errado. Tente de novo.';
  }

  async function tentarAuth(){
    var email = (document.getElementById('auth-email').value || '').trim();
    var senha = document.getElementById('auth-senha').value || '';
    var botao = document.getElementById('btn-auth');
    if (!email || !senha){ renderAuth('Preencha e-mail e senha.'); return; }

    botao.disabled = true;
    botao.textContent = authModo === 'cadastrar' ? 'Criando...' : 'Entrando...';
    try {
      var r = (authModo === 'cadastrar')
        ? await supa.auth.signUp({ email: email, password: senha })
        : await supa.auth.signInWithPassword({ email: email, password: senha });
      if (r.error) throw r.error;

      if (authModo === 'cadastrar' && !r.data.session){
        // Projeto com confirmação de e-mail ligada.
        authModo = 'entrar';
        renderAuth('Conta criada. Confirme o link que chegou no seu e-mail e entre aqui.', 'ok');
        return;
      }
      sessaoUsuario = r.data.user;
      await conferirSeAdmin();
      await depoisDeEntrar();
    } catch(e){
      renderAuth(traduzirErroAuth(e.message));
    }
  }

  /* ---------- Comprovantes: IndexedDB ----------
     As fotos ficavam no localStorage junto com o resto. O problema é que o
     localStorage tem só ~5 MB no total, e uma foto de nota tirada de celular
     pesa entre 300 e 500 KB — ou seja, entre 9 e 16 comprovantes e o espaço
     acabava. Pior: quando enchia, a foto era descartada em silêncio.
     O IndexedDB é feito pra isso e trabalha na casa das centenas de MB, então
     as fotos passaram pra lá. Os gastos e as configurações continuam no
     localStorage, que é leve e simples de ler.
     Se o navegador não tiver IndexedDB (aba anônima antiga, configuração
     restrita), tudo volta pro localStorage sozinho — só com o limite de antes. */

  // Quanto do localStorage já foi usado. É estimativa: o navegador não expõe
  // o número exato, então contamos os caracteres (2 bytes cada, UTF-16) das
  // chaves e valores do app. Serve bem pra saber se está perto do limite.
  function usoDoArmazenamento(){
    var bytes = 0;
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (!k || k.indexOf('gastos_casa') !== 0) continue;
        bytes += (k.length + (localStorage.getItem(k) || '').length) * 2;
      }
    } catch(e){ return null; }
    var limite = 5 * 1024 * 1024;
    return { bytes:bytes, limite:limite, pct: Math.min(100, Math.round(bytes / limite * 100)) };
  }

  function formatarMB(bytes){
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(0) + ' KB';
    return (bytes / 1024 / 1024).toFixed(1) + ' MB';
  }

  // Antes, quando o espaço acabava, a foto simplesmente não era gravada e
  // ninguém ficava sabendo. Agora o app fala.
  function avisarSeFotoNaoCoube(salvou){
    if (salvou) return;
    alert('O gasto foi salvo, mas a FOTO do comprovante não coube: o armazenamento do navegador está cheio.\n\nVá em Configurações → Backup, baixe uma cópia dos seus dados e apague comprovantes antigos pra liberar espaço.');
  }

  var LOJA_FOTOS = 'fotos';
  var receiptDbPromise = null;

  function receiptDb(){
    if (receiptDbPromise) return receiptDbPromise;
    receiptDbPromise = new Promise(function(resolve){
      try {
        if (typeof indexedDB === 'undefined') return resolve(null);
        var req = indexedDB.open('gastos_casa_comprovantes', 1);
        req.onupgradeneeded = function(){
          var db = req.result;
          if (!db.objectStoreNames.contains(LOJA_FOTOS)) db.createObjectStore(LOJA_FOTOS);
        };
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ resolve(null); };
        req.onblocked = function(){ resolve(null); };
      } catch(e){ resolve(null); }
    });
    return receiptDbPromise;
  }

  function idbOp(db, modo, fn){
    return new Promise(function(resolve, reject){
      try {
        var tx = db.transaction(LOJA_FOTOS, modo);
        var req = fn(tx.objectStore(LOJA_FOTOS));
        req.onsuccess = function(){ resolve(req.result); };
        req.onerror = function(){ reject(req.error); };
      } catch(e){ reject(e); }
    });
  }

  function chaveFotoAntiga(id){ return 'gastos_casa_receipt_full_' + id; }

  // Traz pro IndexedDB as fotos que ficaram no localStorage de versões antigas.
  // Roda uma vez na abertura e libera o espaço que elas ocupavam.
  async function migrarFotosAntigas(){
    var db = await receiptDb();
    if (!db || !storageAvailable) return 0;
    var chaves = [];
    try {
      for (var i = 0; i < localStorage.length; i++){
        var k = localStorage.key(i);
        if (k && k.indexOf('gastos_casa_receipt_full_') === 0) chaves.push(k);
      }
    } catch(e){ return 0; }
    var movidas = 0;
    for (var j = 0; j < chaves.length; j++){
      try {
        var valor = localStorage.getItem(chaves[j]);
        if (!valor) continue;
        var id = chaves[j].replace('gastos_casa_receipt_full_', '');
        await idbOp(db, 'readwrite', function(loja){ return loja.put(valor, id); });
        localStorage.removeItem(chaves[j]);
        movidas++;
      } catch(e){ /* deixa onde está e segue */ }
    }
    return movidas;
  }

  async function saveFullReceipt(id, dataUrl){
    var db = await receiptDb();
    if (db){
      try {
        await idbOp(db, 'readwrite', function(loja){ return loja.put(dataUrl, id); });
        return true;
      } catch(e){ console.error('saveFullReceipt (IndexedDB)', e); }
    }
    if (!storageAvailable) return false;
    try {
      localStorage.setItem(chaveFotoAntiga(id), dataUrl);
      return true;
    } catch(e){
      console.error('saveFullReceipt', e);
      return false;
    }
  }

  async function loadFullReceipt(id){
    var db = await receiptDb();
    if (db){
      try {
        var v = await idbOp(db, 'readonly', function(loja){ return loja.get(id); });
        if (v) return v;
      } catch(e){ /* tenta o localStorage abaixo */ }
    }
    if (!storageAvailable) return null;
    try {
      return localStorage.getItem(chaveFotoAntiga(id));
    } catch(e){
      console.error('loadFullReceipt', e);
      return null;
    }
  }

  async function deleteFullReceipt(id){
    var db = await receiptDb();
    if (db){
      try { await idbOp(db, 'readwrite', function(loja){ return loja.delete(id); }); }
      catch(e){ console.error('deleteFullReceipt (IndexedDB)', e); }
    }
    if (!storageAvailable) return;
    try {
      localStorage.removeItem(chaveFotoAntiga(id));
    } catch(e){
      console.error('deleteFullReceipt', e);
    }
  }

  /* ---------- Image handling ---------- */

  function compressImage(file, maxWidth, quality){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  // Versão da foto usada só para a leitura automática (OCR): maior resolução
  // que a guardada no app, e em preto-e-branco com contraste realçado — isso
  // ajuda bastante o reconhecimento de texto em cupons fiscais fotografados.
  function prepareImageForOCR(file){
    return new Promise(function(resolve, reject){
      var reader = new FileReader();
      reader.onload = function(e){
        var img = new Image();
        img.onload = function(){
          // Resolução maior ajuda MUITO em cupons de impressora matricial (os
          // "pontinhos" do texto ficam pequenos e a leitura precisa de mais
          // pixels pra reconhecer cada caractere).
          var maxWidth = 2200, minWidth = 1400;
          var w = img.width, h = img.height;
          if (w > maxWidth){ h = Math.round(h * (maxWidth / w)); w = maxWidth; }
          // Foto pequena demais também atrapalha: o Tesseract precisa de uns
          // 20px de altura por caractere. Ampliar antes de ler ajuda mais do
          // que atrapalha em cupom (o texto é impresso em pontinhos).
          else if (w < minWidth){ h = Math.round(h * (minWidth / w)); w = minWidth; }
          var canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          try {
            var imgData = ctx.getImageData(0, 0, w, h);
            var d = imgData.data;
            var hist = new Array(256).fill(0);
            var i, g;
            for (i = 0; i < d.length; i += 4){
              g = (0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]) | 0;
              d[i] = d[i+1] = d[i+2] = g;
              hist[g]++;
            }
            // Alonga o contraste usando percentis (2%–98%) em vez do mínimo/máximo
            // cru — assim um brilho de reflexo ou uma sombra no canto da foto não
            // estraga o realce da folha inteira, como aconteceria com min/max puro.
            var totalPx = w * h;
            var lowCut = totalPx * 0.02, highCut = totalPx * 0.02;
            var acc = 0, lo = 0, hi = 255;
            for (i = 0; i < 256; i++){ acc += hist[i]; if (acc >= lowCut){ lo = i; break; } }
            acc = 0;
            for (i = 255; i >= 0; i--){ acc += hist[i]; if (acc >= highCut){ hi = i; break; } }
            if (hi <= lo){ lo = 0; hi = 255; }
            var range = hi - lo;
            for (i = 0; i < d.length; i += 4){
              var v = (d[i] - lo) * (255 / range);
              if (v < 0) v = 0; else if (v > 255) v = 255;
              d[i] = d[i+1] = d[i+2] = v;
            }
            ctx.putImageData(imgData, 0, 0);
          } catch(err){ /* segue sem o realce se o navegador não permitir */ }
          resolve(canvas.toDataURL('image/jpeg', 0.92));
        };
        img.onerror = function(){ reject(new Error('Erro ao carregar imagem')); };
        img.src = e.target.result;
      };
      reader.onerror = function(){ reject(new Error('Erro ao ler arquivo')); };
      reader.readAsDataURL(file);
    });
  }

  /* ---------- Computation ---------- */

  function groupByCategory(list){
    var map = {};
    list.forEach(function(e){
      if (!map[e.category]) map[e.category] = [];
      map[e.category].push(e);
    });
    var groups = Object.keys(map).map(function(cat){
      var items = map[cat].slice().sort(function(a,b){ return b.date.localeCompare(a.date); });
      var total = items.reduce(function(s,e){ return s+e.value; }, 0);
      return {category:cat, items:items, total:total};
    });
    groups.sort(function(a,b){ return b.total - a.total; });
    return groups;
  }

  // monthKey opcional ('2026-09'): quando informado, considera só as contas
  // lançadas naquele mês. As abas de cada pessoa continuam chamando sem o
  // filtro, então o comportamento delas não muda.
  function computeSettlement(monthKey){
    var members = state.settings.members;
    var casalExpenses = expensesFor(monthKey).filter(function(e){ return e.type === 'casal'; });
    var totalCasal = casalExpenses.reduce(function(s,e){ return s+casalCalc(e).paidValue; }, 0);
    var pctSum = members.reduce(function(s,m){ return s + (Number(m.percentage)||0); }, 0) || 1;

    var spent = {};
    members.forEach(function(m){ spent[m.id] = 0; });
    casalExpenses.forEach(function(e){
      if (spent.hasOwnProperty(e.person)) spent[e.person] += casalCalc(e).paidValue;
    });

    var balances = members.map(function(m){
      var share = (Number(m.percentage)||0) / pctSum;
      var fairShare = totalCasal * share;
      var s = spent[m.id] || 0;
      return {id:m.id, name:m.name, color:m.color, spent:s, fairShare:fairShare, balance: s - fairShare};
    });

    var creditors = balances.filter(function(b){ return b.balance > 0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });
    var debtors = balances.filter(function(b){ return b.balance < -0.005; })
      .map(function(b){ return {id:b.id, name:b.name, amount:-b.balance}; })
      .sort(function(a,b){ return b.amount - a.amount; });

    var transfers = [];
    var ci = 0, di = 0;
    while (ci < creditors.length && di < debtors.length){
      var c = creditors[ci], d = debtors[di];
      var amt = Math.min(c.amount, d.amount);
      if (amt > 0.005) transfers.push({from:d.name, to:c.name, amount:amt});
      c.amount -= amt; d.amount -= amt;
      if (c.amount <= 0.005) ci++;
      if (d.amount <= 0.005) di++;
    }

    return {totalCasal:totalCasal, balances:balances, transfers:transfers};
  }

  function computeInstallment(e){
    var total = Math.max(1, Number(e.installmentsTotal)||1);
    var paid = Math.min(Math.max(0, Number(e.installmentsPaid)||0), total);
    var parcelValue = e.value / total;
    return {
      installment:true,
      parcelValue:parcelValue,
      total:total,
      paid:paid,
      remaining: total-paid,
      paidValue: parcelValue*paid,
      remainingValue: parcelValue*(total-paid)
    };
  }

  function personalCalc(e){
    if (e.paymentMethod === 'credito' && e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function casalCalc(e){
    if (e.installment && e.installmentsTotal){
      return computeInstallment(e);
    }
    return {installment:false, parcelValue:e.value, total:1, paid:1, remaining:0, paidValue:e.value, remainingValue:0};
  }

  function personalSummary(memberId, monthKey){
    var list = expensesFor(monthKey).filter(function(e){
      return e.person===memberId && e.type==='pessoal';
    });
    var totals = {totalComprado:0, totalPago:0, totalAPagar:0, parcelasRestantes:0};
    list.forEach(function(e){
      var c = personalCalc(e);
      totals.totalComprado += e.value;
      totals.totalPago += c.paidValue;
      totals.totalAPagar += c.remainingValue;
      totals.parcelasRestantes += c.remaining;
    });
    return totals;
  }

  function addMonthsToDate(date, n){
    return new Date(date.getFullYear(), date.getMonth()+n, date.getDate());
  }

  // Linha do tempo dos gastos pessoais de uma pessoa, no mesmo formato da do
  // casal — assim o gráfico de barras serve pros dois sem mudar nada.
  // Compra parcelada entra pelo valor da PARCELA no mês em que ela cai, não
  // pelo valor cheio no mês da compra: é o que você realmente paga naquele mês.
  function buildPersonalMonthsTimeline(memberId){
    var lista = materializedAll(2).filter(function(e){
      return e.person === memberId && e.type === 'pessoal';
    });
    var map = {};
    function addTo(key, ano, mes, valor){
      if (!map[key]) map[key] = {year:ano, month:mes, total:0, items:[]};
      map[key].total += valor;
      map[key].items.push(1);
    }
    lista.forEach(function(e){
      var compra = new Date(e.date + 'T00:00:00');
      if (isNaN(compra.getTime())) return;
      var c = personalCalc(e);
      if (!c.installment){
        addTo(monthKeyFromDate(e.date), compra.getFullYear(), compra.getMonth(), e.value);
        return;
      }
      for (var k = 1; k <= c.total; k++){
        var venc = addMonthsToDate(compra, k - 1);
        var chave = venc.getFullYear() + '-' + String(venc.getMonth()+1).padStart(2,'0');
        addTo(chave, venc.getFullYear(), venc.getMonth(), c.parcelValue);
      }
    });
    var atual = currentMonthKey();
    return Object.keys(map).sort().map(function(k){
      var m = map[k];
      return { key:k, year:m.year, month:m.month, items:m.items, total:m.total,
               isPast:k < atual, isCurrent:k === atual, isFuture:k > atual };
    });
  }

  function upcomingMonthsForMember(memberId){
    var list = state.expenses.filter(function(e){ return e.person===memberId && e.type==='pessoal'; });
    var map = {};
    var currentYear = new Date().getFullYear();
    list.forEach(function(e){
      var c = personalCalc(e);
      if (!c.installment || c.remaining <= 0) return;
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      for (var k = c.paid+1; k <= c.total; k++){
        var due = addMonthsToDate(purchaseDate, k-1);
        var key = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
        if (!map[key]) map[key] = {year:due.getFullYear(), month:due.getMonth(), count:0, value:0};
        map[key].count += 1;
        map[key].value += c.parcelValue;
      }
    });
    var keys = Object.keys(map).sort();
    return keys.map(function(k){
      var m = map[k];
      var label = MONTH_NAMES_PT[m.month] + (m.year !== currentYear ? '/' + String(m.year).slice(2) : '');
      return {label:label, count:m.count, value:m.value};
    });
  }

  function buildCasalMonthsTimeline(){
    // 2 meses à frente: as parcelas e os gastos fixos que já estão contratados
    // aparecem como "previsto" antes de chegar a data.
    var casalExpenses = materializedAll(2).filter(function(e){ return e.type === 'casal'; });
    var map = {};
    function addTo(key, year, month, item){
      if (!map[key]) map[key] = {year:year, month:month, items:[]};
      map[key].items.push(item);
    }
    casalExpenses.forEach(function(e){
      var purchaseDate = new Date(e.date + 'T00:00:00');
      if (isNaN(purchaseDate.getTime())) return;
      var c = casalCalc(e);
      if (!c.installment){
        var key = purchaseDate.getFullYear() + '-' + String(purchaseDate.getMonth()+1).padStart(2,'0');
        addTo(key, purchaseDate.getFullYear(), purchaseDate.getMonth(), {
          id:e.id, description:e.description, category:e.category, value:e.value, installmentLabel:null, paid:true
        });
      } else {
        for (var k = 1; k <= c.total; k++){
          var due = addMonthsToDate(purchaseDate, k-1);
          var key2 = due.getFullYear() + '-' + String(due.getMonth()+1).padStart(2,'0');
          addTo(key2, due.getFullYear(), due.getMonth(), {
            id:e.id, description:e.description, category:e.category, value:c.parcelValue,
            installmentLabel:(k+'/'+c.total), paid:(k<=c.paid)
          });
        }
      }
    });
    var keys = Object.keys(map).sort();
    var now = new Date();
    var currentKey = now.getFullYear() + '-' + String(now.getMonth()+1).padStart(2,'0');
    return keys.map(function(k){
      var m = map[k];
      var items = m.items.slice().sort(function(a,b){ return (a.description||'').localeCompare(b.description||''); });
      var total = items.reduce(function(s,it){ return s+it.value; }, 0);
      return {
        key:k, year:m.year, month:m.month, items:items, total:total,
        isPast: k < currentKey, isCurrent: k === currentKey, isFuture: k > currentKey
      };
    });
  }

  function buildCasalYearsTimeline(){
    var timeline = buildCasalMonthsTimeline();
    var map = {};
    var order = [];
    timeline.forEach(function(g){
      if (!map[g.year]){ map[g.year] = {year:g.year, months:[], total:0, hasCurrent:false}; order.push(g.year); }
      map[g.year].months.push(g);
      map[g.year].total += g.total;
      if (g.isCurrent) map[g.year].hasCurrent = true;
    });
    // Ordem da lista: o ano atual sempre em cima, depois os anos que ainda vão
    // chegar em ordem crescente (é a sequência natural do que vem pela frente),
    // e por último o histórico, do mais recente pro mais antigo.
    var anoAtual = new Date().getFullYear();
    return order.sort(function(a,b){
      if (a === anoAtual) return -1;
      if (b === anoAtual) return 1;
      var aFuturo = a > anoAtual, bFuturo = b > anoAtual;
      if (aFuturo !== bFuturo) return aFuturo ? -1 : 1;
      return aFuturo ? (a - b) : (b - a);
    }).map(function(y){ return map[y]; });
  }

  function monthKeyFromDate(iso){ return String(iso||'').slice(0,7); }

  function currentMonthKey(){
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
  }
  function monthKeyAdd(mk, n){
    var p = String(mk).split('-');
    var y = Number(p[0]), m = Number(p[1]) - 1 + n;
    y += Math.floor(m / 12);
    m = ((m % 12) + 12) % 12;
    return y + '-' + String(m + 1).padStart(2,'0');
  }
  // Dia 31 num mês de 30 vira dia 30 — senão a data do gasto fixo escorregaria
  // pro mês seguinte e ele sumiria do mês certo.
  function dateInMonth(mk, day){
    var p = String(mk).split('-');
    var y = Number(p[0]), m = Number(p[1]);
    var ultimo = new Date(y, m, 0).getDate();
    return mk + '-' + String(Math.min(day || 1, ultimo)).padStart(2,'0');
  }

  /* ---------- Gastos fixos ----------
     Um gasto fixo é lançado UMA vez e vale de lá pra frente. Em vez de gravar
     uma cópia dele em cada mês (o que encheria o armazenamento e faria você ter
     que editar 12 lugares pra mudar o valor do aluguel), guardamos só o
     original e "materializamos" uma cópia na hora de mostrar cada mês.
     A cópia tem id "original@2026-10" — é assim que editar ou excluir uma
     repetição sabe voltar pro lançamento de verdade. */

  function baseExpenseId(id){ return String(id || '').split('@')[0]; }

  function fixedOccurrence(e, mk){
    if (!e.fixed) return null;
    var inicio = monthKeyFromDate(e.date);
    if (!inicio || mk < inicio) return null;
    if (mk === inicio) return e;
    var dia = parseInt(String(e.date).slice(8,10), 10) || 1;
    var copia = Object.assign({}, e);
    copia.id = e.id + '@' + mk;
    copia.date = dateInMonth(mk, dia);
    copia.virtual = true;
    return copia;
  }

  // Até onde um gasto fixo se projeta pra frente. Sem esse limite, bastava
  // você lançar UMA conta lá em 2028 pra o app repetir todas as suas contas
  // fixas em cada um dos 20 meses até lá, inflando os totais dos anos futuros.
  // Dois meses à frente é o mesmo horizonte de "previsto" usado no gráfico.
  function fixedHorizon(){ return monthKeyAdd(currentMonthKey(), 2); }

  function materializedForMonth(mk){
    var out = [];
    var limite = fixedHorizon();
    state.expenses.forEach(function(e){
      if (e.fixed){
        // O mês de origem entra sempre; as repetições param no horizonte.
        if (mk > limite && mk !== monthKeyFromDate(e.date)) return;
        var occ = fixedOccurrence(e, mk);
        if (occ) out.push(occ);
      } else if (monthKeyFromDate(e.date) === mk){
        out.push(e);
      }
    });
    return out;
  }

  // Meses que o app precisa considerar: do primeiro lançamento até o mês atual
  // (ou até o último lançamento, se você já lançou algo à frente).
  function expenseMonthSpan(mesesAdiante){
    var atual = currentMonthKey();
    var keys = state.expenses.map(function(e){ return monthKeyFromDate(e.date); })
      .filter(Boolean).sort();
    if (!keys.length) return [atual];
    var primeiro = keys[0];
    var ultimo = keys[keys.length - 1];
    if (ultimo < atual) ultimo = atual;
    if (mesesAdiante){
      var limite = monthKeyAdd(atual, mesesAdiante);
      if (limite > ultimo) ultimo = limite;
    }
    var out = [], mk = primeiro, guarda = 0;
    while (mk <= ultimo && guarda++ < 600){ out.push(mk); mk = monthKeyAdd(mk, 1); }
    return out;
  }

  function materializedAll(mesesAdiante){
    var out = [];
    expenseMonthSpan(mesesAdiante).forEach(function(mk){
      out = out.concat(materializedForMonth(mk));
    });
    return out;
  }

  // Ponto único de leitura: 'all' (ou vazio) devolve todos os meses,
  // 'YYYY-MM' devolve só aquele mês. Tudo que soma dinheiro passa por aqui.
  function expensesFor(monthKey, mesesAdiante){
    return (!monthKey || monthKey === 'all')
      ? materializedAll(mesesAdiante)
      : materializedForMonth(monthKey);
  }

  function monthLabelFromKey(key){
    var parts = key.split('-');
    if (parts.length !== 2) return key;
    var idx = Number(parts[1]) - 1;
    var name = MONTH_NAMES_PT[idx] || parts[1];
    return name + ' de ' + parts[0];
  }

  function getCategoryItems(category){
    var expenses = materializedAll().filter(function(e){ return e.type === 'casal' && e.category === category; });
    var items = [];
    expenses.forEach(function(e){
      if (Array.isArray(e.items) && e.items.length){
        e.items.forEach(function(it){
          var isNewSchema = it.value !== undefined;
          var subtotal, qty, weight;
          if (isNewSchema){
            subtotal = Number(it.value) || 0;
            qty = (it.units != null && it.units !== '') ? Number(it.units) : null;
            weight = (it.weight != null && it.weight !== '') ? Number(it.weight) : null;
          } else {
            // Itens salvos antes desta atualização (schema antigo: quantity/unitValue).
            qty = Number(it.quantity) || 1;
            var uv = Number(it.unitValue) || 0;
            subtotal = qty * uv;
            weight = null;
          }
          var displayQty = (qty != null) ? qty : (weight != null ? weight : 1);
          items.push({description:it.description, quantity:displayQty, weight:weight, unitValue: displayQty ? subtotal/displayQty : subtotal, subtotal:subtotal, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
        });
      } else {
        items.push({description:e.description, quantity:1, weight:null, unitValue:e.value, subtotal:e.value, date:e.date, monthKey:monthKeyFromDate(e.date), expenseId:e.id});
      }
    });
    return items;
  }

  // Meses (mais recente primeiro) em que existe pelo menos uma compra nessa
  // categoria — usado para popular o filtro de mês em "Ver itens".
  function getAvailableMonths(items){
    var seen = {};
    items.forEach(function(it){ if (it.monthKey) seen[it.monthKey] = true; });
    return Object.keys(seen).sort(function(a,b){ return b.localeCompare(a); });
  }

  // Agrupa compras de itens pelo nome do produto (ignorando maiúscula/minúscula
  // e espaços nas pontas), somando a quantidade e o valor de todas as compras
  // desse produto — assim dá pra ver quantas unidades foram compradas no total.
  function groupItemsByProduct(items){
    var map = {};
    var order = [];
    items.forEach(function(it){
      var key = String(it.description||'').trim().toLowerCase();
      if (!map[key]){
        map[key] = {description: it.description, quantity: 0, subtotal: 0, purchases: 0, date: it.date};
        order.push(key);
      }
      var g = map[key];
      g.quantity += it.quantity;
      g.subtotal += it.subtotal;
      g.purchases += 1;
      if (it.date > g.date) g.date = it.date;
    });
    return order.map(function(k){
      var g = map[k];
      g.unitValue = g.quantity > 0 ? g.subtotal / g.quantity : g.subtotal;
      return g;
    });
  }

  function sortCategoryItems(items, sort){
    var arr = items.slice();
    if (sort === 'qty_desc') arr.sort(function(a,b){ return b.quantity - a.quantity; });
    else if (sort === 'value_desc') arr.sort(function(a,b){ return b.subtotal - a.subtotal; });
    else if (sort === 'value_asc') arr.sort(function(a,b){ return a.subtotal - b.subtotal; });
    else arr.sort(function(a,b){ return b.date.localeCompare(a.date); });
    return arr;
  }
