  /* ---------- Calendário ----------
     O <input type="date"> abre o calendário do sistema, que é branco no
     Windows e não tem nada a ver com o app. Este aqui é desenhado com as cores
     e o traço do resto da tela, e ainda cabe atalho ("daqui a 12 meses"), que
     é como as pessoas realmente pensam num prazo. */

  var DIAS_SEMANA = ['D','S','T','Q','Q','S','S'];
  var agendaEstado = null;   // {campo, mesVisto, escolhido, minimo}

  function abrirAgenda(campoEl){
    if (!campoEl) return;
    var atual = campoEl.value || '';
    var form = campoEl.closest('form');
    var dataEl = form ? form.querySelector('.date-input') : null;
    // O prazo nunca pode ser antes do próprio lançamento.
    var minimo = (dataEl && dataEl.value) ? dataEl.value : todayISO();
    var base = atual || monthKeyAdd(monthKeyFromDate(minimo), 11) + '-' + String(minimo).slice(8,10);
    agendaEstado = {
      campo: campoEl,
      mesVisto: monthKeyFromDate(base),
      escolhido: atual || null,
      minimo: minimo
    };
    renderAgenda();
    agendaModalEl.classList.remove('hidden');
  }
  function fecharAgenda(){
    agendaModalEl.classList.add('hidden');
    agendaEstado = null;
  }

  function renderAgenda(){
    if (!agendaEstado) return;
    var mk = agendaEstado.mesVisto;
    var p = mk.split('-');
    var ano = Number(p[0]), mes = Number(p[1]);
    var primeiro = new Date(ano, mes - 1, 1);
    var diasNoMes = new Date(ano, mes, 0).getDate();
    var comecaEm = primeiro.getDay();
    var hoje = todayISO();

    var celulas = '';
    // Sobra do mês anterior, só pra grade não começar torta.
    var anterior = monthKeyAdd(mk, -1);
    var diasAntes = new Date(Number(anterior.split('-')[0]), Number(anterior.split('-')[1]), 0).getDate();
    for (var b = comecaEm - 1; b >= 0; b--){
      celulas += '<button type="button" class="ag-dia fora" data-ir="' + anterior + '">' + (diasAntes - b) + '</button>';
    }
    for (var d = 1; d <= diasNoMes; d++){
      var iso = mk + '-' + String(d).padStart(2, '0');
      var cls = 'ag-dia';
      if (iso === agendaEstado.escolhido) cls += ' is-on';
      else if (iso === hoje) cls += ' hoje';
      var bloqueado = iso < agendaEstado.minimo;
      celulas += '<button type="button" class="' + cls + '" data-dia="' + iso + '"'
        + (bloqueado ? ' disabled title="Antes da data do lançamento"' : '') + '>' + d + '</button>';
    }
    // Completa a última semana com o começo do mês seguinte.
    var usadas = comecaEm + diasNoMes;
    var faltam = (7 - (usadas % 7)) % 7;
    var seguinte = monthKeyAdd(mk, 1);
    for (var f = 1; f <= faltam; f++){
      celulas += '<button type="button" class="ag-dia fora" data-ir="' + seguinte + '">' + f + '</button>';
    }

    var atalhos = [6, 12, 24, 36].map(function(n){
      var alvo = monthKeyAdd(monthKeyFromDate(agendaEstado.minimo), n - 1);
      var dia = Number(String(agendaEstado.minimo).slice(8, 10)) || 1;
      return '<button type="button" class="ag-atalho" data-atalho="' + dateInMonth(alvo, dia) + '">'
        + n + ' meses</button>';
    }).join('');

    agendaPanelEl.innerHTML = ''
      + '<h2>Até quando repete?</h2>'
      + '<div class="note" style="margin:4px 0 14px;">Escolha o <b>último mês</b> em que essa conta ainda vai cair.</div>'
      + '<div class="ag-topo">'
        + '<span class="ag-mes">' + escapeHTML(monthLabelFromKey(mk)) + '</span>'
        + '<span class="ag-navs">'
          + '<button type="button" class="ag-nav" data-ir="' + monthKeyAdd(mk, -1) + '" aria-label="Mês anterior">‹</button>'
          + '<button type="button" class="ag-nav" data-ir="' + monthKeyAdd(mk, 1) + '" aria-label="Próximo mês">›</button>'
        + '</span>'
      + '</div>'
      + '<div class="ag-semana">' + DIAS_SEMANA.map(function(x){ return '<span>' + x + '</span>'; }).join('') + '</div>'
      + '<div class="ag-grade">' + celulas + '</div>'
      + '<div class="note" style="margin:14px 0 0;">Ou conte a partir do lançamento:</div>'
      + '<div class="ag-atalhos">' + atalhos + '</div>'
      + '<div class="settings-actions" style="margin-top:18px;">'
        + '<button type="button" class="secondary-btn" data-action="fechar-agenda">Cancelar</button>'
        + '<button type="button" class="submit-btn" data-action="usar-agenda"'
          + (agendaEstado.escolhido ? '' : ' disabled')
          + ' style="background:var(--neon2);color:#06222c;">Usar esta data</button>'
      + '</div>';
  }

  function usarDataDaAgenda(){
    if (!agendaEstado || !agendaEstado.escolhido) return;
    var campo = agendaEstado.campo;
    var iso = agendaEstado.escolhido;
    campo.value = iso;
    var linha = campo.closest('.prazo-fixo-field');
    if (linha){
      var txt = linha.querySelector('.prazo-txt');
      if (txt) txt.textContent = rotuloPrazo(iso);
      var dica = linha.querySelector('.prazo-dica');
      if (dica) dica.textContent = 'Depois desse mês ele para de aparecer sozinho. O que já passou continua no histórico.';
    }
    fecharAgenda();
  }

  function salvarAparenciaCartao(){
    if (!cartaoEditando) return;
    var d = state.settingsDraft;
    if (!d) return closeCartaoModal();
    // O nome pode ter sido editado na caixa de texto enquanto a janela estava
    // aberta; quem manda é o que está no rascunho agora.
    var nome = d.cards[cartaoEditando.idx] || cartaoEditando.nome;
    d.cardIcons = d.cardIcons || {};
    d.cardColors = d.cardColors || {};
    if (cartaoEditando.icone) d.cardIcons[nome] = cartaoEditando.icone; else delete d.cardIcons[nome];
    if (cartaoEditando.cor) d.cardColors[nome] = cartaoEditando.cor; else delete d.cardColors[nome];
    closeCartaoModal();
    renderSettingsModal();
  }

  function appExtraPorId(id){
    return APPS_EXTRAS.filter(function(a){ return a.id === id; })[0] || null;
  }

  // O HTML do app fica guardado como texto puro, e a tag de fim de script
  // dele está escapada com uma barra a mais. Aqui a barra sai e o HTML volta
  // ao normal, pronto pra virar página dentro do iframe.
  function fonteDoApp(app){
    var bloco = document.getElementById(app.fonte);
    if (!bloco) return null;
    return String(bloco.textContent || '').replace(/<\\\//g, '</');
  }

  function abrirAppExtra(id){
    var app = appExtraPorId(id);
    if (!app) return;
    var html = fonteDoApp(app);
    if (!html){
      alert('Não consegui abrir o ' + app.nome + ' agora. Recarregue a página e tente de novo.');
      return;
    }
    closeAppsModal();
    appfullNomeEl.textContent = app.icone + ' ' + app.nome;
    appfullAcoesEl.innerHTML = '';
    // srcdoc mantém o app no mesmo endereço do Gestor, então o que ele salva
    // no navegador continua salvo quando a pessoa voltar depois.
    appfullFrameEl.setAttribute('srcdoc', html);
    appfullEl.classList.remove('hidden');
    document.body.style.overflow = 'hidden';
  }

  function fecharAppExtra(){
    appfullEl.classList.add('hidden');
    // Descarrega o app ao sair: sem isso ele fica rodando escondido.
    appfullFrameEl.removeAttribute('srcdoc');
    appfullFrameEl.removeAttribute('src');
    appfullNomeEl.textContent = '';
    appfullAcoesEl.innerHTML = '';
    document.body.style.overflow = '';
  }

  /* O app extra pode pedir botões próprios na barra de cima (o RachaFácil pede
     a ajuda e o zerar). Ele manda a lista assim que abre; o clique volta pra
     ele. Só escutamos o iframe que está aberto agora. */
  function ouvirAppExtra(){
    window.addEventListener('message', function(e){
      if (!appfullFrameEl || e.source !== appfullFrameEl.contentWindow) return;
      var d = e.data;
      if (!d || d.tipo !== 'app-acoes' || !Array.isArray(d.acoes)) return;
      appfullAcoesEl.innerHTML = d.acoes.slice(0, 4).map(function(a){
        return '<button type="button" data-app-acao="' + escapeHTML(String(a.id || '')) + '"'
          + ' title="' + escapeHTML(String(a.titulo || '')) + '"'
          + ' aria-label="' + escapeHTML(String(a.titulo || '')) + '">'
          + escapeHTML(String(a.rotulo || '•')) + '</button>';
      }).join('');
    });

    appfullAcoesEl.addEventListener('click', function(e){
      var btn = e.target.closest('[data-app-acao]');
      if (!btn || !appfullFrameEl.contentWindow) return;
      appfullFrameEl.contentWindow.postMessage(
        {tipo:'app-acao', id: btn.getAttribute('data-app-acao')}, '*');
    });
  }

  /* ---------- Janela das categorias ---------- */

  function openCatsModal(){
    catIconeEditando = null;
    renderCatsModal();
    catsModalEl.classList.remove('hidden');
  }
  function closeCatsModal(){
    catsModalEl.classList.add('hidden');
    // Se as metas estavam abertas atrás, elas podem ter acabado de mudar de
    // nome — redesenha em vez de deixar o nome velho na tela.
    if (metasModalEl && !metasModalEl.classList.contains('hidden') && metasDraft) renderMetasModal();
  }

  // Qual categoria está com o seletor de ícone aberto (null = lista normal).
  var catIconeEditando = null;

  function renderCatsModal(){
    if (catIconeEditando){ renderEscolherIcone(catIconeEditando); return; }

    var lista = catsDaCasa();
    var linhas = lista.map(function(c, i){
      var usos = usosDaCategoria(c);
      return '<div class="cat-linha">'
        + '<span class="cat-ordem">'
          + '<button type="button" class="cat-seta" data-action="subir-cat" data-cat="'+escapeHTML(c)+'"'+(i === 0 ? ' disabled' : '')+' title="Subir">▲</button>'
          + '<button type="button" class="cat-seta" data-action="descer-cat" data-cat="'+escapeHTML(c)+'"'+(i === lista.length-1 ? ' disabled' : '')+' title="Descer">▼</button>'
        + '</span>'
        // O próprio ícone é o botão de trocar o ícone: é onde a pessoa olha
        // quando quer mudá-lo.
        + '<button type="button" class="cat-icone-btn" data-action="trocar-icone" data-cat="'+escapeHTML(c)+'" title="Trocar o ícone">'
          + catChipHTML(c, 30) + '</button>'
        + '<span class="cat-linha-nome">'
          + '<span>' + escapeHTML(c)
            + '<span class="cat-linha-uso">' + (usos ? usos + (usos === 1 ? ' lançamento' : ' lançamentos') : 'sem lançamentos') + '</span></span></span>'
        + '<button type="button" class="meta-cfg-acao" data-action="renomear-cat" data-cat="'+escapeHTML(c)+'" title="Renomear">✏️</button>'
        + '<button type="button" class="meta-cfg-acao" data-action="apagar-cat" data-cat="'+escapeHTML(c)+'" title="Apagar">🗑️</button>'
        + '</div>';
    }).join('');

    catsPanelEl.innerHTML = ''
      + '<h2>🏷️ Categorias da casa</h2>'
      + '<div class="note" style="margin:6px 0 14px;">Toque no ícone pra trocar. As setas mudam a ordem em que elas aparecem na hora de lançar — deixe as que vocês mais usam no topo. Renomear troca o nome em todos os lançamentos antigos de uma vez, e apagar uma categoria com gasto move os lançamentos pra outra em vez de perdê-los.</div>'
      + '<div class="field"><label>Criar categoria</label>'
        + '<div class="cat-add-linha">'
          + '<input type="text" id="cat-nova" placeholder="Ex: iFood, Cachorro, Guardar" autocomplete="off">'
          + '<button type="button" class="secondary-btn" id="btn-criar-cat">Criar</button>'
        + '</div></div>'
      + '<div class="field"><label>' + lista.length + (lista.length === 1 ? ' categoria' : ' categorias') + '</label>'
        + linhas + '</div>'
      + '<div class="settings-actions" style="margin-top:14px;">'
        + '<button type="button" class="secondary-btn" data-action="fechar-categorias">Fechar</button>'
      + '</div>';
  }

  function renderEscolherIcone(cat){
    var atual = catIcon(cat);
    var cor = catColor(cat);
    var grade = ICONES_CATEGORIA.map(function(ic){
      return '<button type="button" class="icone-op'+(ic === atual ? ' is-on' : '')+'" data-action="usar-icone" data-icone="'+ic+'">'+ic+'</button>';
    }).join('');
    catsPanelEl.innerHTML = ''
      + '<h2>Ícone de ' + escapeHTML(cat) + '</h2>'
      + '<div class="note" style="margin:6px 0 14px;">Escolha um. Ele passa a aparecer em toda lista e gráfico onde essa categoria entra.</div>'
      + '<div class="icone-atual" style="border-color:'+hexToRgba(cor,0.5)+';">'
        + '<span style="font-size:30px;">'+atual+'</span>'
        + '<span>Ícone de agora</span>'
      + '</div>'
      + '<div class="icone-grade">' + grade + '</div>'
      + '<div class="settings-actions" style="margin-top:16px;">'
        + '<button type="button" class="secondary-btn" data-action="voltar-categorias">Voltar</button>'
      + '</div>';
  }

  async function acaoMoverCategoria(nome, passo){
    var lista = catsDaCasa();
    var i = lista.indexOf(nome);
    var j = i + passo;
    if (i === -1 || j < 0 || j >= lista.length) return;
    lista.splice(j, 0, lista.splice(i, 1)[0]);
    var novo = Object.assign({}, state.settings, {categories: normalizarCategorias(lista)});
    if (!await salvarCategorias(novo, false)) return;
    renderCatsModal();
    render();
  }

  async function acaoUsarIcone(icone){
    var cat = catIconeEditando;
    if (!cat) return;
    var icones = Object.assign({}, state.settings.categoryIcons || {});
    icones[cat] = icone;
    var novo = Object.assign({}, state.settings, {categoryIcons: icones});
    if (!await salvarCategorias(novo, false)) return;
    catIconeEditando = null;
    renderCatsModal();
    render();
  }

  async function salvarCategorias(novoSettings, tambemGastos){
    var okG = tambemGastos ? await saveExpenses(state.expenses) : true;
    var okS = await saveSettings(novoSettings);
    if (!okG || !okS){ alert('Não consegui salvar. Tente de novo.'); return false; }
    state.settings = novoSettings;
    invalidateCustomColors();
    return true;
  }

  async function criarCategoria(){
    var el = catsPanelEl.querySelector('#cat-nova');
    var nome = (el ? el.value : '').trim();
    if (!nome) return;
    if (catExiste(nome)){ alert('Já existe uma categoria com esse nome.'); return; }
    var novo = Object.assign({}, state.settings, {
      categories: normalizarCategorias(catsDaCasa().concat([nome]))
    });
    if (!await salvarCategorias(novo, false)) return;
    if (el) el.value = '';
    renderCatsModal();
    render();
  }

  async function acaoRenomearCategoria(antiga){
    var nova = prompt('Novo nome para a categoria "' + antiga + '":', antiga);
    if (nova === null) return;
    nova = nova.trim();
    if (!nova || nova === antiga) return;

    var usos = usosDaCategoria(antiga);
    var aviso = usos
      ? 'Isso vai renomear em ' + usos + ' lançamento' + (usos === 1 ? '' : 's') + ' já registrado' + (usos === 1 ? '' : 's') + '.'
      : 'Nenhum lançamento usa essa categoria ainda.';
    if (catExiste(nova)) aviso += '\n\nAtenção: já existe "' + nova + '". As duas viram uma só.';
    if (!confirm(aviso + '\n\nRenomear?')) return;

    if (!await salvarCategorias(trocarNomeCategoria(antiga, nova), usos > 0)) return;
    renderCatsModal();
    render();
  }

  async function acaoApagarCategoria(nome){
    var lista = catsDaCasa();
    if (lista.length <= 1){ alert('Precisa sobrar pelo menos uma categoria.'); return; }

    var usos = usosDaCategoria(nome);
    var destino = null;
    if (usos > 0){
      var opcoes = lista.filter(function(c){ return c !== nome; });
      // "Outros" é o destino natural quando existe; senão, a primeira que sobrar.
      var sugestao = opcoes.indexOf('Outros') !== -1 ? 'Outros' : opcoes[0];
      destino = prompt(
        nome + ' tem ' + usos + ' lançamento' + (usos === 1 ? '' : 's') + '.\n\n'
        + 'Pra onde eles vão? Escreva o nome de uma destas:\n' + opcoes.join(', '),
        sugestao);
      if (destino === null) return;
      destino = destino.trim();
      if (opcoes.indexOf(destino) === -1){ alert('Categoria "' + destino + '" não existe. Nada foi mudado.'); return; }
    } else {
      if (!confirm('Apagar a categoria "' + nome + '"?')) return;
    }

    if (!await salvarCategorias(removerCategoria(nome, destino), usos > 0)) return;
    renderCatsModal();
    render();
  }

  /* ---------- Janela das metas ---------- */

  var metasDraft = null;

  function openMetasModal(){
    var m = normalizarMetas(state.settings.goals);
    metasDraft = {
      geral: m.geral,
      categorias: Object.assign({}, m.categorias),
      cartoes: Object.assign({}, m.cartoes),
      // Itens que a pessoa mandou aparecer na lista mas ainda estão sem valor.
      // Sem esta lista eles sumiriam no primeiro redesenho, porque só entra no
      // rascunho o que tem meta preenchida.
      extras: {categoria:[], cartao:[]}
    };
    renderMetasModal();
    metasModalEl.classList.remove('hidden');
  }
  function closeMetasModal(){ metasModalEl.classList.add('hidden'); metasDraft = null; }

  function mesDaJanelaDeMetas(){
    return (state.resumoMonth && state.resumoMonth !== 'all') ? state.resumoMonth : currentMonthKey();
  }

  // Quantos lançamentos usam este item. É o número que decide se dá pra
  // apagar (nenhum) ou só renomear (tem gasto pendurado nele).
  function quantosUsam(tipo, nome){
    return state.expenses.filter(function(e){
      return tipo === 'cartao' ? (e.card === nome) : (e.category === nome);
    }).length;
  }

  function listaDeCartoes(){
    var c = (state.settings.cards && state.settings.cards.length) ? state.settings.cards : DEFAULT_CARDS;
    return c.slice();
  }

  function renderMetasModal(){
    var mes = mesDaJanelaDeMetas();
    var g = gastoDoMesPorItem(mes);

    // Uma linha por item. Aparecem: os que já têm meta, mais os que tiveram
    // gasto neste mês. Oferecer meta pra coisa que a casa nunca usa só encheria
    // a lista de itens que ninguém lê.
    function bloco(tipo, metas, gastos, extras){
      var chaves = Object.keys(metas);
      Object.keys(gastos).forEach(function(k){ if (chaves.indexOf(k) === -1) chaves.push(k); });
      (metasDraft.extras[tipo] || []).forEach(function(k){ if (chaves.indexOf(k) === -1) chaves.push(k); });
      (extras || []).forEach(function(k){ if (chaves.indexOf(k) === -1) chaves.push(k); });
      chaves.sort(function(a,b){ return (gastos[b] || 0) - (gastos[a] || 0); });

      if (!chaves.length) return '<div class="note">Nada lançado neste mês ainda.</div>';

      return chaves.map(function(k){
        var valor = metas[k];
        var usos = quantosUsam(tipo, k);
        var selo = tipo === 'cartao' ? cardChipHTML(k) : catChipHTML(k, 22);
        return '<div class="meta-linha-cfg">'
          + '<span class="meta-cfg-nome">' + selo
            + '<span>' + escapeHTML(k)
              + '<span class="meta-cfg-gasto">gastou ' + formatBRL(gastos[k] || 0) + ' neste mês</span></span></span>'
          + '<input type="number" inputmode="decimal" min="0" step="0.01" class="meta-cfg-input meta-input-' + tipo + '"'
            + ' data-item="' + escapeHTML(k) + '" placeholder="sem meta" value="' + (valor ? valor : '') + '">'
          + '<button type="button" class="meta-cfg-acao" data-action="renomear-item" data-tipo="'+tipo+'" data-item="'+escapeHTML(k)+'" title="Renomear">✏️</button>'
          // Item com lançamento não pode ser apagado — sumiria o nome de gastos
          // que já existem. Nesse caso o botão tira só a meta.
          + '<button type="button" class="meta-cfg-acao" data-action="apagar-item" data-tipo="'+tipo+'" data-item="'+escapeHTML(k)+'" data-usos="'+usos+'"'
            + ' title="' + (usos ? 'Tirar a meta (tem ' + usos + ' lançamento' + (usos===1?'':'s') + ' usando este nome)' : 'Apagar da lista') + '">'
            + (usos ? '✕' : '🗑️') + '</button>'
          + '</div>';
      }).join('');
    }

    var faltandoCat = catsDaCasa()
      .filter(function(c){ return !metasDraft.categorias[c] && !g.categorias[c]; });
    var faltandoCartao = listaDeCartoes()
      .filter(function(c){ return !metasDraft.cartoes[c] && !g.cartoes[c]; });

    function adicionar(id, rotulo, opcoes, textoNovo){
      return '<div class="meta-add-linha">'
        + '<select id="' + id + '"><option value="">' + escapeHTML(rotulo) + '</option>'
          + opcoes.map(function(c){ return '<option value="'+escapeHTML(c)+'">'+escapeHTML(c)+'</option>'; }).join('')
          + '<option value="__novo__">✏️ ' + escapeHTML(textoNovo) + '</option>'
        + '</select></div>';
    }

    metasPanelEl.innerHTML = ''
      + '<h2>🎯 Metas de gasto</h2>'
      + '<div class="note" style="margin:6px 0 14px;">Meta é um teto, não uma conta a pagar — nada trava quando passa, o app só avisa. Deixe em branco a que você não quiser usar; sem nenhuma meta preenchida, nada de meta aparece na tela.</div>'

      + '<div class="field"><label>Meta geral do mês (contas do casal)</label>'
        + '<input type="number" inputmode="decimal" min="0" step="0.01" id="meta-geral" placeholder="Ex: 7000" value="' + (metasDraft.geral ? metasDraft.geral : '') + '">'
        + '<div class="note">Neste mês vocês já estão em <strong>' + formatBRL(g.totalCasal) + '</strong>.</div></div>'

      + '<div class="field" style="margin-top:18px;"><label>Metas por categoria</label>'
        + '<div class="note" style="margin:-2px 0 6px;">Conta as contas do casal — mercado, gasolina, iFood.</div>'
        + bloco('categoria', metasDraft.categorias, g.categorias)
        + adicionar('meta-add-cat', 'Adicionar categoria…', faltandoCat, 'Criar uma categoria nova')
        + '<button type="button" class="link-gerenciar" data-action="abrir-categorias">✏️ criar, renomear ou apagar categorias</button>'
      + '</div>'

      + '<div class="field" style="margin-top:18px;"><label>Metas por cartão</label>'
        + '<div class="note" style="margin:-2px 0 6px;">Conta <strong>tudo</strong> que passou no cartão no mês, do casal e pessoal — é o que vai chegar na fatura.</div>'
        + bloco('cartao', metasDraft.cartoes, g.cartoes, listaDeCartoes().filter(function(c){ return metasDraft.cartoes[c]; }))
        + adicionar('meta-add-cartao', 'Adicionar cartão…', faltandoCartao, 'Cadastrar um cartão novo')
      + '</div>'

      + '<div class="settings-actions" style="margin-top:18px;">'
        + '<button type="button" class="submit-btn" id="btn-salvar-metas" style="background:var(--positive);color:#04220f;">Salvar metas</button>'
        + '<button type="button" class="secondary-btn" data-action="close-metas">Cancelar</button>'
      + '</div>'
      + (metasAtivas() ? '<button type="button" class="secondary-btn" id="btn-limpar-metas" style="margin-top:8px;">Tirar todas as metas</button>' : '');
  }

  function lerMetasDoFormulario(){
    var geralEl = metasPanelEl.querySelector('#meta-geral');
    var geral = geralEl ? parseFloat(geralEl.value) : NaN;
    function colher(classe){
      var out = {};
      metasPanelEl.querySelectorAll(classe).forEach(function(el){
        var v = parseFloat(el.value);
        if (v > 0) out[el.getAttribute('data-item')] = v;
      });
      return out;
    }
    return {
      geral: (geral > 0 ? geral : null),
      categorias: colher('.meta-input-categoria'),
      cartoes: colher('.meta-input-cartao')
    };
  }

  // Guarda o que já está digitado antes de redesenhar a janela, senão um
  // clique em renomear apagaria os números que a pessoa acabou de escrever.
  function guardarRascunhoMetas(){
    var atual = lerMetasDoFormulario();
    metasDraft.geral = atual.geral;
    metasDraft.categorias = atual.categorias;
    metasDraft.cartoes = atual.cartoes;
    // Tudo que está na tela sem valor preenchido continua listado.
    ['categoria','cartao'].forEach(function(tipo){
      var alvo = tipo === 'cartao' ? atual.cartoes : atual.categorias;
      metasPanelEl.querySelectorAll('.meta-input-' + tipo).forEach(function(el){
        var nome = el.getAttribute('data-item');
        if (alvo[nome] === undefined && metasDraft.extras[tipo].indexOf(nome) === -1){
          metasDraft.extras[tipo].push(nome);
        }
      });
    });
  }

  function adicionarItemMeta(tipo, nome){
    nome = (nome || '').trim();
    if (!nome) return;
    guardarRascunhoMetas();
    if (metasDraft.extras[tipo].indexOf(nome) === -1) metasDraft.extras[tipo].push(nome);
    // Cartão novo entra também na lista de cartões da casa, senão ele não
    // apareceria na hora de lançar um gasto.
    if (tipo === 'cartao'){
      var cards = listaDeCartoes();
      if (cards.indexOf(nome) === -1){
        cards.push(nome);
        state.settings = Object.assign({}, state.settings, {cards: cards});
        saveSettings(state.settings);
      }
    }
    renderMetasModal();
    var novo = metasPanelEl.querySelector('.meta-input-' + tipo + '[data-item="' + nome.replace(/"/g,'\\"') + '"]');
    if (novo) novo.focus();
  }

  // Renomear vale pra tudo de uma vez: os lançamentos antigos, a meta e (no
  // caso do cartão) a lista de cartões. Se mudasse só num lugar, o gasto
  // antigo ficaria órfão com o nome velho.
  async function renomearItemMeta(tipo, antigo){
    var oQue = tipo === 'cartao' ? 'cartão' : 'categoria';
    var novo = prompt('Novo nome para o ' + oQue + ' "' + antigo + '":', antigo);
    if (novo === null) return;
    novo = novo.trim();
    if (!novo || novo === antigo) return;

    var usos = quantosUsam(tipo, antigo);
    var existe = tipo === 'cartao'
      ? listaDeCartoes().indexOf(novo) !== -1
      : (catExiste(novo) || state.expenses.some(function(e){ return e.category === novo; }));

    var aviso = usos
      ? 'Isso vai renomear em ' + usos + ' lançamento' + (usos === 1 ? '' : 's') + ' já registrado' + (usos === 1 ? '' : 's') + '.'
      : 'Nenhum lançamento usa esse nome ainda.';
    if (existe) aviso += '\n\nAtenção: já existe "' + novo + '". Os dois vão virar um só.';
    if (!confirm(aviso + '\n\nRenomear?')) return;

    guardarRascunhoMetas();

    state.expenses.forEach(function(e){
      if (tipo === 'cartao'){ if (e.card === antigo) e.card = novo; }
      else if (e.category === antigo) e.category = novo;
    });

    metasDraft.extras[tipo] = metasDraft.extras[tipo].map(function(k){ return k === antigo ? novo : k; });
    var alvo = tipo === 'cartao' ? metasDraft.cartoes : metasDraft.categorias;
    // Categoria também vive na lista da casa (a que aparece no formulário).
    // Sem esta linha o nome mudaria nos gastos mas não no seletor.
    if (tipo === 'categoria'){
      state.settings = Object.assign({}, state.settings, {
        categories: normalizarCategorias(catsDaCasa().map(function(c){ return c === antigo ? novo : c; }))
      });
    }
    if (alvo[antigo] !== undefined){
      // Se os dois nomes tinham meta, fica a maior — juntar somando daria um
      // teto que ninguém escolheu.
      alvo[novo] = Math.max(Number(alvo[novo]) || 0, Number(alvo[antigo]) || 0);
      delete alvo[antigo];
    }

    var novoSettings = state.settings;
    if (tipo === 'cartao'){
      var cards = listaDeCartoes().map(function(c){ return c === antigo ? novo : c; });
      cards = cards.filter(function(c, i){ return cards.indexOf(c) === i; });
      novoSettings = Object.assign({}, state.settings, {cards: cards});
    }
    novoSettings = Object.assign({}, novoSettings, {goals: normalizarMetas(metasDraft)});

    var okG = await saveExpenses(state.expenses);
    var okS = await saveSettings(novoSettings);
    if (!okG || !okS){ alert('Não consegui salvar a troca de nome. Tente de novo.'); return; }
    state.settings = novoSettings;
    invalidateCustomColors();
    renderMetasModal();
    render();
  }

  async function apagarItemMeta(tipo, nome, usos){
    guardarRascunhoMetas();
    var alvo = tipo === 'cartao' ? metasDraft.cartoes : metasDraft.categorias;

    function tirarDosExtras(){
      metasDraft.extras[tipo] = metasDraft.extras[tipo].filter(function(k){ return k !== nome; });
    }

    if (usos > 0){
      // Tem gasto pendurado: apagar o item apagaria o nome de lançamentos que
      // existem. Então só a meta sai.
      delete alvo[nome];
      tirarDosExtras();
      renderMetasModal();
      return;
    }

    var oQue = tipo === 'cartao' ? 'o cartão' : 'a categoria';
    if (!confirm('Tirar ' + oQue + ' "' + nome + '" da lista?')) return;
    delete alvo[nome];
    tirarDosExtras();

    var novoSettings = state.settings;
    if (tipo === 'cartao'){
      var cards = listaDeCartoes().filter(function(c){ return c !== nome; });
      if (!cards.length) cards = DEFAULT_CARDS.slice();
      novoSettings = Object.assign({}, state.settings, {cards: cards});
    }
    novoSettings = Object.assign({}, novoSettings, {goals: normalizarMetas(metasDraft)});
    var ok = await saveSettings(novoSettings);
    if (!ok){ alert('Não consegui salvar. Tente de novo.'); return; }
    state.settings = novoSettings;
    renderMetasModal();
    render();
  }

  async function handleConfirmReset(){
    var checks = resetPanelEl.querySelectorAll('.reset-check:checked');
    var wipeCasal = false, wipeSettings = false, personalMemberIds = [];
    checks.forEach(function(cb){
      var v = cb.value;
      if (v === 'casal') wipeCasal = true;
      else if (v === 'settings') wipeSettings = true;
      else if (v.indexOf('pessoal:') === 0) personalMemberIds.push(v.slice('pessoal:'.length));
    });
    if (!wipeCasal && !wipeSettings && !personalMemberIds.length) return;

    var toRemove = state.expenses.filter(function(e){
      if (wipeCasal && e.type === 'casal') return true;
      if (e.type === 'pessoal' && personalMemberIds.indexOf(e.person) !== -1) return true;
      return false;
    });
    var remaining = state.expenses.filter(function(e){ return toRemove.indexOf(e) === -1; });
    var savedR = await saveExpenses(remaining);
    if (!savedR){ alert('Não foi possível apagar os dados. Tente de novo.'); return; }
    state.expenses = remaining;
    for (var i=0;i<toRemove.length;i++){
      if (toRemove[i].thumb) await deleteFullReceipt(toRemove[i].id);
    }
    if (wipeSettings){
      var fresh = defaultSettings();
      var savedS = await saveSettings(fresh);
      if (savedS) state.settings = fresh;
      ensureSubTabDefaults();
    }
    state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
    if (state.currentTab !== 'resumo' && state.currentTab !== 'meses' && !state.settings.members.find(function(m){ return m.id === state.currentTab; })){
      state.currentTab = 'resumo';
    }
    closeResetModal();
    render();
  }

  // Mostra e esconde os campos de pagamento conforme o que já foi escolhido.
  // Ficava espalhado em três handlers que se contradiziam; agora é um lugar só,
  // chamado sempre que qualquer um desses campos muda.
  function atualizarCamposPagamento(form){
    if (!form) return;
    var pmEl = form.querySelector('.payment-method-select');
    var metodo = pmEl ? pmEl.value : 'outro';
    var usaCartao = (metodo === 'credito' || metodo === 'debito');
    var fixEl = form.querySelector('.fixed-toggle-select');
    var ehFixo = !!fixEl && fixEl.value === 'sim';

    form.querySelectorAll('.card-field').forEach(function(el){
      el.style.display = usaCartao ? 'block' : 'none';
    });
    var custom = form.querySelector('.custom-card-field');
    if (custom){
      var sel = form.querySelector('.card-select');
      custom.style.display = (usaCartao && sel && sel.value === '__custom__') ? 'block' : 'none';
    }

    // Gasto fixo e parcelamento não convivem: um repete pra sempre com o mesmo
    // valor, o outro divide um valor único em N vezes. E débito não parcela.
    form.querySelectorAll('.credito-only-field').forEach(function(el){
      el.style.display = (metodo === 'credito' && !ehFixo) ? 'block' : 'none';
    });
    form.querySelectorAll('.parcelavel-field').forEach(function(el){
      el.style.display = (!ehFixo && metodo !== 'debito') ? 'block' : 'none';
    });

    // O prazo só existe quando é fixo. Deixando de ser fixo, o prazo é
    // esquecido — senão um "até março" invisível iria junto ao salvar.
    var prazoCaixa = form.querySelector('.prazo-fixo-field');
    if (prazoCaixa){
      // Na aba Contas Fixas tudo que se cadastra já é fixo — lá não existe a
      // pergunta "é fixo?", então a caixa fica sempre à vista.
      var fixoAqui = prazoCaixa.getAttribute('data-sempre-fixo') === '1' ? true : ehFixo;
      prazoCaixa.style.display = fixoAqui ? 'block' : 'none';
      var prazoSel = prazoCaixa.querySelector('.prazo-toggle-select');
      var prazoInp = prazoCaixa.querySelector('.prazo-ate-input');
      if (!fixoAqui){
        if (prazoSel) prazoSel.value = 'sempre';
        if (prazoInp) prazoInp.value = '';
      }
      var comPrazo = fixoAqui && prazoSel && prazoSel.value === 'ate';
      var linha = prazoCaixa.querySelector('.prazo-data-linha');
      if (linha) linha.style.display = comPrazo ? 'flex' : 'none';
      if (!comPrazo && prazoInp) prazoInp.value = '';
      var txt = prazoCaixa.querySelector('.prazo-txt');
      if (txt && (!prazoInp || !prazoInp.value)) txt.textContent = 'Escolher até quando';
    }

    // Se a pergunta "foi parcelado?" saiu da tela, ela volta pra "não" — senão
    // um "sim" escondido seguiria valendo na hora de salvar.
    var tog = form.querySelector('.installment-toggle-select');
    var caixa = tog ? tog.closest('.field') : null;
    var perguntaVisivel = !!caixa && caixa.style.display !== 'none';
    if (tog && !perguntaVisivel) tog.value = 'nao';
    var campos = form.querySelector('.installment-fields');
    if (campos) campos.style.display = (perguntaVisivel && tog && tog.value === 'sim') ? 'block' : 'none';
    atualizarPreviaParcela(form);
  }

  function captureAddFormDraft(){
    var form = contentEl.querySelector('form.add-form');
    if (!form) return null;
    var draft = { memberId: form.getAttribute('data-member') };
    var el;
    el = form.querySelector('.category-select'); if (el) draft.category = el.value;
    el = form.querySelector('.custom-category-input'); if (el) draft.customCategory = el.value;
    el = form.querySelector('.description-input'); if (el) draft.description = el.value;
    el = form.querySelector('.value-input'); if (el && !el.readOnly) draft.value = el.value;
    el = form.querySelector('.date-input'); if (el) draft.date = el.value;
    el = form.querySelector('.payment-method-select'); if (el) draft.paymentMethod = el.value;
    el = form.querySelector('.card-select'); if (el) draft.card = el.value;
    el = form.querySelector('.custom-card-input'); if (el) draft.customCard = el.value;
    el = form.querySelector('.fixed-toggle-select'); if (el) draft.fixedToggle = el.value;
    el = form.querySelector('.prazo-toggle-select'); if (el) draft.prazoToggle = el.value;
    el = form.querySelector('.prazo-ate-input'); if (el) draft.prazoAte = el.value;
    el = form.querySelector('.installment-toggle-select'); if (el) draft.installmentToggle = el.value;
    el = form.querySelector('.installments-total-input'); if (el) draft.installmentsTotal = el.value;
    el = form.querySelector('.installments-paid-input'); if (el) draft.installmentsPaid = el.value;
    var itemRows = form.querySelectorAll('.item-row');
    if (itemRows.length){
      draft.items = [];
      itemRows.forEach(function(row){
        draft.items.push({
          position: row.querySelector('.item-pos-input').value,
          description: row.querySelector('.item-desc-input').value,
          units: row.querySelector('.item-units-input').value,
          weight: row.querySelector('.item-weight-input').value,
          value: row.querySelector('.item-value-input').value
        });
      });
    }
    return draft;
  }

  function applyAddFormDraft(draft){
    if (!draft) return;
    var form = contentEl.querySelector('form.add-form');
    if (!form || form.getAttribute('data-member') !== draft.memberId) return;
    var el;
    el = form.querySelector('.category-select');
    if (el && draft.category != null){ el.value = draft.category; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-category-input'); if (el && draft.customCategory != null) el.value = draft.customCategory;
    el = form.querySelector('.description-input'); if (el && draft.description != null) el.value = draft.description;
    el = form.querySelector('.date-input'); if (el && draft.date != null) el.value = draft.date;
    el = form.querySelector('.payment-method-select');
    if (el && draft.paymentMethod != null){ el.value = draft.paymentMethod; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.card-select');
    if (el && draft.card != null){ el.value = draft.card; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.custom-card-input'); if (el && draft.customCard != null) el.value = draft.customCard;
    el = form.querySelector('.fixed-toggle-select');
    if (el && draft.fixedToggle != null){ el.value = draft.fixedToggle; el.dispatchEvent(new Event('change', {bubbles:true})); }
    // O prazo volta antes do change do seletor, senão o campo escondido
    // limparia a data que a pessoa tinha escolhido.
    el = form.querySelector('.prazo-ate-input'); if (el && draft.prazoAte != null) el.value = draft.prazoAte;
    el = form.querySelector('.prazo-toggle-select');
    if (el && draft.prazoToggle != null){
      el.value = draft.prazoToggle;
      var campoAte = form.querySelector('.prazo-ate-input');
      if (campoAte && draft.prazoAte) campoAte.value = draft.prazoAte;
      el.dispatchEvent(new Event('change', {bubbles:true}));
      var txt = form.querySelector('.prazo-txt');
      if (txt && draft.prazoAte) txt.textContent = rotuloPrazo(draft.prazoAte);
    }
    el = form.querySelector('.installment-toggle-select');
    if (el && draft.installmentToggle != null){ el.value = draft.installmentToggle; el.dispatchEvent(new Event('change', {bubbles:true})); }
    el = form.querySelector('.installments-total-input'); if (el && draft.installmentsTotal != null) el.value = draft.installmentsTotal;
    el = form.querySelector('.installments-paid-input'); if (el && draft.installmentsPaid != null) el.value = draft.installmentsPaid;
    if (draft.items && draft.items.length){
      var list = form.querySelector('.items-list');
      if (list){
        list.innerHTML = draft.items.map(itemRowHTML).join('');
        recalcItemsTotal(form);
      }
    }
    if (draft.value != null){
      var valueInput = form.querySelector('.value-input');
      if (valueInput && !valueInput.readOnly) valueInput.value = draft.value;
    }
  }

  async function saveSettingsAndClose(){
    var d = state.settingsDraft;
    d.members.forEach(function(m){
      if (!m.name || !m.name.trim()) m.name = 'Pessoa';
      m.percentage = Number(m.percentage) || 0;
    });
    var originais = d.cardsOriginais || [];
    var brutos = (d.cards || []).map(function(c){ return (c||'').trim(); });
    var iconesAntes = d.cardIcons || {}, coresAntes = d.cardColors || {};
    var icones = {}, cores = {};
    brutos.forEach(function(nome, i){
      if (!nome) return;
      var antigo = originais[i];
      var ic = iconesAntes[nome] || (antigo ? iconesAntes[antigo] : null);
      var cor = coresAntes[nome] || (antigo ? coresAntes[antigo] : null);
      if (ic) icones[nome] = ic;
      if (cor) cores[nome] = cor;
    });
    d.cards = brutos.filter(function(c){ return c.length > 0; });
    if (!d.cards.length) d.cards = DEFAULT_CARDS.slice();
    d.cardIcons = icones;
    d.cardColors = cores;
    delete d.cardsOriginais;
    var ok = await saveSettings(d);
    if (!ok){ alert('Não foi possível salvar as configurações. Tente de novo.'); return; }
    var formDraft = captureAddFormDraft();
    state.settings = d;
    ensureSubTabDefaults();
    if (state.currentTab !== 'resumo' && state.currentTab !== 'meses' && !state.settings.members.find(function(m){ return m.id === state.currentTab; })){
      state.currentTab = 'resumo';
    }
    closeSettingsModal();
    render();
    applyAddFormDraft(formDraft);
  }

    var memberId = form.getAttribute('data-member');
    var type = state.subTab[memberId] || 'casal';
    var catSelect = form.querySelector('.category-select');
    var category = catSelect.value;
    if (category === '__custom__'){
      var custom = form.querySelector('.custom-category-input').value.trim();
      if (!custom){ alert('Digite o nome da categoria.'); return; }
      category = custom;
    }
    var description = form.querySelector('.description-input').value.trim();
    var value = parseFloat(form.querySelector('.value-input').value);
    var date = form.querySelector('.date-input').value || todayISO();

    if (!description){ alert('Digite uma descrição.'); return; }
    if (!value || value <= 0){ alert('Digite um valor válido.'); return; }

    var extra = {};
    var fixedToggleEl = form.querySelector('.fixed-toggle-select');
    extra.fixed = !!fixedToggleEl && fixedToggleEl.value === 'sim';

    // Prazo do gasto fixo. Só vale quando é fixo E a pessoa escolheu "tem
    // prazo" — nos outros casos vai null e a conta repete sem fim.
    extra.fixedUntil = null;
    if (extra.fixed){
      var prazoSel = form.querySelector('.prazo-toggle-select');
      if (prazoSel && prazoSel.value === 'ate'){
        var ate = (form.querySelector('.prazo-ate-input') || {}).value || '';
        if (!ate){ alert('Escolha até quando esse gasto fixo vai.'); return; }
        if (ate < date){ alert('O prazo não pode ser antes da data do lançamento.'); return; }
        extra.fixedUntil = ate;
      }
    }
    // Forma de pagamento agora vale pros dois formulários — é ela que alimenta
    // o quadro "Contas por cartão" no Resumo.
    var paymentMethodEl = form.querySelector('.payment-method-select');
    var paymentMethod = paymentMethodEl ? paymentMethodEl.value : (type === 'casal' ? 'outro' : 'credito');
    extra.paymentMethod = paymentMethod;
    if (paymentMethod === 'credito' || paymentMethod === 'debito'){
      var cardSelectEl = form.querySelector('.card-select');
      var cardValue = cardSelectEl ? cardSelectEl.value : '';
      if (cardValue === '__custom__'){
        var customCard = form.querySelector('.custom-card-input').value.trim();
        if (!customCard){ alert('Digite o nome do cartão.'); return; }
        cardValue = customCard;
      }
      if (!cardValue){ alert('Selecione o cartão.'); return; }
      extra.card = cardValue;
    } else {
      extra.card = null;
    }

    // Parcelamento: débito não parcela, e no formulário pessoal ele só existe
    // no crédito (carnê e crediário da casa entram pelo formulário do casal).
    var permiteParcela = !extra.fixed && paymentMethod !== 'debito'
      && (type === 'casal' || paymentMethod === 'credito');
    var instToggleEl = form.querySelector('.installment-toggle-select');
    var isInstallment = !!instToggleEl && instToggleEl.value === 'sim' && permiteParcela;
    extra.installment = isInstallment;
    if (isInstallment){
      var totalInst = parseInt(form.querySelector('.installments-total-input').value, 10);
      if (!totalInst || totalInst < 1){ alert('Informe em quantas vezes foi parcelado.'); return; }

      // Sem ajuste manual aberto, o app conta sozinho quantas já venceram
      // pela data da compra. É a conta que a pessoa fazia de cabeça antes.
      var caixaAjuste = form.querySelector('.parcela-ajuste');
      var usouManual = caixaAjuste && caixaAjuste.style.display !== 'none';
      var paidInst;
      if (usouManual){
        paidInst = parseInt(form.querySelector('.installments-paid-input').value, 10);
        if (isNaN(paidInst) || paidInst < 0) paidInst = 0;
      } else {
        paidInst = parcelasVencidas(date, totalInst);
      }
      if (paidInst > totalInst) paidInst = totalInst;
      extra.installmentsTotal = totalInst;
      extra.installmentsPaid = paidInst;
    } else {
      extra.installmentsTotal = null;
      extra.installmentsPaid = null;
    }

    if (type === 'casal'){
      var itemRows = form.querySelectorAll('.item-row');
      var items = [];
      itemRows.forEach(function(row){
        var idesc = row.querySelector('.item-desc-input').value.trim();
        var ivalue = parseFloat(row.querySelector('.item-value-input').value) || 0;
        var ipos = parseInt(row.querySelector('.item-pos-input').value, 10);
        var iunits = parseFloat(row.querySelector('.item-units-input').value);
        var iweight = parseFloat(row.querySelector('.item-weight-input').value);
        if (idesc && ivalue > 0) items.push({
          position: isNaN(ipos) ? null : ipos,
          description: idesc,
          units: isNaN(iunits) ? null : iunits,
          weight: isNaN(iweight) ? null : iweight,
          value: ivalue
        });
      });
      extra.items = items.length ? items : null;
    }

    if (state.editingId){
      var idx = state.expenses.findIndex(function(e){ return e.id === state.editingId; });
      if (idx === -1){ state.editingId = null; render(); return; }
      var original = state.expenses[idx];
      var newThumb = original.thumb;
      if (state.pendingPhoto) newThumb = state.pendingPhoto.thumb;
      else if (state.removeExistingPhoto) newThumb = null;
      var updated = Object.assign({}, original, {category:category, description:description, value:value, date:date, thumb:newThumb}, extra);
      state.expenses[idx] = updated;
      var savedEdit = await saveExpenses(state.expenses);
      if (!savedEdit){ state.expenses[idx] = original; alert('Não foi possível salvar as alterações.'); return; }
      if (state.pendingPhoto) avisarSeFotoNaoCoube(await saveFullReceipt(state.editingId, state.pendingPhoto.full));
      else if (state.removeExistingPhoto) await deleteFullReceipt(state.editingId);
      state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false;
      render();
      return;
    }

    var id = generateId();
    var photo = state.pendingPhoto;
    var newExpense = Object.assign({id:id, person:memberId, type:type, category:category, description:description, value:value, date:date, thumb: photo?photo.thumb:null}, extra);
    state.expenses.push(newExpense);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.pop(); alert('Não foi possível salvar o gasto. Verifique se o navegador permite armazenamento local e tente novamente.'); return; }
    if (photo) avisarSeFotoNaoCoube(await saveFullReceipt(id, photo.full));
    state.pendingPhoto = null;
    render();
  }

  // Cadastro rápido de conta fixa da casa, feito na própria aba Contas Fixas.
  async function handleFixaSubmit(form){
    var catSel = form.querySelector('.category-select');
    var categoria = catSel ? catSel.value : '';
    if (categoria === '__custom__'){
      categoria = (form.querySelector('.custom-category-input').value || '').trim();
      if (!categoria){ alert('Digite o nome da categoria.'); return; }
    }
    if (!categoria){ alert('Escolha a categoria.'); return; }

    var descricao = (form.querySelector('.description-input').value || '').trim();
    if (!descricao){ alert('Escreva a descrição da conta (ex: Aluguel).'); return; }

    var valor = parseFloat(form.querySelector('.value-input').value);
    if (!valor || valor <= 0){ alert('Informe o valor da conta.'); return; }

    var data = form.querySelector('.date-input').value;
    if (!data){ alert('Informe a partir de quando essa conta vale.'); return; }

    var pessoa = form.querySelector('.fixa-person-select').value;

    var ateQuando = null;
    var prazoSel = form.querySelector('.prazo-toggle-select');
    if (prazoSel && prazoSel.value === 'ate'){
      ateQuando = (form.querySelector('.prazo-ate-input') || {}).value || '';
      if (!ateQuando){ alert('Escolha até quando essa conta fixa vai.'); return; }
      if (ateQuando < data){ alert('O prazo não pode ser antes do mês em que a conta começa.'); return; }
    }

    var nova = {
      id: generateId(), person: pessoa, type: 'casal',
      category: categoria, description: descricao, value: valor, date: data,
      thumb: null, items: null, fixed: true, fixedUntil: ateQuando,
      installment: false, installmentsTotal: null, installmentsPaid: null
    };
    state.expenses.push(nova);
    var ok = await saveExpenses(state.expenses);
    if (!ok){
      state.expenses.pop();
      alert('Não foi possível salvar a conta fixa. Tente de novo.');
      return;
    }
    render();
  }

  async function handleDeleteExpense(id){
    // A linha clicada pode ser a repetição de um gasto fixo — nesse caso o que
    // existe de verdade é o lançamento original, e apagar tira de todos os meses.
    var alvo = baseExpenseId(id);
    var idx = state.expenses.findIndex(function(e){ return e.id === alvo; });
    if (idx === -1) return;
    var removed = state.expenses[idx];
    var pergunta = removed.fixed
      ? 'Este é um gasto fixo: excluir tira ele de TODOS os meses, inclusive dos que já passaram e já entraram no acerto. Excluir mesmo assim?'
      : 'Excluir este gasto?';
    if (!confirm(pergunta)) return;
    state.expenses.splice(idx, 1);
    var saved = await saveExpenses(state.expenses);
    if (!saved){ state.expenses.splice(idx, 0, removed); alert('Não foi possível excluir. Tente de novo.'); return; }
    if (removed.thumb) await deleteFullReceipt(alvo);
    if (baseExpenseId(state.editingId) === alvo){ state.editingId = null; state.pendingPhoto = null; state.removeExistingPhoto = false; }
    render();
  }

  function handleEditStart(id){
    // Editar uma repetição edita o lançamento original — mudar o valor do
    // aluguel muda em todos os meses, que é o esperado num gasto fixo.
    var alvo = baseExpenseId(id);
    var exp = state.expenses.find(function(e){ return e.id === alvo; });
    if (!exp) return;
    state.editingId = alvo;
    state.pendingPhoto = null;
    state.removeExistingPhoto = false;
    render();
  }

  async function handleViewReceipt(id){
    openModalLoading();
    var full = await loadFullReceipt(baseExpenseId(id));
    if (full) showModalImage(full);
    else { closeModal(); alert('Não foi possível carregar o comprovante.'); }
  }

  function refreshPhotoSlot(formEl){
    if (!formEl){ render(); return; }
    var slot = formEl.querySelector('.photo-preview-slot');
    if (!slot){ render(); return; }
    var editingExpense = state.editingId ? state.expenses.find(function(e){ return e.id === state.editingId; }) : null;
    slot.innerHTML = renderPhotoSlotHTML(editingExpense);
  }

  /* ================================================================
     LEITURA DA NOTA — v2
     Estratégia: em vez de ler linha por linha (que embaralha quando o
     OCR quebra ou junta linhas), a nota é dividida em BLOCOS ancorados
     no Nº sequencial do item impresso no cupom, e dentro de cada bloco
     procuramos o padrão de compra "quantidade UNIDADE x valor unitário".
     Esse "x" é a chave: é ele que separa a QUANTIDADE COMPRADA do
     TAMANHO impresso no nome do produto ("ARROZ 5KG", "LEITE 395G").
     De cada item extraímos só 4 coisas:
       1) Nº de posição + nome do produto
       2) Unidade (quantas unidades)
       3) Peso em kg (só quando vendido por peso)
       4) Valor total do item
     Todo o resto (código de barras, valor unitário, código tributário,
     CNPJ, endereço, formas de pagamento) é descartado.
     ================================================================ */

  var MONEY_SRC = '\\d{1,3}(?:\\.\\d{3})*,\\d{2}';
  var UNIT_SRC = 'UN|UND|UNID|KG|PC|CX|LT|DZ|MT|PT|FD|G';

  function parseBRLNumber(str){
    if (str == null) return null;
    var cleaned = String(str).replace(/\./g, '').replace(',', '.');
    var n = parseFloat(cleaned);
    return isNaN(n) ? null : n;
  }

  // Quantidade pode ser "2" ou "0,970" — aqui a vírgula é decimal, nunca
  // separador de milhar (ninguém compra 1.500 unidades num mercado).
  function parseQty(str){
    var n = parseFloat(String(str).replace(',', '.'));
    return isNaN(n) ? null : n;
  }

  // O OCR troca letras por números o tempo todo em cupom de impressora
  // térmica. Consertamos isso SÓ dentro de trechos que já parecem número,
  // nunca no nome do produto — senão "SABAO" viraria "5A8AO".
  var DIGIT_FIX = {'O':'0','o':'0','Q':'0','D':'0','l':'1','I':'1','i':'1','|':'1','!':'1','T':'1','S':'5','s':'5','B':'8','Z':'2','z':'2','G':'6','b':'6'};
  function fixDigits(str){
    return String(str).replace(/[OoQDlIi|!TSsBZzGb]/g, function(c){ return DIGIT_FIX[c] || c; });
  }

  // Normaliza o texto bruto do OCR antes de qualquer análise.
  function normalizeOcrText(text){
    var t = String(text || '');

    // 1) Conserta valores em R$ com letra no meio ("8,4S" -> "8,45", "1O,50"
    //    -> "10,50"). Só aceitamos a correção se o resultado virar um valor
    //    válido de verdade — assim uma palavra nunca vira número por engano.
    t = t.replace(/\b[0-9OoQDlIi|!TSsBZzGb]{1,6}(?:[.\s][0-9OoQDlIi|!TSsBZzGb]{3})*\s*,\s*[0-9OoQDlIi|!TSsBZzGb]{2}\b/g, function(tok){
      if (!/[0-9]/.test(tok)) return tok;
      var fixed = fixDigits(tok).replace(/\s+/g, '');
      return /^\d{1,3}(?:\.\d{3})*,\d{2}$/.test(fixed) ? fixed : tok;
    });

    // 2) Separa quantidade/unidade/"x" que vieram grudadas ou com letra
    //    trocada ("TUNX" -> "1 UN X", "2UNx" -> "2 UN X", "0,970KGX" ->
    //    "0,970 KG X"). O "x" é o marcador mais importante da nota inteira.
    t = t.replace(new RegExp('(^|[\\s|])([0-9OoQDlIiTSBZG]{1,3}(?:[.,][0-9OoQDlIiTSBZG]{1,3})?)\\s*(' + UNIT_SRC + ')\\s*[XxK×*]\\s*(?=[\\d' + 'OoQDlIiTSBZG' + '])', 'gi'), function(m, pre, q, u){
      return pre + fixDigits(q) + ' ' + u.toUpperCase() + ' X ';
    });

    // 3) Conserta o Nº sequencial do item no começo da linha quando ele veio
    //    com letra ("OO1 7891..." -> "001 7891...").
    t = t.split(/\r?\n/).map(function(line){
      return line.replace(/^(\s*)([0-9OoQDlIiTS]{1,3})(\s+\d[\d.\-]{5,}\b)/, function(m, sp, seq, rest){
        return sp + fixDigits(seq) + rest;
      });
    }).join('\n');

    return t;
  }

  // Tira do nome do produto tudo que não é nome: Nº sequencial, código de
  // barras/interno, valores em R$, código tributário solto no fim.
  function cleanProductName(raw){
    var s = ' ' + String(raw || '') + ' ';
    s = s.replace(new RegExp(MONEY_SRC, 'g'), ' ');       // valores em R$
    s = s.replace(/\b\d[\d.\-]{5,}\b/g, ' ');             // código de barras / interno
    s = s.replace(/^\s*\d{1,3}\b(?!\s*(KG|G|ML|L|UN)\b)/i, ' '); // Nº sequencial no início
    s = s.replace(/[^A-Za-zÀ-ÿ0-9.,%/&+\-\s]/g, ' ');     // símbolos que o OCR inventa
    s = s.replace(/\s+[A-Za-z]\s*$/, ' ');                // letra solta no fim (F/T/I/N — código tributário)
    s = s.replace(/\s{2,}/g, ' ').trim();
    s = s.replace(/[.,\-]+$/, '').trim();
    if (!/[A-Za-zÀ-ÿ]{2,}/.test(s)) return '';
    return s;
  }

  /* ---------- Recorte da região dos itens ---------- */
  var TABLE_HEAD_RE = /(C[ÓO]DIGO.*DESCRI|DESCRI[ÇC][ÃA]O.*(QTD|QTDE|UN)|ITEM.*C[ÓO]DIGO|VL\.?\s*UNIT|V[LR]\.?\s*TOT|#\s*COD)/i;
  var FOOTER_RE = /(QTD\.?\s*TOTAL\s*DE\s*ITENS|TOTAL\s*DE\s*ITENS|VALOR\s*A\s*PAGAR|VALOR\s*TOTAL|^TOTAL\b|FORMA\s*DE\s*PAGAMENTO|FORMAS?\s*PGTO|^DINHEIRO|CART[ÃA]O\s*DE|TROCO|INFORMA[ÇC][ÕO]ES\s*DO\s*QR|CONSULTE\s*PELA\s*CHAVE|CHAVE\s*DE\s*ACESSO|PROTOCOLO)/i;
  var NOISE_RE = /(CNPJ|\bCPF\b|INSCRI[ÇC][ÃA]O|ENDERE|CUPOM\s*FISCAL|NOTA\s*FISCAL|DOCUMENTO\s*AUXILIAR|CONSUMIDOR|N[ÃA]O\s*IDENTIFICADO|EXTRATO|SAT\s*N|EMISS[ÃA]O|S[ÉE]RIE|www\.)/i;
  // Linhas que aparecem NO MEIO dos itens mas não são item — descontos,
  // acréscimos, subtotais parciais. Elas somem sem interromper a lista.
  var MID_NOISE_RE = /(DESCONTO|ACR[ÉE]SCIMO|SUBTOTAL|CANCELAMENTO|ITEM\s*CANCELADO|TROCO)/i;
  // Sobras de cabeçalho da tabela que não podem virar nome de produto.
  var HEADER_WORDS_RE = /(DESCRI[ÇC]|C[ÓO]DIGO|\bQTDE?\b|VL\.?\s*UNIT|V[LR]\.?\s*TOT|\bCOD\b)/i;

  /* ---------- Âncoras de item ---------- */
  var ANCHOR_STRONG_RE = /^(\d{1,3})\s+(\d[\d.\-]{5,})\b/;
  var ANCHOR_MEDIUM_RE = /^(\d{1,3})[\s.\)\-]+(?=[A-Za-zÀ-ÿ])/;

  // O padrão de compra completo: quantidade + unidade + "x" + valor unitário.
  // Exigir o "x" e o valor é o que impede "ARROZ 5KG" de virar "5 KG".
  var QTY_FULL_SRC = '(\\d+(?:[.,]\\d+)?)\\s*(' + UNIT_SRC + ')\\s*[Xx×*]\\s*(' + MONEY_SRC + ')';
  // Fallback quando o OCR comeu o "x": exige espaço entre número e unidade
  // (o tamanho no nome do produto vem colado: "5KG", "395G", "2L").
  var QTY_LOOSE_SRC = '(\\d+(?:[.,]\\d+)?)\\s+(UN|UND|UNID|KG|PC|CX|LT|DZ|MT|PT|FD)\\b';

  function readUnitsOrWeight(qtyStr, unitStr){
    var qty = parseQty(qtyStr);
    if (qty == null) return {units:null, weight:null, ok:false};
    var u = String(unitStr || '').toUpperCase();
    if (u === 'KG') return {units:null, weight:qty, ok:(qty > 0 && qty < 500)};
    if (u === 'G')  return {units:null, weight:qty/1000, ok:(qty > 0 && qty < 500000)};
    return {units:qty, weight:null, ok:(qty > 0 && qty < 1000)};
  }

  // Uma linha que só tem o Nº do item (e a linha seguinte só o código de
  // barras) é o mesmo cabeçalho de item quebrado em pedaços pelo OCR —
  // remontamos antes de procurar as âncoras.
  function stitchLines(lines){
    var out = [];
    for (var i = 0; i < lines.length; i++){
      var cur = lines[i];
      if (/^\d{1,3}$/.test(cur) && i + 1 < lines.length){
        var nxt = lines[i + 1];
        if (/^\d[\d.\-]{5,}$/.test(nxt)){ out.push(cur + ' ' + nxt); i++; continue; }
        if (/^[A-Za-zÀ-ÿ]/.test(nxt)){ out.push(cur + ' ' + nxt); i++; continue; }
      }
      out.push(cur);
    }
    return out;
  }

  // Linha que contém apenas um valor em R$ (com no máximo o código
  // tributário do lado): é a continuação do item anterior, nunca um item novo.
  var ONLY_MONEY_RE = new RegExp('^R?\\$?\\s*(' + MONEY_SRC + ')\\s*[A-Za-z]?$');

  /* ---------- Parser principal ---------- */
  /* ---------- Quem vendeu ----------
     O cabeçalho do cupom traz a razão social ("SHIBATA SUPERMERCADOS LTDA",
     "CIA BRASILEIRA DE DISTRIBUICAO"), que ninguém escreveria à mão na
     descrição. Aqui isso vira o nome que a pessoa usa: "Shibata". Duas
     tentativas, nessa ordem: procurar uma rede conhecida em qualquer lugar do
     texto (o OCR erra o cabeçalho com frequência, mas o nome costuma aparecer
     mais de uma vez), e, se não achar, limpar a primeira linha que pareça um
     nome de loja. */

  var REDES = [
    {nome:'Shibata',       re:/SHIBATA/i,                    categoria:'Mercado'},

    {nome:'Pão de Açúcar', re:/P[ÃA]O\s*DE\s*A[ÇC][ÚU]CAR/i, categoria:'Mercado'},
    {nome:'Extra',         re:/\bEXTRA\s*(HIPER|SUPER|MERCADO)?\b/i, categoria:'Mercado'},
    {nome:'Dia',           re:/\bDIA\s*(SUPERMERCADO|BRASIL)\b/i, categoria:'Mercado'},
    {nome:'Tenda',         re:/TENDA\s*ATACADO/i,            categoria:'Mercado'},
